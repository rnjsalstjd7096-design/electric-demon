<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>빗변 짝!: 전력 삼각형 짝 찾기 퍼즐</title>
<meta name="description" content="노란 유효전력(kW) 칸과 파란 무효전력(kvar) 칸을 하나씩 골라, 직각으로 붙인 빗변이 위의 피상전력(kVA)이 되게 짝짓는 퍼즐. 하트 3개, 숫자는 모두 예시.">
<style>
html,body{margin:0;height:100%;background:#14161b;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;font-size:20px}
#app{position:relative;margin:0 auto;max-width:480px;height:100%;display:flex;flex-direction:column;padding:8px 12px 10px;box-sizing:border-box}
#top{display:flex;align-items:center;justify-content:space-between;padding-left:44px;padding-right:56px;min-height:48px}
#top b{font-size:20px;white-space:nowrap}#stat{white-space:nowrap;font-size:20px;font-weight:800;color:#ffd23f}
#sub{font-size:20px;line-height:1.35;color:#e8ebf2;text-align:center;margin:4px 0 8px;word-break:keep-all}
#board{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
.btn{flex:1;border:0;border-radius:14px;font-size:20px;font-weight:800;min-height:56px;font-family:inherit;cursor:pointer;touch-action:manipulation;background:#3b4252;color:#fff;box-shadow:0 4px 0 #1f232c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f232c}.btn.main{background:#ffd23f;color:#2b2000;box-shadow:0 4px 0 #a98400}
#mute{position:absolute;top:8px;right:10px;width:48px;height:48px;border:0;border-radius:24px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;z-index:5}
#end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,11,16,.78);z-index:4;padding:16px;box-sizing:border-box}
#end.on{display:flex}
#card{width:100%;max-width:360px;background:#2b2f3a;border:3px solid #4a505f;border-radius:18px;padding:18px;box-sizing:border-box;text-align:center;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#endTitle{font-size:24px;font-weight:800;margin:0 0 6px}#endScore{font-size:52px;font-weight:900;line-height:1.1;color:#ffd23f}
#endSub{font-size:20px;color:#e8ebf2;margin:4px 0}#endBest{font-size:20px;font-weight:700;color:#9fe1ff;margin:0 0 10px}
#fact{font-size:20px;line-height:1.45;background:#1d2029;border-radius:12px;padding:10px 12px;margin:0 0 12px;text-align:left;word-break:keep-all}
.shake{animation:sk .3s}@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.sp{position:absolute;font-size:28px;animation:fl .8s ease-out forwards}@keyframes fl{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.6)}}
#bar{width:100%;text-align:center;min-height:56px;font-size:20px;font-weight:700;color:#9fe1ff;margin-top:6px;line-height:1.3;word-break:keep-all}

#tgt{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;background:#2b2f3a;border:3px solid #3fd27a;border-radius:16px;padding:8px 14px;margin:0 0 10px;width:100%;box-sizing:border-box}
#tgt .n{font-size:44px;font-weight:900;color:#3fd27a}#tgt .u{font-size:20px;color:#e8ebf2;line-height:1.2}
#tgt svg{flex:none}
#grid{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:380px}
.t{border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;cursor:pointer;box-sizing:border-box;border:3px solid;box-shadow:0 4px 0 rgba(0,0,0,.4);min-height:64px;transition:transform .12s}
.t .v{font-size:32px;line-height:1}.t .u{font-size:15px;margin-top:2px}
.t.p{background:#ffd23f;color:#2b2000;border-color:#a98400}.t.q{background:#9fe1ff;color:#06263a;border-color:#3a8ab0}
.t.s{transform:scale(1.08);outline:4px solid #fff}
.t.new{animation:drop .3s ease-out}@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
#hint{font-size:18px;color:#aeb4c2;text-align:center;margin-top:8px}

</style>
<meta name="description" content="노란 유효전력(kW) 칸과 파란 무효전력(kvar) 칸을 하나씩 골라 직각으로 붙인 빗변이 목표 피상전력(kVA)이 되게 짝짓는 퍼즐. 하트 3개, 숫자는 모두 예시."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/leg-pair/"><meta property="og:title" content="빗변 짝!: 전력 삼각형 짝 찾기 퍼즐"><meta property="og:description" content="노란 유효전력(kW) 칸과 파란 무효전력(kvar) 칸을 하나씩 골라 직각으로 붙인 빗변이 목표 피상전력(kVA)이 되게 짝짓는 퍼즐. 하트 3개, 숫자는 모두 예시."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="빗변 짝!: 전력 삼각형 짝 찾기 퍼즐",D="노란 유효전력(kW) 칸과 파란 무효전력(kvar) 칸을 하나씩 골라 직각으로 붙인 빗변이 목표 피상전력(kVA)이 되게 짝짓는 퍼즐. 하트 3개, 숫자는 모두 예시.",U="https://rnjsalstjd7096-design.github.io/electr <body>
<div id="app">
  <div id="top"><b id="lv"></b><span id="stat"></span></div>
  <div id="sub"></div>
  <div id="board"></div>
  <div id="bar"></div>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <div id="fx"></div>
  <div id="end"><div id="card">
    <div id="endTitle"></div><div id="endScore"></div><div id="endSub"></div><div id="endBest"></div>
    <div id="fact"></div>
    <button class="btn main" id="again" style="width:100%">한 번 더</button>
  </div></div>
</div>
<script>
"use strict";
const KEY='leg-pair.save.v1';
const $=id=>document.getElementById(id);
let save={best:0,plays:0,fi:0};
try{const r=localStorage.getItem(KEY);if(r)save=Object.assign(save,JSON.parse(r));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
let muted=false,AC=null;
try{muted=localStorage.getItem(KEY+'.mute')==='1';}catch(e){}
function actx(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();}if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,t,v,when){if(muted)return;const a=actx();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;const s=a.currentTime+(when||0);g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d);}catch(e){}}
const sfx={tap(){tone(520,.07,'triangle',.1)},ok(){tone(660,.1,'triangle',.14);tone(880,.14,'triangle',.14,.09)},bad(){tone(180,.25,'sawtooth',.12)},
 done(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.08))},lose(){[330,262,196].forEach((f,i)=>tone(f,.28,'sawtooth',.1,i*.16))}};
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function burst(x,y,ch){const fx=$('fx'),r=fx.getBoundingClientRect();for(let i=0;i<5;i++){const s=document.createElement('div');s.className='sp';s.textContent=ch||'✨';s.style.left=(x-r.left-14+(Math.random()*60-30))+'px';s.style.top=(y-r.top-14+(Math.random()*30-15))+'px';fx.appendChild(s);setTimeout(()=>s.remove(),850);}}
function burstEl(el,ch){if(!el)return burst(innerWidth/2,innerHeight/3,ch);const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,ch);}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'.mute',muted?'1':'0');}catch(e){}if(!muted)sfx.tap();};
function showEnd(title,score,sub,best,isNew,fact){$('endTitle').textContent=title;$('endScore').textContent=score;$('endSub').textContent=sub;const b=$('endBest');b.textContent=best;b.style.color=isNew?'#ffd23f':'#9fe1ff';$('fact').innerHTML=fact;$('end').classList.add('on');}
function hideEnd(){$('end').classList.remove('on');}
function endGame(t,n,unit,extra,facts){over=true;save.plays++;const nb=n>save.best;const prev=save.best;if(nb)save.best=n;const f=facts[save.fi++%facts.length];persist();sfx.lose();
 const gap=nb?0:save.best-n;
 showEnd(t,n+unit,extra+(nb?'':' · 최고 기록까지 '+(gap+1)+unit+' (아깝다!)'),nb?'신기록! 이전 최고 '+prev+unit:'최고 '+save.best+unit,nb,'<b>'+f[0]+'</b> — '+f[1]);}
// 숫자는 모두 예시. 공식(피상² = 유효² + 무효²)은 FACTS.md 1번.
save.tot=save.tot||0;
const FACTS=[['그냥 더하면 안 된다','유효전력(W)과 무효전력(var)은 직각으로 더한다. 피상전력² = 유효전력² + 무효전력².'],
 ['단위가 셋','일하는 전기(유효)는 kW, 왔다 갔다 하는 전기(무효)는 kvar, 둘을 합친 겉보기 전기(피상)는 kVA.'],
 ['예: 12kW에 9kvar면?','√(144 + 81) = √225 = 15kVA. 그냥 더한 21이 아니다.'],
 ['역률 = 유효 ÷ 피상','12kW·15kVA면 역률 0.8. 피상전력 중에 일하는 몫이 얼마인지다.'],
 ['변압기 용량은 kVA','변압기·발전기 용량은 kW가 아니라 kVA로 적는다.']];
const TRI=[[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[12,16,20],[7,24,25],[15,20,25],[20,21,29]];
let tiles,S,sel,life,score,over,streak,uid=0;
function pool(){return score<4?TRI.slice(0,2):score<10?TRI.slice(0,5):TRI}
function leg(){const t=pool()[rnd(pool().length)];const k=rnd(2);return {v:t[k],k:rnd(2)?'p':'q',id:++uid}}
function pairTile(){const t=pool()[rnd(pool().length)];const sw=rnd(2);return [{v:t[sw],k:'p',id:++uid},{v:t[1-sw],k:'q',id:++uid}]}
function good(a,b){return a.k!==b.k&&a.v*a.v+b.v*b.v===S*S}
function hyps(){const out=[];for(const a of tiles)for(const b of tiles)if(a.k==='p'&&b.k==='q'){const c=Math.round(Math.sqrt(a.v*a.v+b.v*b.v));if(c*c===a.v*a.v+b.v*b.v)out.push(c);}return out}
function pickTarget(){let h=hyps();if(!h.length){const [a,b]=pairTile();const i=rnd(16);let j=rnd(16);if(j===i)j=(i+1)%16;tiles[i]=a;tiles[j]=b;h=hyps();}S=h[rnd(h.length)];}
function deal(){tiles=[];const [a,b]=pairTile(),[c,d]=pairTile();tiles.push(a,b,c,d);while(tiles.length<16)tiles.push(leg());shuffle(tiles);pickTarget();sel=-1;render(true);}
function render(fresh,newIds){
 $('lv').textContent=score+'개';$('stat').textContent='❤'.repeat(life)+'🤍'.repeat(3-life);
 $('sub').textContent='노랑 하나, 파랑 하나 — 빗변이 초록 숫자가 되게';
 const b=$('board');if(!$('grid')){b.innerHTML='<div id="tgt"><svg width="64" height="48" viewBox="0 0 64 48"><path d="M4 44H56" stroke="#ffd23f" stroke-width="6" stroke-linecap="round"/><path d="M56 44V6" stroke="#9fe1ff" stroke-width="6" stroke-linecap="round"/><path d="M4 44L56 6" stroke="#3fd27a" stroke-width="5" stroke-linecap="round"/></svg><span class="n" id="sv"></span><span class="u">kVA<br>빗변</span></div><div id="grid"></div><div id="hint">숫자는 모두 예시 · 노랑 kW · 파랑 kvar</div>';}
 $('sv').textContent=S;const g=$('grid');g.innerHTML='';
 tiles.forEach((t,i)=>{const e=document.createElement('div');e.className='t '+t.k+(i===sel?' s':'')+(newIds&&newIds.includes(t.id)?' new':'');e.id='t'+i;
  e.innerHTML='<span class="v">'+t.v+'</span><span class="u">'+(t.k==='p'?'kW':'kvar')+'</span>';e.onclick=()=>tap(i,e);g.appendChild(e);});
}
function tap(i,el){if(over)return;actx();
 if(sel<0||sel===i||tiles[sel].k===tiles[i].k){sel=sel===i?-1:i;sfx.tap();render();return;}
 const a=tiles[sel],b=tiles[i];const P=a.k==='p'?a:b,Q=a.k==='p'?b:a;
 if(good(a,b)){score++;save.tot++;streak++;tone(500+Math.min(streak,10)*50,.12,'triangle',.14);sfx.ok();vib(20);burstEl($('t'+sel),'⚡');burstEl(el,streak>=5?'🌟':'💡');burstEl($('tgt'),'✨');
  $('bar').textContent='√('+P.v+'² + '+Q.v+'²) = '+S+(streak>=3?' · '+streak+'연속!':'');
  const ids=[];[sel,i].forEach(k=>{const n=leg();tiles[k]=n;ids.push(n.id);});
  if(score%3===0){const k=rnd(16);if(k!==sel&&k!==i){const n=leg();tiles[k]=n;ids.push(n.id);}}
  sel=-1;pickTarget();persist();render(false,ids);return;}
 life--;streak=0;sfx.bad();vib([40,40,40]);el.classList.add('shake');
 const c=Math.sqrt(P.v*P.v+Q.v*Q.v);
 $('bar').textContent=(P.v+Q.v===S?'그냥 더하면 '+S+'이지만 직각이면 ':'빗변은 ')+(Number.isInteger(c)?c:c.toFixed(1))+' (목표 '+S+')';
 sel=-1;$('stat').textContent='❤'.repeat(life)+'🤍'.repeat(3-life);setTimeout(()=>{if(!over)render();},350);
 if(life<=0){over=true;setTimeout(()=>endGame('하트를 다 썼다',score,'개','만든 전력 삼각형 · 누적 '+save.tot+'개',FACTS),1100);}
}
function start(){score=0;life=3;over=false;streak=0;hideEnd();$('board').innerHTML='';$('bar').textContent='지금까지 만든 삼각형 '+save.tot+'개';deal();}
$('again').onclick=()=>{sfx.tap();start();};
window.__game={get state(){return {score,life,over,S}},
 sel(){if(over)return null;for(let i=0;i<16;i++)for(let j=0;j<16;j++)if(good(tiles[i],tiles[j])){if(sel===i)return '#t'+j;if(sel===j)return '#t'+i;if(sel>=0)return '#t'+sel;return '#t'+i;}return null},
 wrong(){if(over)return null;if(sel<0)return '#t'+tiles.findIndex(t=>t.k==='p');const k=tiles[sel].k==='p'?'q':'p';const j=tiles.findIndex(t=>t.k===k&&!good(tiles[sel],t));return j<0?null:'#t'+j}};
start();

</script>
</body>
</html>
