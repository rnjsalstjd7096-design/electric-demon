<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>짝 맞춰 줄!: 전압 조각 놓기</title>
<meta name="description" content="전선 두 가닥이 적힌 조각을 알맞은 전압(220V·380V) 줄에 놓아 채우는 퍼즐.">
<style>
html,body{margin:0;height:100%;background:#14161b;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;font-size:20px}
#app{position:relative;margin:0 auto;max-width:480px;height:100%;display:flex;flex-direction:column;padding:8px 12px 10px;box-sizing:border-box}
#top{display:flex;align-items:center;justify-content:space-between;padding-left:44px;padding-right:56px;min-height:48px}
#top b{font-size:20px}#stat{font-size:20px;font-weight:800;color:#ffd23f}
#sub{font-size:20px;line-height:1.35;color:#e8ebf2;text-align:center;margin:4px 0 8px;word-break:keep-all}
#board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.btn{flex:1;border:0;border-radius:14px;font-size:20px;font-weight:800;min-height:56px;font-family:inherit;cursor:pointer;touch-action:manipulation;background:#3b4252;color:#fff;box-shadow:0 4px 0 #1f232c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f232c}.btn.main{background:#ffd23f;color:#2b2000;box-shadow:0 4px 0 #a98400}
#mute{position:absolute;top:8px;right:10px;width:48px;height:48px;border:0;border-radius:24px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;z-index:5}
#end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,11,16,.78);z-index:4;padding:16px;box-sizing:border-box}
#end.on{display:flex}
#card{width:100%;max-width:360px;background:#2b2f3a;border:3px solid #4a505f;border-radius:18px;padding:18px;box-sizing:border-box;text-align:center;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#endTitle{font-size:24px;font-weight:800;margin:0 0 6px}#endScore{font-size:52px;font-weight:900;line-height:1.1;color:#ffd23f}
#endSub{font-size:20px;color:#e8ebf2;margin:4px 0}#endBest{font-size:20px;font-weight:700;color:#9fe1ff;margin:0 0 10px}
#fact{font-size:20px;line-height:1.45;background:#1d2029;border-radius:12px;padding:10px 12px;margin:0 0 12px;text-align:left;word-break:keep-all}
.pp{animation:pp .35s ease-out}@keyframes pp{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.shake{animation:sk .3s}@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.sp{position:absolute;font-size:28px;animation:fl .8s ease-out forwards}@keyframes fl{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.6)}}

#rows{display:flex;flex-direction:column;gap:8px;width:100%;max-width:372px}
.rw{display:flex;align-items:center;gap:8px;background:#1d2029;border:4px solid #3b4252;border-radius:14px;padding:6px 8px;min-height:54px;cursor:pointer;font-family:inherit;color:#fff;touch-action:manipulation;text-align:left}
.rw.v220{border-color:#6ee08a}.rw.v380{border-color:#ff9f43}
.rw .t{font-size:26px;font-weight:900;width:92px}
.rw.v220 .t{color:#6ee08a}.rw.v380 .t{color:#ff9f43}
.sl{flex:1;height:46px;border-radius:10px;background:#12141a;border:2px dashed #4a505f;display:flex;align-items:center;justify-content:center;gap:4px;font-size:18px;font-weight:800}
.ch{display:inline-block;min-width:34px;padding:4px 6px;border-radius:8px;font-size:17px;font-weight:900;text-align:center;border:2px solid #fff4}
.a-L1{background:#8b5a2b}.a-L2{background:#111}.a-L3{background:#9aa0a6;color:#111}.a-N{background:#2f6fdc}
#hand{display:flex;gap:10px;width:100%;max-width:372px;margin-top:10px}
.dm{flex:1;min-height:76px;border:4px solid #4a505f;border-radius:14px;background:#2b2f3a;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-family:inherit;color:#fff;touch-action:manipulation;flex-wrap:wrap}
.dm.sel{border-color:#ffd23f;background:#3a3420}
.dm.used{visibility:hidden}
#board{align-items:flex-start;padding-top:4px;flex-direction:column}
#bar{width:100%;text-align:center;min-height:28px;font-size:20px;font-weight:700;color:#9fe1ff;margin-top:6px}
.fl{animation:pp .35s}

</style>
<meta name="description" content="전선 두 가닥이 적힌 조각을 알맞은 전압(220V·380V) 줄에 놓아 줄을 채우는 퍼즐. 줄이 6개 쌓이면 과부하."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/volt-row/"><meta property="og:title" content="짝 맞춰 줄!: 전압 조각 놓기"><meta property="og:description" content="전선 두 가닥이 적힌 조각을 알맞은 전압(220V·380V) 줄에 놓아 줄을 채우는 퍼즐. 줄이 6개 쌓이면 과부하."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;top:max(8px,env(safe-area-inset-top));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="짝 맞춰 줄!: 전압 조각 놓기",D="전선 두 가닥이 적힌 조각을 알맞은 전압(220V·380V) 줄에 놓아 줄을 채우는 퍼즐. 줄이 6개 쌓이면 과부하.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/volt-row/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div id="top"><b id="lv"></b><span id="stat"></span></div>
  <div id="sub"></div>
  <div id="board"></div>
  <div id="bar"></div>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <div id="fx"></div>
  <div id="end"><div id="card">
    <div id="endTitle"></div><div id="endScore"></div><div id="endSub"></div><div id="endBest"></div>
    <div id="fact"></div>
    <button class="btn main" id="again" style="width:100%">한 번 더</button>
  </div></div>
</div>
<script>
"use strict";
const KEY='volt-row.save.v1';
let save={best:0,plays:0,fi:0};
try{const r=localStorage.getItem(KEY);if(r)save=Object.assign(save,JSON.parse(r));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
const $=id=>document.getElementById(id);
let muted=false,AC=null;
try{muted=localStorage.getItem(KEY+'.mute')==='1';}catch(e){}
function actx(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();}if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,t,v,when){if(muted)return;const a=actx();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;const s=a.currentTime+(when||0);g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d);}catch(e){}}
const sfx={tap(){tone(520,.07,'triangle',.1)},ok(){tone(660,.1,'triangle',.14);tone(880,.14,'triangle',.14,.09)},bad(){tone(180,.25,'sawtooth',.12)},
 done(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.08))},win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'square',.09,i*.09))},lose(){[330,262,196].forEach((f,i)=>tone(f,.28,'sawtooth',.1,i*.16))}};
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function burst(x,y,ch){const fx=$('fx'),r=fx.getBoundingClientRect();for(let i=0;i<5;i++){const s=document.createElement('div');s.className='sp';s.textContent=ch||'✨';s.style.left=(x-r.left-14+(Math.random()*60-30))+'px';s.style.top=(y-r.top-14+(Math.random()*30-15))+'px';fx.appendChild(s);setTimeout(()=>s.remove(),850);}}
function burstEl(el,ch){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,ch);}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'.mute',muted?'1':'0');}catch(e){}if(!muted)sfx.tap();};
function showEnd(title,score,sub,best,isNew,fact){$('endTitle').textContent=title;$('endScore').textContent=score;$('endSub').textContent=sub;const b=$('endBest');b.textContent=best;b.style.color=isNew?'#ffd23f':'#9fe1ff';$('fact').innerHTML=fact;$('end').classList.add('on');}
function hideEnd(){$('end').classList.remove('on');}

const P=['L1','L2','L3'],MAXR=6;
let rows,hand,sel,score,lives,done,placedInHand,over,cleared;
function volt(a,b){return (a==='N'||b==='N')?220:380}
function mkPiece(v){if(v===220)return [P[rnd(3)],'N'];const a=shuffle(P.slice());return [a[0],a[1]]}
function newRow(v){return {v:v||(Math.random()<.5?220:380),n:0}}
function needs(){const s=new Set();rows.forEach(r=>{if(r.n<2)s.add(r.v)});return [...s]}
function newHand(){const nd=needs();hand=[];for(let i=0;i<3;i++){const v=(i===0&&nd.length)?nd[rnd(nd.length)]:(Math.random()<.5?220:380);hand.push({p:mkPiece(v).sort(()=>Math.random()-.5),used:false});}
 sel=-1;placedInHand=0;}
function start(){hideEnd();rows=[newRow(220),newRow(380),newRow()];score=0;lives=3;over=false;cleared=0;newHand();render('조각을 누르고, 같은 전압 줄을 누르세요');}
function chips(p){return p.map(x=>'<span class="ch a-'+x+'">'+x+'</span>').join('')}
function render(msg){
 $('lv').textContent='전압 줄 맞추기';$('stat').textContent='✔'+cleared+'줄  '+'🔌'.repeat(lives)+'·'.repeat(3-lives);
 $('sub').textContent='조각 두 선 사이의 전압과 같은 줄에 놓아요 · 줄이 '+MAXR+'개 쌓이면 과부하';
 let h='<div id="rows">'+rows.map((r,i)=>'<button class="rw v'+r.v+'" data-i="'+i+'"><span class="t">'+r.v+'V</span><span class="sl">'+(r.n>=1?chips(r.s0):'<span style="color:#7d8596">빈 칸 1</span>')+'</span><span class="sl">'+(r.n>=2?chips(r.s1):'<span style="color:#7d8596">빈 칸 2</span>')+'</span></button>').join('')+'</div>';
 h+='<div id="hand">'+hand.map((d,i)=>'<button class="dm'+(sel===i?' sel':'')+(d.used?' used':'')+'" data-i="'+i+'">'+chips(d.p)+'</button>').join('')+'</div>';
 $('board').innerHTML=h;$('bar').textContent=msg||'';
 document.querySelectorAll('.dm').forEach(el=>el.onclick=()=>{if(over||hand[+el.dataset.i].used)return;sel=+el.dataset.i;sfx.tap();render('')});
 document.querySelectorAll('.rw').forEach(el=>el.onclick=()=>putRow(+el.dataset.i,el));}
function putRow(i,el){if(over)return;if(sel<0){sfx.bad();$('bar').textContent='먼저 아래 조각을 눌러요';return}
 const d=hand[sel],r=rows[i];if(r.n>=2){sfx.bad();return}
 if(volt(d.p[0],d.p[1])!==r.v){lives--;sfx.bad();vib([60,40,60]);$('board').classList.add('shake');setTimeout(()=>$('board').classList.remove('shake'),320);
  if(lives<=0){finish('쇼트! 차단기가 떨어졌어요');return}
  sel=-1;render('🔥 쇼트! '+d.p.join('·')+'는 '+volt(d.p[0],d.p[1])+'V예요');return}
 if(r.n===0)r.s0=d.p;else r.s1=d.p;r.n++;d.used=true;sel=-1;placedInHand++;score+=5;sfx.ok();vib(20);let msg='⚡ 딱 맞아요!';
 if(r.n>=2){rows.splice(i,1);cleared++;score+=20;sfx.done();msg='⚡ 한 줄 완성! +25';burst(innerWidth/2,innerHeight/3,'⚡');}
 if(hand.every(x=>x.used)){rows.push(newRow());if(rows.length>MAXR){render('');finish('과부하! 줄이 너무 쌓였어요');return}newHand();}
 if(rows.length===0)rows.push(newRow());
 if(!hand.some(x=>!x.used))newHand();
 render(msg);}
const FACTS=[
 ['상전압','상선(L1·L2·L3) 한 가닥과 중성선(N) 사이는 220V예요. 이걸 상전압이라고 불러요.'],
 ['선간전압','상선과 상선 사이는 380V예요. 이걸 선간전압이라고 불러요.'],
 ['단상 380V','현장에서 「단상 380V」는 3상 전원 중 두 상선 사이의 380V를 단상 부하에 쓴다는 뜻인 경우가 많아요.'],
 ['어디와 어디 사이','220V냐 380V냐는 「어디와 어디 사이를 재느냐」의 차이예요.']];
function finish(t){over=true;save.plays++;const nb=cleared>save.best;const prev=save.best;if(nb)save.best=cleared;const f=FACTS[save.fi++%FACTS.length];persist();sfx.lose();
 const gap=nb?0:save.best-cleared;
 showEnd(t,cleared+'줄','완성한 줄 '+cleared+'줄 · '+score+'점'+(nb?'':' · 최고 기록까지 '+(gap+1)+'줄 (아깝다!)'),nb?'신기록! 이전 최고 '+prev+'줄':'최고 '+save.best+'줄',nb,'<b>'+f[0]+'</b> — '+f[1]);}
$('again').onclick=()=>{sfx.tap();start();};
window.__game={get state(){return {rows:rows.map(r=>({v:r.v,n:r.n})),hand:hand.map(d=>({p:d.p,used:d.used})),sel,score,lives,cleared,over}},start,volt,
 select(i){sel=i;},putRow:i=>putRow(i,null)};
start();

</script>
</body>
</html>
