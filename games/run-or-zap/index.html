<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
</div>
<script>
'use strict';
// ───────── 저장 ─────────
const SAVE_KEY='run-or-zap.save.v1';
const save={best:0,mute:false,tut:false,runs:0,fi:{}};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&typeof s==='object')Object.assign(save,s);if(!save.fi||typeof save.fi!=='object')save.fi={};}catch(e){}
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

// ───────── 사망 원인 상식 (전부 FACTS.md에 같은 문구로) ─────────
const CAUSE={
  wire:  '늘어진 전선에 감전!',
  cord:  '피복 벗겨진 전선에 감전!',
  puddle:'누전 물웅덩이에 감전!',
  birds: '전선 두 가닥을 한꺼번에!',
  trans: '고압 변압기에 감전!'
};
const FACTS={
  wire:[
    '끊어진 전선은 살아 있다고 생각하세요. 가까이 가지 말고 한전(123)에 신고.',
    '늘어진 전선은 눈으로 봐선 전기가 있는지 몰라요. 발로 치우지도, 넘지도 마세요.'
  ],
  cord:[
    '피복이 벗겨진 전선은 쓰지 말고 바꾸세요. 절연이 감전을 막는 첫 번째 벽이에요.',
    '전선을 만지기 전엔 차단기부터 내리고, 검전기로 전기가 없는지 확인해야 해요.',
    '콘센트 구멍에 젓가락·쇠붙이 금지! 한쪽 구멍만 넣어도 감전될 수 있어요.'
  ],
  puddle:[
    '물웅덩이 + 누전 = 몸이 전기 통로. 누전차단기(30mA)가 있었다면…',
    '사람 보호용 누전차단기는 누설이 30mA에 이르면 0.03초 안에 끊어요. 시험 버튼 점검은 월 1회 권장.',
    '젖은 손·젖은 발은 몸의 저항을 크게 낮춰요. 물 근처의 전기는 훨씬 위험합니다.'
  ],
  birds:[
    '새는 전선 한 가닥에만 앉아 두 발 사이 전위차가 거의 없어요. 사람 몸이 두 선을 이으면 달라요.',
    '전기는 전위차가 있어야 흘러요. 몸이 선과 선, 선과 땅을 잇는 순간 통로가 됩니다.',
    '전선 근처에선 연·낚싯대·긴 사다리 금지. 닿는 순간 몸까지 전기가 와요.'
  ],
  trans:[
    "'고압 위험' 표지가 붙은 설비는 열거나 올라가지 마세요. 이상하면 한전(123)에 신고.",
    '고압 전선은 닿기 직전 가까이만 가도 방전이 튈 수 있어요. 거리가 곧 안전입니다.'
  ]
};
const TOAST={
  glove:'절연장갑 획득! 감전 1번 막아 줌',
  shield:'절연장갑이 막았다! 그래도 활선은 피하는 게 먼저',
  checker:'검전기! 앞의 활선을 미리 보여 줌'
};

// ───────── 상수 ─────────
const STEP=1/120;
const GRAV=2000, JUMP_V=640, HOLD_MAX=0.22, HOLD_G=0.42;
const SPEED0=250, SPEED_ACC=5, SPEED_MAX=470;
const PX_PER_M=40;
const RESTART_AT=0.6;           // 감전 후 이 시간(초)부터 탭 = 즉시 재시작
const POP_AT=0.56;              // "펑" 시점
const HERO_W=9, HERO_H=50;      // 판정 반폭·높이 (그림보다 약간 작게 = 너그럽게)
const OB={ // w: 폭, y0~y1: 땅에서의 판정 높이, jump: 점프로 넘는 장애물인지
  wire:  {w:56,y0:0,y1:14,jump:true},
  cord:  {w:62,y0:0,y1:12,jump:true},
  puddle:{w:80,y0:0,y1:3, jump:true},
  trans: {w:38,y0:0,y1:46,jump:true},
  birds: {w:170,y0:86,y1:112,jump:false}
};

// ───────── 캔버스 ─────────
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap'), muteBtn=document.getElementById('mute');
let W=375,H=812,GY=560,HX=95,DPR=1;
function resize(){
  const r=wrap.getBoundingClientRect();
  W=Math.max(200,r.width);H=Math.max(300,r.height);DPR=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  GY=Math.round(H*0.70);HX=Math.round(Math.min(W*0.26,110));
}
window.addEventListener('resize',resize);resize();

// ───────── 난수 (테스트에서 고정 가능) ─────────
let seed=(Date.now()>>>0)||1;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function rr(a,b){return a+(b-a)*rnd();}

// ───────── 소리 (WebAudio 합성) ─────────
let AC=null,master=null,noiseBuf=null;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=save.mute?0:0.5;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function tone(type,f0,f1,dur,vol,delay){
  if(!AC||save.mute)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,freq,q,vol,delay){
  if(!AC||save.mute)return;const t=AC.currentTime+(delay||0);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);
}
const sfx={
  jump(){tone('square',330,660,0.12,0.12);},
  zap(){noise(0.45,2500,0.8,0.5);tone('sawtooth',60,58,0.45,0.25);tone('square',120,110,0.4,0.08);},
  pop(){noise(0.35,400,0.6,0.8);tone('sine',300,50,0.3,0.4);},
  pick(){tone('triangle',660,660,0.08,0.18);tone('triangle',990,990,0.12,0.18,0.08);},
  shield(){noise(0.2,3000,1,0.3);tone('triangle',880,440,0.25,0.15);},
  restart(){tone('triangle',440,880,0.1,0.12);}
};
function setMute(m){save.mute=m;writeSave();muteBtn.textContent=m?'🔇':'🔊';if(master)master.gain.value=m?0:0.5;}
setMute(!!save.mute);

// ───────── 게임 상태 ─────────
let G=null;
// 처음 20초 대본: 시간(초)에 주인공 앞에 닿도록 배치. 넉넉하고 땅 장애물만.
const SCRIPT=[
  {t:3.0, type:'wire'},
  {t:7.0, type:'cord'},
  {t:9.6, item:'glove'},
  {t:11.5,type:'puddle',w:76},
  {t:15.5,type:'wire'},
  {t:19.0,type:'trans'}
];
function distAt(t){ // 시작부터 t초 동안 달린 거리 (속도 = SPEED0 + SPEED_ACC·t)
  const tc=(SPEED_MAX-SPEED0)/SPEED_ACC;
  if(t<=tc)return SPEED0*t+SPEED_ACC*t*t/2;
  return SPEED0*tc+SPEED_ACC*tc*tc/2+SPEED_MAX*(t-tc);
}
function newRun(){
  G={mode:'run',t:0,dist:0,speed:SPEED0,
     hero:{y:0,vy:0,ground:true,holding:false,holdT:0,buf:0,legT:0},
     obs:[],items:[],parts:[],toasts:[],
     shield:0,inv:0,checkerT:0,deadT:0,deadAtT:0,cause:null,fact:'',score:0,newBest:false,
     nextX:0,scriptI:0,jumps:0,cleared:0,timeScale:1,hint:false,shake:0,heroDeadY:0,
     startLine:true,lastType:null};
  // 대본 배치
  for(const s of SCRIPT){
    const x=HX+HERO_W+distAt(s.t);
    if(s.item)G.items.push({type:s.item,x,y:24,got:false});
    else addOb(s.type,x,s.w);
  }
  const last=G.obs[G.obs.length-1];
  G.nextX=last.x+last.w+distAt(21.8)-distAt(19.0);
}
function addOb(type,x,w){
  const o={type,x,w:w||OB[type].w,y0:OB[type].y0,y1:OB[type].y1,jump:OB[type].jump,passed:false,shorted:false,ph:rnd()*6};
  G.obs.push(o);G.lastType=type;return o;
}
function genMore(){
  // 화면 오른쪽 너머까지 장애물 채우기
  const viewR=G.dist+W*2.2;
  while(G.nextX<viewR){
    const tAt=G.t+(G.nextX-G.dist-HX)/Math.max(G.speed,1);
    const sp=Math.min(SPEED_MAX,SPEED0+SPEED_ACC*Math.max(tAt,0));
    const types=['wire','cord','puddle','trans'];
    if(tAt>20&&G.lastType!=='birds')types.push('birds','birds');
    const type=types[Math.floor(rnd()*types.length)];
    let x=G.nextX,w;
    if(type==='puddle')w=Math.round(rr(70,70+Math.min(60,tAt*1.2)));
    if(type==='birds')x+=sp*0.3; // 새 전선 앞은 착지할 여유를 더
    const o=addOb(type,x,w);
    const k=tAt<45?rr(1.05,1.9):rr(0.9,1.6);
    G.nextX=o.x+o.w+sp*k+(type==='birds'?sp*0.25:0);
    // 빈 구간에 가끔 아이템 (달리는 높이라 점프 없이도 먹힘)
    if(rnd()<0.16){
      const it=rnd()<0.5?'glove':'checker';
      G.items.push({type:it,x:(o.x+o.w+G.nextX)/2,y:24,got:false});
    }
  }
}

// ───────── 입력 ─────────
function pressDown(){
  audioInit();
  if(G.mode==='dead'){
    if(G.deadT>=RESTART_AT){newRun();sfx.restart();}
    return;
  }
  const h=G.hero;h.holding=true;
  if(h.ground)doJump();else h.buf=0.12; // 착지 직전 탭은 착지하자마자 점프
}
function pressUp(){if(G)G.hero.holding=false;}
function doJump(){
  const h=G.hero;h.vy=JUMP_V;h.ground=false;h.holdT=0;h.buf=0;G.jumps++;G.startLine=false;G.timeScale=1;sfx.jump();
}
let activePtr=new Set();
wrap.addEventListener('pointerdown',e=>{
  if(e.target===muteBtn)return;
  e.preventDefault();activePtr.add(e.pointerId);pressDown();
},{passive:false});
function ptrEnd(e){activePtr.delete(e.pointerId);if(activePtr.size===0)pressUp();}
window.addEventListener('pointerup',ptrEnd);window.addEventListener('pointercancel',ptrEnd);
muteBtn.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();audioInit();setMute(!save.mute);});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Enter'){e.preventDefault();if(!e.repeat)pressDown();}
  if(e.code==='KeyM')setMute(!save.mute);
});
window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Enter')pressUp();});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// ───────── 시뮬레이션 ─────────
function nextJumpOb(){
  for(const o of G.obs)if(o.jump&&!o.passed&&!o.shorted&&o.x+o.w>G.dist+HX-HERO_W)return o;
  return null;
}
// 그냥 탭(누르지 않고) 점프로 넘을 수 있는 이륙 시점 범위: 장애물에 닿기 tt초 전에 뛰면 됨
function jumpWindow(o){
  const d=Math.sqrt(JUMP_V*JUMP_V-2*GRAV*o.y1);
  const t1=(JUMP_V-d)/GRAV,t2=(JUMP_V+d)/GRAV;
  const contact=(o.w+2*HERO_W-(o.type==='puddle'?4:0))/G.speed;
  return {lo:t1,hi:t2-contact};
}
function update(dt){
  if(G.mode==='dead'){
    G.deadT+=dt;
    if(G.deadT>=POP_AT&&G.heroDeadY>0)G.heroDeadY=Math.max(0,G.heroDeadY-300*dt);
    updParts(dt);G.shake=Math.max(0,G.shake-dt*30);
    return;
  }
  G.t+=dt;
  G.speed=Math.min(SPEED_MAX,SPEED0+SPEED_ACC*G.t);
  G.dist+=G.speed*dt;
  const h=G.hero;
  // 점프 물리 (누르고 있으면 조금 더 높이·멀리)
  if(!h.ground){
    let g=GRAV;
    if(h.holding&&h.vy>0&&h.holdT<HOLD_MAX){g*=HOLD_G;h.holdT+=dt;}
    h.vy-=g*dt;h.y+=h.vy*dt;
    if(h.y<=0){h.y=0;h.vy=0;h.ground=true;if(h.buf>0)doJump();}
  }
  if(h.buf>0)h.buf-=dt;
  h.legT+=dt*G.speed/40;
  if(G.inv>0)G.inv-=dt;
  if(G.checkerT>0)G.checkerT-=dt;
  // 첫 판 도우미: 아직 20초를 버틴 적이 없으면, 장애물 앞에서 느려지며 "지금 탭!"
  G.hint=false;G.timeScale=1;
  if(!save.tut&&G.t<21&&h.ground){
    const o=nextJumpOb();
    if(o){const tt=(o.x-(G.dist+HX+HERO_W))/G.speed,win=jumpWindow(o);if(tt<=win.hi&&tt>=win.lo-0.02){G.hint=true;G.timeScale=0.22;}}
  }
  if(G.t>=20&&!save.tut){save.tut=true;writeSave();}
  // 충돌
  const hx0=G.dist+HX-HERO_W,hx1=G.dist+HX+HERO_W;
  for(const o of G.obs){
    if(o.passed||o.shorted)continue;
    if(o.x+o.w<hx0){o.passed=true;G.cleared++;continue;}
    let ix0=o.x,ix1=o.x+o.w;
    if(o.type==='puddle'){ix0+=2;ix1-=2;} // 발 끝이 살짝 걸친 건 봐줌
    if(hx1>ix0&&hx0<ix1&&h.y<o.y1&&h.y+HERO_H>o.y0){
      if(G.inv>0)continue;
      if(G.shield>0){G.shield=0;G.inv=0.9;o.shorted=true;toast(TOAST.shield);sfx.shield();burst(HX,GY-h.y-25,'#ffd84a',18);continue;}
      die(o);break;
    }
  }
  // 아이템
  for(const it of G.items){
    if(it.got)continue;
    if(Math.abs(it.x-(G.dist+HX))<20&&h.y<it.y+14&&h.y+HERO_H>it.y-14){
      it.got=true;sfx.pick();burst(HX,GY-it.y,it.type==='glove'?'#ff9a2e':'#61e8ff',12);
      if(it.type==='glove'){G.shield=1;toast(TOAST.glove);}else{G.checkerT=12;toast(TOAST.checker);}
    }
  }
  // 정리
  const left=G.dist-200;
  G.obs=G.obs.filter(o=>o.x+o.w>left);G.items=G.items.filter(i=>i.x>left&&!i.got);
  genMore();
  updParts(dt);
  for(const tt of G.toasts)tt.t+=dt;G.toasts=G.toasts.filter(t=>t.t<2.4);
}
function die(o){
  G.mode='dead';G.deadT=0;G.deadAtT=G.t;G.cause=o.type;G.heroDeadY=G.hero.y;G.timeScale=1;G.hint=false;
  const list=FACTS[o.type];const i=(save.fi[o.type]|0);G.fact=list[i%list.length];save.fi[o.type]=(i+1)%list.length;
  G.score=Math.floor(G.dist/PX_PER_M);G.newBest=G.score>save.best;
  if(G.newBest)save.best=G.score;save.runs=(save.runs|0)+1;writeSave();

}
function toast(s){G.toasts=[{s,t:0}];}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,v=rr(60,220);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:rr(0.3,0.6),c,r:rr(1.5,3)});}}
function smoke(x,y,n){for(let i=0;i<n;i++)G.parts.push({x:x+rr(-14,14),y:y+rr(-6,6),vx:rr(-25,25),vy:rr(-70,-30),t:0,life:rr(0.9,1.6),c:'smoke',r:rr(6,12)});}
function updParts(dt){for(const p of G.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.c!=='smoke')p.vy+=400*dt;else p.r+=dt*8;}G.parts=G.parts.filter(p=>p.t<p.life);}

function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wrapText(s,maxW){
  const out=[];let line='';
  for(const word of s.split(' ')){
    const test=line?line+' '+word:word;
    if(ctx.measureText(test).width>maxW&&line){out.push(line);line=word;}else line=test;
    while(ctx.measureText(line).width>maxW&&line.length>1){ // 긴 단어는 글자 단위로
      let k=line.length;while(k>1&&ctx.measureText(line.slice(0,k)).width>maxW)k--;
      out.push(line.slice(0,k));line=line.slice(k);
    }
  }
  if(line)out.push(line);return out;
}
function spark(x,y,n,col){
  ctx.strokeStyle=col||'#fff36b';ctx.lineWidth=1.6;
  for(let i=0;i<n;i++){
    ctx.beginPath();let px=x,py=y;ctx.moveTo(px,py);
    for(let k=0;k<3;k++){px+=rr(-7,7);py+=rr(-9,-1);ctx.lineTo(px,py);}
    ctx.stroke();
  }
}
function drawBG(){

  ctx.fillStyle='#ffd77a';

  const off2=(G.dist*0.5)%220;
  ctx.strokeStyle='#1a1530';ctx.lineWidth=5;
  for(let i=-1;i<W/220+2;i++){const x=i*220-off2+40;ctx.beginPath();ctx.moveTo(x,GY);ctx.lineTo(x,GY-210);ctx.stroke();ctx.fillStyle='#1a1530';ctx.fillRect(x-22,GY-200,44,5);}
  ctx.lineWidth=1.2;

  // 땅

}
function drawOb(o){

    case 'birds':{

        ctx.fillStyle='#f5a623';ctx.fillRect(bx+8,by-11,3,2);

  }
  if(hot)ctx.restore();
}
function drawItem(it){

// 주인공. pose: {x, yFeet(화면), leg, mode:'run'|'air'|'xray'|'hair'|'afro', glove}
function drawHero(p){
  const x=p.x,y=p.yFeet;
  const xr=p.mode==='xray';
  const skin=xr?'#3a7bd5':'#f2c49b', cloth=xr?'#2a5fb0':'#2f6db5', pants=xr?'#24509a':'#25365e';

  ctx.beginPath();ctx.moveTo(x,y-16);ctx.lineTo(x-Math.sin(a)*12,y-2+(p.mode==='air'?-4:0));ctx.stroke();
  ctx.fillStyle=xr?'#1b3d75':'#222';ctx.fillRect(x+Math.sin(a)*12-3,y-4,8,4);ctx.fillRect(x-Math.sin(a)*12-3,y-4+(p.mode==='air'?-4:0),8,4);

  ctx.fillStyle=p.glove&&!xr?'#ff9a2e':skin;ctx.beginPath();ctx.arc(hx,hy,3.5,0,Math.PI*2);ctx.fill();

  if(p.mode==='afro'){ctx.fillStyle='rgba(70,70,80,.55)';ctx.beginPath();ctx.arc(x-5,hy0+3,3.5,0,Math.PI*2);ctx.arc(x+6,hy0-5,3,0,Math.PI*2);ctx.arc(x+3,hy0+6,2.5,0,Math.PI*2);ctx.fill();} // 그을음

    ctx.beginPath();ctx.moveTo(x,y-16);ctx.lineTo(x+Math.sin(a)*12,y-3);ctx.moveTo(x,y-16);ctx.lineTo(x-Math.sin(a)*12,y-3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-34);ctx.lineTo(hx,hy);ctx.stroke();

    ctx.fillStyle='#3a7bd5';ctx.fillRect(x+1,hy0-3,3,3);ctx.fillRect(x-4,hy0-3,3,3);ctx.fillRect(x-3,hy0+2,6,1.5);
    return;
  }

    ctx.fillStyle='#222';ctx.fillRect(x+3,hy0-2,1.5,1.5);ctx.fillRect(x-4,hy0-2,1.5,1.5);
    ctx.beginPath();ctx.ellipse(x+1,hy0+5,3,2.5,0,0,Math.PI*2);ctx.fillStyle='#222';ctx.fill();

    ctx.fillStyle='#222';ctx.fillRect(x+3,hy0-3,2.5,3);ctx.fillRect(x-2,hy0-3,2.5,3);
    ctx.fillRect(x,hy0+4,5,1.5);
  }
  if(p.mode==='hair'){

    ctx.strokeStyle='#222';ctx.lineWidth=2;
    for(let i=-4;i<=4;i++){ctx.beginPath();ctx.moveTo(x+i*2,hy0-8);ctx.lineTo(x+i*3.2+rr(-1,1),hy0-24+Math.abs(i)*1.5);ctx.stroke();}
    ctx.fillStyle='#f6c90e';ctx.beginPath();ctx.arc(x,hy0-24,11,Math.PI,0);ctx.fill();ctx.fillRect(x-13,hy0-25,26,3);

function heroPose(){
  const h=G.hero;
  if(G.mode==='dead'){
    const d=G.deadT;let mode;
    if(d<0.36)mode=(Math.floor(d/0.06)%2===0)?'xray':'hair0';

    if(mode==='hair0')mode='run';
    const jx=d<POP_AT?rr(-1.5,1.5):0;
    return {x:HX+jx,yFeet:GY-G.heroDeadY,leg:1.2,mode:mode==='run'?'stand':mode,glove:false};
  }
  return {x:HX,yFeet:GY-h.y,leg:h.legT,mode:h.ground?'run':'air',glove:G.shield>0};
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);

  drawBG();

  for(const it of G.items)drawItem(it);
  const p=heroPose();
  if(G.mode==='run'&&G.inv>0&&Math.floor(G.inv*20)%2)ctx.globalAlpha=0.4;
  if(G.mode==='dead'){const z=1+0.6*Math.min(1,G.deadT/0.15);ctx.save();ctx.translate(p.x,p.yFeet);ctx.scale(z,z);ctx.translate(-p.x,-p.yFeet);drawHero(p);ctx.restore();}
  else drawHero(p);
  ctx.globalAlpha=1;
  if(G.mode==='dead'&&G.deadT<POP_AT){ // 몸 주위 지지직
    spark(HX-12,GY-G.heroDeadY-45,3,'#bff6ff');spark(HX+12,GY-G.heroDeadY-70,3,'#fff36b');
  }
  // 입자
  for(const q of G.parts){

  }
  // 검전기: 화면 밖 활선 미리 표시
  if(G.mode==='run'&&G.checkerT>0){
    for(const o of G.obs){
      const sx=o.x-G.dist;if(o.shorted||sx<W-10||sx>W+G.speed*2.5)continue;
      const yy=o.type==='birds'?GY-100:GY-30;
      ctx.fillStyle='#ff3b3b';ctx.beginPath();ctx.moveTo(W-6,yy);ctx.lineTo(W-22,yy-10);ctx.lineTo(W-22,yy+10);ctx.closePath();ctx.fill();
      ctx.font='bold 11px sans-serif';ctx.textAlign='right';ctx.fillText('활선 '+Math.round((sx-HX)/PX_PER_M)+'m',W-26,yy+4);
    }
  }

}

  // 토스트
  for(const tt of G.toasts){
    const a=Math.min(1,(2.4-tt.t)*3);ctx.globalAlpha=a;
    ctx.font='bold 15px system-ui,sans-serif';ctx.textAlign='center';
    const lines=wrapText(tt.s,W-60);const bw=Math.min(W-30,Math.max(...lines.map(l=>ctx.measureText(l).width))+28),bh=lines.length*20+14;
    ctx.fillStyle='rgba(0,0,0,.6)';rrect(W/2-bw/2,H*0.2-4,bw,bh,10);ctx.fill();
    ctx.fillStyle='#fff';lines.forEach((l,i)=>ctx.fillText(l,W/2,H*0.2+18+i*20));
    ctx.globalAlpha=1;
  }
  if(G.mode==='dead')drawDeath();
}
function drawTapRing(x,y,t){
  const r=18+6*((t*1.2)%1);
  ctx.strokeStyle=`rgba(255,243,107,${1-((t*1.2)%1)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r+10,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,243,107,.9)';ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill();
}
function drawDeath(){
  const d=G.deadT;
  if(d<0.36&&Math.floor(d/0.06)%2===0){ctx.fillStyle='rgba(180,230,255,.25)';ctx.fillRect(0,0,W,H);}
  if(d>=POP_AT&&d<POP_AT+0.35){
    const k=(d-POP_AT)/0.35;
    ctx.save();ctx.translate(HX+40,GY-G.heroDeadY-125);ctx.scale(0.8+k*0.9,0.8+k*0.9);ctx.globalAlpha=1-k*0.6;
    ctx.fillStyle='#fff36b';ctx.beginPath();
    for(let i=0;i<16;i++){const r=i%2?18:38,a=i/16*Math.PI*2;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
    ctx.closePath();ctx.fill();ctx.fillStyle='#d01e1e';ctx.font='bold 26px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('펑!',0,9);
    ctx.restore();
  }
  if(d<POP_AT)return;
  // 상식 카드
  const k=Math.min(1,(d-POP_AT)/0.15);
  const cw=Math.min(W-28,420),cx=W/2-cw/2,cy=H*0.13+(1-k)*30;
  ctx.globalAlpha=k;
  ctx.font='bold 15px system-ui,sans-serif';
  const lines=wrapText(G.fact,cw-32);
  const ch=94+lines.length*22+40;
  ctx.fillStyle='rgba(12,14,30,.88)';rrect(cx,cy,cw,ch,16);ctx.fill();
  ctx.strokeStyle='#fff36b';ctx.lineWidth=2;rrect(cx,cy,cw,ch,16);ctx.stroke();
  ctx.textAlign='center';ctx.fillStyle='#fff36b';ctx.font='bold 20px system-ui,sans-serif';
  ctx.fillText('⚡ '+CAUSE[G.cause],W/2,cy+34);
  ctx.fillStyle='#fff';ctx.font='bold 15px system-ui,sans-serif';
  lines.forEach((l,i)=>ctx.fillText(l,W/2,cy+66+i*22));
  const sy=cy+66+lines.length*22+14;
  ctx.font='bold 22px system-ui,sans-serif';ctx.fillStyle=G.newBest?'#7dff8a':'#fff';
  ctx.fillText(G.score+'m'+(G.newBest?'  최고 기록!':''),W/2,sy+8);
  ctx.font='13px system-ui,sans-serif';ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillText('최고 '+save.best+'m',W/2,sy+30);
  ctx.globalAlpha=1;
  if(d>=RESTART_AT){
    const a=0.65+0.35*Math.sin(d*7);
    ctx.font='bold 24px system-ui,sans-serif';ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.fillText('아무 데나 탭 → 바로 다시',W/2,cy+ch+44);
  }
}

// ───────── 루프 ─────────
let acc=0,last=performance.now(),popDone=false;
function simAdvance(realDt){
  acc+=realDt*G.timeScale;
  let n=0;
  while(acc>=STEP&&n<60){
    const wasPop=G.mode==='dead'&&G.deadT>=POP_AT;
    update(STEP);acc-=STEP;n++;
    if(G.mode==='dead'&&!wasPop&&G.deadT>=POP_AT){smoke(HX,GY-G.heroDeadY-90,14);burst(HX,GY-G.heroDeadY-80,'#fff36b',18);G.shake=8;}
  }
}
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  if(!paused)simAdvance(dt);
  draw();requestAnimationFrame(frame);
}
let paused=false;
newRun();
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{last=performance.now();});

// ───────── 테스트용 ─────────
window.__game={
  get state(){const h=G.hero;return {mode:G.mode,t:G.t,dist:G.dist,m:Math.floor(G.dist/PX_PER_M),speed:G.speed,heroY:h.y,ground:h.ground,
    shield:G.shield,checkerT:G.checkerT,deadT:G.deadT,cause:G.cause,fact:G.fact,score:G.score,best:save.best,jumps:G.jumps,cleared:G.cleared,
    hint:G.hint,timeScale:G.timeScale,tut:save.tut,restartAt:RESTART_AT};},
  get obstacles(){return G.obs.map(o=>({type:o.type,dx:o.x-(G.dist+HX),w:o.w,passed:o.passed,shorted:o.shorted}));},
  nextJump(){const o=nextJumpOb();return o?{type:o.type,dx:o.x-(G.dist+HX+HERO_W),w:o.w,tt:(o.x-(G.dist+HX+HERO_W))/G.speed,win:jumpWindow(o)}:null;},
  step(sec){const n=Math.round(sec/STEP);for(let i=0;i<n;i++)simAdvance(STEP);draw();},
  pause(p){paused=!!p;last=performance.now();},
  tap(){pressDown();},release(){pressUp();},
  seed(s){seed=s>>>0||1;},restart(){newRun();},
  facts:FACTS,save
};
</script>
