<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>1000mA=1A!: 전류 단위 짝 퍼즐</title>
<style>
*{box-sizing:border-box;word-break:keep-all;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f1420;color:#fff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:8px 10px 10px;user-select:none}
.top{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800}
.top .sp{flex:1}
#mute{width:56px;height:56px;border-radius:14px;border:2px solid #3c4660;background:#182036;color:#fff;font-size:24px}
.rule{margin:2px 0 6px;font-size:20px;font-weight:800;color:#ffd84a;text-align:center;line-height:1.3}
.bar{display:flex;justify-content:space-between;font-size:21px;font-weight:800;margin-bottom:6px}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c{border:3px solid #34406a;border-radius:14px;background:#1b2440;color:#fff;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:27px;line-height:1.1}
.c small{font-size:16px;font-weight:700;color:#b8c4e0}
.c.a{border-color:#4aa3ff}.c.m{border-color:#ff9f43}
.c.a .u{color:#7cc4ff}.c.m .u{color:#ffbf7a}
.c.sel{background:#ffd84a;color:#111;border-color:#fff}.c.sel .u,.c.sel small{color:#111}
.c.hint{box-shadow:0 0 0 4px #7bffb0}
.c.gone{visibility:hidden}
.c.bad{animation:shake .3s}
.c.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(.2);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.msg{min-height:56px;text-align:center;font-size:20px;font-weight:800;margin-top:8px;line-height:1.35}
.msg.warn{color:#ff9a8a}
#hint{display:block;margin:2px auto 0;height:56px;padding:0 22px;border-radius:14px;border:2px solid #3c4660;background:#182036;color:#fff;font-size:20px;font-weight:800}
.rec{text-align:center;font-size:18px;color:#9aa6c2;margin-top:auto;padding-top:4px}
.fx{position:fixed;left:0;top:0;pointer-events:none;font-size:34px;font-weight:900;transition:transform .9s ease-out,opacity .9s;z-index:9;white-space:nowrap;color:#7bffb0}
#over{position:fixed;inset:0;background:rgba(6,8,14,.94);display:none;align-items:center;justify-content:center;z-index:20}
#over .box{width:min(400px,92vw);background:#1b2440;border:3px solid #ffd84a;border-radius:20px;padding:18px;text-align:center}
#over h2{margin:0 0 6px;font-size:27px}
#over .big{font-size:24px;font-weight:800;margin:6px 0}
#over .near{font-size:20px;color:#ffd84a;margin:6px 0}
#over .tip{font-size:19px;line-height:1.45;background:#0f1420;border-radius:12px;padding:10px;margin:10px 0;text-align:left}
#again{width:100%;height:64px;border-radius:16px;border:0;background:#ffd84a;color:#111;font-size:26px;font-weight:900}
</style>
<meta name="description" content="파란 A 카드와 주황 mA 카드 중 같은 전류끼리 짝짓는 퍼즐(1A = 1000mA). 하트 3개, 짝 10개마다 힌트 +1."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/ma-pair/"><meta property="og:title" content="1000mA=1A!: 전류 단위 짝 퍼즐"><meta property="og:description" content="파란 A 카드와 주황 mA 카드 중 같은 전류끼리 짝짓는 퍼즐(1A = 1000mA). 하트 3개, 짝 10개마다 힌트 +1."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="1000mA=1A!: 전류 단위 짝 퍼즐",D="파란 A 카드와 주황 mA 카드 중 같은 전류끼리 짝짓는 퍼즐(1A = 1000mA). 하트 3개, 짝 10개마다 힌트 +1.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/ma-pair/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div class="top"><span id="stage">1판</span><span class="sp"></span><button id="mute" aria-label="소리">🔊</button></div>
  <div class="rule">같은 전류인 A 카드와 mA 카드를 짝지어라</div>
  <div class="bar"><span id="hearts">❤️❤️❤️</span><span id="left"></span></div>
  <div id="board"></div>
  <div class="msg" id="msg"></div>
  <button id="hint">💡 힌트 (0개)</button>
  <div class="rec" id="rec"></div>
</div>
<div id="over"><div class="box">
  <h2>단위가 꼬였어요</h2>
  <div class="big" id="oScore"></div>
  <div class="near" id="oNear"></div>
  <div class="tip" id="oTip"></div>
  <button id="again">한 번 더</button>
</div></div>
<script>
(function(){
'use strict';
var KEY='ma-pair.save.v1';
var save={best:0,pairs:0,hints:1};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object'){save.best=o.best|0;save.pairs=o.pairs|0;save.hints=('hints' in o)?(o.hints|0):1;}}}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
// FACTS.md 1~4
var TIPS=[
 '1A는 1000mA예요. m(밀리)는 「천분의 일」이라 mA를 1000으로 나누면 A가 돼요.',
 '누전차단기(사람 감전 보호용)는 30mA에서 떨어져요. 30mA = 0.03A, 아주 작은 전류예요.',
 '보조배터리의 mAh는 「얼마나 오래」(용량), 충전기의 A는 「얼마나 세게」(전류)예요. 둘은 다른 말이에요.',
 '가전 이름표의 W를 220으로 나누면 대략 몇 A인지 나와요. 2200W면 약 10A.'
];
// 예시 물건 이름(숫자는 놀이용 예시)
var ITEMS=['예시 충전기','예시 LED등','예시 선풍기','예시 라디오','예시 장난감'];
var AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,delay){if(muted)return;var a=ac();if(!a)return;var t=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function $(id){return document.getElementById(id);}
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fx(txt,x,y){var d=document.createElement('div');d.className='fx';d.textContent=txt;if(x==null){x=window.innerWidth/2-110;y=window.innerHeight/2-40;}d.style.transform='translate('+x+'px,'+y+'px)';document.body.appendChild(d);requestAnimationFrame(function(){d.style.transform='translate('+x+'px,'+(y-80)+'px)';d.style.opacity='0';});setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},1000);}
// 값은 mA 정수로 다룸
var EASY=[1000,2000,3000,4000,5000];
var MID=[500,1500,2500,200,100,800];
var HARD=[250,50,20,750,1200,30,5,150,10];
function fmtA(ma){var s=(ma/1000).toString();return s;}
function pickValues(st,n){
 var pool=st<=2?EASY.concat(MID.slice(0,2)):st<=4?EASY.concat(MID):EASY.slice(0,3).concat(MID,HARD);
 var vals=[];
 // 3판부터: 헷갈리는 가족(5000·500·50 같은 것)을 섞음
 if(st>=3){var fam=shuffle([[5000,500,50],[2000,200,20],[1000,100,10],[3000,300,30],[1500,150]])[0];fam.forEach(function(v){if(vals.length<n-1)vals.push(v);});}
 shuffle(pool);
 for(var i=0;i<pool.length&&vals.length<n;i++)if(vals.indexOf(pool[i])<0)vals.push(pool[i]);
 return vals;
}
var S={stage:1,hearts:3,cards:[],sel:-1,left:0,over:false,lock:false};
function build(){
 var st=S.stage,n=Math.min(3+Math.floor((st-1)/2),6);
 var vals=pickValues(st,n),cards=[];
 vals.forEach(function(v,i){
  var item=(st>=5&&i%2===0)?ITEMS[rnd(ITEMS.length)]:'';
  cards.push({v:v,u:'A',item:item?'':'' ,gone:false});
  cards.push({v:v,u:'mA',item:item,gone:false});
 });
 S.cards=shuffle(cards);S.sel=-1;S.left=n;
 var bd=$('board');bd.innerHTML='';
 var rows=Math.ceil(S.cards.length/3),avail=window.innerHeight-330;
 var h=Math.max(64,Math.min(96,Math.floor((avail-8*(rows-1))/rows)));
 S.cards.forEach(function(c,i){
  var b=document.createElement('button');b.className='c '+(c.u==='A'?'a':'m');b.dataset.i=i;b.style.height=h+'px';
  var num=c.u==='A'?fmtA(c.v):String(c.v);
  b.innerHTML=(c.item?'<small>'+c.item+'</small>':'')+'<span>'+num+'<span class="u">'+c.u+'</span></span>';
  bd.appendChild(b);
 });
 render();
 say(st===1?'파란 A 카드 하나, 주황 mA 카드 하나를 눌러 보세요':'같은 크기의 전류끼리 짝!');
}
function say(t,warn){$('msg').textContent=t;$('msg').className='msg'+(warn?' warn':'');}
function render(){
 $('stage').textContent=S.stage+'판';
 $('hearts').textContent='❤️'.repeat(S.hearts)+'🖤'.repeat(3-S.hearts);
 $('left').textContent='남은 짝 '+S.left;
 $('hint').textContent='💡 힌트 ('+save.hints+'개)';
 $('rec').textContent='최고 '+save.best+'판 · 지금까지 맞춘 짝 '+save.pairs+'개 (10짝마다 힌트 +1)';
}
function el(i){return document.querySelectorAll('#board .c')[i];}
function tap(i){
 if(S.over||S.lock)return;ac();
 var c=S.cards[i];if(!c||c.gone)return;
 if(S.sel===i){S.sel=-1;el(i).classList.remove('sel');tone(330,.05,'sine',.08);return;}
 if(S.sel<0){S.sel=i;el(i).classList.add('sel');tone(520,.06,'sine',.1);return;}
 var a=S.cards[S.sel],ai=S.sel;
 if(a.u===c.u){el(ai).classList.remove('sel');S.sel=i;el(i).classList.add('sel');say('A 하나, mA 하나를 짝지어요');tone(520,.06,'sine',.1);return;}
 S.sel=-1;
 if(a.v===c.v){
  a.gone=c.gone=true;S.left--;save.pairs++;
  if(save.pairs%10===0){save.hints++;setTimeout(function(){fx('💡 힌트 +1');},500);}
  store();
  [ai,i].forEach(function(k){var e=el(k);e.classList.remove('sel','hint');e.classList.add('pop');});
  var r=el(i).getBoundingClientRect();
  fx(fmtA(c.v)+'A = '+c.v+'mA',Math.max(4,r.left-60),r.top);
  tone(660,.1,'triangle',.18);tone(880,.14,'triangle',.18,.09);vib(25);
  say('딱 맞아요! '+fmtA(c.v)+'A = '+c.v+'mA');
  setTimeout(function(){[ai,i].forEach(function(k){el(k).classList.add('gone');});},280);
  render();
  if(S.left===0)win();
 }else{
  S.hearts--;
  [ai,i].forEach(function(k){var e=el(k);e.classList.remove('sel');void e.offsetWidth;e.classList.add('bad');setTimeout(function(){e.classList.remove('bad');},320);});
  var A=a.u==='A'?a:c,M=a.u==='A'?c:a;
  say(fmtA(A.v)+'A는 '+A.v+'mA예요. '+M.v+'mA는 '+fmtA(M.v)+'A',true);
  tone(160,.25,'sawtooth',.12);vib([50,30,50]);
  render();
  if(S.hearts<=0)lose();
 }
}
function win(){
 S.lock=true;
 if(S.stage>save.best)save.best=S.stage;store();
 tone(523,.12,'triangle',.2,.15);tone(659,.12,'triangle',.2,.27);tone(784,.12,'triangle',.2,.39);tone(1047,.35,'triangle',.2,.51);vib([30,30,60]);
 fx(S.stage+'판 짝 완성!');
 setTimeout(function(){S.stage++;S.lock=false;build();},1300);
}
function lose(){
 S.over=true;store();
 var done=S.stage-1;
 $('oScore').textContent=done+'판 완성 · '+S.stage+'판에서 짝 '+S.left+'개 남김';
 var gap=save.best-done;
 $('oNear').textContent=gap>0?'최고 기록까지 '+gap+'판 남았어요':'최고 기록과 같아요! 한 판만 더';
 $('oTip').textContent='💡 '+TIPS[rnd(TIPS.length)];
 setTimeout(function(){$('over').style.display='flex';},500);
}
function useHint(){
 if(S.over||S.lock)return;
 if(save.hints<=0){say('힌트가 없어요. 짝 10개마다 하나 생겨요',true);return;}
 for(var i=0;i<S.cards.length;i++){var c=S.cards[i];if(c.gone)continue;
  for(var j=0;j<S.cards.length;j++){var d=S.cards[j];if(j!==i&&!d.gone&&d.v===c.v&&d.u!==c.u){save.hints--;store();el(i).classList.add('hint');el(j).classList.add('hint');tone(990,.15,'sine',.12);render();say('빛나는 두 장이 짝이에요');return;}}}
}
function start(){S.stage=1;S.hearts=3;S.over=false;S.lock=false;$('over').style.display='none';build();}
$('board').addEventListener('click',function(e){var c=e.target.closest?e.target.closest('.c'):null;if(c)tap(+c.dataset.i);});
$('hint').addEventListener('click',useHint);
$('again').addEventListener('click',function(){ac();start();});
$('mute').addEventListener('click',function(){muted=!muted;this.textContent=muted?'🔇':'🔊';});
window.__game={state:S,save:save,start:start,tap:tap};
start();
})();
</script>
</body>
