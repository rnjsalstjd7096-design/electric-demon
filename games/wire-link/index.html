<body>
<div id="app">
  <div id="top"><div id="title">⚡ <span>전선 잇기</span> 퍼즐</div><button id="mute" aria-label="소리">🔊</button></div>

<script>
'use strict';
/* ================= 기본 ================= */
const SAVE_KEY = 'wire-link.save.v1';
const URL_GAME = 'https://rnjsalstjd7096-design.github.io/electric-demon/games/wire-link/';
const $ = s => document.querySelector(s);
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];            // 0 북 · 1 동 · 2 남 · 3 서
const POP = [0,1,1,2,1,2,2,3,1,2,2,3,2,3,3,4];
const rotm = (m, k) => { k &= 3; while (k--) m = ((m << 1) | (m >> 3)) & 15; return m; };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ================= 전기 상식 (FACTS.md) ================= */
const FACTS = [
  { t:'전기는 길이 이어져야 흐른다', f:'전선이 한 군데만 끊겨 있어도 전류는 0입니다. 전구가 안 켜지면 전구보다 먼저 "어디가 끊겼나"를 봅니다.' },
  { t:'직렬 연결', f:'전구를 한 줄로(직렬) 이으면 하나만 끊겨도 전부 꺼집니다. 옛날 크리스마스 전구 한 알이 빠지면 줄 전체가 꺼지던 이유입니다.' },
  { t:'병렬 연결', f:'집의 전등·콘센트는 병렬입니다. 하나를 꺼도 나머지는 그대로이고, 모두 같은 220V를 받습니다.' },
  { t:'분전반', f:'집에 들어온 전기는 분전반에서 메인 차단기 → 분기 차단기를 거쳐 방마다 나뉩니다. 게임의 전원 칸이 그 분전반입니다.' },
  { t:'열린 선 끝은 위험', f:'전기가 살아 있는 선 끝을 그냥 두면 감전·합선 위험입니다. 실제 현장에서는 절연 캡이나 테이프로 마감하고 접속함 안에 둡니다.' },
  { t:'접촉 불량 = 열', f:'느슨하게 물린 접속부는 저항이 커져 그 자리에서 열이 납니다. 전기 화재의 흔한 원인이라, 콘센트·단자의 조임을 점검합니다.' },
  { t:'전선 굵기', f:'전선이 굵을수록 저항이 작습니다. 가는 선에 큰 전류를 흘리면 뜨거워지므로, 전류 크기에 맞는 굵기(허용전류)를 고릅니다.' },
  { t:'옴의 법칙', f:'V = I × R. 220V에 22Ω 전열기를 꽂으면 10A가 흐릅니다. 저항이 반이면 전류는 두 배입니다.' },
  { t:'합선(단락)', f:'전원의 두 선이 저항 거의 없이 바로 맞닿으면 아주 큰 전류가 흘러 차단기가 떨어집니다. 차단기가 자꾸 떨어지면 먼저 원인을 찾아야 합니다.' },
  { t:'직렬 전구는 어둡다', f:'전구 두 개를 직렬로 이으면 전압을 나눠 가져 각각 어두워집니다. 병렬이면 각각 제 밝기로 켜집니다.' },
  { t:'전선 색', f:'KEC 기준 전선 색은 L1 갈색 · L2 흑색 · L3 회색 · 중성선 청색 · 보호도체(접지) 녹황색입니다.' },
  { t:'전선 접속', f:'전선을 이을 때는 접속부의 저항이 커지지 않게, 전선의 세기가 20% 넘게 줄지 않게, 그리고 원래 피복만큼 절연이 되도록 합니다(KEC 123).' },
  { t:'전압 강하', f:'선이 길고 가늘면 끝으로 갈수록 전압이 떨어집니다. 저압 수용가에서 조명은 3%, 그 밖의 부하는 5% 이내가 기준입니다(KEC 232.3.9).' },
  { t:'스위치는 전압선에', f:'전등 스위치는 중성선이 아니라 전압선(L) 쪽에 넣습니다. 꺼 놓았을 때 등기구에 전압이 남지 않게 하려는 것입니다.' },
  { t:'누전차단기', f:'사람 보호용 누전차단기는 30mA 이하 누설을 0.03초 안에 끊습니다(KEC 211.2.4). 분전반의 시험 버튼을 한 달에 한 번 눌러 보세요.' },
  { t:'도체와 절연체', f:'전선 속 구리는 저항이 아주 작아 전기를 잘 흘리고, 겉의 피복(PVC·XLPE)은 절연체라 전기를 막습니다. 피복이 벗겨진 선이 위험한 이유입니다.' },
  { t:'직렬 구간의 전류는 같다', f:'한 줄로 이어진 회로에서는 어느 지점을 재도 전류가 같습니다. 전구 앞이든 뒤든 같은 전류가 흐릅니다.' },
  { t:'접지', f:'접지선(녹황색)은 기기의 금속 외함을 땅과 이어 둡니다. 누전이 생겨도 사람 대신 그 선으로 전기가 흘러 차단기가 먼저 끊도록 하기 위해서입니다.' },
];

/* ================= 스테이지 설정 ================= */
const STAGES = [
  { w:4, h:4, cells:4,  bulbs:1, decoy:0,    seed:101 },
  { w:4, h:4, cells:6,  bulbs:1, decoy:0,    seed:102 },
  { w:4, h:4, cells:7,  bulbs:2, decoy:0,    seed:103 },
  { w:4, h:4, cells:8,  bulbs:2, decoy:.2,   seed:104 },
  { w:5, h:5, cells:9,  bulbs:2, decoy:.15,  seed:105 },
  { w:5, h:5, cells:11, bulbs:2, decoy:.25,  seed:106 },
  { w:5, h:5, cells:12, bulbs:3, decoy:.25,  seed:107 },
  { w:5, h:5, cells:14, bulbs:3, decoy:.3,   seed:108 },
  { w:5, h:5, cells:15, bulbs:3, decoy:.35,  seed:109 },
  { w:6, h:6, cells:14, bulbs:3, decoy:.3,   seed:110 },
  { w:6, h:6, cells:17, bulbs:3, decoy:.35,  seed:111 },
  { w:6, h:6, cells:19, bulbs:4, decoy:.35,  seed:112 },
  { w:6, h:6, cells:21, bulbs:4, decoy:.4,   seed:113 },
  { w:6, h:6, cells:23, bulbs:4, decoy:.4,   seed:114 },
  { w:6, h:6, cells:26, bulbs:5, decoy:.45,  seed:115 },
];
const DAILY_CFG = { w:6, h:6, cells:16, bulbs:3, decoy:.35 };

/* ================= 퍼즐 생성 ================= */
// 타일: { k:'src'|'wire'|'bulb'|'' , base:열린 변 비트(북1 동2 남4 서8), rot:0~3, sol:정답 rot(장식선은 -1), depth:전원에서 거리 }
function grow(rnd, W, H, cells) {
  const adj = new Int8Array(W * H), inT = new Uint8Array(W * H);
  const src = Math.floor(rnd() * W * H); inT[src] = 1; let last = src, size = 1; const members = [src];
  while (size < cells) {
    const cand = [];
    const tryFrom = c => { const x = c % W, y = (c / W) | 0; for (let d = 0; d < 4; d++) { const nx = x + DX[d], ny = y + DY[d]; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue; const n = ny * W + nx; if (!inT[n]) cand.push([c, n, d]); } };
    if (rnd() < .7) tryFrom(last);
    if (!cand.length) for (const c of members) tryFrom(c);
    if (!cand.length) return null;
    const [c, n, d] = cand[Math.floor(rnd() * cand.length)];
    adj[c] |= 1 << d; adj[n] |= 1 << ((d + 2) % 4); inT[n] = 1; members.push(n); last = n; size++;
  }
  return { adj, src, members };
}
function baseOf(m) { // 열린 변 → (기준 모양, 회전수)
  for (const b of [1, 5, 3, 7, 15]) for (let r = 0; r < 4; r++) if (rotm(b, r) === m) return [b, r];
  return [m, 0];
}
function genPuzzle(cfg, seed) {
  for (let a = 0; a < 400; a++) {
    const rnd = mulberry32((seed * 7919 + a * 104729) | 0);
    const W = cfg.w, H = cfg.h, t = grow(rnd, W, H, cfg.cells);
    if (!t) continue;
    const leaves = t.members.filter(c => c !== t.src && POP[t.adj[c]] === 1);
    if (leaves.length !== cfg.bulbs) continue;
    // 전원에서 거리
    const depth = new Int16Array(W * H).fill(-1); depth[t.src] = 0; const q = [t.src];
    while (q.length) { const c = q.shift(), x = c % W, y = (c / W) | 0; for (let d = 0; d < 4; d++) if (t.adj[c] & (1 << d)) { const n = (y + DY[d]) * W + x + DX[d]; if (depth[n] < 0) { depth[n] = depth[c] + 1; q.push(n); } } }
    const tiles = [];
    for (let c = 0; c < W * H; c++) {
      const m = t.adj[c];
      if (c === t.src) tiles.push({ k:'src', base:m, rot:0, sol:0, depth:0 });
      else if (m && POP[m] === 1) { const [b, r] = baseOf(m); tiles.push({ k:'bulb', base:b, rot:r, sol:r, depth:depth[c] }); }
      else if (m) { const [b, r] = baseOf(m); tiles.push({ k:'wire', base:b, rot:r, sol:r, depth:depth[c] }); }
      else if (rnd() < cfg.decoy) { const b = [5, 5, 3, 3, 3, 7][Math.floor(rnd() * 6)]; tiles.push({ k:'wire', base:b, rot:0, sol:-1, depth:-1 }); }
      else tiles.push({ k:'', base:0, rot:0, sol:-1, depth:-1 });
    }
    // 섞기 — 정답 타일의 60% 이상이 틀린 방향이 되도록
    const P = { w:W, h:H, tiles, src:t.src, bulbs:cfg.bulbs };
    const movable = tiles.filter(tl => tl.sol >= 0 && tl.k !== 'src' && tl.base !== 15);
    let ok = false;
    for (let k = 0; k < 30 && !ok; k++) {
      for (const tl of tiles) if (tl.k === 'wire' || tl.k === 'bulb') tl.rot = Math.floor(rnd() * 4);
      const wrong = movable.filter(tl => maskOf(tl) !== rotm(tl.base, tl.sol)).length;
      ok = wrong >= Math.ceil(movable.length * .6) && !isSolved(P);
    }
    if (!ok) continue;
    return P;
  }
  return null;
}
const maskOf = tl => tl.k ? rotm(tl.base, tl.rot) : 0;
function flow(P) { // 전원에서 흐르는 곳 계산
  const W = P.w, H = P.h, dist = new Int16Array(W * H).fill(-1), open = [];
  dist[P.src] = 0; const q = [P.src]; let lit = 0;
  while (q.length) {
    const c = q.shift(), x = c % W, y = (c / W) | 0, m = maskOf(P.tiles[c]);

/* ================= 테스트용 ================= */
window.__game = {
  state: () => ({ mode, stage:cur + 1, cleared, w:P.w, h:P.h, bulbs:P.bulbs, lit:F ? F.lit : 0, open:F ? F.open.length : 0, solved:solvedAt > 0, clearShown, hintsLeft, dailyDate, dailyDone, muted,
    tiles:P.tiles.map(t => ({ k:t.k, base:t.base, rot:t.rot, sol:t.sol })) }),
  cellCenter: c => { const b = bc.getBoundingClientRect(); return { x:b.left + ox + (c % P.w + .5) * cell, y:b.top + oy + (((c / P.w) | 0) + .5) * cell }; },
  wrong: () => { const out = []; for (let c = 0; c < P.w * P.h; c++) { const t = P.tiles[c]; if (t.sol >= 0 && t.k !== 'src' && maskOf(t) !== rotm(t.base, t.sol)) out.push({ c, taps:((t.sol - t.rot) & 3) }); } return out; },
  tap: c => tapCell(c), hint: useHint, audio: () => ac(), goto: i => loadStage(i - 1), daily: loadDaily, shuffle, gen: (cfg, seed) => genPuzzle(cfg, seed), stages: STAGES.length, share: () => dailyDone ? shareText() : '',
};

/* ================= 시작 ================= */
const sv = load();
if (sv) {
  cleared = Math.max(0, Math.min(STAGES.length, sv.cleared | 0)); muted = !!sv.muted;
  cur = Math.max(0, Math.min(cleared, sv.stage | 0, STAGES.length - 1));
  dailyDone = (sv.daily && typeof sv.daily === 'object' && sv.daily.date) ? sv.daily : null;
  dailyLog = (sv.log && typeof sv.log === 'object') ? sv.log : {};
}
$('#mute').textContent = muted ? '🔇' : '🔊';
loadStage(cur);
requestAnimationFrame(frame);
</script>
</body>
</html>
