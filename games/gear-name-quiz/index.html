<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>이게 뭐야?: 설비 이름 맞히기</title>
<meta name="description" content="설명을 읽고 현장 전기 설비의 이름을 고르는 10문제 퀴즈. 틀려도 바로 알려 줍니다.">
<style>
html,body{margin:0;height:100%;background:#14161b;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;font-size:20px}
#app{position:relative;margin:0 auto;max-width:480px;height:100%;display:flex;flex-direction:column;padding:8px 12px 10px;box-sizing:border-box}
#top{display:flex;align-items:center;justify-content:space-between;padding-left:44px;padding-right:56px;min-height:48px}
#top b{font-size:20px}#stat{font-size:20px;font-weight:800;color:#ffd23f}
#sub{font-size:20px;line-height:1.35;color:#e8ebf2;text-align:center;margin:4px 0 8px;word-break:keep-all}
#board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.bar{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;border:0;border-radius:14px;font-size:20px;font-weight:800;min-height:56px;font-family:inherit;cursor:pointer;touch-action:manipulation;background:#3b4252;color:#fff;box-shadow:0 4px 0 #1f232c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f232c}.btn.main{background:#ffd23f;color:#2b2000;box-shadow:0 4px 0 #a98400}
#mute{position:absolute;top:8px;right:10px;width:48px;height:48px;border:0;border-radius:24px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;z-index:5}
#end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,11,16,.78);z-index:4;padding:16px;box-sizing:border-box}
#end.on{display:flex}
#card{width:100%;max-width:360px;background:#2b2f3a;border:3px solid #4a505f;border-radius:18px;padding:18px;box-sizing:border-box;text-align:center;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#endTitle{font-size:24px;font-weight:800;margin:0 0 6px}#endScore{font-size:52px;font-weight:900;line-height:1.1;color:#ffd23f}
#endSub{font-size:20px;color:#e8ebf2;margin:4px 0}#endBest{font-size:20px;font-weight:700;color:#9fe1ff;margin:0 0 10px}
#fact{font-size:20px;line-height:1.45;background:#1d2029;border-radius:12px;padding:10px 12px;margin:0 0 12px;text-align:left;word-break:keep-all}
.pop{animation:pp .35s ease-out}@keyframes pp{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.shake{animation:sk .3s}@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.sp{position:absolute;font-size:28px;animation:fl .8s ease-out forwards}@keyframes fl{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.6)}}
</style>
<meta name="description" content="설명을 읽고 길가·현장 전기 설비의 이름을 고르는 10문제 퀴즈. 틀리면 바로 정답과 현장 말을 알려 줍니다."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/gear-name-quiz/"><meta property="og:title" content="이게 뭐야?: 설비 이름 맞히기"><meta property="og:description" content="설명을 읽고 길가·현장 전기 설비의 이름을 고르는 10문제 퀴즈. 틀리면 바로 정답과 현장 말을 알려 줍니다."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;top:max(8px,env(safe-area-inset-top));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="이게 뭐야?: 설비 이름 맞히기",D="설명을 읽고 길가·현장 전기 설비의 이름을 고르는 10문제 퀴즈. 틀리면 바로 정답과 현장 말을 알려 줍니다.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/gear-name-quiz/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div id="top"><b id="lv"></b><span id="stat"></span></div>
  <div id="sub"></div>
  <div id="board"></div>
  <div class="bar" id="bar"></div>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <div id="fx"></div>
  <div id="end"><div id="card">
    <div id="endTitle"></div><div id="endScore"></div><div id="endSub"></div><div id="endBest"></div>
    <div id="fact"></div>
    <button class="btn main" id="again" style="width:100%">한 번 더</button>
  </div></div>
</div>
<script>
"use strict";
const KEY='gear-name-quiz.save.v1';
let save={best:0,plays:0,fi:0};
try{const r=localStorage.getItem(KEY);if(r)save=Object.assign(save,JSON.parse(r));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
const $=id=>document.getElementById(id);
let muted=false,AC=null;
try{muted=localStorage.getItem(KEY+'.mute')==='1';}catch(e){}
function actx(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();}if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,t,v,when){if(muted)return;const a=actx();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;const s=a.currentTime+(when||0);g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d);}catch(e){}}
const sfx={tap(){tone(520,.07,'triangle',.1)},ok(){tone(660,.1,'triangle',.14);tone(880,.14,'triangle',.14,.09)},bad(){tone(180,.25,'sawtooth',.12)},
 done(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.08))},win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'square',.09,i*.09))},lose(){[330,262,196].forEach((f,i)=>tone(f,.28,'sawtooth',.1,i*.16))}};
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function burst(x,y,ch){const fx=$('fx'),r=fx.getBoundingClientRect();for(let i=0;i<5;i++){const s=document.createElement('div');s.className='sp';s.textContent=ch||'✨';s.style.left=(x-r.left-14+(Math.random()*60-30))+'px';s.style.top=(y-r.top-14+(Math.random()*30-15))+'px';fx.appendChild(s);setTimeout(()=>s.remove(),850);}}
function burstEl(el,ch){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,ch);}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'.mute',muted?'1':'0');}catch(e){}if(!muted)sfx.tap();};
function showEnd(title,score,sub,best,isNew,fact){$('endTitle').textContent=title;$('endScore').textContent=score;$('endSub').textContent=sub;const b=$('endBest');b.textContent=best;b.style.color=isNew?'#ffd23f':'#9fe1ff';$('fact').innerHTML=fact;$('end').classList.add('on');}
function hideEnd(){$('end').classList.remove('on');}

const ITEMS=[
 {n:'분전반',e:'🔲',h:'차단기들이 모여 있는 함',f:'「분전반 열어 봐」는 차단기 함 보라는 말입니다.'},
 {n:'전력량계',e:'📟',h:'쓴 전기를 재는 기계',f:'「계량기 돈다」는 전기 쓰고 있다는 말입니다.'},
 {n:'피뢰침',e:'📍',h:'벼락을 받아 땅으로 보내는 뾰족한 침',f:'건물 꼭대기에 서 있습니다.'},
 {n:'피뢰기',e:'🛡️',h:'벼락 전기를 땅으로 흘리는 장치',f:'수전 설비 입구에 달려 있습니다.'},
 {n:'서지 보호기',e:'🔰',h:'순간 높은 전압을 막는 장치',f:'분전반에 달아 기기를 지킵니다.'},
 {n:'접지 저항계',e:'📏',h:'접지가 잘 됐는지 재는 계기',f:'접지 공사 끝나면 값을 재서 적어 둡니다.'},
 {n:'검전기',e:'🔦',h:'전기가 있는지 확인하는 기구',f:'「검전기 대 봐」는 전기 있나 확인하라는 말입니다.'},
 {n:'컷아웃 스위치',e:'📦',h:'퓨즈가 든 고압 개폐기',f:'전주 변압기 위의 통이 COS입니다.'},
 {n:'변압기',e:'🔌',h:'전압을 올리거나 내리는 기계',f:'「트랜스」라고도 부릅니다.'},
 {n:'접지선',e:'🟢',h:'땅과 이어진 녹색 바탕 전선',f:'「초록선은 접지」 이것만 기억해도 됩니다.'},
 {n:'인입선',e:'🏠',h:'바깥 전기를 건물 안으로 끌어오는 선',f:'「인입선」은 한전에서 들어오는 선입니다.'}
];
const NQ=10,LIVES=3;
let qs,qi,ok,lives,lock;
function start(){hideEnd();qs=shuffle(ITEMS.slice()).slice(0,NQ);qi=0;ok=0;lives=LIVES;lock=false;$('bar').innerHTML='';draw();}
function hearts(){return '💡'.repeat(lives)+'🌑'.repeat(LIVES-lives);}
function draw(){
  const it=qs[qi];
  $('lv').textContent=(qi+1)+' / '+NQ+' 번';$('stat').textContent=hearts();
  $('sub').textContent='설명을 읽고 이름을 고르세요';
  const opts=shuffle([it].concat(shuffle(ITEMS.filter(x=>x!==it)).slice(0,2)));
  const b=$('board');b.style.alignItems='stretch';
  b.innerHTML='<div id="q" style="width:100%;display:flex;flex-direction:column;gap:12px;justify-content:center">'+
   '<div style="background:#23262e;border:3px solid #4a505f;border-radius:16px;padding:14px;text-align:center"><div style="font-size:64px;line-height:1.1">'+it.e+'</div><div style="font-size:22px;font-weight:800;line-height:1.4;margin-top:6px;word-break:keep-all">'+it.h+'</div></div>'+
   opts.map((o,i)=>'<button class="btn ch" data-i="'+i+'" style="flex:none;min-height:68px;font-size:24px">'+o.n+'</button>').join('')+'</div>';
  b.querySelectorAll('.ch').forEach((el,i)=>{el.onclick=()=>pick(el,opts[i]===it);});
}
function pick(el,right){
  if(lock)return;lock=true;const it=qs[qi];
  if(right){ok++;el.style.background='#2fa84f';sfx.ok();burstEl(el,'⚡');vib(30);el.classList.add('pop');}
  else{lives--;el.style.background='#d6453d';el.classList.add('shake');sfx.bad();vib([60,40,60]);
    document.querySelectorAll('.ch').forEach(x=>{if(x.textContent===it.n)x.style.background='#2fa84f';});}
  $('stat').textContent=hearts();
  $('sub').textContent=(right?'정답! ':'아쉽다! 정답은 '+it.n+'. ')+it.f;
  setTimeout(()=>{lock=false;qi++;if(lives<=0||qi>=NQ)finish(qi>=NQ&&lives>0);else draw();},right?1500:2300);
}
function finish(clear){
  save.plays++;const isNew=ok>save.best;if(isNew)save.best=ok;persist();
  (clear?sfx.win:sfx.lose)();
  const it=ITEMS[save.fi++%ITEMS.length];persist();
  const title=clear?'끝까지 왔어요!':'전구가 다 꺼졌어요';
  const sub=clear?NQ+'문제 끝':NQ+'문제 중 '+qi+'번째에서 멈춤';
  showEnd(title,ok+' / '+NQ,sub,(isNew?'🎉 새 최고 ':'최고 ')+save.best+' 개',isNew,'<b>'+it.n+'</b> — '+it.h+'. '+it.f);
}
$('again').onclick=()=>{sfx.tap();start();};
window.__game={get state(){return {qi,ok,lives,q:qs&&qs[qi]&&qs[qi].n}},start,ITEMS};
start();

</script>
</body>
</html>
