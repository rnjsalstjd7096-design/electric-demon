<style>
*{box-sizing:border-box;word-break:keep-all;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#15130f;color:#fff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none;touch-action:none}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:8px 10px 10px;user-select:none}
.top{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800}
.top .sp{flex:1}
#mute{width:56px;height:56px;border-radius:14px;border:2px solid #4a4436;background:#24201a;color:#fff;font-size:24px}
.rule{margin:2px 0 6px;font-size:20px;font-weight:800;color:#ffd84a;text-align:center;line-height:1.3}
.moves{text-align:center;font-size:21px;font-weight:800;margin-bottom:6px}
.moves b{color:#7be0ff}
#wrap{position:relative;margin:0 auto}
#board{position:absolute;left:0;top:0;background:#2b261e;border:4px solid #6b5f48;border-radius:12px;background-image:linear-gradient(#3a3428 2px,transparent 2px),linear-gradient(90deg,#3a3428 2px,transparent 2px)}
#door{position:absolute;background:#15130f;color:#7bffb0;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center}
.b{position:absolute;border-radius:10px;border:3px solid rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:#111;touch-action:none;transition:left .12s,top .12s}
.b.drag{transition:none;z-index:5;box-shadow:0 0 0 3px #fff}
.b.t{background:#ff4d3d;color:#fff;font-size:22px}
.b.out{transition:left .45s ease-in,opacity .45s;opacity:0}
.msg{min-height:56px;text-align:center;font-size:20px;font-weight:800;margin-top:8px;line-height:1.35}
.msg.warn{color:#ff9a8a}
#reset{display:block;margin:2px auto 0;height:56px;padding:0 22px;border-radius:14px;border:2px solid #4a4436;background:#24201a;color:#fff;font-size:20px;font-weight:800}
.rec{text-align:center;font-size:18px;color:#b0a690;margin-top:auto;padding-top:4px}
.fx{position:fixed;left:0;top:0;pointer-events:none;font-size:34px;font-weight:900;transition:transform .9s ease-out,opacity .9s;z-index:9;white-space:nowrap;color:#7bffb0}
#over{position:fixed;inset:0;background:rgba(8,7,5,.94);display:none;align-items:center;justify-content:center;z-index:20}
#over .box{width:min(400px,92vw);background:#24201a;border:3px solid #ffd84a;border-radius:20px;padding:18px;text-align:center}
#over h2{margin:0 0 6px;font-size:27px}
#over .big{font-size:24px;font-weight:800;margin:6px 0}
#over .near{font-size:20px;color:#ffd84a;margin:6px 0}
#over .tip{font-size:19px;line-height:1.45;background:#15130f;border-radius:12px;padding:10px;margin:10px 0;text-align:left}
#again{width:100%;height:64px;border-radius:16px;border:0;background:#ffd84a;color:#111;font-size:26px;font-weight:900}
</style>
<meta name="description" content="6×6 자재창고에서 가로 자재는 옆으로, 세로 자재는 위아래로 밀어 길을 내고 빨간 공구함을 문으로 빼내는 블록 탈출 퍼즐. 손 수 제한."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/slide-out/"><meta property="og:title" content="밀어 빼!: 자재창고 블록 탈출 퍼즐"><meta property="og:description" content="6×6 자재창고에서 가로 자재는 옆으로, 세로 자재는 위아래로 밀어 길을 내고 빨간 공구함을 문으로 빼내는 블록 탈출 퍼즐. 손 수 제한."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="밀어 빼!: 자재창고 블록 탈출 퍼즐",D="6×6 자재창고에서 가로 자재는 옆으로, 세로 자재는 위아래로 밀어 길을 내고 빨간 공구함을 문으로 빼내는 블록 탈출 퍼즐. 손 수 제한.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/slide-out/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div class="top"><span id="stage">1판</span><span class="sp"></span><button id="mute" aria-label="소리">🔊</button></div>
  <div class="rule">자재를 밀어 길을 내고 빨간 공구함을 문으로</div>
  <div class="moves" id="moves"></div>
  <div id="wrap"><div id="board"></div><div id="door">문▶</div></div>
  <div class="msg" id="msg"></div>
  <button id="reset">↺ 이 판 처음부터 (손 수 그대로)</button>
  <div class="rec" id="rec"></div>
</div>
<div id="over"><div class="box">
  <h2>창고에 갇혔어요</h2>
  <div class="big" id="oScore"></div>
  <div class="near" id="oNear"></div>
  <div class="tip" id="oTip"></div>
  <button id="again">한 번 더</button>
</div></div>
<script>
(function(){
'use strict';
var KEY='slide-out.save.v1';
var save={best:0,total:0};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object'){save.best=o.best|0;save.total=o.total|0;}}}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
// FACTS.md 1~3
var TIPS=[
 '작업 전엔 뿌레카(차단기)부터 내리고, 검전기로 전기가 죽었는지 확인부터.',
 '느슨한 접속부는 저항이 커져 열이 나요. 전기 화재의 흔한 원인이라 단자 조임 점검이 중요해요.',
 '젖은 손으로 플러그·스위치를 만지지 마세요. 물기는 감전 위험을 키워요.'
];
var NAMES=['전선관','드럼','분전함','사다리','자재','공구통'];
var COLORS=['#ffd84a','#7be0ff','#b8f28a','#f0b7ff','#ffb870','#e0e0e0'];
var AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,delay){if(muted)return;var a=ac();if(!a)return;var t=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function $(id){return document.getElementById(id);}
function rnd(n){return Math.floor(Math.random()*n);}
function fx(txt){var d=document.createElement('div');d.className='fx';d.textContent=txt;var x=window.innerWidth/2-120,y=window.innerHeight/2-40;d.style.transform='translate('+x+'px,'+y+'px)';document.body.appendChild(d);requestAnimationFrame(function(){d.style.transform='translate('+x+'px,'+(y-90)+'px)';d.style.opacity='0';});setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},1000);}
var N=6,EXIT=2;
// 블록: {h:가로?, len, fix:고정 좌표(가로면 줄, 세로면 칸), p:움직이는 좌표}
function cells(b,p){var a=[];for(var k=0;k<b.len;k++)a.push(b.h?b.fix*N+p+k:(p+k)*N+b.fix);return a;}
function occ(bs,pos,skip){var g=new Array(N*N).fill(-1);bs.forEach(function(b,i){if(i===skip)return;cells(b,pos[i]).forEach(function(c){g[c]=i;});});return g;}
function range(bs,pos,i){var g=occ(bs,pos,i),b=bs[i],lo=pos[i],hi=pos[i];
 while(lo>0&&g[b.h?b.fix*N+lo-1:(lo-1)*N+b.fix]<0)lo--;
 while(hi+b.len<N&&g[b.h?b.fix*N+hi+b.len:(hi+b.len)*N+b.fix]<0)hi++;
 return [lo,hi];}
function solve(bs,pos0,cap){ // 최소 손 수(블록 하나를 몇 칸이든 한 번 = 1수)
 var key=function(p){return p.join('');};
 var seen={},q=[pos0],d=0,cnt=0;seen[key(pos0)]=1;
 while(q.length&&d<=cap){var nq=[];
  for(var qi=0;qi<q.length;qi++){var p=q[qi];if(p[0]+bs[0].len===N)return d;
   for(var i=0;i<bs.length;i++){var r=range(bs,p,i);for(var v=r[0];v<=r[1];v++){if(v===p[i])continue;var np=p.slice();np[i]=v;var k=key(np);if(!seen[k]){seen[k]=1;cnt++;nq.push(np);}}}}
  q=nq;d++;if(++cnt>25000)return -1;}
 return -1;}
function gen(st){
 var k=Math.min(3+st,12),want=Math.min(2+Math.floor(st*0.8),11),best=null,bestD=-1;
 var t0=Date.now();
 for(var tries=0;tries<260;tries++){
  if(best&&Date.now()-t0>500)break;
  var bs=[{h:true,len:2,fix:EXIT}],pos=[rnd(2)];
  var g=occ(bs,pos,-1);
  for(var a=0;a<80&&bs.length<k+1;a++){
   var h=Math.random()<.45,len=Math.random()<.3?3:2,fix=rnd(N),p=rnd(N-len+1);
   if(h&&fix===EXIT)continue;
   var b={h:h,len:len,fix:fix},cs=cells(b,p);
   if(cs.some(function(c){return g[c]>=0;}))continue;
   bs.push(b);pos.push(p);cs.forEach(function(c){g[c]=bs.length-1;});
  }
  var d=solve(bs,pos,want+2);
  if(d<0)continue;
  if(d>bestD&&d<=want){best={bs:bs,pos:pos};bestD=d;}
  if(d===want)break;
 }
 if(!best){best={bs:[{h:true,len:2,fix:EXIT},{h:false,len:2,fix:4,p:0}],pos:[0,1]};bestD=1;}
 best.bs.forEach(function(b,i){b.name=i?NAMES[rnd(NAMES.length)]:'🧰공구함';b.col=COLORS[rnd(COLORS.length)];});
 return {bs:best.bs,pos:best.pos,min:bestD};
}
var S={stage:1,bs:[],pos:[],start:[],min:0,left:0,over:false,lock:false,cs:50};
function layout(){
 var w=Math.min(document.documentElement.clientWidth,430)-20-30,avail=window.innerHeight-310;
 S.cs=Math.floor(Math.min(w/N,avail/N,62));
 var W=S.cs*N+8;
 $('wrap').style.width=(W+30)+'px';$('wrap').style.height=W+'px';
 var bd=$('board');bd.style.width=W+'px';bd.style.height=W+'px';bd.style.backgroundSize=S.cs+'px '+S.cs+'px';bd.style.backgroundPosition='-2px -2px';
 var dr=$('door');dr.style.left=(W-4)+'px';dr.style.top=(4+EXIT*S.cs)+'px';dr.style.width='34px';dr.style.height=S.cs+'px';
}
function build(){
 var g=gen(S.stage);
 S.bs=g.bs;S.pos=g.pos.slice();S.start=g.pos.slice();S.min=g.min;
 S.left=S.min+(S.stage<=3?4:S.stage<=6?3:2);
 layout();
 var bd=$('board');bd.innerHTML='';
 S.bs.forEach(function(b,i){var e=document.createElement('div');e.className='b'+(i?'':' t');e.dataset.i=i;
  e.style.width=((b.h?b.len:1)*S.cs-6)+'px';e.style.height=((b.h?1:b.len)*S.cs-6)+'px';
  if(i)e.style.background=b.col;e.textContent=b.name;if(!b.h&&i){e.style.writingMode='vertical-rl';}
  bd.appendChild(e);});
 place();render();
 say(S.stage===1?'막는 자재를 손가락으로 밀어 보세요':'가장 적게 밀면 '+S.min+'번이면 돼요');
}
function place(){var es=document.querySelectorAll('#board .b');S.bs.forEach(function(b,i){var e=es[i];var r=b.h?b.fix:S.pos[i],c=b.h?S.pos[i]:b.fix;e.style.left=(c*S.cs+3)+'px';e.style.top=(r*S.cs+3)+'px';});}
function say(t,warn){$('msg').textContent=t;$('msg').className='msg'+(warn?' warn':'');}
function render(){
 $('stage').textContent=S.stage+'판';
 $('moves').innerHTML='남은 손 수 <b>'+S.left+'</b>번';
 $('rec').textContent='최고 '+save.best+'판 · 지금까지 꺼낸 공구함 '+save.total+'개';
}
// 끌기
var D=null;
$('board').addEventListener('pointerdown',function(e){
 if(S.over||S.lock)return;var t=e.target.closest('.b');if(!t)return;ac();
 var i=+t.dataset.i,b=S.bs[i];D={i:i,el:t,x:e.clientX,y:e.clientY,p0:S.pos[i],r:range(S.bs,S.pos,i)};
 t.classList.add('drag');try{t.setPointerCapture(e.pointerId);}catch(err){}e.preventDefault();
});
window.addEventListener('pointermove',function(e){if(!D)return;var b=S.bs[D.i];var dpx=b.h?e.clientX-D.x:e.clientY-D.y;
 var px=Math.max((D.r[0]-D.p0)*S.cs,Math.min((D.r[1]-D.p0)*S.cs,dpx));
 var base=D.p0*S.cs+3+px;if(b.h)D.el.style.left=base+'px';else D.el.style.top=base+'px';});
function end(e){if(!D)return;var b=S.bs[D.i];var dpx=b.h?e.clientX-D.x:e.clientY-D.y;
 var np=Math.max(D.r[0],Math.min(D.r[1],D.p0+Math.round(dpx/S.cs)));
 var i=D.i;D.el.classList.remove('drag');D=null;
 if(np!==S.pos[i]){S.pos[i]=np;S.left--;tone(260+np*40,.07,'triangle',.12);}
 place();render();
 if(S.pos[0]+S.bs[0].len===N){win();return;}
 if(S.left<=0)lose();
 else if(S.left<=2)say('손 수가 '+S.left+'번 남았어요',true);
 else if(i!==0&&np!==null)say('길이 보이나요? 공구함을 문으로');
}
window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
function win(){
 S.lock=true;save.total++;if(S.stage>save.best)save.best=S.stage;store();
 var e=document.querySelectorAll('#board .b')[0];e.classList.add('out');e.style.left=(N*S.cs+40)+'px';
 tone(523,.12,'triangle',.2);tone(659,.12,'triangle',.2,.12);tone(784,.12,'triangle',.2,.24);tone(1047,.35,'triangle',.2,.36);vib([30,30,60]);
 fx(S.stage+'판 탈출!');say('공구함 꺼냈어요!');
 setTimeout(function(){S.stage++;S.lock=false;build();},1300);
}
function lose(){
 S.over=true;store();vib([60,40,60]);tone(150,.4,'sawtooth',.12);
 var done=S.stage-1,gap=N-(S.pos[0]+S.bs[0].len);
 $('oScore').textContent=done+'판 탈출 · '+S.stage+'판에서 문까지 '+gap+'칸 남김';
 var g2=save.best-done;
 $('oNear').textContent=g2>0?'최고 기록까지 '+g2+'판 남았어요':'최고 기록과 같아요! 한 판만 더';
 $('oTip').textContent='💡 '+TIPS[rnd(TIPS.length)];
 setTimeout(function(){$('over').style.display='flex';},300);
}
function resetStage(){if(S.over||S.lock)return;S.pos=S.start.slice();place();say('처음 자리로 돌렸어요. 손 수는 그대로예요');}
function start(){S.stage=1;S.over=false;S.lock=false;$('over').style.display='none';build();}
$('reset').addEventListener('click',resetStage);
$('again').addEventListener('click',function(){ac();start();});
$('mute').addEventListener('click',function(){muted=!muted;this.textContent=muted?'🔇':'🔊';});
window.__game={state:S,save:save,start:start,solve:solve,range:range,build:build};
start();
})();
</script>
</body>
</html>
