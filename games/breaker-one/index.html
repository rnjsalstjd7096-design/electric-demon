<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>한 단자 한 가닥!: 분전반 회로 꽂기 퍼즐</title>
<style>
*{box-sizing:border-box;word-break:keep-all;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#14181c;color:#fff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:8px 10px 10px;user-select:none}
.top{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.top .sp{flex:1}
#hearts{font-size:22px;letter-spacing:2px}
#mute{width:56px;height:56px;border-radius:14px;border:2px solid #3c4650;background:#1e252c;color:#fff;font-size:24px}
.rule{margin:2px 0 6px;font-size:20px;font-weight:800;color:#ffd84a;text-align:center;line-height:1.3}
#panel{background:#cfd4d8;border:5px solid #8a949c;border-radius:14px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bk{height:56px;border-radius:10px;border:3px solid #444;background:#f4f4f0;color:#111;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:19px;font-weight:800;position:relative}
.bk .lv{width:16px;height:34px;border-radius:4px;background:#333;flex:none}
.bk.on .lv{background:#1e9e4a}
.bk.on{background:#e4f7e8;border-color:#1e9e4a}
.bk.dead{background:#6b6f73;border-color:#3a3d40;color:#ddd}
.bk.dead .lv{background:#b33}
.bk.flash{animation:fl .5s}
.bk.bad{animation:sh .4s}
@keyframes fl{0%{box-shadow:0 0 0 0 #7bff9a}50%{box-shadow:0 0 0 8px #7bff9a}100%{box-shadow:0 0 0 0 #7bff9a}}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hand{margin-top:10px;display:flex;align-items:center;gap:8px}
.card{flex:1;height:72px;border-radius:14px;background:#ffd84a;color:#111;font-size:25px;font-weight:900;display:flex;align-items:center;justify-content:center;border:4px solid #fff}
.next{font-size:18px;color:#b9c2ca;line-height:1.3;width:110px;text-align:center}
#call{margin-top:8px;height:60px;border-radius:14px;border:3px solid #ff9a5a;background:#3a2418;color:#ffd0b0;font-size:21px;font-weight:900}
.msg{min-height:50px;text-align:center;font-size:20px;font-weight:800;margin-top:6px;line-height:1.35}
.msg.warn{color:#ff9a8a}.msg.good{color:#7bff9a}
.rec{text-align:center;font-size:18px;color:#a8b0b8;margin-top:auto;padding-top:4px}
.fx{position:fixed;left:0;top:0;pointer-events:none;font-size:32px;font-weight:900;transition:transform .9s ease-out,opacity .9s;z-index:9;white-space:nowrap;color:#7bff9a}
#over{position:fixed;inset:0;background:rgba(5,8,12,.94);display:none;align-items:center;justify-content:center;z-index:20}
#over .box{width:min(400px,92vw);background:#1e252c;border:3px solid #ffd84a;border-radius:20px;padding:18px;text-align:center}
#over h2{margin:0 0 6px;font-size:27px}
#over .big{font-size:24px;font-weight:800;margin:6px 0}
#over .near{font-size:20px;color:#ffd84a;margin:6px 0}
#over .tip{font-size:19px;line-height:1.45;background:#14181c;border-radius:12px;padding:10px;margin:10px 0;text-align:left}
#again{width:100%;height:64px;border-radius:16px;border:0;background:#ffd84a;color:#111;font-size:26px;font-weight:900}
</style>
<meta name="description" content="노란 회로 카드를 분전반 빈 차단기에 하나씩 꽂는 퍼즐. 찬 차단기에 또 꽂거나(두 가닥) 고장 차단기에 꽂으면 하트 -1, 빈자리가 없으면 업체 부르기."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/breaker-one/"><meta property="og:title" content="한 단자 한 가닥!: 분전반 회로 꽂기 퍼즐"><meta property="og:description" content="노란 회로 카드를 분전반 빈 차단기에 하나씩 꽂는 퍼즐. 찬 차단기에 또 꽂거나(두 가닥) 고장 차단기에 꽂으면 하트 -1, 빈자리가 없으면 업체 부르기."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="한 단자 한 가닥!: 분전반 회로 꽂기 퍼즐",D="노란 회로 카드를 분전반 빈 차단기에 하나씩 꽂는 퍼즐. 찬 차단기에 또 꽂거나(두 가닥) 고장 차단기에 꽂으면 하트 -1, 빈자리가 없으면 업체 부르기.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/breaker-one/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div class="top"><span id="stage">1판</span><span id="hearts">❤️❤️❤️</span><span class="sp"></span><button id="mute" aria-label="소리">🔊</button></div>
  <div class="rule">차단기 하나에 회로 하나, 빈자리 없으면 업체</div>
  <div id="panel"></div>
  <div class="hand"><div class="card" id="card"></div><div class="next" id="next"></div></div>
  <button id="call">📞 빈자리 없음 — 업체 부르기</button>
  <div class="msg" id="msg">노란 회로 카드를 빈 차단기에 꽂으세요 (차단기를 누르기)</div>
  <div class="rec" id="rec"></div>
</div>
<div id="over"><div class="box">
  <h2>확인 필요 — 업체에!</h2>
  <div class="big" id="oScore"></div>
  <div class="near" id="oNear"></div>
  <div class="tip" id="oTip"></div>
  <button id="again">한 번 더</button>
</div></div>
<script>
(function(){
'use strict';
var KEY='breaker-one.save.v1';
var save={best:0,total:0};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object'){save.best=o.best|0;save.total=o.total|0;}}}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
// FACTS.md 1~4
var TIPS=[
 '뿌레카(차단기)는 자기가 맡은 전선을 지키는 문지기예요. 문지기 하나에 구역 하나.',
 '한 단자에 전선 두 가닥을 억지로 끼우면 접촉이 헐거워지기 쉽고, 헐거운 곳은 열이 날 수 있어요.',
 '차단기가 고장 나면 그 회로 기기는 쓰지 말고 업체를 부르는 게 제일 안전해요. 분전반 안은 직접 만지지 마세요.',
 '차단기 용량을 멋대로 키우면 안 돼요. 전선이 견디는 만큼에 맞춘 것이라 전선이 먼저 타요.'
];
var NAMES=['💡 거실 전등','🔌 거실 콘센트','❄️ 에어컨','🍚 주방 콘센트','🧺 세탁기','🚿 욕실','🛏️ 안방 전등','🔌 안방 콘센트','📺 작은방','🔥 전기레인지','🧊 냉장고','💡 현관 전등'];
var AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,delay){if(muted)return;var a=ac();if(!a)return;var t=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function $(id){return document.getElementById(id);}
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fx(txt,el){var d=document.createElement('div');d.className='fx';d.textContent=txt;var r=el?el.getBoundingClientRect():{left:window.innerWidth/2-80,top:window.innerHeight/2};var x=Math.max(4,Math.min(window.innerWidth-200,r.left)),y=r.top;d.style.transform='translate('+x+'px,'+y+'px)';document.body.appendChild(d);requestAnimationFrame(function(){d.style.transform='translate('+x+'px,'+(y-80)+'px)';d.style.opacity='0';});setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},1000);}
var S={};
function newRun(){S={stage:1,hearts:3,placed:0,tipI:rnd(TIPS.length)};newStage();}
function newStage(){
  var st=S.stage;
  var n=Math.min(8,4+2*Math.floor((st-1)/2)); // 4,4,6,6,8 (360×640에 맞춰 8칸까지)
  var dead=st<2?0:Math.min(3,1+Math.floor((st-2)/3));
  var pre=st<3?0:Math.min(n-dead-1,1+rnd(2)); // 미리 꽂혀 있는 회로
  var names=shuffle(NAMES.slice());
  S.bk=[];for(var i=0;i<n;i++)S.bk.push({c:null,dead:false});
  var idx=shuffle(Array.from({length:n},function(_,i){return i;}));
  var k=0;
  for(var d=0;d<dead;d++)S.bk[idx[k++]].dead=true;
  for(var p=0;p<pre;p++)S.bk[idx[k++]].c=names.pop();
  S.queue=[];for(var q=0;q<n-pre;q++)S.queue.push(names.pop());
  S.tripAt=st>=4?1+rnd(Math.max(1,S.queue.length-2)):-1; // 몇 번째 꽂은 뒤 한 차단기가 고장
  S.done=0;S.need=S.queue.length;
  $('msg').className='msg';
  $('msg').textContent=st===1?'노란 회로 카드를 빈 차단기에 꽂으세요 (차단기를 누르기)':st+'판 — 회색 차단기는 고장, 쓰면 안 돼요';
  render();
}
function render(){
  $('stage').textContent=S.stage+'판';
  $('hearts').textContent='❤️'.repeat(S.hearts)+'🖤'.repeat(3-S.hearts);
  var p=$('panel');p.innerHTML='';
  S.bk.forEach(function(b,i){
    var d=document.createElement('button');d.className='bk'+(b.dead?' dead':b.c?' on':'');d.dataset.i=i;
    d.innerHTML='<span class="lv"></span><span>'+(b.dead?'✖ 고장':b.c?b.c:(i+1)+'번 빈자리')+'</span>';
    d.addEventListener('click',function(){tapBk(i,d);});
    p.appendChild(d);
  });
  $('card').textContent=S.queue[0]||'✔';
  $('next').textContent=S.queue.length>1?'다음: '+S.queue.slice(1,3).join(', '):'';
  $('rec').textContent='최고 '+save.best+'판 · 지금까지 바로 꽂은 회로 '+save.total+'개';
}
function bad(text,el){
  S.hearts--;tone(160,.35,'sawtooth',.18);vib(200);
  if(el){el.classList.add('bad');}
  $('msg').className='msg warn';$('msg').textContent=text;
  if(S.hearts<=0){setTimeout(function(){gameOver(text);},450);return;}
  setTimeout(render,450);
}
function emptyIdx(){for(var i=0;i<S.bk.length;i++)if(!S.bk[i].dead&&!S.bk[i].c)return i;return -1;}
function tapBk(i,el){
  if(S.hearts<=0||!S.queue.length)return;
  var b=S.bk[i];
  if(b.dead){bad('✖ 고장 난 차단기예요. 여기엔 꽂으면 안 돼요',el);return;}
  if(b.c){bad('⚠ 한 단자에 두 가닥! 확인 필요 — 업체에',el);return;}
  b.c=S.queue.shift();S.done++;S.placed++;save.total++;store();
  tone(660,.12,'square',.12);tone(990,.18,'sine',.14,.08);vib(30);
  $('msg').className='msg good';$('msg').textContent='딸깍! '+b.c+' 연결';
  render();
  var nb=$('panel').children[i];nb.classList.add('flash');fx('딸깍!',nb);
  if(S.done===S.tripAt&&S.queue.length>0){
    // 쓰던 차단기 하나가 고장: 그 회로가 다시 손으로 돌아옴
    var used=[];S.bk.forEach(function(x,j){if(x.c&&!x.dead)used.push(j);});
    var t=used[rnd(used.length)],back=S.bk[t].c;
    setTimeout(function(){
      S.bk[t].c=null;S.bk[t].dead=true;S.queue.unshift(back);S.need++;
      tone(220,.25,'triangle',.16);
      $('msg').className='msg warn';$('msg').textContent='뚝! '+(t+1)+'번 차단기 고장 — '+back+' 다시 꽂을 곳은?';
      render();
    },600);
    return;
  }
  if(!S.queue.length)stageClear();
}
function callTech(){
  if(S.hearts<=0||!S.queue.length)return;
  if(emptyIdx()>=0){bad('빈 차단기가 아직 있어요. 거기에 꽂으면 돼요',$('call'));return;}
  var deads=[];S.bk.forEach(function(x,j){if(x.dead)deads.push(j);});
  if(!deads.length){bad('고친 차단기가 없어요',$('call'));return;}
  var t=deads[rnd(deads.length)];S.bk[t].dead=false;
  tone(523,.12,'sine',.14);tone(784,.2,'sine',.14,.1);vib(30);
  $('msg').className='msg good';$('msg').textContent='📞 업체가 '+(t+1)+'번 차단기를 새것으로! 이제 꽂으세요';
  render();var nb=$('panel').children[t];nb.classList.add('flash');fx('수리 끝!',nb);
}
function stageClear(){
  [523,659,784,1046].forEach(function(f,k){tone(f,.18,'triangle',.14,k*.09);});vib([40,40,80]);
  fx(S.stage+'판 끝! 모두 한 가닥씩',$('panel'));
  if(S.stage>save.best){save.best=S.stage;store();}
  S.stage++;
  setTimeout(newStage,900);
}
function gameOver(reason){
  var cleared=S.stage-1;
  $('oScore').textContent=cleared+'판 끝냄 · 이 판 '+S.done+'/'+S.need+' 꽂음';
  var gap=save.best-cleared;
  $('oNear').textContent=gap>0?'최고 기록('+save.best+'판)까지 '+gap+'판!':'최고 기록 '+save.best+'판과 같거나 넘었어요!';
  $('oTip').textContent='💡 '+TIPS[S.tipI%TIPS.length];S.tipI++;
  $('over').style.display='flex';
}
$('call').addEventListener('click',callTech);
$('again').addEventListener('click',function(){$('over').style.display='none';newRun();});
$('mute').addEventListener('click',function(){muted=!muted;$('mute').textContent=muted?'🔇':'🔊';});
window.__game={state:function(){return S;},save:function(){return save;},
  emptyIdx:emptyIdx,tap:function(i){tapBk(i,$('panel').children[i]);},call:callTech};
newRun();
})();
</script>
</body>
</html>
