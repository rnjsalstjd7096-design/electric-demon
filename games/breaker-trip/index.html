<script>
(function(){
var KEY='breaker-trip.save.v1';

  w:'의심 가는 기기는 뽑아 두고, 전기 기사나 한국전기안전공사에 점검을 맡기세요. 젖은 손으로 만지지 마세요.'},

};
var Q1={q:'차단기가 언제 떨어지나요?',o:[

  {t:'잘 모르겠어요',r:'leak'}]}
};
