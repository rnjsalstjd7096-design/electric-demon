<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>한 줄 한 색!: 전선 색 칸 채우기 퍼즐</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#16140f;color:#fff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:10px 12px 14px;user-select:none}
.top{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800}
.top .sp{flex:1}
#mute{width:56px;height:56px;border-radius:14px;border:2px solid #5a5040;background:#2a2519;color:#fff;font-size:24px}
.rule{margin:6px 0;font-size:20px;font-weight:800;color:#ffd84a;text-align:center;line-height:1.3}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:4px auto;border:4px solid #e8dcc0;border-radius:10px;overflow:hidden;width:min(100%,360px);aspect-ratio:1}
.c{border:1px solid #6b604b;background:#2a2519;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:900;padding:0;color:#fff}
.c.r1{border-bottom:4px solid #e8dcc0}.c.c1{border-right:4px solid #e8dcc0}
.c .wire{width:70%;height:22%;border-radius:8px;border:2px solid rgba(255,255,255,.5)}
.c .nm{margin-top:4px;font-size:17px}
.c.given{background:#3a3326}
.c.given .nm{color:#d8ccb0}
.c.good{background:#173a1f;box-shadow:inset 0 0 16px #2ee66b}
.c.bad{background:#5a1a12}
.c.flash{animation:fl .6s}
@keyframes fl{0%{background:#ffd84a}100%{}}
#pal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.p{height:72px;border-radius:14px;border:4px solid transparent;background:#2a2519;color:#fff;font-size:18px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.p .wire{width:76%;height:20px;border-radius:7px;border:2px solid rgba(255,255,255,.5);margin-bottom:4px}
.p.sel{border-color:#ffd84a;background:#4a3f22;box-shadow:0 0 12px #ffd84a}
.msg{min-height:30px;text-align:center;font-size:20px;font-weight:800;margin-top:8px}
.rec{text-align:center;font-size:18px;color:#b8ab90;margin-top:auto;padding-top:6px}
.fx{position:fixed;left:0;top:0;pointer-events:none;font-size:38px;font-weight:900;transition:transform .8s ease-out,opacity .8s;z-index:9;white-space:nowrap}
#over{position:fixed;inset:0;background:rgba(10,8,4,.93);display:none;align-items:center;justify-content:center;z-index:20}
#over .box{width:min(400px,92vw);background:#2a2519;border:3px solid #ffd84a;border-radius:20px;padding:20px;text-align:center}
#over h2{margin:0 0 8px;font-size:28px}
#over .big{font-size:24px;font-weight:800;margin:6px 0}
#over .near{font-size:20px;color:#ffd84a;margin:6px 0}
#over .tip{font-size:19px;line-height:1.45;background:#16140f;border-radius:12px;padding:10px;margin:12px 0;text-align:left}
#again{width:100%;height:64px;border-radius:16px;border:0;background:#ffd84a;color:#111;font-size:26px;font-weight:900}
</style>
<meta name="description" content="4×4 판에 갈색·검정·회색·파랑 전선 색을 가로·세로·네모칸마다 하나씩 들어가게 채우는 퍼즐. 시간 제한 없이 실수 3번이면 끝."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/wire-grid/"><meta property="og:title" content="한 줄 한 색!: 전선 색 칸 채우기 퍼즐"><meta property="og:description" content="4×4 판에 갈색·검정·회색·파랑 전선 색을 가로·세로·네모칸마다 하나씩 들어가게 채우는 퍼즐. 시간 제한 없이 실수 3번이면 끝."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="한 줄 한 색!: 전선 색 칸 채우기 퍼즐",D="4×4 판에 갈색·검정·회색·파랑 전선 색을 가로·세로·네모칸마다 하나씩 들어가게 채우는 퍼즐. 시간 제한 없이 실수 3번이면 끝.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/wire-grid/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div class="top"><span id="stage">1판</span><span class="sp"></span><span id="life">❤️❤️❤️</span><button id="mute" aria-label="소리">🔊</button></div>
  <div class="rule">가로·세로·네모칸마다 네 색이 하나씩</div>
  <div id="grid"></div>
  <div id="pal"></div>
  <div class="msg" id="msg"></div>
  <div class="rec" id="rec"></div>
</div>
<div id="over"><div class="box">
  <h2>실수 3번이에요</h2>
  <div class="big" id="oScore"></div>
  <div class="near" id="oNear"></div>
  <div class="tip" id="oTip"></div>
  <button id="again">한 번 더</button>
</div></div>
<script>
(function(){
'use strict';
var KEY='wire-grid.save.v1';
var save={best:0,total:0};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object'){save.best=o.best|0;save.total=o.total|0;}}}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
// 네 가지 전선 색(놀이 판 무늬. 색 이름은 KEC 전선 식별 색에서 가져옴 — FACTS.md)
var COL=[['#8a5a2b','갈색'],['#111111','검정'],['#8c8c8c','회색'],['#1f6fe0','파랑']];
var TIPS=[
 '전선 색: L1 갈색 · L2 검정 · L3 회색 · 중성선 파랑 · 접지선 초록-노랑 줄무늬.',
 '배선용 차단기는 전선을 지키고, 누전차단기는 사람을 지킨다.',
 '누전차단기는 들어간 전류와 돌아온 전류의 차이를 본다. 차이가 나면 어딘가로 새는 것.',
 '많이 써서 떨어지는 건 과전류 쪽, 새서 떨어지는 건 누전 쪽 일이다.'
];
var AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,delay){if(muted)return;var a=ac();if(!a)return;var t=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
function sPick(){tone(440,.06,'square',.06);}
function sGood(){tone(660,.1,'triangle',.16);tone(990,.14,'triangle',.13,.08);}
function sLine(){[784,988,1175].forEach(function(f,i){tone(f,.14,'triangle',.13,i*.07);});}
function sClear(){[523,659,784,1046,1318].forEach(function(f,i){tone(f,.18,'triangle',.15,i*.08);});}
function sBad(){tone(200,.25,'sawtooth',.1);}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function fx(txt,x,y,color){var e=document.createElement('div');e.className='fx';e.textContent=txt;e.style.color=color;e.style.transform='translate('+(x-40)+'px,'+(y-20)+'px)';document.body.appendChild(e);requestAnimationFrame(function(){e.style.transform='translate('+(x-40)+'px,'+(y-90)+'px) scale(1.2)';e.style.opacity='0';});setTimeout(function(){e.parentNode&&e.parentNode.removeChild(e);},900);}
var $=function(id){return document.getElementById(id);};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0;var t=a[i];a[i]=a[j];a[j]=t;}return a;}
// 4×4 판 만들기(가로·세로·2×2 네모마다 0~3 하나씩)
function solution(){
  var base=[[0,1,2,3],[2,3,0,1],[1,0,3,2],[3,2,1,0]];
  var d=shuffle([0,1,2,3]);
  var bands=shuffle([0,1]),rows=[];bands.forEach(function(b){shuffle([0,1]).forEach(function(r){rows.push(b*2+r);});});
  var stacks=shuffle([0,1]),cols=[];stacks.forEach(function(b){shuffle([0,1]).forEach(function(c){cols.push(b*2+c);});});
  var tr=Math.random()<.5,g=[];
  for(var r=0;r<4;r++){g.push([]);for(var c=0;c<4;c++){var v=tr?base[cols[c]][rows[r]]:base[rows[r]][cols[c]];g[r].push(d[v]);}}
  return g;
}
function ok(g,r,c,v){for(var i=0;i<4;i++){if(g[r][i]===v||g[i][c]===v)return false;}var br=r-r%2,bc=c-c%2;for(var y=br;y<br+2;y++)for(var x=bc;x<bc+2;x++)if(g[y][x]===v)return false;return true;}
function count(g,lim){for(var r=0;r<4;r++)for(var c=0;c<4;c++)if(g[r][c]<0){var n=0;for(var v=0;v<4;v++)if(ok(g,r,c,v)){g[r][c]=v;n+=count(g,lim-n);g[r][c]=-1;if(n>=lim)return n;}return n;}return 1;}
function puzzle(blanks){
  var sol=solution(),g=sol.map(function(r){return r.slice();});var cells=shuffle(Array.from({length:16},function(_,i){return i;})),made=0;
  for(var k=0;k<cells.length&&made<blanks;k++){var r=cells[k]>>2,c=cells[k]&3,keep=g[r][c];g[r][c]=-1;if(count(g,2)!==1)g[r][c]=keep;else made++;}
  return{sol:sol,g:g};
}
var st,sel=0;
function newGame(){st={stage:0,cleared:0,filled:0,life:3,over:false};$('over').style.display='none';nextStage();}
function nextStage(){
  st.stage++;var n=st.stage;var blanks=[4,6,8,9,10][Math.min(4,n-1)]+(n>5?1:0);
  var p=puzzle(blanks);st.sol=p.sol;st.g=p.g;st.given=p.g.map(function(r){return r.map(function(v){return v>=0;});});
  st.left=0;st.g.forEach(function(r){r.forEach(function(v){if(v<0)st.left++;});});st.lock=false;
  render();msg(n===1?'아래에서 색을 고르고, 빈칸을 눌러요':'다음 판! 빈칸 '+st.left+'개','#ffd84a');
}
function wire(v){return'<span class="wire" style="background:'+COL[v][0]+'"></span><span class="nm">'+COL[v][1]+'</span>';}
function render(){
  var g=$('grid');g.innerHTML='';
  for(var r=0;r<4;r++)for(var c=0;c<4;c++){(function(r,c){var b=document.createElement('button');b.className='c'+(r===1?' r1':'')+(c===1?' c1':'')+(st.given[r][c]?' given':'');
    if(st.g[r][c]>=0)b.innerHTML=wire(st.g[r][c]);b.onclick=function(){tap(r,c,b);};g.appendChild(b);})(r,c);}
  var p=$('pal');if(!p.children.length){COL.forEach(function(cl,i){var b=document.createElement('button');b.className='p';b.innerHTML='<span class="wire" style="background:'+cl[0]+'"></span>'+cl[1];b.onclick=function(){sel=i;sPick();ac();paint();};p.appendChild(b);});}
  paint();hud();
}
function paint(){var ps=$('pal').children;for(var i=0;i<ps.length;i++)ps[i].classList.toggle('sel',i===sel);}
function hud(){$('stage').textContent=st.stage+'판 · 남은 칸 '+st.left;$('life').textContent='❤️'.repeat(st.life)+'🖤'.repeat(3-st.life);
  $('rec').textContent='최고 '+save.best+'판 · 지금까지 채운 칸 '+save.total+'칸';}
function msg(t,c){$('msg').textContent=t;$('msg').style.color=c||'#fff';}
function cell(r,c){return $('grid').children[r*4+c];}
function tap(r,c,b){
  if(st.over||st.lock)return;ac();if(st.g[r][c]>=0)return;
  var rc=b.getBoundingClientRect(),x=rc.left+rc.width/2,y=rc.top;
  if(st.sol[r][c]!==sel){
    st.life--;sBad();buzz([50,30,50]);b.classList.add('bad');b.innerHTML=wire(sel);fx('틀림!',x,y,'#ff5a2a');
    msg('그 칸은 '+COL[sel][1]+'이 아니에요. 줄·네모를 다시 봐요','#ff9c7a');hud();st.lock=true;
    setTimeout(function(){b.classList.remove('bad');b.innerHTML='';st.lock=false;if(st.life<=0)gameOver();},700);return;
  }
  st.g[r][c]=sel;st.left--;st.filled++;save.total++;store();b.innerHTML=wire(sel);b.classList.add('good');sGood();buzz(15);fx('딱!',x,y,'#2ee66b');
  // 줄·네모 완성 이펙트
  var groups=[],i,done=function(list){return list.every(function(p){return st.g[p[0]][p[1]]>=0;});};
  var row=[],col=[],box=[];for(i=0;i<4;i++){row.push([r,i]);col.push([i,c]);}var br=r-r%2,bc=c-c%2;for(var yy=br;yy<br+2;yy++)for(var xx=bc;xx<bc+2;xx++)box.push([yy,xx]);
  [row,col,box].forEach(function(l){if(done(l))groups.push(l);});
  if(groups.length&&st.left>0){sLine();groups.forEach(function(l){l.forEach(function(p){var e=cell(p[0],p[1]);e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');});});msg('한 줄 완성!','#2ee66b');}
  else if(st.left>0)msg('','#fff');
  hud();
  if(st.left===0){st.cleared++;st.lock=true;sClear();buzz([30,40,30]);fx('판 완성 💡',innerWidth/2,innerHeight/2,'#ffd84a');msg('다 채웠어요! 다음 판으로','#2ee66b');setTimeout(nextStage,1300);}
}
function gameOver(){
  st.over=true;st.lock=true;var prev=save.best,nb=st.cleared>prev;if(nb)save.best=st.cleared;store();
  $('oScore').textContent=st.cleared+'판 완성 · '+st.filled+'칸 채움';
  $('oNear').textContent='이번 판 '+st.left+'칸만 더 채우면 넘어갔어요 · '+(nb&&prev>0?'최고 기록 '+(st.cleared-prev)+'판 넘음!':nb?'첫 기록!':'최고 기록까지 '+(prev-st.cleared+1)+'판');
  $('oTip').textContent='💡 '+TIPS[Math.random()*TIPS.length|0];
  $('over').style.display='flex';
}
$('again').onclick=function(){ac();newGame();};
$('mute').onclick=function(){muted=!muted;$('mute').textContent=muted?'🔇':'🔊';};
window.__game={get state(){return st;},save:save,newGame:newGame,select:function(v){sel=v;paint();}};
newGame();
})();
</script>
</body>
</html>
