<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>숫자 따라 충전!: 칸 수 맞춰 잇기 퍼즐</title>
<style>
*{box-sizing:border-box;word-break:keep-all;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#121a14;color:#fff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:8px 10px 10px;user-select:none}
.top{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800}
.top .sp{flex:1}
#mute{width:56px;height:56px;border-radius:14px;border:2px solid #3c5a44;background:#1a281e;color:#fff;font-size:24px}
.rule{margin:2px 0 4px;font-size:20px;font-weight:800;color:#ffd84a;text-align:center;line-height:1.3}
.goal{text-align:center;font-size:19px;font-weight:800;margin-bottom:6px;min-height:28px}
.goal b{color:#7fe3ff}
#outer{margin:0 auto;display:grid;gap:0}
.k{display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#ffe9a8;border-radius:10px}
.k.ok{color:#5fe08a}
.k.over{color:#ff7a6a}
#wrap{position:relative;touch-action:none}
#grid{display:grid;width:100%;height:100%}
.c{position:relative;border:2px solid #121a14;border-radius:12px;background:#24372a;color:#fff;font-size:26px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.c small{font-size:12px;font-weight:800;margin-top:2px}
.c.on{background:#4a3f0a}
.c.head{background:#a8860a;outline:4px solid #ffd84a;outline-offset:-4px}
.c.can{background:#2f4f39}
.c.conv{background:#1d5a6a}
.c.conv.on{background:#2f7a9a}
.c.dev{background:#5a2a4a}
#svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.msg{min-height:56px;text-align:center;font-size:20px;font-weight:800;margin-top:6px;line-height:1.35}
.msg.warn{color:#ff9a8a}
.rec{text-align:center;font-size:18px;color:#a8bcae;margin-top:auto;padding-top:2px}
.fx{position:fixed;left:0;top:0;pointer-events:none;font-size:36px;font-weight:900;transition:transform .9s ease-out,opacity .9s;z-index:9;white-space:nowrap;color:#ffd84a}
#over{position:fixed;inset:0;background:rgba(5,9,6,.94);display:none;align-items:center;justify-content:center;z-index:20}
#over .box{width:min(400px,92vw);background:#1a281e;border:3px solid #ffd84a;border-radius:20px;padding:18px;text-align:center}
#over h2{margin:0 0 6px;font-size:27px}
#over .big{font-size:24px;font-weight:800;margin:6px 0}
#over .near{font-size:20px;color:#ffd84a;margin:6px 0}
#over .tip{font-size:19px;line-height:1.45;background:#121a14;border-radius:12px;padding:10px;margin:10px 0;text-align:left}
#again{width:100%;height:64px;border-radius:16px;border:0;background:#ffd84a;color:#111;font-size:26px;font-weight:900}
</style>
<meta name="description" content="줄·칸 끝 숫자만큼 칸을 지나게 콘센트에서 기기까지 전선을 까는 길 퍼즐. 휴대폰·노트북은 충전기를 거치고 전기포트는 피함. 하트 3개."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/count-path/"><meta property="og:title" content="숫자 따라 충전!: 칸 수 맞춰 잇기 퍼즐"><meta property="og:description" content="줄·칸 끝 숫자만큼 칸을 지나게 콘센트에서 기기까지 전선을 까는 길 퍼즐. 휴대폰·노트북은 충전기를 거치고 전기포트는 피함. 하트 3개."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="숫자 따라 충전!: 칸 수 맞춰 잇기 퍼즐",D="줄·칸 끝 숫자만큼 칸을 지나게 콘센트에서 기기까지 전선을 까는 길 퍼즐. 휴대폰·노트북은 충전기를 거치고 전기포트는 피함. 하트 3개.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/count-path/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div class="top"><span id="stage">1판</span><span class="sp"></span><span id="hp">❤❤❤</span><button id="mute" aria-label="소리">🔊</button></div>
  <div class="rule">줄 끝 숫자만큼 칸을 지나 기기까지 이어라</div>
  <div class="goal" id="goal"></div>
  <div id="outer"></div>
  <div class="msg" id="msg"></div>
  <div class="rec" id="rec"></div>
</div>
<div id="over"><div class="box">
  <h2>전기가 안 들어갔어요</h2>
  <div class="big" id="oScore"></div>
  <div class="near" id="oNear"></div>
  <div class="tip" id="oTip"></div>
  <button id="again">한 번 더</button>
</div></div>
<script>
(function(){
'use strict';
var KEY='count-path.save.v1';
var save={best:0,total:0};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object'){save.best=o.best|0;save.total=o.total|0;}}}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
// FACTS.md 1~4
var TIPS=[
 '콘센트 전기는 교류다. 휴대폰·노트북 충전기는 이 교류를 직류로 바꿔 준다.',
 '배터리는 한쪽 방향 전기(직류)로 채운다. 그래서 휴대폰은 충전기를 거쳐 충전한다.',
 '전기포트 열선은 콘센트 교류 그대로 뜨거워진다. 열은 교류든 직류든 흐르기만 하면 난다.',
 '충전기 이름표에 입력은 AC(교류), 출력은 DC(직류)라고 적혀 있다.'
];
var DEV=[{n:'휴대폰',e:'📱',dc:1},{n:'노트북',e:'💻',dc:1},{n:'전기포트',e:'🫖',dc:0}];
var AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,delay){if(muted)return;var a=ac();if(!a)return;var t=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
function vib(ms){try{if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate(ms);}catch(e){}}
function $(id){return document.getElementById(id);}
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fx(txt){var d=document.createElement('div');d.className='fx';d.textContent=txt;var x=window.innerWidth/2-100,y=window.innerHeight/2-40;d.style.transform='translate('+x+'px,'+y+'px)';document.body.appendChild(d);requestAnimationFrame(function(){d.style.transform='translate('+x+'px,'+(y-90)+'px)';d.style.opacity='0';});setTimeout(function(){d.remove();},1000);}
var S={stage:1,hp:3,N:4,st:0,dv:0,conv:-1,dev:DEV[0],rc:[],cc:[],path:[],over:false,lock:false};
function nb(i){var N=S.N,r=Math.floor(i/N),c=i%N,o=[];if(r>0)o.push(i-N);if(r<N-1)o.push(i+N);if(c>0)o.push(i-1);if(c<N-1)o.push(i+1);return o;}
// 숨은 답 길을 먼저 만든다(반드시 풀림)
function gen(){
 var N=S.N,minL=N+2,maxL=Math.floor(N*N*.6);
 for(var tr=0;tr<300;tr++){
  var st=(N-1)*N+rnd(N),dv=rnd(N);
  var want=minL+rnd(maxL-minL+1),seen={},path=[st],cnt=0,found=null;seen[st]=1;
  (function dfs(i){if(found||++cnt>3000)return;
   if(path.length===want-1){if(nb(i).indexOf(dv)>=0)found=path.concat([dv]);return;}
   var ns=shuffle(nb(i).filter(function(x){return !seen[x]&&x!==dv;}));
   for(var q=0;q<ns.length&&!found;q++){seen[ns[q]]=1;path.push(ns[q]);dfs(ns[q]);path.pop();seen[ns[q]]=0;}})(st);
  if(found)return found;
 }
 return null;
}
function build(){
 S.N=S.stage<=2?4:S.stage<=5?5:6;var N=S.N;
 var di=S.stage===1?rnd(2):rnd(DEV.length);S.dev=DEV[di];
 var sol=null;while(!sol)sol=gen();
 S.st=sol[0];S.dv=sol[sol.length-1];
 var mid=sol.slice(1,-1);
 if(S.dev.dc)S.conv=mid[rnd(mid.length)];
 else{var off=[];for(var i=0;i<N*N;i++)if(sol.indexOf(i)<0)off.push(i);S.conv=off.length?off[rnd(off.length)]:-1;}
 S.rc=[];S.cc=[];for(var r=0;r<N;r++){S.rc.push(0);S.cc.push(0);}
 sol.forEach(function(i){S.rc[Math.floor(i/N)]++;S.cc[i%N]++;});
 S.path=[S.st];
 var w=Math.min(document.documentElement.clientWidth,430)-20,avail=window.innerHeight-290;
 var cs=Math.floor(Math.min((w-40)/N,(avail-40)/N,80));
 var out=$('outer');out.innerHTML='';
 out.style.gridTemplateColumns='repeat('+N+','+cs+'px) 40px';out.style.gridTemplateRows='40px '+(cs*N)+'px';
 for(var c=0;c<N;c++){var k=document.createElement('div');k.className='k';k.id='kc'+c;out.appendChild(k);}
 out.appendChild(document.createElement('div'));
 var wrap=document.createElement('div');wrap.id='wrap';wrap.style.gridColumn='1 / span '+N;wrap.style.width=(cs*N)+'px';wrap.style.height=(cs*N)+'px';
 wrap.innerHTML='<div id="grid"></div><svg id="svg"></svg>';out.appendChild(wrap);
 var side=document.createElement('div');side.style.display='grid';side.style.gridTemplateRows='repeat('+N+',1fr)';
 for(r=0;r<N;r++){k=document.createElement('div');k.className='k';k.id='kr'+r;side.appendChild(k);}out.appendChild(side);
 var gd=$('grid');gd.style.gridTemplateColumns='repeat('+N+',1fr)';gd.style.gridTemplateRows='repeat('+N+',1fr)';
 for(i=0;i<N*N;i++){var b=document.createElement('button');b.dataset.i=i;
  b.innerHTML=i===S.st?'🔌<small>콘센트</small>':i===S.dv?S.dev.e+'<small>'+S.dev.n+'</small>':i===S.conv?'🔁<small>충전기</small>':'';gd.appendChild(b);}
 $('svg').setAttribute('viewBox','0 0 '+N+' '+N);
 $('goal').innerHTML='손님: '+S.dev.e+' <b>'+S.dev.n+'</b> — '+(S.dev.dc?'충전기를 꼭 거쳐요':'충전기는 피해요');
 bindWrap();render();say(S.stage===1?'숫자는 그 줄에 깔 전선 칸 수예요 (콘센트·기기 칸 포함)':'🔌 옆 칸부터 이어 가세요');
}
function say(t,warn){$('msg').textContent=t;$('msg').className='msg'+(warn?' warn':'');}
function head(){return S.path[S.path.length-1];}
function counts(){var N=S.N,rc=[],cc=[];for(var r=0;r<N;r++){rc.push(0);cc.push(0);}S.path.forEach(function(i){rc[Math.floor(i/N)]++;cc[i%N]++;});return {rc:rc,cc:cc};}
function okLines(){var k=counts(),n=0;for(var r=0;r<S.N;r++){if(k.rc[r]===S.rc[r])n++;if(k.cc[r]===S.cc[r])n++;}return n;}
function render(){
 var N=S.N,cells=$('grid').children,h=head(),can=nb(h),k=counts();
 for(var i=0;i<cells.length;i++){var on=S.path.indexOf(i)>=0;
  cells[i].className='c'+(i===S.conv?' conv':'')+(i===S.dv?' dev':'')+(on?' on':'')+(i===h?' head':'')+(!on&&can.indexOf(i)>=0?' can':'');}
 for(var r=0;r<N;r++){var a=$('kr'+r),b=$('kc'+r);a.textContent=S.rc[r];b.textContent=S.cc[r];
  a.className='k'+(k.rc[r]===S.rc[r]?' ok':k.rc[r]>S.rc[r]?' over':'');b.className='k'+(k.cc[r]===S.cc[r]?' ok':k.cc[r]>S.cc[r]?' over':'');}
 var pts=S.path.map(function(i){return ((i%N)+.5)+','+(Math.floor(i/N)+.5);}).join(' ');
 var dc=S.path.indexOf(S.conv)>=0;
 $('svg').innerHTML='<polyline points="'+pts+'" fill="none" stroke="'+(dc?'#7fe3ff':'#ffd84a')+'" stroke-width=".14" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>';
 $('stage').textContent=S.stage+'판 · 맞은 줄 '+okLines()+'/'+(2*N);
 $('hp').textContent='❤'.repeat(S.hp)+'🤍'.repeat(3-S.hp);
 $('rec').textContent='최고 '+save.best+'판 · 지금까지 깐 전선 '+save.total+'칸';
}
function tap(i){
 if(S.over||S.lock)return;ac();
 var idx=S.path.indexOf(i);
 if(idx>=0){if(i===head())return;S.path.length=idx+1;tone(300,.12,'sine',.1);render();say('거기까지 전선을 걷었어요');return;}
 if(nb(head()).indexOf(i)<0){say('노란 칸 바로 옆 칸만 이을 수 있어요',true);return;}
 var before=okLines();
 S.path.push(i);save.total++;
 if(i===S.conv){tone(660,.1,'square',.1);tone(880,.12,'square',.1,.08);}
 else tone(420+S.path.length*14,.08,'triangle',.12);
 if(i===S.dv){arrive();return;}
 render();
 var after=okLines();
 if(after>before){tone(988,.12,'triangle',.12,.08);vib(15);say('숫자 하나 맞았다! ('+after+'/'+(2*S.N)+')');}
 else if(i===S.conv)say('충전기 통과! 이제부터 직류예요');
 else say('');
}
function arrive(){
 var dc=S.path.indexOf(S.conv)>=0,ok=okLines()===2*S.N,why='';
 if(S.dev.dc&&!dc)why=S.dev.n+'은 배터리라 직류가 필요해요. 충전기를 거쳐야 해요';
 else if(!S.dev.dc&&dc)why=S.dev.n+' 열선은 교류 그대로 데워요. 충전기는 필요 없어요';
 else if(!ok)why='줄 끝 숫자와 전선 칸 수가 안 맞아요';
 if(!why){win();return;}
 S.path.pop();S.hp--;tone(150,.35,'sawtooth',.12);vib([60,40,60]);render();
 if(S.hp<=0){lose(why);return;}
 say(why+' (❤ 하나 잃음)',true);
}
function win(){
 S.lock=true;render();
 tone(523,.12,'triangle',.2);tone(659,.12,'triangle',.2,.12);tone(784,.12,'triangle',.2,.24);tone(1047,.35,'triangle',.2,.36);vib([30,30,60]);
 fx(S.dev.e+' 켜졌다!');say(S.dev.dc?'충전기가 교류를 직류로 바꿔 충전 시작!':'교류 그대로 열선이 뜨거워져요!');
 if(S.stage>save.best)save.best=S.stage;store();
 setTimeout(function(){S.stage++;if(S.hp<3)S.hp++;S.lock=false;build();},1400);
}
function lose(why){
 S.over=true;store();
 var done=S.stage-1;
 $('oScore').textContent=done+'판 연결 · 마지막 판 맞은 줄 '+okLines()+'/'+(2*S.N);
 var gap=save.best-done;
 $('oNear').textContent=(gap>0?'최고 기록까지 '+gap+'판':'최고 기록과 같아요! 한 판만 더')+' · '+why;
 $('oTip').textContent='💡 '+TIPS[rnd(TIPS.length)];
 $('over').style.display='flex';
}
function start(){S.stage=1;S.hp=3;S.over=false;S.lock=false;$('over').style.display='none';build();}
function cellAt(e){var el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest?el.closest('.c'):null;}
var down=false;
function bindWrap(){var w=$('wrap');
 w.addEventListener('pointerdown',function(e){down=true;var c=cellAt(e);if(c)tap(+c.dataset.i);e.preventDefault();});
 w.addEventListener('pointermove',function(e){if(!down||S.over||S.lock)return;var c=cellAt(e);if(!c)return;var i=+c.dataset.i;if(S.path.indexOf(i)<0&&nb(head()).indexOf(i)>=0)tap(i);});}
window.addEventListener('pointerup',function(){down=false;});
$('again').addEventListener('click',function(){ac();start();});
$('mute').addEventListener('click',function(){muted=!muted;this.textContent=muted?'🔇':'🔊';});
window.__game={state:S,save:save,start:start,tap:tap};
start();
})();
</script>
</body>
</html>
