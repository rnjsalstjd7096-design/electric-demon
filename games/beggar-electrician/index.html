<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#11151f">
<title>거지키우기 — 길바닥에서 전기기술사까지</title>
<style>
:root{--bg:#11151f;--panel:#1a2030;--line:#2a3348;--text:#eef2f8;--dim:#8d97ab;--gold:#ffcc4d;--copper:#e08a3c;--good:#5fd38d;--bad:#ff6b6b;--glow:#ffe27a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
#top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px calc(6px);padding-top:max(8px,env(safe-area-inset-top));background:#0c0f17;border-bottom:1px solid var(--line)}
#moneyBox{flex:1;min-width:0}
#money{font-size:26px;font-weight:800;color:var(--gold);letter-spacing:-.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
#rates{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rank{font-size:12px;padding:3px 8px;border-radius:10px;background:#263049;color:#cfd8ea;white-space:nowrap}
.iconBtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#182033;color:var(--text);display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation;cursor:pointer}
.iconBtn svg{width:20px;height:20px}
#stageWrap{position:relative;flex:1 1 auto;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#msg{flex:0 0 auto;min-height:38px;padding:8px 12px;font-size:14px;line-height:1.35;background:#0c0f17;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;transition:background .3s}
#msg.fact{background:#1d2a1f;color:#d8f5df}
#msg.warn{background:#2e1c1c;color:#ffd9d9}
#action{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:none;z-index:3}
.bigBtn{font:inherit;font-size:18px;font-weight:800;padding:14px 26px;border-radius:14px;border:0;background:var(--gold);color:#2a1d00;box-shadow:0 0 0 0 rgba(255,226,122,.8);animation:pulse 1.1s infinite;touch-action:manipulation;cursor:pointer;white-space:nowrap}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,226,122,.75)}70%{box-shadow:0 0 0 16px rgba(255,226,122,0)}100%{box-shadow:0 0 0 0 rgba(255,226,122,0)}}
#panel{flex:0 0 0px;height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--panel);transition:flex-basis .5s ease,height .5s ease}
#panel.open{flex-basis:44%;height:44%}
#tabs{display:flex;gap:6px;padding:8px 10px 6px}
.tab{flex:1;font:inherit;font-size:14px;font-weight:700;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:#141a28;color:var(--dim);position:relative;touch-action:manipulation;cursor:pointer}
.tab.on{background:#26314b;color:var(--text);border-color:#3c4a6b}
.tab.hidden{display:none}
.tab .dot{position:absolute;top:4px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--gold);display:none}
.tab.has .dot{display:block}
#list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:2px 10px calc(12px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;touch-action:pan-y}
.row{display:flex;align-items:center;gap:10px;padding:10px;margin:6px 0;border-radius:12px;background:#141a28;border:1px solid var(--line)}
.row.can{border-color:#8a7425;box-shadow:0 0 12px rgba(255,204,77,.25) inset}
.row.can.hot{animation:rowglow 1s infinite alternate}
@keyframes rowglow{from{box-shadow:0 0 6px rgba(255,226,122,.3) inset,0 0 0 rgba(255,226,122,0)}to{box-shadow:0 0 16px rgba(255,226,122,.55) inset,0 0 14px rgba(255,226,122,.5)}}
.row.done{opacity:.55}
.row.mystery{opacity:.45;border-style:dashed}
.ri{flex:1;min-width:0}
.rn{font-size:15px;font-weight:700}
.rn small{font-weight:600;color:var(--good);margin-left:6px;font-size:12px}
.rd{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.35}
.buy{font:inherit;flex:0 0 auto;min-width:96px;padding:9px 8px;border-radius:10px;border:0;font-size:13px;font-weight:800;background:#2c3550;color:#7d879c;touch-action:manipulation;cursor:pointer}
.row.can .buy{background:var(--gold);color:#2a1d00}
.bar{height:8px;border-radius:4px;background:#0c0f17;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5fd38d,#b6f08a);width:0}
#overlay{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(5,7,12,.72)}
#overlay .card{width:min(320px,86%);background:#1b2235;border:1px solid #3a4766;border-radius:18px;padding:22px 18px;text-align:center}
#overlay h2{margin:0 0 6px;font-size:18px}
#overlay .big{font-size:40px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;margin:8px 0}
#overlay p{margin:8px 0 14px;font-size:13px;color:#c5cee0;line-height:1.45}
#overlay .bigBtn{animation:none;font-size:16px;padding:12px 22px}
#menu{position:absolute;right:10px;top:56px;z-index:12;display:none;background:#1b2235;border:1px solid #3a4766;border-radius:12px;padding:10px;width:200px}
#menu button{font:inherit;width:100%;padding:10px;border-radius:9px;border:1px solid #5a3030;background:#2a1717;color:#ffd0d0;font-size:13px;cursor:pointer}
#menu .ver{font-size:11px;color:var(--dim);margin-top:8px;text-align:center}
</style>
<meta name="description" content="길바닥에서 버려진 전선을 줍던 주인공이 공구를 사고 자격증을 따며 전기공사 사장이 되는 방치형 게임."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/beggar-electrician/"><meta property="og:title" content="거지키우기 — 길바닥에서 전기기술사까지"><meta property="og:description" content="길바닥에서 버려진 전선을 줍던 주인공이 공구를 사고 자격증을 따며 전기공사 사장이 되는 방치형 게임."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"></head>
<body>
<div id="app">
  <div id="top">
    <div id="moneyBox"><div id="money">₩0</div><div id="rates">길바닥 · 비 오는 골목</div></div>
    <div id="rank">길바닥</div>
    <button class="iconBtn" id="muteBtn" aria-label="소리 켜기/끄기"></button>
    <button class="iconBtn" id="menuBtn" aria-label="메뉴"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div id="stageWrap">
    <canvas id="cv"></canvas>
    <div id="action"><button class="bigBtn" id="actionBtn"></button></div>
    <div id="menu"><button id="resetBtn">처음부터 (저장 삭제)</button><div class="ver">거지키우기 v0.1</div></div>
  </div>
  <div id="msg">전선 피복을 벗겨 보자</div>
  <div id="panel">
    <div id="tabs">
      <button class="tab on" data-tab="tools">공구<span class="dot"></span></button>
      <button class="tab hidden" data-tab="people">사람<span class="dot"></span></button>
      <button class="tab hidden" data-tab="cert">자격증<span class="dot"></span></button>
    </div>
    <div id="list"></div>
  </div>
  <div id="overlay"><div class="card" id="ovCard"></div></div>
</div>
<script>
'use strict';
(function(){
const SAVE_KEY='beggar-electrician.save.v1';
const VERSION='v0.1';

/* ───────── 데이터 ───────── */
// 첫 1분 대본 순서(니퍼 → 와이어 스트리퍼 → 검전기)를 먼저, 나머지는 BRIEF 공구 단계 순서.
const TOOLS=[
 {id:'nipper',  name:'니퍼',            cost:30000,     mul:5, fact:'니퍼: 전선을 끊는 공구. 피복 벗기기는 다음 공구 몫.'},
 {id:'stripper',name:'와이어 스트리퍼', cost:100000,    mul:2, fact:'와이어 스트리퍼: 전선 굵기(sq)에 맞는 홈에 물려 피복만 벗긴다.'},
 {id:'tester',  name:'저압 검전기',     cost:250000,    mul:2, fact:'검전기: 전기가 살아 있는지(충전 여부) 불·소리로 알린다. 만지기 전엔 검전.'},
 {id:'pliers',  name:'펜치·드라이버',   cost:700000,    mul:2, fact:'펜치는 잡고 꼬고 자르고, 드라이버는 단자를 조인다. 헐거운 단자는 열이 난다.'},
 {id:'multi',   name:'멀티테스터',      cost:2000000,   mul:2, fact:'멀티테스터: 전압·저항·도통을 잰다. 전류를 재려면 회로를 끊고 직렬로.'},
 {id:'clamp',   name:'클램프미터(후크메타)',cost:6000000,mul:2, fact:'클램프미터: 선을 끊지 않고 전류를 잰다. 단, 한 가닥만 물릴 것.'},
 {id:'megger',  name:'절연저항계(메거)',cost:18000000,  mul:2, fact:'메거: 직류 고전압을 걸어 절연저항(MΩ)을 잰다. 전원은 끄고 잰다.'},
 {id:'earth',   name:'접지저항계',      cost:50000000,  mul:2, fact:'접지저항계: 보조 접지봉 2개를 박고 접지극과 대지 사이 저항(Ω)을 잰다.'},
];
const PEOPLE=[
 {id:'jogong', name:'조공 고용',        cost:300000,   grow:1.17, rate:3000,   desc:'자재 나르고 정리하는 보조. 손 안 대도 돈이 들어온다.', unlock:s=>s.tools.pliers||s.t>=55},
 {id:'scrap',  name:'폐전선 수거 리어카',cost:3000000, grow:1.2,  rate:30000,  desc:'현장 자투리 전선을 모아 고물상에 넘긴다. 구리는 돈이다.', unlock:s=>s.tools.multi},
 {id:'gigong', name:'기공 고용',        cost:40000000, grow:1.2,  rate:300000, desc:'배관·배선을 맡기는 기능공. 전기기능사를 따야 부를 수 있다.', unlock:s=>s.cert.gn===2},
];
const CERTS=[
 {id:'gn', name:'전기기능사', cost:500000, need:40,
  req:s=>s.tools.pliers, reqText:'펜치·드라이버를 사면 공부를 시작할 수 있다',
  passText:'응시 자격 제한 없음. 필기(60점 이상) 붙고 실기(작업형) 붙으면 끝.',
  reward:'탭 수익 ×3 · 일당 25만 · 기공 대접 · 기공 고용 열림'},
 {id:'san',name:'전기산업기사', cost:8000000, need:80,
  req:s=>s.cert.gn===2&&(s.days-s.gnDay)>=10, reqText:'기능사 + 같은 분야 실무 1년 (게임에선 현장 10일)',
  passText:'기능사 + 같은 분야 실무 1년이면 응시 가능. 실기는 필답형.',
  reward:'탭 수익 ×3 · 일당 40만 · 반장 · 사람 수입 ×2'},
];
const RANKS=[{name:'잡부(조공)',wage:150000},{name:'기공(전공)',wage:250000},{name:'반장',wage:400000}];
const CORES=[ // KEC 121.2 전선 식별
 {c:'#8a4b22',n:'갈색',p:'L1'},{c:'#1b1b1b',n:'흑색',p:'L2'},{c:'#8c8c8c',n:'회색',p:'L3'},{c:'#2f6fd6',n:'청색',p:'N'},{c:'gy',n:'녹색-노란색',p:'PE'}];
const DAY_TAPS=30, WORK_TAPS=8, STRIP_TAP=120, FIRST_SALE=1000;

/* ───────── 상태 ───────── */
function fresh(){return{v:1,stage:'strip',strips:0,copper:0,money:0,earned:0,taps:0,work:0,
 tools:{},people:{jogong:0,scrap:0,gigong:0},cert:{gn:0,san:0},study:{gn:0,san:0},rank:0,days:0,gnDay:0,dayTaps:0,
 t:0,last:Date.now(),muted:false,nextEvent:40,tab:'tools'};}
let s=fresh();
function load(){
  let raw=null;try{raw=localStorage.getItem(SAVE_KEY);}catch(e){}
  if(!raw)return false;
  try{const o=JSON.parse(raw);if(!o||o.v!==1)return false;s=Object.assign(fresh(),o);
    s.tools=Object.assign({},o.tools);s.people=Object.assign(fresh().people,o.people);s.cert=Object.assign(fresh().cert,o.cert);s.study=Object.assign(fresh().study,o.study);
    return true;}catch(e){return false;}
}
function save(){s.last=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(s));}catch(e){}}

/* ───────── 계산 ───────── */
function tapVal(){let v=200;for(const t of TOOLS)if(s.tools[t.id])v*=t.mul;if(s.cert.gn===2)v*=3;if(s.cert.san===2)v*=3;if(lostNipper>0)v*=.5;return v;}
function perSec(){let v=0;for(const p of PEOPLE)v+=s.people[p.id]*p.rate;if(s.cert.san===2)v*=2;return v;}
function peopleCost(p){return Math.ceil(p.cost*Math.pow(p.grow,s.people[p.id])/1000)*1000;}
function wage(){return RANKS[s.rank].wage;}
function addMoney(n){s.money+=n;s.earned+=n;}

/* 한국식 큰 수: 1억 2,345만 / 15만 1,000 */
function fmt(n){n=Math.floor(Math.max(0,n));if(n<10000)return n.toLocaleString('ko-KR');
  const U=['','만','억','조','경'];const g=[];let x=n;while(x>0){g.push(x%10000);x=Math.floor(x/10000);}
  const i=g.length-1;let out=g[i].toLocaleString('ko-KR')+U[i];if(g[i-1])out+=' '+g[i-1].toLocaleString('ko-KR')+U[i-1];return out;}
function won(n){return '₩'+fmt(n);}
function fmtS(n){n=Math.floor(Math.max(0,n));if(n<10000)return n.toLocaleString('ko-KR');const U=['','만','억','조','경'];let i=0;while(n>=10000&&i<4){n/=10000;i++;}return (n>=100?Math.floor(n):Math.floor(n*10)/10).toLocaleString('ko-KR')+U[i];}

/* ───────── 소리 ───────── */
let ac=null;
function audio(){if(s.muted)return null;try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){ac=null;}return ac;}
function tone(f,d,type,vol,when,slide){const a=audio();if(!a)return;const t=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,vol,hp){const a=audio();if(!a)return;const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);const src=a.createBufferSource();src.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp||2000;const g=a.createGain();g.gain.value=vol||.2;src.connect(f);f.connect(g);g.connect(a.destination);src.start();}
const sfx={
 snip(){noise(.06,.25,3000);tone(1400,.05,'square',.04);},
 coin(){tone(988,.08,'square',.06);tone(1319,.14,'square',.06,.07);},
 cash(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.12,i*.07));},
 tick(){tone(1800,.03,'square',.03);},
 thud(){tone(140,.12,'sine',.25,0,70);noise(.05,.08,400);},
 buy(){tone(660,.08,'triangle',.12);tone(990,.18,'triangle',.12,.08);},
 zap(){noise(.25,.25,800);tone(90,.3,'sawtooth',.1,0,40);},
 fanfare(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.13,i*.11));},
 study(){tone(500+Math.random()*200,.05,'sine',.06);},
};

/* ───────── DOM ───────── */
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),msgEl=$('msg'),panel=$('panel'),list=$('list'),actionWrap=$('action'),actionBtn=$('actionBtn');
const SPK_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
const SPK_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
let W=0,H=0,DPR=1,SC=1;
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);SC=Math.max(1,Math.min(1.7,H/380));}
new ResizeObserver(resize).observe(cv);

let msgTimer=0,msgBase='전선 피복을 벗겨 보자';
function say(text,kind,sec){msgEl.textContent=text;msgEl.className=kind||'';msgTimer=sec||0;}
function base(text){msgBase=text;if(msgTimer<=0)say(text);}

function showAction(label,fn){actionBtn.textContent=label;actionBtn.onclick=e=>{e.stopPropagation();audio();fn();};actionWrap.style.display='block';}
function hideAction(){actionWrap.style.display='none';actionBtn.onclick=null;}

/* ───────── 장면 객체 ───────── */
const floats=[],sparks=[],rain=[];
for(let i=0;i<70;i++)rain.push({x:Math.random(),y:Math.random(),v:.7+Math.random()*.6});
let scrapper=null,foreman=null,swing=0,clock=0,shake=0,lostNipper=0,nipperSpot=null,countup=null,arrowOn=true;
function float(text,x,y,color,size){floats.push({text,x,y,vy:-60,life:1.1,color:color||'#ffcc4d',size:size||20});}
function burst(x,y,col,n){for(let i=0;i<(n||8);i++){const a=Math.random()*Math.PI*2,v=60+Math.random()*120;sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:.5+Math.random()*.3,col:col||'#ffe27a'});}}

/* ───────── 대본 진행 ───────── */
function cableEnd(){return{x:W*.62,y:H*.82-10*SC};}
function onStageTap(x,y){
  audio();
  if(s.stage==='strip'){
    const e=cableEnd();
    s.strips++;s.copper+=STRIP_TAP;sfx.snip();burst(e.x,e.y,'#f3a65a',10);
    float('+₩'+STRIP_TAP,e.x,e.y-30,'#ffcc4d',24);
    if(s.strips===1)say('겉피복 속에 다섯 가닥이 들어 있다',null,1.6);
    else{const c=CORES[s.strips-2];say(c.n+' = '+c.p+'  (KEC 전선 색상)','fact',2.2);}
    if(s.strips>=1+CORES.length){s.stage='sell';arrowOn=false;scrapper={x:W+60,tx:W*.80,say:''};}
    return;
  }
  if(s.stage==='work'){
    s.work++;sfx.thud();swing=1;shake=.12;float('영차!',W*.45,H*.55,'#ffffff',18);
    if(s.work>=WORK_TAPS){s.stage='pay';arrowOn=false;startFirstWage();}
    return;
  }
  if(s.stage==='play'||s.stage==='shop'){
    if(s.stage==='shop')return; // 상점 첫 구매 전에는 니퍼만
    if(nipperSpot&&Math.hypot(x-nipperSpot.x,y-nipperSpot.y)<34){findNipper();return;}
    const v=tapVal();addMoney(v);s.taps++;s.dayTaps++;swing=1;sfx.snip();

function runEvent(){
  const pool=['wire','wire','check'];
  if(s.tools.nipper&&!nipperSpot&&lostNipper<=0)pool.push('lost');
  if(s.tools.clamp)pool.push('clamp');
  if(s.tools.megger)pool.push('megger');
  const k=pool[Math.floor(Math.random()*pool.length)];
  const bonusBase=Math.max(tapVal()*8,perSec()*10);
  if(k==='wire'){const w=WIRES[Math.floor(Math.random()*WIRES.length)];const b=Math.round(bonusBase/2/100)*100;addMoney(b);sfx.coin();
    say('버려진 '+w.sq+'sq 전선 10m 주움 → 구리 약 '+w.g+'g · +'+won(b),'fact',4.5);}
  else if(k==='check'){
    if(s.tools.tester){const b=Math.round(bonusBase/100)*100;addMoney(b);sfx.coin();say('검전기가 삑! 이름표와 다른 차단기였다. 검전 습관 보너스 +'+won(b),'fact',5);}
    else{s.dayTaps=0;sfx.zap();shake=.5;say('차단기 내렸다고 그냥 만짐 → 따끔! 오늘 일한 거 날림. 검전부터!','warn',5);}
  }
  else if(k==='lost'){nipperSpot={x:W*(.15+Math.random()*.7),y:H*(.3+Math.random()*.4),t:8};say('니퍼 어디 갔지? 화면에서 찾아 탭! (8초)','warn',8);}
  else if(k==='clamp'){const b=Math.round(bonusBase/100)*100;addMoney(b);sfx.coin();say('두 가닥 같이 물렸더니 0A? 가는 전류·오는 전류가 상쇄. 한 가닥만! +'+won(b),'fact',5.5);}
  else if(k==='megger'){const b=Math.round(bonusBase*2/100)*100;addMoney(b);sfx.cash();say('절연저항 측정 통과 (220V 회로: DC 500V로 1MΩ 이상) 보너스 +'+won(b),'fact',5.5);}
  dirty=true;
}

let lastListKey='';
function render(force){
  // 탭 표시
  const peopleOn=PEOPLE.some(p=>p.unlock(s)),certOn=s.tools.pliers||s.cert.gn>0;
  document.querySelector('[data-tab=people]').classList.toggle('hidden',!peopleOn);
  document.querySelector('[data-tab=cert]').classList.toggle('hidden',!certOn);
  if((s.tab==='people'&&!peopleOn)||(s.tab==='cert'&&!certOn))s.tab='tools';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===s.tab));
  // 알림 점
  const canTool=TOOLS.some(t=>!s.tools[t.id]&&toolUnlocked(t)&&s.money>=t.cost);
  const canPeople=PEOPLE.some(p=>p.unlock(s)&&s.money>=peopleCost(p));
  const canCert=CERTS.some(c=>(s.cert[c.id]===0&&c.req(s)&&s.money>=c.cost)||s.cert[c.id]===1);
  document.querySelector('[data-tab=tools]').classList.toggle('has',canTool&&s.tab!=='tools');
  document.querySelector('[data-tab=people]').classList.toggle('has',canPeople&&s.tab!=='people');
  document.querySelector('[data-tab=cert]').classList.toggle('has',canCert&&s.tab!=='cert');
  // 목록 (상태가 바뀔 때만 다시 그림 → 버튼 탭이 끊기지 않게)
  const rows=[];
  if(s.tab==='tools'){
    let shownNext=false;
    for(const t of TOOLS){
      if(s.tools[t.id]){rows.push({cls:'done',name:t.name,badge:'보유 ×'+t.mul,desc:t.fact});continue;}
      if(!toolUnlocked(t)){if(!shownNext&&s.stage!=='shop'){rows.push({cls:'mystery',name:'다음 공구: ???',desc:'앞 공구를 사면 열린다'});}shownNext=true;continue;}
      const can=s.money>=t.cost;rows.push({cls:(can?'can hot':''),name:t.name,badge:'탭 ×'+t.mul,desc:t.fact,btn:won(t.cost),act:'tool',id:t.id,dis:!can});
      shownNext=true;
    }
  }else if(s.tab==='people'){
    for(const p of PEOPLE){if(!p.unlock(s)){rows.push({cls:'mystery',name:'???',desc:p.id==='scrap'?'멀티테스터를 사면 열린다':'전기기능사를 따면 열린다'});continue;}
      const c=peopleCost(p),can=s.money>=c;const r=p.rate*(s.cert.san===2?2:1);
      rows.push({cls:can?'can':'',name:p.name,badge:s.people[p.id]?s.people[p.id]+'명':'',desc:p.desc+' 초당 +'+won(r),btn:won(c),act:'people',id:p.id,dis:!can});}
  }else{
    for(const c of CERTS){
      if(s.cert[c.id]===2){rows.push({cls:'done',name:c.name,badge:'합격',desc:c.reward});continue;}
      if(s.cert[c.id]===1){rows.push({cls:'can',name:c.name+' 공부 중',desc:'탭할 때마다 한 칸. '+c.reward,bar:Math.floor(s.study[c.id]/c.need*100),barId:c.id,btn:'공부 탭',act:'study',id:c.id});continue;}
      const ok=c.req(s),can=ok&&s.money>=c.cost;
      rows.push({cls:can?'can':(ok?'':'mystery'),name:c.name,desc:ok?('교재·원서 '+won(c.cost)+' · '+c.reward):(c.id==='san'&&s.cert.gn===2?c.reqText+' · 지금 '+Math.max(0,s.days-s.gnDay)+'일':c.reqText),btn:ok?won(c.cost):null,act:'cert',id:c.id,dis:!can});
      if(!ok)break;
    }
    if(s.cert.san===2)rows.push({cls:'mystery',name:'전기기사 · 기능장 · 기술사',desc:'다음 버전에서 이어진다'});
  }
  const key=s.tab+'|'+rows.map(r=>r.cls+r.name+r.badge+(r.bar!=null?'':r.desc)+r.btn+r.dis).join('|');
  if(force||key!==lastListKey){lastListKey=key;list.innerHTML=rows.map(rowHTML).join('');}
  updateBars();
}
function updateBars(){for(const c of CERTS){const el=list.querySelector('[data-bar="'+c.id+'"]');if(el)el.style.width=Math.floor(s.study[c.id]/c.need*100)+'%';}}
list.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;audio();const id=b.dataset.id;
  if(b.dataset.act==='tool')buyTool(id);else if(b.dataset.act==='people')buyPeople(id);else if(b.dataset.act==='cert')startStudy(id);else if(b.dataset.act==='study')studyTap(id);});

/* ───────── 그리기 ───────── */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function bubble(x,y,text){const fs=Math.round(15*Math.min(SC,1.3));ctx.font='bold '+fs+'px sans-serif';const w=Math.min(W-20,ctx.measureText(text).width+22),h=fs*2.2;let bx=Math.max(10,Math.min(W-10-w,x-w/2));const by=y-h;
  ctx.fillStyle='#fff';rr(bx,by,w,h,12);ctx.fill();ctx.beginPath();ctx.moveTo(x-7,by+h-1);ctx.lineTo(x+7,by+h-1);ctx.lineTo(x,by+h+10);ctx.fill();
  ctx.fillStyle='#1a1a1a';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,bx+w/2,by+h/2+1);}
function person(x,gy,o){ // 단순한 사람: o={hat,vest,sit,scale,face,arm}
  const k=(o.scale||1)*SC;ctx.save();ctx.translate(x,gy);ctx.scale(k,k);
  const sit=o.sit?22:0;
  // 다리
  ctx.strokeStyle=o.pants||'#3b4256';ctx.lineWidth=9;ctx.lineCap='round';
  if(o.sit){ctx.beginPath();ctx.moveTo(-6,-38);ctx.lineTo(12,-36);ctx.lineTo(14,-8);ctx.moveTo(6,-38);ctx.lineTo(22,-36);ctx.lineTo(24,-8);ctx.stroke();}
  else{const st=o.walk?Math.sin(clock*10)*8:0;ctx.beginPath();ctx.moveTo(-4,-34);ctx.lineTo(-6+st,0);ctx.moveTo(4,-34);ctx.lineTo(6-st,0);ctx.stroke();}
  // 몸
  ctx.fillStyle=o.shirt||'#6b5b45';rr(-13,-74+sit,26,40,8);ctx.fill();
  if(o.vest){ctx.fillStyle='#ff8a1f';rr(-13,-72+sit,26,30,6);ctx.fill();ctx.fillStyle='#e8ff6a';ctx.fillRect(-13,-58+sit,26,4);}
  // 팔
  ctx.strokeStyle=o.shirt||'#6b5b45';ctx.lineWidth=7;const ang=(o.arm||0);
  ctx.beginPath();ctx.moveTo(10,-66+sit);ctx.lineTo(10+Math.cos(.6-ang)*22,-66+sit+Math.sin(.6-ang)*22);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-10,-66+sit);ctx.lineTo(-18,-46+sit);ctx.stroke();
  // 머리
  ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(0,-86+sit,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.fillRect(3,-89+sit,2.5,3);ctx.fillRect(-5,-89+sit,2.5,3);
  ctx.strokeStyle='#7a4a2a';ctx.lineWidth=1.6;ctx.beginPath();if(o.sad)ctx.arc(0,-77+sit,4,Math.PI*1.15,Math.PI*1.85);else ctx.arc(0,-82+sit,4,.2,Math.PI-.2);ctx.stroke();
  if(o.hat==='beanie'){ctx.fillStyle='#4a5a7a';ctx.beginPath();ctx.arc(0,-90+sit,13.5,Math.PI,0);ctx.fill();ctx.fillRect(-14,-92+sit,28,5);}
  else if(o.hat){ctx.fillStyle=o.hat;ctx.beginPath();ctx.arc(0,-92+sit,14,Math.PI,0);ctx.fill();ctx.fillRect(-18,-93+sit,36,4);}
  if(o.cap){ctx.fillStyle=o.cap;ctx.beginPath();ctx.arc(0,-92+sit,13,Math.PI,0);ctx.fill();ctx.fillRect(0,-94+sit,20,4);}
  if(o.beard){ctx.fillStyle='#555';ctx.beginPath();ctx.arc(0,-78+sit,8,0,Math.PI);ctx.fill();}
  ctx.restore();}
function drawAlley(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#141b2e');g.addColorStop(1,'#232a3c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 벽돌
  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;for(let y=12;y<H*.72;y+=16){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();for(let x=((y/16)%2)*18;x<W;x+=36){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+16);ctx.stroke();}}
  // 가로등
  const lx=W*.86;ctx.fillStyle='#2b3245';ctx.fillRect(lx-3,H*.12,6,H*.66);ctx.fillStyle='#ffe9a8';ctx.beginPath();ctx.arc(lx,H*.12,7,0,Math.PI*2);ctx.fill();
  const lg=ctx.createRadialGradient(lx,H*.12,4,lx,H*.12,H*.5);lg.addColorStop(0,'rgba(255,230,150,.22)');lg.addColorStop(1,'rgba(255,230,150,0)');ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
  // 땅
  const gy=H*.82;ctx.fillStyle='#1a1f2b';ctx.fillRect(0,gy,W,H-gy);ctx.fillStyle='rgba(120,150,200,.12)';ctx.beginPath();ctx.ellipse(W*.6,gy+18,70,6,0,0,Math.PI*2);ctx.fill();
  // 비
  ctx.strokeStyle='rgba(170,200,255,.35)';ctx.lineWidth=1;ctx.beginPath();for(const r of rain){const x=r.x*W,y=r.y*H;ctx.moveTo(x,y);ctx.lineTo(x-3,y+12);}ctx.stroke();
  return gy;}
function drawSite(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7fb4e6');g.addColorStop(1,'#cfe3f2');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const gy=H*.82;
  // 짓는 중인 건물 골조
  ctx.fillStyle='#a7adb6';for(let i=0;i<4;i++){ctx.fillRect(W*.05+i*W*.08,H*.18,8,gy-H*.18);}for(let j=0;j<4;j++)ctx.fillRect(W*.05,H*.18+j*(gy-H*.18)/4,W*.24+8,6);
  // 분전반
  const px=W*.62,py=gy-H*.42;ctx.fillStyle='#d9dde3';rr(px,py,W*.2,H*.3,6);ctx.fill();ctx.strokeStyle='#8d949e';ctx.lineWidth=2;ctx.stroke();
  for(let i=0;i<4;i++){ctx.fillStyle=i%2?'#2d2d2d':'#3a3a3a';ctx.fillRect(px+8+i*(W*.2-16)/4,py+14,(W*.2-16)/4-4,H*.07);}
  ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.moveTo(px+W*.1,py+H*.14);ctx.lineTo(px+W*.1-9,py+H*.24);ctx.lineTo(px+W*.1+9,py+H*.24);ctx.closePath();ctx.fill();ctx.fillStyle='#222';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('!',px+W*.1,py+H*.225);
  // 케이블 드럼
  ctx.fillStyle='#9a6b3c';ctx.beginPath();ctx.arc(W*.88,gy-22,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#333';ctx.beginPath();ctx.arc(W*.88,gy-22,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#8f8a80';ctx.fillRect(0,gy,W,H-gy);ctx.fillStyle='#7d786f';for(let x=0;x<W;x+=40)ctx.fillRect(x,gy,20,3);

function drawCable(gy){
  ctx.save();ctx.translate(W*.62,gy);ctx.scale(SC,SC);ctx.translate(-W*.62,-gy);
  const e={x:W*.62,y:gy-10};
  // 감긴 전선 뭉치
  ctx.strokeStyle='#30343d';ctx.lineWidth=7;for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(W*.80+i*4,gy-12,30-i*3,12,0,0,Math.PI*2);ctx.stroke();}
  // 뻗어 나온 끝
  ctx.lineCap='round';ctx.strokeStyle='#30343d';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(W*.76,gy-10);ctx.lineTo(e.x+(s.strips?14:0),e.y);ctx.stroke();
  if(s.strips===0){const a=.5+.5*Math.sin(clock*6);ctx.fillStyle='rgba(255,240,170,'+a+')';star(e.x,e.y-4,9+a*4);star(W*.82,gy-24,5+a*3);}
  else{for(let i=0;i<CORES.length;i++){const c=CORES[i],dy=(i-2)*9,ex=e.x-30,ey=e.y+dy-6;
      ctx.lineWidth=5;if(c.c==='gy'){ctx.strokeStyle='#3fa34a';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(e.x+12,e.y);ctx.lineTo(ex,ey);ctx.stroke();ctx.strokeStyle='#f0d630';ctx.lineDashOffset=5;ctx.beginPath();ctx.moveTo(e.x+12,e.y);ctx.lineTo(ex,ey);ctx.stroke();ctx.setLineDash([]);ctx.lineDashOffset=0;}
      else{ctx.strokeStyle=c.c;ctx.beginPath();ctx.moveTo(e.x+12,e.y);ctx.lineTo(ex,ey);ctx.stroke();}
      if(s.strips-1>i){ctx.strokeStyle='#ffb35c';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-16,ey-dy*.2);ctx.stroke();}}}
  ctx.restore();
  if(s.copper>0){ctx.fillStyle='rgba(0,0,0,.55)';rr(W*.5,gy+12,W*.4,26,13);ctx.fill();ctx.fillStyle='#f3a65a';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('구리 ₩'+fmt(s.copper),W*.7,gy+25);}
}
function star(x,y,r){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr2=i%2?r*.35:r;ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}ctx.closePath();ctx.fill();}
function arrow(x,y){const b=Math.sin(clock*7)*8;ctx.save();ctx.translate(x,y-26+b);ctx.fillStyle='#ffe27a';ctx.shadowColor='#ffe27a';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-14,-18);ctx.lineTo(-5,-18);ctx.lineTo(-5,-36);ctx.lineTo(5,-36);ctx.lineTo(5,-18);ctx.lineTo(14,-18);ctx.closePath();ctx.fill();ctx.restore();}
function nipperIcon(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(clock*5)*.2);ctx.fillStyle='#d23b3b';rr(-14,2,10,22,4);ctx.fill();rr(4,2,10,22,4);ctx.fill();ctx.fillStyle='#9aa3ad';ctx.beginPath();ctx.moveTo(-8,4);ctx.lineTo(0,-16);ctx.lineTo(8,4);ctx.closePath();ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(255,230,120,'+(.5+.5*Math.sin(clock*8))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y+2,26,0,Math.PI*2);ctx.stroke();}

function draw(){
  ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*10*shake,(Math.random()-.5)*10*shake);
  const early=['strip','sell','foremanWait','offer','work','pay'].includes(s.stage);
  const gy=early?drawAlley():drawSite();
  if(early){
    if(s.stage==='work'||s.stage==='pay'){ // 일하는 중: 일어서서 드럼을 나름
      person(W*.2,gy,{hat:'#ffd23a',shirt:'#6b5b45',arm:swing*1.2});
      const prog=Math.min(1,s.work/WORK_TAPS);const dx=W*.42+prog*W*.2;ctx.fillStyle='#9a6b3c';ctx.beginPath();ctx.arc(dx,gy-18*SC,18*SC,0,Math.PI*2);ctx.fill();ctx.fillStyle='#333';ctx.beginPath();ctx.arc(dx,gy-18*SC,9*SC,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.5)';rr(W*.15,14,W*.7,22,11);ctx.fill();ctx.fillStyle='#5fd38d';rr(W*.15,14,W*.7*prog,22,11);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('하루 일 '+Math.min(s.work,WORK_TAPS)+' / '+WORK_TAPS,W/2,25);
      if(arrowOn)arrow(dx,gy-36*SC);
    }else{
      ctx.fillStyle='#a67c4a';ctx.fillRect(W*.2-36*SC,gy-30*SC,72*SC,30*SC);ctx.strokeStyle='#7d5a33';ctx.strokeRect(W*.2-36*SC,gy-30*SC,72*SC,30*SC); // 박스
      person(W*.2,gy-30*SC,{hat:'beanie',shirt:'#5a5248',sit:true,sad:s.money<1,arm:swing*1.2});
      if(s.stage==='strip'||s.stage==='sell')drawCable(gy);
      if(s.stage==='strip'&&arrowOn){const e=cableEnd();arrow(e.x,e.y-14*SC);}
    }
    if(scrapper){ctx.save();ctx.translate(scrapper.x,gy);ctx.scale(SC,SC);ctx.fillStyle='#6a6a6a';ctx.fillRect(14,-26,46,18);ctx.strokeStyle='#444';ctx.lineWidth=3;ctx.beginPath();ctx.arc(26,-6,6,0,Math.PI*2);ctx.moveTo(56,-6);ctx.arc(50,-6,6,0,Math.PI*2);ctx.stroke();ctx.restore();
      person(scrapper.x,gy,{cap:'#2e6b3a',shirt:'#4b6a8a',beard:true,walk:Math.abs(scrapper.x-scrapper.tx)>2});if(scrapper.say)bubble(scrapper.x,gy-112*SC,scrapper.say);}
    if(foreman){person(foreman.x,gy,{hat:'#ffffff',vest:true,shirt:'#3c5a8a',walk:Math.abs(foreman.x-foreman.tx)>2});if(foreman.say)bubble(foreman.x,gy-114*SC,foreman.say);}
  }else{
    // 현장: 조공/기공 그림 + 주인공
    const nj=Math.min(5,s.people.jogong),ng=Math.min(3,s.people.gigong);
    for(let i=0;i<nj;i++){const x=W*.08+((clock*30+i*70)%(W*.45));person(x,gy,{hat:'#ffd23a',shirt:'#7a6a55',scale:.6,walk:true});}
    for(let i=0;i<ng;i++)person(W*.52+i*18,gy,{hat:'#ffffff',vest:true,shirt:'#3c5a8a',scale:.7,arm:Math.abs(Math.sin(clock*4+i))});
    if(s.people.scrap){ctx.fillStyle='#6a6a6a';ctx.fillRect(W*.02,gy-20,40,14);ctx.fillStyle='#e08a3c';ctx.fillRect(W*.02+4,gy-28,32,8);}
    person(W*.52,gy,{hat:s.rank>=2?'#ffffff':'#ffd23a',vest:s.rank>=1,shirt:'#6b5b45',arm:swing*1.4});
    if(foreman){person(foreman.x,gy,{hat:'#ffffff',vest:true,shirt:'#3c5a8a',walk:true});if(foreman.say)bubble(foreman.x,gy-114*SC,foreman.say);}
    // 하루 진행 막대
    if(s.stage==='play'){const p=s.dayTaps/DAY_TAPS;ctx.fillStyle='rgba(0,0,0,.45)';rr(W*.1,12,W*.8,22,11);ctx.fill();ctx.fillStyle='#5fd38d';rr(W*.1,12,Math.max(22,W*.8*p),22,11);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('오늘 일 '+s.dayTaps+'/'+DAY_TAPS+' → 일당 '+won(wage())+' · '+s.days+'일째',W/2,23);
      if(s.taps<6)arrow(W*.52,gy-112*SC);}
    if(nipperSpot)nipperIcon(nipperSpot.x,nipperSpot.y);
  }
  for(const f of floats){ctx.globalAlpha=Math.max(0,Math.min(1,f.life*1.5));ctx.font='900 '+f.size+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(f.text,f.x,f.y);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);}
  ctx.globalAlpha=1;for(const p of sparks){ctx.fillStyle=p.col;ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillRect(p.x,p.y,3,3);}ctx.globalAlpha=1;
  ctx.restore();
}

/* ───────── 루프 ───────── */
let shownMoney=0,saveTimer=0,listTimer=0;
function step(dt){
  clock+=dt;s.t+=dt;
  if(s.stage==='play'||s.stage==='shop'){const ps=perSec();if(ps>0)addMoney(ps*dt);
    if(s.stage==='play'){s.nextEvent-=dt;if(s.nextEvent<=0){s.nextEvent=35+Math.random()*30;runEvent();}}}
  if(lostNipper>0)lostNipper-=dt;
  if(nipperSpot){nipperSpot.t-=dt;if(nipperSpot.t<=0){nipperSpot=null;lostNipper=15;say('못 찾았다… 15초 동안 탭 수익 절반','warn',4);}}
  for(const r of rain){r.y+=r.v*dt*1.4;if(r.y>1){r.y=-.05;r.x=Math.random();}}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y+=f.vy*dt;f.life-=dt;if(f.life<=0)floats.splice(i,1);}
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt;if(p.life<=0)sparks.splice(i,1);}
  swing=Math.max(0,swing-dt*5);shake=Math.max(0,shake-dt);
  if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)say(msgBase);}
  // 인물 이동
  if(scrapper){scrapper.x+=(scrapper.leave?220:-220)*dt;if(!scrapper.leave&&scrapper.x<=scrapper.tx){scrapper.x=scrapper.tx;if(!scrapper.say){scrapper.say='구리네? 쳐 줄게.';sfx.coin();showAction('고물상에 팔기 ₩1,000',sellCopper);base('고물상 아저씨가 왔다');}}
    if(scrapper.leave&&scrapper.x>W+80)scrapper=null;}
  if(s.stage==='foremanWait'){foremanTimer-=dt;if(foremanTimer<=0){s.stage='offer';foreman={x:W+40,tx:W*.78,say:''};}}
  if(foreman){if(foreman.leave){foreman.x+=200*dt;if(foreman.x>W+60)foreman=null;}
    else if(foreman.x>foreman.tx){foreman.x=Math.max(foreman.tx,foreman.x-200*dt);if(foreman.x<=foreman.tx&&s.stage==='offer'&&!foreman.say){foreman.say='잡부 하루 할래?';sfx.coin();showAction('할게요!',acceptJob);base('전기 현장 반장이 지나간다');}}}
  if(countup){countup.t+=dt;const p=Math.min(1,countup.t/countup.dur);const v=Math.floor(countup.to*(1-Math.pow(1-p,3))/10)*10;const el=$('cu');if(el)el.textContent='₩'+v.toLocaleString('ko-KR');
    if(Math.floor(countup.t*20)!==Math.floor((countup.t-dt)*20)&&p<1)sfx.tick();
    if(p>=1&&countup.t>countup.dur+.7){countup=null;finishFirstWage();}}
  saveTimer+=dt;if(saveTimer>5){saveTimer=0;save();}
}
let lastFrame=performance.now(),paused=false;
function frame(now){const dt=Math.min(.1,(now-lastFrame)/1000);lastFrame=now;if(!paused)step(dt);
  draw();
  if(s.money<shownMoney)shownMoney=s.money;else shownMoney+=(s.money-shownMoney)*Math.min(1,dt*12);if(Math.abs(s.money-shownMoney)<1)shownMoney=s.money;
  $('money').textContent='₩'+fmt(shownMoney);
  const early=!['play','shop'].includes(s.stage);
  $('rates').textContent=early?(s.stage==='work'||s.stage==='pay'?'잡부 첫날':'길바닥 · 비 오는 골목'):'탭 +₩'+fmtS(tapVal())+' · 초당 +₩'+fmtS(perSec());
  $('rank').textContent=early&&s.stage!=='work'&&s.stage!=='pay'?'길바닥':RANKS[s.rank].name;
  listTimer+=dt;if(panel.classList.contains('open')&&listTimer>.25){listTimer=0;render();}
  requestAnimationFrame(frame);}

/* ───────── 입력 ───────── */
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();onStageTap(e.clientX-r.left,e.clientY-r.top);});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
function paintMute(){$('muteBtn').innerHTML=s.muted?SPK_OFF:SPK_ON;}
$('muteBtn').addEventListener('click',()=>{s.muted=!s.muted;if(s.muted&&ac)try{ac.suspend();}catch(e){}paintMute();save();});
$('menuBtn').addEventListener('click',e=>{e.stopPropagation();const m=$('menu');m.style.display=m.style.display==='block'?'none':'block';resetArm=0;$('resetBtn').textContent='처음부터 (저장 삭제)';});
let resetArm=0;
$('resetBtn').addEventListener('click',e=>{e.stopPropagation();if(!resetArm){resetArm=1;$('resetBtn').textContent='정말 지울까요? 한 번 더';return;}
  try{localStorage.removeItem(SAVE_KEY);}catch(err){}location.reload();});
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('#menuBtn'))$('menu').style.display='none';});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.addEventListener('pagehide',save);

/* ───────── 시작 ───────── */
function restoreScene(){
  // 대본 중간에 닫았다면 안전한 지점으로 돌려놓음
  if(['sell','foremanWait','offer','work','pay'].includes(s.stage)){
    if(s.stage==='sell'){scrapper={x:W*.80,tx:W*.80,say:''};}
    else if(s.money<FIRST_SALE){s.stage='sell';scrapper={x:W*.80,tx:W*.80,say:''};}
    else{s.stage='offer';s.work=0;foreman={x:W+40,tx:W*.78,say:''};}
    arrowOn=s.stage==='strip';
  }
  if(s.stage==='play'||s.stage==='shop'){openPanel();base(s.stage==='shop'?'상점이 열렸다. 니퍼부터 사자':'탭해서 일하자 · 30번 = 하루 일당');}
}
const had=load();resize();restoreScene();shownMoney=s.money;paintMute();
// 오프라인 수입: 마지막 저장 이후 시간 × 초당 수입 (최대 8시간)
if(had&&s.stage==='play'){const away=Math.min(8*3600,Math.max(0,(Date.now()-s.last)/1000));const ps=perSec();
  if(away>30&&ps>0){const got=Math.floor(away*ps);addMoney(got);shownMoney=s.money-got;
    const h=Math.floor(away/3600),m=Math.floor(away%3600/60);
    overlay('<h2>다녀왔어?</h2><p>'+(h?h+'시간 ':'')+m+'분 동안 사람들이 일했다</p><div class="big">+'+won(got)+'</div><button class="bigBtn" id="ovOk">받기</button>');
    $('ovOk').onclick=()=>{closeOverlay();sfx.cash();};}}
render(true);requestAnimationFrame(frame);

/* ───────── 테스트용 ───────── */
window.__game={get s(){return s;},fmt,won,tapVal,perSec,wage,
  tap:(n,x,y)=>{for(let i=0;i<(n||1);i++)onStageTap(x==null?W*.5:x,y==null?H*.5:y);},
  step:(sec)=>{let t=sec;while(t>0){const d=Math.min(.05,t);step(d);t-=d;}},
  buyTool,buyPeople,startStudy,studyTap,runEvent,save,load,render:()=>render(true),
  pause:v=>{paused=!!v;},cableEnd,version:VERSION};
})();
</script>
</body>
