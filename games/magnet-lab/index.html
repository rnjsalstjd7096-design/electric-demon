<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1320">
<title>자석 실험실</title>
<style>
/* 자석 실험실 — 전자석 격자 퍼즐 (한 파일 완결) */
:root{
  --bg:#0a1320; --bg2:#101923; --panel:#152238; --line:#2c415b; --text:#eaf1fb; --dim:#a5b7ca;
  --cyan:#64ceeb; --gold:#f2c66d; --green:#78e2ae; --red:#e77d78; --blue:#5fa6ee;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;overscroll-behavior:none;word-break:keep-all}
body{background:radial-gradient(ellipse at 50% -10%,#16304a 0%,var(--bg) 55%) fixed,var(--bg)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%;max-width:1100px;margin:0 auto;
  padding:var(--sat) var(--sar) var(--sab) var(--sal)}
.screen{position:absolute;inset:var(--sat) var(--sar) var(--sab) var(--sal);display:none;flex-direction:column}
.screen.on{display:flex}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 18px;min-height:46px;
  font-size:16px;font-weight:600;transition:transform .08s,background .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.main{background:linear-gradient(180deg,#2c6f8f,#1d4a66);border-color:#64ceeb88;box-shadow:0 0 18px #64ceeb33}
.btn.gold{background:linear-gradient(180deg,#8a6a2a,#5d4518);border-color:#f2c66d99;box-shadow:0 0 18px #f2c66d33}
.icon-btn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  display:inline-flex;align-items:center;justify-content:center;padding:0}
.icon-btn svg{width:22px;height:22px}
a.back{position:absolute;left:12px;top:10px;color:var(--dim);text-decoration:none;font-size:15px;padding:10px 6px;z-index:2}
a.back:hover{color:var(--text)}

/* 타이틀 */
#scrTitle{align-items:center;justify-content:center;text-align:center;padding:20px 16px;overflow:auto}
#titleArt{width:min(300px,78vw);height:auto;aspect-ratio:3/2}
h1{font-size:clamp(34px,10vw,52px);margin:6px 0 4px;letter-spacing:2px;
  background:linear-gradient(180deg,#fff,#9fdcf0);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px #64ceeb66)}
.sub{color:var(--dim);margin:0 0 18px;font-size:15px;line-height:1.5}
.tbtns{display:flex;flex-direction:column;gap:10px;width:min(300px,86vw)}
.record{margin-top:18px;color:var(--gold);font-size:15px;min-height:22px}
.record small{display:block;color:var(--dim);font-size:13px;margin-top:4px}
#titleSound{position:absolute;right:12px;top:8px}

/* 단계 선택 */
#scrSelect{padding:56px 16px 16px}
#scrSelect h2{margin:0 0 4px;text-align:center;font-size:22px}
#selSummary{text-align:center;color:var(--gold);margin-bottom:12px;font-size:14px}
#lvGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:9px;overflow-y:auto;padding:4px 2px 12px;
  align-content:start;flex:1}
.lv{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;font-weight:700;min-height:56px}
.lv .st{font-size:11px;letter-spacing:1px;color:#55667a;margin-top:2px}
.lv .st b{color:var(--gold);font-weight:400}
.lv.done{border-color:#78e2ae77}
.lv.locked{opacity:.38;cursor:not-allowed}
.lv.new::after{content:'';position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.lv .ic{position:absolute;bottom:3px;font-size:9px;color:var(--dim)}
.selfoot{display:flex;gap:10px;justify-content:center;padding-top:8px}

/* 게임 */
#scrGame{touch-action:none}
.hud{display:flex;align-items:center;gap:8px;padding:6px 10px 4px}
.lvinfo{flex:1;min-width:0}
#lvName{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvMoves{font-size:13px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvMoves b{color:var(--text)}
#starNow{font-size:18px;letter-spacing:1px;color:#3c4d63}
#starNow .on{color:var(--gold);text-shadow:0 0 8px #f2c66d88}
#tip{margin:2px 10px 4px;padding:7px 10px;border-radius:10px;background:#11203a;border:1px solid #233a58;
  font-size:13.5px;line-height:1.4;color:#cfe0f2;min-height:36px;display:flex;align-items:center;transition:background .2s,border-color .2s}
#tip.warn{background:#3a1717;border-color:#e77d7899;color:#ffd9d6}
#tip.good{background:#123327;border-color:#78e2ae88;color:#d9ffe9}
#stage{flex:1;position:relative;min-height:120px;margin:0 6px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#controls{display:flex;gap:12px;justify-content:center;align-items:center;padding:8px 10px 10px}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
.dpad button{border:1px solid var(--line);background:var(--panel);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:0}
.dpad button:active,.dpad button.press{background:#21395a;border-color:var(--cyan)}
.dpad svg{width:26px;height:26px}
.dpad .c{border:none;background:transparent;pointer-events:none}
.side{display:flex;flex-direction:column;gap:7px;width:172px}
.polrow{display:flex;gap:7px}
.pol{flex:1;height:54px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-size:22px;font-weight:800;position:relative}
.pol small{display:block;font-size:10px;font-weight:500;color:var(--dim);margin-top:-2px}
.pol.n{color:#ffb4ae}.pol.s{color:#a9d2ff}.pol.off{height:44px;font-size:16px;flex:none;color:var(--dim)}
.pol.n.act{background:linear-gradient(180deg,#7a2f2c,#4b1e1d);border-color:var(--red);box-shadow:0 0 16px #e77d7877;color:#fff}
.pol.s.act{background:linear-gradient(180deg,#24497a,#172e4d);border-color:var(--blue);box-shadow:0 0 16px #5fa6ee77;color:#fff}
.pol.off.act{background:#1d2a3c;border-color:#7d8fa5;color:var(--text)}
.row{display:flex;gap:7px}
.row .btn{flex:1;padding:6px 4px;font-size:13.5px;min-height:44px;border-radius:12px;font-weight:600}

/* 오버레이 */
.ov{position:absolute;inset:0;background:#050b14cc;display:none;align-items:center;justify-content:center;z-index:10;padding:16px;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ov.on{display:flex}
.card{background:linear-gradient(180deg,#182a44,#121e31);border:1px solid #35506f;border-radius:18px;padding:20px 18px;
  width:min(380px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 50px #0009,0 0 30px #64ceeb1a}
.card h2{margin:0 0 6px;font-size:23px}
.card p{color:var(--dim);line-height:1.55;margin:6px 0 14px;font-size:15px}
.card .btns{display:flex;flex-direction:column;gap:9px}
.card .btns.h{flex-direction:row}.card .btns.h .btn{flex:1}
#clearStars{font-size:44px;letter-spacing:6px;margin:4px 0}
#clearStars span{color:#334459;display:inline-block;transition:color .3s,transform .3s}
#clearStars span.on{color:var(--gold);text-shadow:0 0 18px #f2c66daa}
#clearStars span.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.stat{display:flex;justify-content:center;gap:18px;margin:6px 0 4px;font-size:15px;color:var(--dim)}
.stat b{color:var(--text);font-size:20px;display:block}
.newrec{color:var(--gold);font-weight:700;min-height:22px;margin:4px 0 10px;text-shadow:0 0 10px #f2c66d77}
#introIcon{width:96px;height:96px;margin:2px auto 6px;display:block}
.howlist{text-align:left;display:flex;flex-direction:column;gap:8px;margin:8px 0 14px}
.howitem{display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.4;color:#d5e2f0}
.howitem canvas{width:40px;height:40px;flex:none}
.keys{font-size:13px;color:var(--dim);line-height:1.6;text-align:left;background:#0e1a2b;border-radius:10px;padding:8px 10px;margin-bottom:12px}
kbd{background:#22344b;border-radius:5px;padding:1px 6px;font-family:inherit;font-size:12px;color:var(--text);border:1px solid #3a5070}

/* 넓은 화면: 조작부를 오른쪽에 */
@media (min-width:760px) and (min-aspect-ratio:1/1){
  #scrGame{display:none;flex-direction:row;flex-wrap:wrap}
  #scrGame.on{display:grid;grid-template-columns:1fr 300px;grid-template-rows:auto auto 1fr;padding:6px 10px}
  .hud{grid-column:1/3}
  #tip{grid-column:1/2;margin:2px 6px 6px}
  #stage{grid-column:1/2;grid-row:3/4}
  #controls{grid-column:2/3;grid-row:2/4;flex-direction:column;justify-content:center;gap:20px}
  .side{width:220px}
}
@media (max-height:640px){
  .dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}
  .pol{height:46px}.pol.off{height:44px}
  #tip{font-size:12.5px;min-height:32px;padding:5px 9px}
}
@media (prefers-reduced-motion:reduce){ #clearStars span.pop{animation:none} }
</style>

<body>
<div id="app">
  <!-- 타이틀 -->
  <section id="scrTitle" class="screen on">
    <a class="back" href="../">← 게임 목록</a>
    <button class="icon-btn" id="titleSound" aria-label="소리 켜기/끄기"></button>
    <canvas id="titleArt" width="300" height="200" aria-hidden="true"></canvas>
    <h1>자석 실험실</h1>
    <p class="sub">전자석의 극성을 바꿔 상자를 밀고 당겨<br>실험실 탈출구를 찾아라!</p>
    <div class="tbtns">
      <button class="btn main" id="btnStart">게임 시작</button>
      <button class="btn" id="btnSelect">단계 선택</button>
      <button class="btn" id="btnHow">방법 보기</button>
    </div>
    <div class="record" id="titleRecord"></div>
  </section>

  <!-- 단계 선택 -->
  <section id="scrSelect" class="screen">
    <a class="back" href="#" id="selBack">← 타이틀</a>
    <h2>단계 선택</h2>
    <div id="selSummary"></div>
    <div id="lvGrid"></div>
    <div class="selfoot"><button class="btn" id="selHow">방법 보기</button></div>
  </section>

  <!-- 게임 -->
  <section id="scrGame" class="screen">
    <header class="hud">
      <button class="icon-btn" id="btnPause" aria-label="일시정지"><svg viewBox="0 0 24 24" fill="#eaf1fb"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <div class="lvinfo"><div id="lvName"></div><div id="lvMoves"></div></div>
      <div id="starNow"></div>
      <button class="icon-btn" id="gameSound" aria-label="소리 켜기/끄기"></button>
    </header>
    <div id="tip"></div>
    <div id="stage"><canvas id="cv"></canvas></div>
    <div id="controls">
      <div class="dpad">
        <span class="c"></span><button data-dir="0" aria-label="위"><svg viewBox="0 0 24 24"><path d="M12 5l7 9H5z" fill="#cfe0f2"/></svg></button><span class="c"></span>
        <button data-dir="3" aria-label="왼쪽"><svg viewBox="0 0 24 24"><path d="M5 12l9-7v14z" fill="#cfe0f2"/></svg></button><span class="c"></span><button data-dir="1" aria-label="오른쪽"><svg viewBox="0 0 24 24"><path d="M19 12l-9 7V5z" fill="#cfe0f2"/></svg></button>
        <span class="c"></span><button data-dir="2" aria-label="아래"><svg viewBox="0 0 24 24"><path d="M12 19l-7-9h14z" fill="#cfe0f2"/></svg></button><span class="c"></span>
      </div>
      <div class="side">
        <div class="polrow">
          <button class="pol n" data-pol="1">N<small>N극 켜기</small></button>
          <button class="pol s" data-pol="2">S<small>S극 켜기</small></button>
        </div>
        <button class="pol off" data-pol="0">전자석 끔</button>
        <div class="row"><button class="btn" id="btnUndo">↶ 되돌리기</button><button class="btn" id="btnReset">⟲ 처음부터</button></div>
      </div>
    </div>
  </section>

  <!-- 일시정지 -->
  <div class="ov" id="ovPause"><div class="card">
    <h2>일시정지</h2><p id="pauseInfo"></p>
    <div class="btns">
      <button class="btn main" id="pResume">계속하기</button>
      <button class="btn" id="pRestart">이 단계 다시 시작</button>
      <button class="btn" id="pHow">방법 보기</button>
      <button class="btn" id="pSelect">단계 선택</button>
      <button class="btn" id="pTitle">타이틀로</button>
    </div>
  </div></div>

  <!-- 단계 클리어 / 결과 -->
  <div class="ov" id="ovClear"><div class="card">
    <h2 id="clearTitle">탈출 성공!</h2>
    <div id="clearStars"><span>★</span><span>★</span><span>★</span></div>
    <div class="stat"><div><b id="cMoves">0</b>이동 수</div><div><b id="cPar">0</b>★3 기준</div><div><b id="cBest">-</b>최고 기록</div></div>
    <div class="newrec" id="cNew"></div>
    <div class="btns">
      <button class="btn main" id="cNext">다음 단계 ▶</button>
      <div class="btns h"><button class="btn" id="cRetry">다시 하기</button><button class="btn" id="cSelect">단계 선택</button></div>
      <button class="btn" id="cTitle">타이틀</button>
    </div>
  </div></div>

  <!-- 새 요소 소개 -->
  <div class="ov" id="ovIntro"><div class="card">
    <canvas id="introIcon" width="192" height="192"></canvas>
    <h2 id="introTitle"></h2><p id="introText"></p>
    <div class="btns"><button class="btn main" id="introOk">알겠어요!</button></div>
  </div></div>

  <!-- 방법 보기 -->
  <div class="ov" id="ovHow"><div class="card">
    <h2>방법 보기</h2>
    <div class="howlist" id="howList"></div>
    <div class="keys">
      <b>터치</b> 방향 버튼 또는 화면 밀기(스와이프) · N / S / 끔 버튼<br>
      <b>키보드</b> <kbd>←↑→↓</kbd>/<kbd>WASD</kbd> 이동 · <kbd>1</kbd><kbd>Q</kbd> N극 · <kbd>2</kbd><kbd>E</kbd> S극 · <kbd>3</kbd><kbd>F</kbd> 끔 · <kbd>Space</kbd> 켜기/끄기<br>
      <kbd>Z</kbd> 되돌리기 · <kbd>R</kbd> 처음부터 · <kbd>Esc</kbd> 일시정지
    </div>
    <div class="btns"><button class="btn main" id="howOk">닫기</button></div>
  </div></div>
</div>

<script>
'use strict';
/* =====================================================================
   자석 실험실
   구조: ① 규칙 엔진(RULES, 순수 함수 — 솔버와 공유) ② 단계 데이터(LEVELS, 솔버가 검증한 최소 수 par 포함)
         ③ 저장·소리 ④ 화면 전환·입력 ⑤ 캔버스 그리기·애니메이션 ⑥ requestAnimationFrame 루프
   규칙 요약: 연구원은 한 칸씩 이동·상자 밀기(무거운 상자 제외). 전자석(N/S)을 켜면 바라보는 직선에서
   처음 만나는 자성 상자(나무는 통과)가 반응: 철=당김(미끄러짐), 무거운 철=1칸 당김, 자석 상자=같은 극 밀어냄/다른 극 당김.
   전자석이 켜진 동안 다른 방향 입력은 제자리 회전(조준). 레이저 칸으로는 들어갈 수 없음.
   ===================================================================== */
const SAVE_PREFIX = 'edgames.07.';
const MOVE_MS = 105, SLIDE_MS = 48, MAX_DT = 0.05;
const COL = { bg: '#0a1320', floor: '#131f30', floor2: '#17263a', wall: '#2c415b', wallTop: '#3b5778', wallDark: '#1b2a3d',
  text: '#eaf1fb', dim: '#a5b7ca', cyan: '#64ceeb', gold: '#f2c66d', green: '#78e2ae', red: '#e77d78', blue: '#5fa6ee',

const POL_COL = ['#8a9bb0', '#ff7a70', '#6cb4ff'];

// ==RULES-BEGIN==
/* ---- 규칙 엔진 (화면과 무관한 순수 함수) — 해답 검증 솔버도 이 부분을 그대로 씀 ----
   맵 기호: '#' 벽, ' ' 바깥, '.' 바닥, '@' 연구원, 'E' 탈출구, '_' 압력판, 'D' 문,
            'o' 구멍, 'i' 철 상자, 'h' 무거운 철 상자, 'w' 나무 상자, 'n' N극 상자, 's' S극 상자,
            '^' '>' 'v' '<' 레이저 발사기(벽에 붙은 방향).
   상태: {p:연구원 칸, f:바라보는 방향(0위 1오른쪽 2아래 3왼쪽), pol:0끔 1N 2S, c:칸마다 내용 문자열}
   c의 문자: '.' 비었음, 'o' 열린 구멍, 그 밖은 상자 종류. */
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const T_VOID = 0, T_WALL = 1, T_FLOOR = 2, T_PLATE = 3, T_DOOR = 4, T_EXIT = 5, T_EMIT = 6;
const A_OFF = 4, A_N = 5, A_S = 6;          // 행동 번호: 0~3 이동, 4 끔, 5 N극, 6 S극
const BOX_KINDS = 'ihwns';

function parseLevel(def) {
  const rows = def.map, h = rows.length, w = Math.max(...rows.map(r => r.length));
  const tile = new Uint8Array(w * h), cells = new Array(w * h).fill('.');
  const emit = [], plates = [], doors = [];
  let p = -1, exit = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x] || ' ', i = y * w + x;
    let t = T_FLOOR;
    if (ch === ' ') t = T_VOID;
    else if (ch === '#') t = T_WALL;
    else if (ch === '@') p = i;
    else if (ch === 'E') { t = T_EXIT; exit = i; }
    else if (ch === '_') { t = T_PLATE; plates.push(i); }
    else if (ch === 'D') { t = T_DOOR; doors.push(i); }
    else if (ch === 'o') cells[i] = 'o';
    else if (BOX_KINDS.includes(ch)) cells[i] = ch;
    else if ('^>v<'.includes(ch)) { t = T_EMIT; emit.push({ i, d: '^>v<'.indexOf(ch) }); }
    else if (ch !== '.') throw new Error('알 수 없는 기호 ' + ch);
    tile[i] = t;
  }
  return { w, h, tile, emit, plates, doors, exit,
    start: { p, f: def.f == null ? 2 : def.f, pol: 0, c: cells.join('') } };
}
function nb(L, i, d) {
  const x = i % L.w + DX[d], y = (i / L.w | 0) + DY[d];
  return (x < 0 || y < 0 || x >= L.w || y >= L.h) ? -1 : y * L.w + x;
}
function isBox(ch) { return ch !== '.' && ch !== 'o'; }
function doorsOpen(L, c) {
  if (!L.plates.length) return false;
  for (const i of L.plates) if (!isBox(c[i])) return false;
  return true;
}
// 움직이는 것(연구원·상자)과 자력선을 막는 고정물인가
function solid(L, c, i, open) {
  if (i < 0) return true;
  const t = L.tile[i];
  if (t === T_VOID || t === T_WALL || t === T_EMIT) return true;
  return t === T_DOOR && !open && c[i] === '.';
}
// 레이저가 지나가는 칸 표시 (상자·벽·닫힌 문에서 멈춤)
function beamMap(L, c, open) {
  const m = new Uint8Array(L.w * L.h);
  for (const e of L.emit) {
    let i = e.i;
    for (;;) { i = nb(L, i, e.d); if (solid(L, c, i, open) || isBox(c[i])) break; m[i] = 1; }
  }
  return m;
}
// 전자석 자력: 바라보는 방향 직선에서 처음 만나는 자성 상자(나무는 통과)에 작용
function applyField(L, c, p, f, pol, ev) {
  for (let guard = 0; pol && guard < 40; guard++) {
    const open = doorsOpen(L, c);
    let i = p, target = -1;
    for (;;) {
      i = nb(L, i, f);
      if (solid(L, c, i, open)) break;
      const ch = c[i];
      if (ch === '.' || ch === 'o' || ch === 'w') continue;
      target = i; break;
    }
    if (target < 0) return;
    const k = c[target];
    const repel = (k === 'n' && pol === 1) || (k === 's' && pol === 2);
    const md = repel ? f : (f + 2) % 4, maxSteps = k === 'h' ? 1 : 99;
    let cur = target, fell = false, steps = 0;
    while (steps < maxSteps) {
      const nx = nb(L, cur, md);
      if (nx === p || solid(L, c, nx, open) || isBox(c[nx])) break;
      steps++;
      if (c[nx] === 'o') { c[nx] = '.'; c[cur] = '.'; cur = nx; fell = true; break; }
      c[nx] = c[cur]; c[cur] = '.'; cur = nx;
    }
    if (steps && ev) ev.push({ t: 'slide', from: target, to: cur, kind: k, fall: fell, repel });
    if (!fell) return;           // 구멍에 빠지면 그 뒤의 상자가 새로 끌려옴
  }
}
// 한 행동을 적용한 새 상태. 아무 변화 없거나 레이저에 닿으면 null
function step(L, s, a, ev) {
  const c = s.c.split('');
  let p = s.p, f = s.f, pol = s.pol;
  if (a < 4) {
    const open = doorsOpen(L, c), t = nb(L, p, a);
    let moved = false;
    // 전자석이 켜져 있으면 다른 방향 입력은 '제자리에서 돌기'(조준)
    if (!(pol && a !== f) && !solid(L, c, t, open) && c[t] !== 'o') {
      const k = c[t];
      if (k === '.') { p = t; moved = true; }
      else if (k !== 'h') {
        const b2 = nb(L, t, a);
        if (!solid(L, c, b2, open) && !isBox(c[b2])) {
          const fall = c[b2] === 'o';
          c[b2] = fall ? '.' : k; c[t] = '.';
          if (ev) ev.push({ t: 'push', from: t, to: b2, kind: k, fall });
          p = t; moved = true;
        }
      }
    }
    if (!moved && a === f) { if (ev) ev.push({ t: 'bump', at: t }); return null; }
    if (ev) ev.push(moved ? { t: 'move', from: s.p, to: p } : { t: 'turn' });
    f = a;
  } else {
    const np = a - 4;
    if (np === pol) return null;
    pol = np;
    if (ev) ev.push({ t: 'pol', pol });
  }
  applyField(L, c, p, f, pol, ev);
  const open2 = doorsOpen(L, c);
  if (beamMap(L, c, open2)[p]) { if (ev) ev.push({ t: 'laser', at: p }); return null; }
  return { p, f, pol, c: c.join('') };
}
function isWin(L, s) { return L.tile[s.p] === T_EXIT; }
function stateKey(s) { return s.p + ',' + s.f + ',' + s.pol + ',' + s.c; }
// ==RULES-END==

/* ---------- 저장 (막혀 있어도 동작) ---------- */
const store = {

/* ---------- 효과음 (Web Audio 합성) ---------- */
const Sfx = (() => {
  let ac = null, master = null, hum = null, humGain = null, noiseBuf = null;

    step() { tone(190 + Math.random() * 30, 0.05, 'triangle', 0.07); },
    bump() { tone(90, 0.08, 'square', 0.05); },
    turn() { tone(420, 0.04, 'triangle', 0.05); },

    polOff() { tone(500, 0.18, 'sawtooth', 0.06, 120); },

    clunk() { tone(70, 0.16, 'square', 0.13, 45); noise(0.08, 0.14, 2500, 0, 4); },
    fall() { tone(260, 0.35, 'sine', 0.16, 50); noise(0.25, 0.1, 400, 120, 1, 0.1, 'lowpass'); },
    door(open) { if (open) { tone(523, 0.12, 'triangle', 0.12); tone(784, 0.18, 'triangle', 0.12, 0, 0.09); } else { tone(392, 0.12, 'triangle', 0.1); tone(262, 0.16, 'triangle', 0.1, 0, 0.08); } },
    zap() { noise(0.22, 0.2, 2200, 600, 6); tone(880, 0.2, 'square', 0.07, 220); },

function doAction(a) {

/* ---------- 입력 ---------- */
const KEYMAP = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3,
  Digit1: 5, Numpad1: 5, KeyQ: 5, Digit2: 6, Numpad2: 6, KeyE: 6, Digit3: 4, Numpad3: 4, KeyF: 4, Digit0: 4 };

// 화면 버튼: pointerdown으로 즉시 반응, 누르고 있으면 반복

// 스와이프 / 인접 칸 탭
let swipe = null;
const stage = $('stage');

/* ---------- 애니메이션 ---------- */
function startAnim(prev, n, ev) {
  const A = { t: 0, dur: 0, tracks: [], player: null, hide: new Set(), holes: new Map(), fx: [] };
  let tcur = 0;
  const addSeg = (from, to, t0, t1, kind, fall) => {
    let tr = A.tracks.find(t => t.last === from && !t.fell);
    if (!tr) { tr = { kind, segs: [], last: from, fell: false }; A.tracks.push(tr); }
    tr.segs.push({ from, to, t0, t1 }); tr.last = to; if (fall) { tr.fell = true; A.holes.set(to, t1); }
  };
  for (const e of ev) {
    if (e.t === 'move') { A.player = { from: e.from, to: e.to }; tcur = Math.max(tcur, MOVE_MS); }
    else if (e.t === 'push') {
      addSeg(e.from, e.to, 0, MOVE_MS, e.kind, e.fall); tcur = Math.max(tcur, MOVE_MS);
      if (e.fall) A.fx.push({ at: MOVE_MS, f: () => { Sfx.fall(); dustAt(e.to); } });
    } else if (e.t === 'slide') {
      const dist = cellDist(e.from, e.to), d = Math.max(70, dist * SLIDE_MS + (e.kind === 'h' ? 90 : 30));
      const t0 = tcur + (e.kind === 'h' ? 0 : 20);
      addSeg(e.from, e.to, t0, t0 + d, e.kind, e.fall);
      A.fx.push({ at: t0, f: () => { Sfx.slide(dist); fieldPulse = 1; } });
      A.fx.push({ at: t0 + d, f: () => { if (e.fall) { Sfx.fall(); dustAt(e.to); } else { Sfx.clunk(); sparkAt(e.to, e.kind === 'n' ? COL.red : e.kind === 's' ? COL.blue : COL.gold, 10, e.repel ? e.to : -1); addShake(e.kind === 'h' ? 4 : 2); } } });
      tcur = t0 + d;
    }
  }
  for (const tr of A.tracks) if (!tr.fell) A.hide.add(tr.last);
  A.dur = Math.max(tcur, A.player ? MOVE_MS : 0);
  anim = A.dur > 0 ? A : null;
}
let fieldPulse = 0;
function finishAnim() {
  if (!anim) return;
  for (const f of anim.fx) if (!f.done) { f.done = true; }
  anim = null;
}
function cellDist(a, b) { return Math.abs(a % L.w - b % L.w) + Math.abs((a / L.w | 0) - (b / L.w | 0)); }
function addShake(v) { if (!reduceMotion) shake = Math.max(shake, v); }

/* ---------- 입자 ---------- */
function cellCenter(i) { const g = geom(); return [g.ox + (i % L.w + 0.5) * g.T, g.oy + ((i / L.w | 0) + 0.5) * g.T]; }
function sparkAt(i, col, n = 10) {
  const [x, y] = cellCenter(i), T = geom().T;
  const cnt = reduceMotion ? Math.ceil(n / 3) : n;
  for (let k = 0; k < cnt; k++) {
    const a = Math.random() * Math.PI * 2, sp = (0.8 + Math.random() * 2.2) * T;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.25 + Math.random() * 0.3, max: 0.5, col, size: 1.5 + Math.random() * 1.5, kind: 'spark' });
  }
}
function dustAt(i) {
  const [x, y] = cellCenter(i), T = geom().T;
  for (let k = 0; k < (reduceMotion ? 4 : 14); k++) {
    const a = Math.random() * Math.PI * 2, sp = (0.3 + Math.random() * 0.8) * T;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5 + Math.random() * 0.4, max: 0.9, col: '#8a99ab', size: 2 + Math.random() * 3, kind: 'dust' });
  }
}

function geom() {

  c.fillStyle = '#20324a'; const d = Math.max(1, T * 0.04); c.fillRect(x + T * 0.12, y + T * 0.12, d, d); c.fillRect(x + T * 0.84, y + T * 0.84, d, d);

  c.strokeStyle = '#22354d'; c.lineWidth = 1; c.beginPath(); c.moveTo(x, y + T * 0.45); c.lineTo(x + T, y + T * 0.45);
  c.moveTo(x + T * ((i * 7) % 3 === 0 ? 0.3 : 0.62), y + T * 0.1); c.lineTo(x + T * ((i * 7) % 3 === 0 ? 0.3 : 0.62), y + T * 0.45); c.stroke();
}

  g.addColorStop(0, '#000'); g.addColorStop(0.75, '#04080f'); g.addColorStop(1, '#1b2a3c');
  c.fillStyle = g; rr(c, x + T * 0.06, y + T * 0.06, T * 0.88, T * 0.88, T * 0.18); c.fill();
  c.strokeStyle = '#3a4d64'; c.lineWidth = Math.max(1, T * 0.04); c.stroke();
}
function drawFilled(c, x, y, T) {

  c.strokeStyle = '#3d4a5a'; c.lineWidth = Math.max(1, T * 0.03);

  c.moveTo(x + T * 0.45, y + T * 0.48); c.lineTo(x + T * 0.78, y + T * 0.4); c.stroke();

  c.fillStyle = pressed ? '#5d4a1e' : '#2a2a26'; rr(c, x + T * 0.16, y + T * 0.16, T * 0.68, T * 0.68, T * 0.1); c.fill();

function drawDoor(c, x, y, T, open, t) {

  c.restore();

  c.beginPath(); c.arc(cx, cy, T * (0.18 + 0.12 * ((t * 0.8) % 1)), 0, Math.PI * 2); c.globalAlpha = 1 - ((t * 0.8) % 1); c.stroke(); c.globalAlpha = 1;

  c.fillStyle = '#3b2025'; c.beginPath(); c.arc(x + T / 2, y + T / 2, T * 0.28, 0, Math.PI * 2); c.fill();
  c.save(); c.shadowColor = COL.laser; c.shadowBlur = T * 0.4;

function drawBox(c, kind, x, y, T, scale = 1, glow = 0) {

function drawPlayer(c, x, y, T, f, pol, t, glow) {

function drawIcon(c, k, size, woodpass) {

    c.strokeStyle = POL_COL[1]; c.lineWidth = T * 0.05; for (let q = 0; q < 3; q++) { c.globalAlpha = 1 - q * 0.25; c.beginPath(); c.arc(T * 0.38 + q * T * 0.17, T * 0.5, T * 0.16, -0.9, 0.9); c.stroke(); }

    drawFloor(c, 0, 0, T, 0); drawBox(c, 'w', T * 0.22, T * 0.22, T * 0.56);
    c.strokeStyle = POL_COL[2]; c.lineWidth = T * 0.04; c.setLineDash([T * 0.06, T * 0.05]);
    c.beginPath(); c.moveTo(0, T * 0.5); c.lineTo(T, T * 0.5); c.stroke(); c.setLineDash([]);
  }
  else { drawFloor(c, 0, 0, T, 0); drawBox(c, k, 0, 0, T); }
  c.restore();
}
function drawTitleArt() {
  const c = $('titleArt').getContext('2d'), T = 50, t = now;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 300, 200);
  for (let y = 0; y < 4; y++) for (let x = 0; x < 6; x++) {
    if (y === 0 || y === 3) drawWall(c, x * T, y * T, T, null, x + y); else drawFloor(c, x * T, y * T, T, (x + y) & 1);
  }
  const k = (Math.sin(t * 1.2) + 1) / 2;
  const bx = T * (4 - k * 1.6);
  drawField(c, T * 0.5 + T * 0.55, T * 1.5, bx, T * 1.5, 1, true, t, T);
  drawPlayer(c, 0, T, T, 1, 1, t, 1);
  drawBox(c, 'i', bx - T * 0.1, T, T);
  drawPlayer(c, 0, T * 2, T, 1, 2, t, 1);
  drawField(c, T * 1.05, T * 2.5, T * 5, T * 2.5, 2, false, t, T);
  drawBox(c, 's', T * 4.6 + Math.sin(t * 5) * 1.5, T * 2, T);
  drawExit(c, T * 5, T * 1, T, t);
}

// 자력선 연출: (x0,y0)→(x1,y1), attract면 상자에서 연구원 쪽으로 물결
function drawField(c, x0, y0, x1, y1, pol, attract, t, T) {
  const len = Math.hypot(x1 - x0, y1 - y0); if (len < 2) return;
  const ux = (x1 - x0) / len, uy = (y1 - y0) / len, col = POL_COL[pol];
  c.save();
  const g = c.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, col + '55'); g.addColorStop(1, col + '10');
  c.strokeStyle = g; c.lineWidth = T * 0.5; c.lineCap = 'butt';
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.globalAlpha = 0.35; c.stroke(); c.globalAlpha = 1;
  c.strokeStyle = col; c.lineWidth = Math.max(1.5, T * 0.05); c.shadowColor = col; c.shadowBlur = T * 0.2;
  const sp = T * 0.42, phase = ((reduceMotion ? 0 : t) * T * 1.6) % sp;
  for (let d = 0; d < len + sp; d += sp) {
    let dd = attract ? d - phase + sp : d + phase;
    if (dd < 0 || dd > len) continue;
    const px = x0 + ux * dd, py = y0 + uy * dd, a = Math.atan2(uy, ux);
    c.globalAlpha = 0.85 * (1 - dd / (len + T)) + 0.15;
    c.beginPath(); c.arc(px - ux * T * 0.2, py - uy * T * 0.2, T * 0.24, a - 0.8, a + 0.8); c.stroke();
  }
  c.restore();
}
function fieldLine() {   // 현재 상태에서 자력이 닿는 곳 (렌더용)
  if (!S.pol) return null;
  const open = doorsOpen(L, S.c);
  let i = S.p, last = S.p, target = -1;
  for (;;) {
    const n = nb(L, i, S.f);
    if (solid(L, S.c, n, open)) break;
    i = n; last = i;
    const ch = S.c[i];
    if (ch === '.' || ch === 'o' || ch === 'w') continue;
    target = i; break;
  }
  return { last, target };
}

function render(dt) {
  const c = ctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, W, H);
  if (!L) return;
  const { T, ox, oy } = geom();
  let sx = 0, sy = 0;
  if (shake > 0.1) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; }
  c.save(); c.translate(ox + sx, oy + sy);
  const at = anim ? anim.t : 1e9;
  const open = doorsOpen(L, S.c), beams = beamMap(L, S.c, open);
  // 바닥 · 고정물
  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
    const i = y * L.w + x, t = L.tile[i], X = x * T, Y = y * T;
    if (t === T_VOID) continue;
    if (t === T_WALL) { drawWall(c, X, Y, T, L, i); continue; }
    if (t === T_EMIT) continue;
    drawFloor(c, X, Y, T, (x + y) & 1);
    if (t === T_PLATE) drawPlate(c, X, Y, T, isBox(S.c[i]), now);
    else if (t === T_EXIT) drawExit(c, X, Y, T, now);
    else if (t === T_DOOR) drawDoor(c, X, Y, T, open || S.c[i] !== '.' || S.p === i, now);
    if (L.start.c[i] === 'o') {
      const fallT = anim && anim.holes.has(i) ? anim.holes.get(i) : -1;
      if (S.c[i] === 'o' || (fallT >= 0 && at < fallT + 140)) drawHole(c, X, Y, T); else drawFilled(c, X, Y, T);
    }
  }
  // 레이저
  for (const e of L.emit) {
    const ex = e.i % L.w, ey = e.i / L.w | 0;
    let i = e.i, n = 0;
    for (;;) { const k = nb(L, i, e.d); if (k < 0 || !beams[k]) break; i = k; n++; }
    const x0 = (ex + 0.5 + DX[e.d] * 0.45) * T, y0 = (ey + 0.5 + DY[e.d] * 0.45) * T;
    const x1 = ((i % L.w) + 0.5 + DX[e.d] * 0.5) * T, y1 = ((i / L.w | 0) + 0.5 + DY[e.d] * 0.5) * T;
    const fl = reduceMotion ? 1 : 0.75 + 0.25 * Math.sin(now * 40 + e.i);
    c.save(); c.shadowColor = COL.laser; c.shadowBlur = T * 0.35;
    c.strokeStyle = `rgba(255,77,94,${0.35 * fl})`; c.lineWidth = T * 0.22; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
    c.strokeStyle = `rgba(255,220,225,${0.95 * fl})`; c.lineWidth = Math.max(1.5, T * 0.05); c.stroke();
    c.restore();
    drawEmitter(c, ex * T, ey * T, T, e.d, now);
  }
  // 자력선
  const fl = fieldLine();
  polT += dt;
  if (fl && !won) {
    const px = (S.p % L.w + 0.5) * T, py = ((S.p / L.w | 0) + 0.5) * T;
    const lx = (fl.last % L.w + 0.5) * T, ly = ((fl.last / L.w | 0) + 0.5) * T;
    const k = S.c[fl.target];
    const attract = fl.target >= 0 && !((k === 'n' && S.pol === 1) || (k === 's' && S.pol === 2));
    const reach = Math.min(1, polT * 6);
    const ex = px + (lx + DX[S.f] * T * (fl.target >= 0 ? -0.35 : 0.5) - px) * reach, ey = py + (ly + DY[S.f] * T * (fl.target >= 0 ? -0.35 : 0.5) - py) * reach;
    drawField(c, px + DX[S.f] * T * 0.42, py + DY[S.f] * T * 0.42, ex, ey, S.pol, attract, now, T);
  }
  // 상자 (정지)
  for (let i = 0; i < S.c.length; i++) {
    const k = S.c[i]; if (!isBox(k)) continue;
    if (anim && anim.hide.has(i)) continue;
    const glow = fl && fl.target === i ? 0.7 + 0.3 * Math.sin(now * 8) : 0;
    drawBox(c, k, (i % L.w) * T, (i / L.w | 0) * T, T, 1, glow);
  }
  // 상자 (움직이는 중)
  if (anim) for (const tr of anim.tracks) {
    let pos = null, sc = 1;
    for (const sg of tr.segs) {
      if (at < sg.t0) { if (!pos) pos = [sg.from % L.w, sg.from / L.w | 0]; break; }
      const u = Math.min(1, (at - sg.t0) / Math.max(1, sg.t1 - sg.t0)), e = u * u * (3 - 2 * u);
      const ax = sg.from % L.w, ay = sg.from / L.w | 0, bx = sg.to % L.w, by = sg.to / L.w | 0;
      pos = [ax + (bx - ax) * e, ay + (by - ay) * e];
    }
    const lastSeg = tr.segs[tr.segs.length - 1];
    if (tr.fell) { if (at > lastSeg.t1 + 140) continue; if (at > lastSeg.t1) sc = 1 - (at - lastSeg.t1) / 140 * 0.7; }
    if (pos) drawBox(c, tr.kind, pos[0] * T, pos[1] * T, T, sc, 0);
  }
  // 연구원
  let ppx = S.p % L.w, ppy = S.p / L.w | 0;
  if (anim && anim.player && at < MOVE_MS) {
    const u = at / MOVE_MS, e = u * (2 - u), fx = anim.player.from % L.w, fy = anim.player.from / L.w | 0;
    ppx = fx + (ppx - fx) * e; ppy = fy + (ppy - fy) * e;
  }
  if (won) { // 탈출: 빛으로 사라짐
    const u = Math.min(1, (now - wonAt) / 0.5);
    c.save(); c.globalAlpha = 1 - u; drawPlayer(c, ppx * T, ppy * T - u * T * 0.3, T, S.f, 0, now, 0); c.restore();
    if (!reduceMotion) { c.save(); c.globalAlpha = (1 - u) * 0.8; c.strokeStyle = '#d9ffe9'; c.lineWidth = T * 0.06; c.shadowColor = COL.green; c.shadowBlur = T * 0.5;
      c.beginPath(); c.arc((ppx + 0.5) * T, (ppy + 0.5) * T, T * (0.3 + u * 1.2), 0, Math.PI * 2); c.stroke(); c.restore(); }
  } else drawPlayer(c, ppx * T, ppy * T, T, S.f, S.pol, now, 1);
  // 경고 번쩍
  if (flash) {
    flash.t -= dt;
    if (flash.t <= 0) flash = null;
    else { const fx = flash.i % L.w, fy = flash.i / L.w | 0; c.fillStyle = flash.col; c.globalAlpha = Math.min(0.6, flash.t) * (reduceMotion ? 0.5 : 1);
      rr(c, fx * T + 2, fy * T + 2, T - 4, T - 4, T * 0.15); c.fill(); c.globalAlpha = 1; }
  }
  c.restore();
  // 입자 (화면 좌표)
  for (let k = particles.length - 1; k >= 0; k--) {
    const p = particles[k]; p.life -= dt;
    if (p.life <= 0) { particles.splice(k, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9;
    c.globalAlpha = Math.min(1, p.life / p.max * 1.6);
    c.fillStyle = p.col;
    if (p.kind === 'spark') { c.save(); c.shadowColor = p.col; c.shadowBlur = 6; c.fillRect(p.x + sx, p.y + sy, p.size, p.size); c.restore(); }
    else { c.beginPath(); c.arc(p.x + sx, p.y + sy, p.size, 0, Math.PI * 2); c.fill(); }
  }
  c.globalAlpha = 1;
}

/* ---------- 루프 ---------- */
let lastT = 0;
function frame(ts) {
  const dt = Math.min(MAX_DT, Math.max(0, (ts - lastT) / 1000)); lastT = ts;
  now += dt;
  if (anim && !overlay) {
    anim.t += dt * 1000;
    for (const f of anim.fx) if (!f.done && anim.t >= f.at) { f.done = true; f.f(); }
    if (anim.t >= anim.dur + 160) anim = null;
  }
  shake *= Math.pow(0.0005, dt);
  if (screen === 'game') render(dt);
  else if (screen === 'title') drawTitleArt();
  requestAnimationFrame(frame);
}

/* ---------- 테스트용 읽기 훅 (치트 없음) ---------- */
window.__game = {
  state: () => ({
    screen, overlay, level: lvIdx + 1, levelName: L ? LEVELS[lvIdx].name : null, levels: LEVELS.length,
    moves: hist.length, par: L ? LEVELS[lvIdx].par : null, won, animating: !!anim,
    player: S ? { x: S.p % L.w, y: S.p / L.w | 0, facing: 'URDL'[S.f], pol: ['끔', 'N', 'S'][S.pol] } : null,
    doorsOpen: S ? doorsOpen(L, S.c) : null,
    map: S ? Array.from({ length: L.h }, (_, y) => Array.from({ length: L.w }, (_, x) => { const i = y * L.w + x; return i === S.p ? '@' : isBox(S.c[i]) ? S.c[i] : S.c[i] === 'o' ? 'o' : LEVELS[lvIdx].map[y][x] && '@ihwnso'.includes(LEVELS[lvIdx].map[y][x]) ? '.' : (LEVELS[lvIdx].map[y][x] || ' '); }).join('')) : null,
    best: Object.assign({}, best), totalStars: totalStars(), sound: soundOn,
  }),
};

updateSoundBtns(); buildHow(); renderTitle();
requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
</script>
</body>
