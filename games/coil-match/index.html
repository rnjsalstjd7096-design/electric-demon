<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바로 펴!: 변압기 짝 맞추기 퍼즐</title>
<style>
:root{--bg:#17131f;--ink:#fff;--sub:#d6cfe3;--v:#ffcf33;--ok:#3ddc84;--bad:#ff5a5a;--card:#271f36}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100%;padding:8px 12px 70px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;font-size:20px;font-weight:800}
.rule{font-size:20px;color:var(--sub);text-align:center;margin:0}
.stat{display:flex;justify-content:space-around;font-size:21px;font-weight:800}
.stat .m{color:var(--v)} .stat .o{color:var(--ok)}
#board{position:relative;display:flex;flex-direction:column;gap:10px;padding:4px 0}
#wires{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.row{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.tr,.ld{width:40%;min-height:64px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;text-align:center;line-height:1.2}
.tr{background:#2f2645;border:3px solid #4b3d6b;font-size:19px}
.tr small{font-size:16px;color:var(--sub);font-weight:600}
.ld{background:#3a2f22;border:3px solid #6b5536;font-size:22px;cursor:pointer;transition:transform .15s}
.ld small{font-size:16px;color:#e8d9bf;font-weight:600}
.ld.sel{border-color:var(--v);transform:scale(1.06);box-shadow:0 0 0 3px #ffcf3355}
.ld.ok{border-color:var(--ok);background:#1d4430}
#msg{min-height:52px;text-align:center;font-size:20px;line-height:1.4}
#over{position:fixed;inset:0;background:rgba(8,6,12,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.box{max-width:400px;width:100%;background:var(--card);border-radius:18px;padding:20px;text-align:center;font-size:21px;line-height:1.5}
.box h2{margin:0 0 6px;font-size:30px}.big{font-size:42px;font-weight:900;color:var(--v)}
.tip{background:#110d18;border-radius:12px;padding:10px;margin:12px 0;font-size:19px;color:var(--sub);text-align:left}
#again{width:100%;min-height:64px;border:0;border-radius:14px;background:var(--ok);color:#052;font-size:26px;font-weight:900}
.spark{position:fixed;pointer-events:none;font-size:28px;animation:fly .8s ease-out forwards;z-index:9}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
</style><meta name="description" content="변압기 감은 수로 2차 전압을 계산해, 맞는 전압의 기계를 마주 보게 바꿔 끼우는 퍼즐. 맞으면 줄이 바로 펴짐."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/coil-match/"><meta property="og:title" content="바로 펴!: 변압기 짝 맞추기 퍼즐"><meta property="og:description" content="변압기 감은 수로 2차 전압을 계산해, 맞는 전압의 기계를 마주 보게 바꿔 끼우는 퍼즐. 맞으면 줄이 바로 펴짐."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="바로 펴!: 변압기 짝 맞추기 퍼즐",D="변압기 감은 수로 2차 전압을 계산해, 맞는 전압의 기계를 마주 보게 바꿔 끼우는 퍼즐. 맞으면 줄이 바로 펴짐.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/coil-match/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head><body>
<div id="app">
 <div class="top"><span>판 <span id="lv">1</span></span><span>최고 <span id="best">0</span>판</span></div>
 <p class="rule">기계 둘을 눌러 바꿔, 변압기 전압과 마주 보게 한다</p>
 <div class="stat"><span class="o">🔌 바로 핀 줄 <span id="okn">0</span>/<span id="tot">0</span></span><span class="m">🔄 남은 바꾸기 <span id="sw">0</span></span></div>
 <div id="board"><svg id="wires"></svg></div>
 <div id="msg">왼쪽 변압기는 모두 1차 100V. 감은 수로 2차 전압을 계산!</div>
</div>
<div id="over"><div class="box">
 <h2>바꾸기를 다 썼어요</h2>
 <div class="big" id="oScore">0판</div>
 <div id="oGap"></div>
 <div class="tip" id="oTip"></div>
 <button id="again">한 번 더</button>
 <div style="font-size:17px;color:var(--sub);margin-top:8px">지금까지 바로 편 줄 <span id="oTot">0</span>개</div>
</div></div>
<script>
(function(){
const KEY='coil-match.save.v1';let save={best:0,total:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)save=Object.assign(save,s);}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
let ac=null;
function tone(f,d,t,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.14;o.connect(g);g.connect(ac.destination);const n=ac.currentTime;g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d);}catch(e){}}
function sparks(el,n){const r=el.getBoundingClientRect();for(let i=0;i<(n||8);i++){const s=document.createElement('div');s.className='spark';s.textContent=i%2?'⚡':'✨';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';const a=Math.random()*6.28,d=50+Math.random()*70;s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),900);}}
const $=id=>document.getElementById(id);
const ICON=['💡','📻','🔧','🌀','🔦','🧊','🖥️','🔔'];
const RAT=[[1,4],[1,2],[1,1],[3,2],[2,1],[5,2],[3,1],[4,1]];
const TIPS=['2차 전압 = 1차 전압 × (2차 감은 수 ÷ 1차 감은 수). 감은 수가 많은 쪽이 전압도 높다.','전압이 맞지 않는 기계를 꽂으면 안 된다. 기계 이름표의 전압을 먼저 보자.','감은 수로 전압을 올리면 전류는 그만큼 줄어든다. 힘(전력)은 그대로(손실 없는 이상 변압기 기준).'];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
let st,sel=-1;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function minSwaps(p){const seen=[];let s=0;for(let i=0;i<p.length;i++){if(seen[i])continue;let j=i,len=0;while(!seen[j]){seen[j]=1;j=p[j];len++;}s+=len-1;}return s;}
function build(){
 const n=Math.min(3+Math.floor((st.level-1)/2),6);
 const rs=shuffle(RAT.slice()).slice(0,n);
 st.tr=rs.map(r=>{const m=rnd([1,2]);return {N1:100*r[1]*m,N2:100*r[0]*m,V:100*r[0]/r[1]};});
 const icons=shuffle(ICON.slice());
 st.ld=st.tr.map((t,i)=>({V:t.V,ic:icons[i]}));
 let tries=0;do{shuffle(st.ld);tries++;}while(st.ld.some((l,i)=>l.V===st.tr[i].V)&&tries<60||st.ld.every((l,i)=>l.V===st.tr[i].V));
 const perm=st.ld.map(l=>st.tr.findIndex(t=>t.V===l.V));
 st.need=minSwaps(perm);st.sw=st.need+Math.max(1,3-Math.floor(st.level/3));
 sel=-1;render();
}
function fmt(v){return Math.round(v*10)/10;}
function okc(){return st.ld.filter((l,i)=>l.V===st.tr[i].V).length;}
function render(){
 const b=$('board');[...b.querySelectorAll('.row')].forEach(r=>r.remove());
 st.tr.forEach((t,i)=>{const r=document.createElement('div');r.className='row';
  const ok=st.ld[i].V===t.V;
  r.innerHTML='<div class="tr">1차 '+t.N1+'회<br>2차 '+t.N2+'회<small>1차 100V 🔁</small></div><div class="ld'+(ok?' ok':'')+(sel===i?' sel':'')+'" data-i="'+i+'">'+st.ld[i].ic+' '+fmt(st.ld[i].V)+'V<small>필요 전압</small></div>';
  r.querySelector('.ld').onclick=()=>tap(i);b.appendChild(r);});
 requestAnimationFrame(wires);
 $('lv').textContent=st.level;$('best').textContent=save.best;$('okn').textContent=okc();$('tot').textContent=st.tr.length;$('sw').textContent=st.sw;
}
function ok0(i,j){return i===j||st.level<=2;}
function wires(){
 const b=$('board'),svg=$('wires'),br=b.getBoundingClientRect();let h='';
 const rows=[...b.querySelectorAll('.row')];
 // wire from each transformer to the load that actually needs its voltage → straight when matched, tangled otherwise
 st.tr.forEach((t,i)=>{const j=st.ld.findIndex(l=>l.V===t.V);const a=rows[i].children[0].getBoundingClientRect(),c=rows[j].children[1].getBoundingClientRect();
  if(!ok0(i,j))return;const x1=a.right-br.left,y1=a.top+a.height/2-br.top,x2=c.left-br.left,y2=c.top+c.height/2-br.top;const ok=i===j;
  h+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(ok?'#ffcf33':'#ff5a5a')+'" stroke-width="'+(ok?7:4)+'" stroke-linecap="round" '+(ok?'':'stroke-dasharray="6 6" opacity=".8"')+'/>';});
 svg.innerHTML=h;
}
function tap(i){
 if(st.busy)return;
 if(sel<0){sel=i;tone(500,.06,'square',.05);render();return;}
 if(sel===i){sel=-1;render();return;}
 const a=sel;sel=-1;const before=okc();[st.ld[a],st.ld[i]]=[st.ld[i],st.ld[a]];st.sw--;
 render();const now=okc();const rows=[...document.querySelectorAll('.ld')];
 if(now>before){tone(660,.1);setTimeout(()=>tone(990,.16,'triangle',.1),90);if(navigator.vibrate)navigator.vibrate(25);[a,i].forEach(k=>{if(st.ld[k].V===st.tr[k].V)sparks(rows[k],6);});$('msg').textContent='찌잉! 줄이 바로 폈다 ⚡';}
 else{tone(260,.12,'triangle',.08);$('msg').textContent='줄이 아직 꼬여 있어요. 감은 수를 다시 계산!';}
 if(now===st.tr.length){st.busy=true;st.cleared++;st.total+=st.tr.length;$('msg').textContent='전부 바로 폈다! 다음 판 ▶';setTimeout(()=>tone(1320,.3,'triangle',.1),200);sparks($('board'),14);setTimeout(()=>{st.level++;st.busy=false;build();$('msg').textContent=''+(st.level===3?'이제부터 꼬인 줄은 안 보여요. 감은 수로 계산!':'감은 수를 보고 계산!')+'';},1300);}
 else if(st.sw<=0){st.busy=true;tone(160,.4,'sawtooth',.12);if(navigator.vibrate)navigator.vibrate([60,40,60]);setTimeout(over,700);}
}
function over(){const prev=save.best;save.total+=st.total+okc();if(st.cleared>prev)save.best=st.cleared;store();
 $('oScore').textContent=st.cleared+'판 통과';
 $('oGap').textContent='이번 판 '+st.tr.length+'줄 중 '+okc()+'줄 폈음 · '+(st.cleared>prev?'🎉 새 최고 기록!':'최고 '+prev+'판까지 '+(prev-st.cleared+1)+'판');
 $('oTip').textContent='💡 '+rnd(TIPS);$('oTot').textContent=save.total;$('over').style.display='flex';}
function newGame(){st={level:1,cleared:0,total:0,busy:false};$('over').style.display='none';build();}
$('again').onclick=newGame;window.addEventListener('resize',()=>st&&wires());
window.__game={get state(){return st;},save:()=>save,tap,okc,
 solveStep(){for(let i=0;i<st.tr.length;i++){if(st.ld[i].V!==st.tr[i].V){return [i,st.ld.findIndex(l=>l.V===st.tr[i].V)];}}return null;}};
newGame();
})();
</script></body></html>
