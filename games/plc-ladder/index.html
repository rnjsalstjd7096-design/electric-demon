<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f141b">
<title>PLC 래더 퍼즐</title>
<style>
:root{--bg:#0f141b;--panel:#18212c;--panel2:#212c3a;--line:#5d6b7e;--pow:#ffd84a;--txt:#e8eef6;--dim:#8a98aa;--ok:#46e08a;--bad:#ff5a5a;--acc:#3fb6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;top:0;bottom:0;left:0;right:0;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#top{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px}
#lvBtn{flex:1;text-align:left;font-size:15px;font-weight:700;padding:8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvBtn small{color:var(--dim);font-weight:500;margin-left:6px}
#mute{width:40px;height:36px;border-radius:10px;background:var(--panel);font-size:18px}
#machine{flex:none;margin:0 12px;background:var(--panel);border-radius:14px;overflow:hidden}
#mc{display:block;width:100%;height:136px}
#inputs{display:flex;justify-content:center;gap:22px;padding:4px 8px 10px;touch-action:none}
.pb{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;touch-action:none;cursor:pointer}
.cap{width:52px;height:52px;border-radius:50%;position:relative;box-shadow:0 5px 0 #0007,inset 0 -4px 0 #0004,inset 0 3px 0 #fff3;transition:transform .05s,box-shadow .05s}
.cap.green{background:radial-gradient(circle at 40% 35%,#6fe58f,#1f9a45)}
.cap.red{background:radial-gradient(circle at 40% 35%,#ff7b7b,#c2262b)}
.cap.estop{background:radial-gradient(circle at 40% 35%,#ff6b6b,#b0151b);border:5px solid #f2c400;width:58px;height:58px;margin-top:-3px}
.pb.on .cap{transform:translateY(4px);box-shadow:0 1px 0 #0007,inset 0 3px 6px #0006}
.pb.on .cap.estop{transform:translateY(5px) scale(.96)}
.pb.glow .cap::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--acc);animation:pulse 1s infinite}
.lb{font-size:12px;color:var(--dim);white-space:nowrap}
.lb b{color:var(--txt);margin-right:3px}
.pb.locked{pointer-events:none}
#hint{flex:none;min-height:36px;padding:8px 14px 4px;text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint.bad{color:var(--bad)}
#ladderWrap{flex:1;min-height:120px;position:relative;margin:0 6px}
#lc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#palette{flex:none;display:flex;gap:4px;padding:6px 10px;justify-content:center}
.tool{width:52px;height:56px;border-radius:10px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--dim);border:2px solid transparent;position:relative}
.tool svg{width:40px;height:22px}
.tool b{color:var(--txt);font-size:12px}
.tool.sel{border-color:var(--acc);background:var(--panel2);color:var(--txt)}
.tool.glow::after{content:"";position:absolute;inset:-5px;border-radius:13px;border:3px solid var(--pow);animation:pulse 1s infinite}
#actions{flex:none;display:flex;gap:8px;padding:2px 12px 10px}
#actions button{height:46px;border-radius:12px;background:var(--panel);font-weight:700;font-size:15px}
#hintBtn{width:86px}
#testBtn{flex:1;background:#1f6f43 !important}
@keyframes pulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
#sheet{position:absolute;left:0;right:0;bottom:0;background:#141c26;border-top:2px solid var(--panel2);border-radius:16px 16px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none;box-shadow:0 -8px 24px #0008}
#sheet.show{display:block}
#sheetHead{font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center}
#sheetHead span{font-size:11px;color:var(--dim);font-weight:500}
#chart{display:block;width:100%;height:120px;margin-top:6px}
#sheetMsg{font-size:14px;margin-top:6px;min-height:20px}
#sheetMsg .why{color:var(--dim);font-size:13px;margin-top:3px}
#sheetBtns{display:flex;gap:8px;margin-top:8px}
#sheetBtns button{flex:1;height:42px;border-radius:11px;background:var(--panel2);font-weight:700}
.ovl{position:absolute;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;padding:12px}
.ovl.show{display:flex}
.card{width:100%;background:#17212d;border-radius:18px;padding:18px 16px 14px;border:2px solid #2c3a4b;box-shadow:0 10px 40px #000a}
.card h2{margin:0 0 8px;font-size:24px}
.card .k{font-size:15px;font-weight:700;margin:8px 0}
.card .f{font-size:14px;color:#c9d6e4;line-height:1.5;background:#0f1720;border-radius:10px;padding:10px 12px}
.card .f b{color:var(--pow)}
.card .t{font-size:14px;color:var(--acc);margin-top:10px;font-weight:700}
.card .go{display:block;width:100%;height:50px;margin-top:14px;border-radius:13px;background:#1f6f43;font-weight:800;font-size:17px}
.grid6{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.grid6 button{height:64px;border-radius:12px;background:var(--panel2);text-align:left;padding:8px 12px;font-size:14px;font-weight:700}
.grid6 button small{display:block;color:var(--dim);font-weight:500;font-size:12px;margin-top:2px}
.grid6 button.done{border:2px solid #1f6f43}
.grid6 button:disabled{opacity:.35}
.card .soon{font-size:12px;color:var(--dim);margin-top:10px}
</style>

<div id="app">

/* ================= 루프 ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T = now / 1000;
  if (testing) stepTest(dt); else physFromUI();
  const prev = { ...plc.out };
  scan(plc, lv, grid);
  let ch = false;
  for (const o of lv.outputs) if (prev[o.a] !== plc.out[o.a]) { ch = true; if (plc.out[o.a] && !testing) everOn = true; }
  if (ch && plc.scans > 1) SFX.relay();
  if (lv.short) {
    if (isShort(lv, plc.out) && !tripped) { tripped = true; SFX.spark(); spark(mach.sx || 200, mach.sy || 40, 30); }
    if (!plc.out[lv.short[0]] && !plc.out[lv.short[1]]) tripped = false;
  }
  if (!testing && !sheet && !clearOpen && dirty && interacted && everOn && !anyHeld() && now - lastInputT > 700) startTest();
  updateMachine(dt);
  const tgt = updateHintUI(now);
  drawMachine(); drawLadder(tgt); drawChart();
  requestAnimationFrame(frame);
}

/* ================= 테스트용 ================= */
window.__game = {
  state: () => ({ level:cur + 1, title:lv.title, grid:grid.map(r => r.slice()), phys:{ ...plc.phys }, out:{ ...plc.out }, scans:plc.scans,
    testing:!!testing, sheet:sheet && sheet.state, clearOpen, maxCleared, silentPass, tripped, hint:$('#hint').textContent }),
  cellCenter: (r, c) => { const b = lc.getBoundingClientRect(); return { x:b.left + x0 + (c + .5) * cw, y:b.top + rowY[r] }; },
  place: (r, c, v) => setCell(r, c, v),
  press: (a, v) => { ui.latch[a] = !!v; inputChanged(); },
  simulate: () => simulateTest(lv, grid),
  test: startTest, goto: i => loadLevel(i - 1), levels: LEVELS.length,
};

/* ================= 시작 ================= */
const sv = load();
if (sv) {
  maxCleared = Math.max(0, Math.min(LEVELS.length, sv.maxCleared | 0));
  muted = !!sv.muted; grids = (sv.grids && typeof sv.grids === 'object') ? sv.grids : {};
  cur = Math.max(0, Math.min(maxCleared, sv.level | 0, LEVELS.length - 1));
}
$('#mute').textContent = muted ? '🔇' : '🔊';
loadLevel(cur);
addEventListener('resize', layout);
if (window.ResizeObserver) new ResizeObserver(layout).observe($('#ladderWrap'));
requestAnimationFrame(frame);
</script>
</body>
</html>
