var q=document.getElementById('q'),out=document.getElementById('out'),cnt=document.getElementById('cnt'),more=document.getElementById('more');
var PAGE=20,shown=PAGE,cur=[];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(s){return String(s).toLowerCase().replace(/\s+/g,'')}
function find(w){w=norm(w);if(!w)return T.slice();
 var a=[],b=[];
 T.forEach(function(t){var k=norm(t[0]),s=norm(t[1]);
  if(k===w||k.indexOf(w)===0)a.push(t);
  else if(k.indexOf(w)>=0||s.indexOf(w)>=0||norm(t[2]).indexOf(w)>=0)b.push(t)});
 return a.concat(b)}
function card(t){return '<div class="item"><b>'+esc(t[0])+'</b>'+(t[1]?'<span class="std">바른 말: '+esc(t[1])+'</span>':'')+'<span class="m">'+esc(t[2])+'</span>'+(t[3]?'<span class="f">'+esc(t[3])+'</span>':'')+'<span class="tag">'+esc(t[4])+'</span></div>'}
function draw(){
 var w=q.value.trim();
 if(w&&!cur.length){out.innerHTML='<div class="none"><p><b>아직 없음</b></p><p class="sub">「'+esc(w)+'」은(는) 우리 자료에 아직 없어요.</p></div>';cnt.textContent='';more.style.display='none';return}
 out.innerHTML=cur.slice(0,shown).map(card).join('');
 cnt.textContent=(w?'찾은 말 ':'전체 ')+cur.length+'개';
 more.style.display=cur.length>shown?'block':'none'}

more.onclick=function(){shown+=PAGE;draw()};
save.plays=(save.plays||0)+1;persist();
if(save.last){q.value=save.last}
run();
window.__game={T:T,find:find,run:run,state:function(){return {shown:shown,found:cur.length}}};
})();
