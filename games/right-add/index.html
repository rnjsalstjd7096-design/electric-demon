<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>직각으로 더해!: 전력 삼각형 빗변 퀴즈</title>
<meta name="description" content="가로 막대(유효전력)와 세로 막대(무효전력)를 직각으로 붙인 빗변(피상전력) 길이를 세 개 중에서 고르는 퀴즈. 숫자는 모두 예시.">
<style>
html,body{margin:0;height:100%;background:#14161b;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;font-size:20px}
#app{position:relative;margin:0 auto;max-width:480px;height:100%;display:flex;flex-direction:column;padding:8px 12px 10px;box-sizing:border-box}
#top{display:flex;align-items:center;justify-content:space-between;padding-left:44px;padding-right:56px;min-height:48px}
#top b{font-size:20px;white-space:nowrap}#stat{white-space:nowrap;font-size:20px;font-weight:800;color:#ffd23f}
#sub{font-size:20px;line-height:1.35;color:#e8ebf2;text-align:center;margin:4px 0 8px;word-break:keep-all}
#board{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
.btn{flex:1;border:0;border-radius:14px;font-size:20px;font-weight:800;min-height:56px;font-family:inherit;cursor:pointer;touch-action:manipulation;background:#3b4252;color:#fff;box-shadow:0 4px 0 #1f232c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f232c}.btn.main{background:#ffd23f;color:#2b2000;box-shadow:0 4px 0 #a98400}
#mute{position:absolute;top:8px;right:10px;width:48px;height:48px;border:0;border-radius:24px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;z-index:5}
#end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,11,16,.78);z-index:4;padding:16px;box-sizing:border-box}
#end.on{display:flex}
#card{width:100%;max-width:360px;background:#2b2f3a;border:3px solid #4a505f;border-radius:18px;padding:18px;box-sizing:border-box;text-align:center;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#endTitle{font-size:24px;font-weight:800;margin:0 0 6px}#endScore{font-size:52px;font-weight:900;line-height:1.1;color:#ffd23f}
#endSub{font-size:20px;color:#e8ebf2;margin:4px 0}#endBest{font-size:20px;font-weight:700;color:#9fe1ff;margin:0 0 10px}
#fact{font-size:20px;line-height:1.45;background:#1d2029;border-radius:12px;padding:10px 12px;margin:0 0 12px;text-align:left;word-break:keep-all}
.shake{animation:sk .3s}@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.sp{position:absolute;font-size:28px;animation:fl .8s ease-out forwards}@keyframes fl{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.6)}}
#bar{width:100%;text-align:center;min-height:56px;font-size:20px;font-weight:700;color:#9fe1ff;margin-top:6px;line-height:1.3;word-break:keep-all}

#cv{display:block;width:100%;flex:1;min-height:0}
#opts{flex:none;width:100%;display:flex;gap:10px;margin-top:6px}
#opts .btn{font-size:28px;min-height:72px}
#opts .btn.good{background:#3fd27a;color:#002b12;box-shadow:0 4px 0 #1f8a4a}
#opts .btn.no{background:#e0505a}
#hint{font-size:18px;color:#aeb4c2;text-align:center}

</style>
<meta name="description" content="노란 가로(유효 kW)와 파란 세로(무효 kvar) 막대를 직각으로 붙인 빗변(피상 kVA)을 세 보기 중 고르는 퀴즈. 그냥 더한 값은 함정. 하트 3개, 숫자는 모두 예시."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/right-add/"><meta property="og:title" content="직각으로 더해!: 전력 삼각형 빗변 퀴즈"><meta property="og:description" content="노란 가로(유효 kW)와 파란 세로(무효 kvar) 막대를 직각으로 붙인 빗변(피상 kVA)을 세 보기 중 고르는 퀴즈. 그냥 더한 값은 함정. 하트 3개, 숫자는 모두 예시."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="직각으로 더해!: 전력 삼각형 빗변 퀴즈",D="노란 가로(유효 kW)와 파란 세로(무효 kvar) 막대를 직각으로 붙인 빗변(피상 kVA)을 세 보기 중 고르는 퀴즈. 그냥 더한 값은 함정. 하트 3개, 숫자는 모두 예시.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/right-add/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div id="top"><b id="lv"></b><span id="stat"></span></div>
  <div id="sub"></div>
  <div id="board"></div>
  <div id="bar"></div>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <div id="fx"></div>
  <div id="end"><div id="card">
    <div id="endTitle"></div><div id="endScore"></div><div id="endSub"></div><div id="endBest"></div>
    <div id="fact"></div>
    <button class="btn main" id="again" style="width:100%">한 번 더</button>
  </div></div>
</div>
<script>
"use strict";
const KEY='right-add.save.v1';
const $=id=>document.getElementById(id);
let save={best:0,plays:0,fi:0};
try{const r=localStorage.getItem(KEY);if(r)save=Object.assign(save,JSON.parse(r));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
let muted=false,AC=null;
try{muted=localStorage.getItem(KEY+'.mute')==='1';}catch(e){}
function actx(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();}if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,t,v,when){if(muted)return;const a=actx();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;const s=a.currentTime+(when||0);g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d);}catch(e){}}
const sfx={tap(){tone(520,.07,'triangle',.1)},ok(){tone(660,.1,'triangle',.14);tone(880,.14,'triangle',.14,.09)},bad(){tone(180,.25,'sawtooth',.12)},
 done(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.08))},lose(){[330,262,196].forEach((f,i)=>tone(f,.28,'sawtooth',.1,i*.16))}};
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function burst(x,y,ch){const fx=$('fx'),r=fx.getBoundingClientRect();for(let i=0;i<5;i++){const s=document.createElement('div');s.className='sp';s.textContent=ch||'✨';s.style.left=(x-r.left-14+(Math.random()*60-30))+'px';s.style.top=(y-r.top-14+(Math.random()*30-15))+'px';fx.appendChild(s);setTimeout(()=>s.remove(),850);}}
function burstEl(el,ch){if(!el)return burst(innerWidth/2,innerHeight/3,ch);const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,ch);}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'.mute',muted?'1':'0');}catch(e){}if(!muted)sfx.tap();};
function showEnd(title,score,sub,best,isNew,fact){$('endTitle').textContent=title;$('endScore').textContent=score;$('endSub').textContent=sub;const b=$('endBest');b.textContent=best;b.style.color=isNew?'#ffd23f':'#9fe1ff';$('fact').innerHTML=fact;$('end').classList.add('on');}
function hideEnd(){$('end').classList.remove('on');}
function endGame(t,n,unit,extra,facts){over=true;save.plays++;const nb=n>save.best;const prev=save.best;if(nb)save.best=n;const f=facts[save.fi++%facts.length];persist();sfx.lose();
 const gap=nb?0:save.best-n;
 showEnd(t,n+unit,extra+(nb?'':' · 최고 기록까지 '+(gap+1)+unit+' (아깝다!)'),nb?'신기록! 이전 최고 '+prev+unit:'최고 '+save.best+unit,nb,'<b>'+f[0]+'</b> — '+f[1]);}
// 막대 길이 숫자는 모두 예시. 공식(피상² = 유효² + 무효²)은 FACTS.md 1번.
save.tot=save.tot||0;
const FACTS=[['그냥 더하면 안 된다','유효전력(W)과 무효전력(var)은 직각으로 더한다. 피상전력² = 유효전력² + 무효전력².'],
 ['단위가 셋','일하는 전기(유효)는 kW, 왔다 갔다 하는 전기(무효)는 kvar, 둘을 합친 겉보기 전기(피상)는 kVA.'],
 ['예: 12kW에 9kvar면?','√(144 + 81) = √225 = 15kVA. 그냥 더한 21이 아니다.'],
 ['역률 = 유효 ÷ 피상','12kW·15kVA면 역률 0.8. 피상전력 중에 일하는 몫이 얼마인지다.'],
 ['변압기 용량은 kVA','변압기·발전기 용량은 kW가 아니라 kVA로 적는다.']];
const BASE=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[9,40,41],[12,35,37]];
let score,life,over,q,locked,streak;
function lvl(){return score<5?1:score<12?2:3}
function newQ(){
 const L=lvl();let pool=L===1?[[3,4,5]]:L===2?BASE.slice(0,3):BASE;
 const t=pool[rnd(pool.length)];const kmax=L===1?3:L===2?2:Math.max(1,Math.floor(60/t[2]));
 const k=1+rnd(kmax);let a=t[0]*k,b=t[1]*k;const c=t[2]*k;if(rnd(2))[a,b]=[b,a];
 const set=new Set([c,a+b]);let guard=0;
 while(set.size<3&&guard++<50){const d=L===1?c+(rnd(2)?-1:1)*(2+rnd(3)):c+(rnd(2)?-1:1)*(1+rnd(L===2?3:2));if(d>Math.max(a,b)&&d!==a+b)set.add(d);}
 if(set.size<3)set.add(c+1);
 q={a,b,c,opts:shuffle([...set])};locked=false;render();
}
function render(){
 $('lv').textContent=score+'문제';$('stat').textContent='❤'.repeat(life)+'🤍'.repeat(3-life);
 $('sub').textContent='직각으로 붙인 빗변 길이를 골라라';
 const b=$('board');if(!$('cv')){b.innerHTML='<canvas id="cv"></canvas><div id="hint">숫자는 모두 예시 · 단위 kW · kvar · kVA</div><div id="opts"></div>';}
 const o=$('opts');o.innerHTML='';q.opts.forEach((v,i)=>{const e=document.createElement('button');e.className='btn';e.id='o'+i;e.textContent=v;e.onclick=()=>pick(i,e);o.appendChild(e);});
 draw(false);
}
function draw(show){
 const cv=$('cv');const r=cv.getBoundingClientRect();const dpr=devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
 const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);const W=r.width,H=r.height;g.clearRect(0,0,W,H);
 const pad=48;const s=Math.min((W-40-110)/q.a,(H-pad*2)/q.b);const x0=(W-110-q.a*s)/2+20,y0=H-pad+10;const x1=x0+q.a*s,y1=y0-q.b*s;
 g.lineCap='round';g.lineWidth=14;
 g.strokeStyle='#ffd23f';g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y0);g.stroke();
 g.strokeStyle='#9fe1ff';g.beginPath();g.moveTo(x1,y0);g.lineTo(x1,y1);g.stroke();
 g.setLineDash(show?[]:[10,10]);g.lineWidth=show?10:6;g.strokeStyle=show?'#3fd27a':'#e8ebf2';g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();g.setLineDash([]);
 g.lineWidth=3;g.strokeStyle='#fff';g.strokeRect(x1-18,y0-18,18,18);
 g.font='800 22px system-ui,sans-serif';g.textAlign='center';g.fillStyle='#ffd23f';g.fillText('유효 '+q.a+'kW',(x0+x1)/2,y0+34);
 g.save();g.fillStyle='#9fe1ff';g.textAlign='left';const ty=(y0+y1)/2;g.fillText('무효',x1+14,ty-12);g.fillText(q.b+'kvar',x1+14,ty+14);g.restore();
 g.fillStyle=show?'#3fd27a':'#fff';g.font='900 26px system-ui,sans-serif';const mx=(x0+x1)/2-30,my=(y0+y1)/2-14;g.fillText(show?q.c+'kVA':'? kVA',mx,my);
}
function pick(i,el){if(over||locked)return;actx();locked=true;const v=q.opts[i];const good=$('o'+q.opts.indexOf(q.c));
 if(v===q.c){score++;save.tot++;streak++;el.classList.add('good');draw(true);tone(520+Math.min(streak,8)*50,.12,'triangle',.14);sfx.ok();vib(20);burstEl(el,streak>=5?'🌟':'⚡');
  $('bar').textContent='√('+q.a+'² + '+q.b+'²) = '+q.c+(streak>=3?' · '+streak+'연속!':'');setTimeout(newQ,1100);}
 else{life--;streak=0;el.classList.add('no','shake');good.classList.add('good');draw(true);sfx.bad();vib([40,40,40]);
  $('bar').textContent=(v===q.a+q.b?'그냥 더하면 '+(q.a+q.b)+', 직각이면 '+q.c:v+'가 아니라 '+q.c);$('stat').textContent='❤'.repeat(life)+'🤍'.repeat(3-life);
  if(life<=0){over=true;setTimeout(()=>endGame('하트를 다 썼다',score,'문제','틀린 3번 전까지 맞힘 · 누적 '+save.tot+'문제',FACTS),1300);}else setTimeout(newQ,1700);}
}
function start(){score=0;life=3;over=false;streak=0;hideEnd();$('board').innerHTML='';$('bar').textContent='지금까지 맞힌 빗변 '+save.tot+'개';newQ();}
$('again').onclick=()=>{sfx.tap();start();};
addEventListener('resize',()=>{if(q)draw(false);});
window.__game={get state(){return {score,life,over,q}},sel(){if(over||locked)return null;return '#o'+q.opts.indexOf(q.c)},wrong(){if(over||locked)return null;return '#o'+q.opts.findIndex(v=>v!==q.c)}};
start();

</script>
</body>
</html>
