<button id="mute" aria-label="소리">🔊</button>
<div id="app"></div>
<script>
(function(){
var KEY='where-outlet.save.v1';
var save={best:0,plays:0};
try{var r=localStorage.getItem(KEY);if(r)save=Object.assign(save,JSON.parse(r)||{})}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
var muted=false,ac=null;
function beep(f,d,t){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}

document.getElementById('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊'};
// 3장면, 장면마다 틀린 곳 1개(w). 설명은 일반 상식 수준만(FACTS.md 참고).
var S=[
 {t:'🧺 세탁기 옆 콘센트',q:'그림 1: 세탁기를 쓰는 베란다 콘센트예요. 틀린 곳은?',
  p:[{e:'🔌',n:'접지 단자가 있는 콘센트에 꽂음'},{e:'✂️',n:'세탁기 접지선(초록·노랑)을 잘라서 치워 둠',w:1},{e:'💧',n:'세탁기 옆에 물이 튀는 곳'}],
  x:'접지선은 전기가 새어 나왔을 때 사람 대신 땅으로 길을 내 주는 선이에요. 잘라 버리면 기계 겉이 전기가 흐르는 채로 남을 수 있어요.'},
 {t:'🛁 욕실 앞 콘센트',q:'그림 2: 드라이어를 꽂는 욕실 앞 콘센트예요. 틀린 곳은?',
  p:[{e:'🧴',n:'젖은 손으로 플러그를 잡음',w:1},{e:'🔌',n:'플러그가 끝까지 꽂혀 있음'},{e:'🧹',n:'콘센트 주변이 깨끗함'}],
  x:'물은 전기를 통하게 해서 감전 위험을 키워요. 젖은 손으로는 플러그를 만지지 말고, 손을 닦은 뒤에 꽂고 빼요.'},
 {t:'🔧 가스·수도 배관 옆',q:'그림 3: 접지선을 연결하려는 사람이 있어요. 틀린 곳은?',
  p:[{e:'⛽',n:'접지선을 가스 배관에 감아 둠',w:1},{e:'🟢',n:'접지선 색이 초록·노랑'},{e:'🪛',n:'단자에 나사로 단단히 조임'}],
  x:'가스 배관은 접지선을 연결하는 곳으로 쓰면 안 돼요. 접지는 전기 설비 기준에 맞는 접지 단자나 접지극에 연결하고, 모르면 전기 전문가에게 맡겨요.'}
];
var app=document.getElementById('app'),idx=0,score=0;
function home(){idx=0;score=0;
 app.innerHTML='<div class="big">🔌🔍</div><h1>이 콘센트 어디가 문제?</h1><p class="sub">그림 3장을 보고 틀린 곳 하나씩 골라요. 20초면 끝나요.</p><div class="sp"></div><button class="go" id="st">시작하기</button><p class="sub" style="font-size:18px">최고 기록 '+(save.best||0)+' / 3 · '+(save.plays||0)+'번 했어요</p>';
 document.getElementById('st').onclick=function(){beep(660,.12);scene()};}
function scene(){var s=S[idx];
 app.innerHTML='<div class="bar"><span>그림 '+(idx+1)+' / 3</span><span>맞힌 개수 '+score+'</span></div><div class="scene"><div class="t">'+s.t+'</div><div class="q">'+s.q+'</div>'+s.p.map(function(o,i){return '<button data-i="'+i+'"><span class="e">'+o.e+'</span><span>'+o.n+'</span></button>'}).join('')+'</div><div id="fb"></div><div class="sp"></div>';
 [].forEach.call(app.querySelectorAll('button[data-i]'),function(b){b.onclick=function(){pick(+b.dataset.i)}});}
function pick(i){var s=S[idx],right=!!s.p[i].w;
 [].forEach.call(app.querySelectorAll('button[data-i]'),function(b){var k=+b.dataset.i;b.disabled=true;if(s.p[k].w)b.classList.add('ok');else if(k===i)b.classList.add('bad')});
 if(right){score++;beep(880,.2);vib(30)}else{beep(220,.3,'square');vib([40,40,40])}
 var last=idx===S.length-1;
 document.getElementById('fb').innerHTML='<div class="exp flash"><b>'+(right?'⭕ 맞아요!':'❌ 아쉬워요')+'</b><br>'+s.x+'</div><button class="go" id="nx" style="margin-top:12px">'+(last?'결과 보기':'다음 그림')+'</button>';

 window.__game.last=right;}

 document.getElementById('again').onclick=home;}
