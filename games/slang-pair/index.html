<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>뺀찌=펜치!: 현장말 짝 모으기 퍼즐</title>
<meta name="description" content="줄 맨 위 카드를 눌러 아래 칸에 담고, 현장말과 표준말 짝이 모이면 사라지는 퍼즐.">
<style>
html,body{margin:0;height:100%;background:#14161b;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;font-size:20px}
#app{position:relative;margin:0 auto;max-width:480px;height:100%;display:flex;flex-direction:column;padding:8px 12px 10px;box-sizing:border-box}
#top{display:flex;align-items:center;justify-content:space-between;padding-left:44px;padding-right:56px;min-height:48px}
#top b{font-size:20px;white-space:nowrap}#stat{white-space:nowrap;font-size:20px;font-weight:800;color:#ffd23f}
#sub{font-size:20px;line-height:1.35;color:#e8ebf2;text-align:center;margin:4px 0 8px;word-break:keep-all}
#board{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
.btn{flex:1;border:0;border-radius:14px;font-size:20px;font-weight:800;min-height:56px;font-family:inherit;cursor:pointer;touch-action:manipulation;background:#3b4252;color:#fff;box-shadow:0 4px 0 #1f232c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f232c}.btn.main{background:#ffd23f;color:#2b2000;box-shadow:0 4px 0 #a98400}
#mute{position:absolute;top:8px;right:10px;width:48px;height:48px;border:0;border-radius:24px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;z-index:5}
#end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,11,16,.78);z-index:4;padding:16px;box-sizing:border-box}
#end.on{display:flex}
#card{width:100%;max-width:360px;background:#2b2f3a;border:3px solid #4a505f;border-radius:18px;padding:18px;box-sizing:border-box;text-align:center;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#endTitle{font-size:24px;font-weight:800;margin:0 0 6px}#endScore{font-size:52px;font-weight:900;line-height:1.1;color:#ffd23f}
#endSub{font-size:20px;color:#e8ebf2;margin:4px 0}#endBest{font-size:20px;font-weight:700;color:#9fe1ff;margin:0 0 10px}
#fact{font-size:20px;line-height:1.45;background:#1d2029;border-radius:12px;padding:10px 12px;margin:0 0 12px;text-align:left;word-break:keep-all}
.shake{animation:sk .3s}@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.sp{position:absolute;font-size:28px;animation:fl .8s ease-out forwards}@keyframes fl{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.6)}}
#bar{width:100%;text-align:center;min-height:56px;font-size:20px;font-weight:700;color:#9fe1ff;margin-top:6px;line-height:1.3;word-break:keep-all}
.nb{background:repeating-linear-gradient(45deg,#2f9e44 0 9px,#f2d21b 9px 18px);color:#111;text-shadow:0 1px 0 #fff8}
.bl{background:#2f6fdc;color:#fff}

.tg{display:inline-block;padding:0 6px;border-radius:6px;font-weight:800}
.k0{background:#ffd23f;color:#2b2000}.k1{background:#2f6fdc;color:#fff}
#cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:400px;flex:1;min-height:0;align-items:start}
.col{display:flex;flex-direction:column}
.cd{border:3px solid #0006;border-radius:12px;font-family:inherit;font-size:18px;font-weight:800;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere;padding:4px 2px;min-height:40px;margin-bottom:-8px;box-shadow:0 3px 0 #0006;cursor:default}
.cd:disabled{opacity:1;filter:brightness(.55);color:inherit}
.cd.k0:disabled{color:#2b2000}.cd.k1:disabled{color:#fff}
.cd.top{min-height:72px;margin-bottom:0;border-color:#fff;cursor:pointer;touch-action:manipulation;box-shadow:0 0 10px #ffd23f88,0 4px 0 #0007}
.cd.top:active{transform:scale(.95)}
.empty{height:72px;border:2px dashed #2c3140;border-radius:12px}
#tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;width:100%;max-width:400px;background:#1d2029;border:3px solid #4a505f;border-radius:14px;padding:6px;box-sizing:border-box;margin-top:8px}
.slot{min-height:60px;background:#12141a;border-radius:8px;display:flex}
.slot span{flex:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;line-height:1.1;text-align:center;word-break:keep-all;overflow-wrap:anywhere;padding:2px}

</style>
<meta name="description" content="줄 맨 위 카드(현장말·표준말)를 눌러 아래 5칸에 담고, 뺀찌-펜치처럼 같은 공구를 가리키는 짝이 모이면 사라지는 퍼즐. 칸이 꽉 차면 끝"><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/slang-pair/"><meta property="og:title" content="뺀찌=펜치!: 현장말 짝 모으기 퍼즐"><meta property="og:description" content="줄 맨 위 카드(현장말·표준말)를 눌러 아래 5칸에 담고, 뺀찌-펜치처럼 같은 공구를 가리키는 짝이 모이면 사라지는 퍼즐. 칸이 꽉 차면 끝"><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;top:max(8px,env(safe-area-inset-top));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="뺀찌=펜치!: 현장말 짝 모으기 퍼즐",D="줄 맨 위 카드(현장말·표준말)를 눌러 아래 5칸에 담고, 뺀찌-펜치처럼 같은 공구를 가리키는 짝이 모이면 사라지는 퍼즐. 칸이 꽉 차면 끝",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/slang-pair/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div id="top"><b id="lv"></b><span id="stat"></span></div>
  <div id="sub"></div>
  <div id="board"></div>
  <div id="bar"></div>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <div id="fx"></div>
  <div id="end"><div id="card">
    <div id="endTitle"></div><div id="endScore"></div><div id="endSub"></div><div id="endBest"></div>
    <div id="fact"></div>
    <button class="btn main" id="again" style="width:100%">한 번 더</button>
  </div></div>
</div>
<script>
const KEY='slang-pair.save.v1';
"use strict";
const $=id=>document.getElementById(id);
let save={best:0,plays:0,fi:0};
try{const r=localStorage.getItem(KEY);if(r)save=Object.assign(save,JSON.parse(r));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
let muted=false,AC=null;
try{muted=localStorage.getItem(KEY+'.mute')==='1';}catch(e){}
function actx(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();}if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,t,v,when){if(muted)return;const a=actx();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;const s=a.currentTime+(when||0);g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d);}catch(e){}}
const sfx={tap(){tone(520,.07,'triangle',.1)},ok(){tone(660,.1,'triangle',.14);tone(880,.14,'triangle',.14,.09)},bad(){tone(180,.25,'sawtooth',.12)},
 done(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.08))},lose(){[330,262,196].forEach((f,i)=>tone(f,.28,'sawtooth',.1,i*.16))}};
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function burst(x,y,ch){const fx=$('fx'),r=fx.getBoundingClientRect();for(let i=0;i<5;i++){const s=document.createElement('div');s.className='sp';s.textContent=ch||'✨';s.style.left=(x-r.left-14+(Math.random()*60-30))+'px';s.style.top=(y-r.top-14+(Math.random()*30-15))+'px';fx.appendChild(s);setTimeout(()=>s.remove(),850);}}
function burstEl(el,ch){if(!el)return burst(innerWidth/2,innerHeight/3,ch);const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,ch);}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'.mute',muted?'1':'0');}catch(e){}if(!muted)sfx.tap();};
function showEnd(title,score,sub,best,isNew,fact){$('endTitle').textContent=title;$('endScore').textContent=score;$('endSub').textContent=sub;const b=$('endBest');b.textContent=best;b.style.color=isNew?'#ffd23f':'#9fe1ff';$('fact').innerHTML=fact;$('end').classList.add('on');}
function hideEnd(){$('end').classList.remove('on');}
function endGame(t,n,unit,extra,facts){over=true;save.plays++;const nb=n>save.best;const prev=save.best;if(nb)save.best=n;const f=facts[save.fi++%facts.length];persist();sfx.lose();
 const gap=nb?0:save.best-n;
 showEnd(t,n+unit,extra+(nb?'':' · 최고 기록까지 '+(gap+1)+unit+' (아깝다!)'),nb?'신기록! 이전 최고 '+prev+unit:'최고 '+save.best+unit,nb,'<b>'+f[0]+'</b> — '+f[1]);}


const PAIRS=[["뺀찌", "펜치"], ["니빠", "니퍼"], ["도라이바", "드라이버"], ["압착 단자", "터미널"], ["와고", "전선 커넥터"], ["테스터", "멀티미터"], ["후크 미터", "클램프 미터"], ["메거", "절연 저항계"], ["함마 드릴", "해머 드릴"], ["기리", "드릴 날"], ["몽키", "몽키 스패너"], ["빠루", "쇠지렛대"], ["함마", "해머"], ["먹통", "먹줄"], ["요비선", "피시 테이프"], ["전선관", "파이프"], ["자바라", "가요 전선관"], ["박스", "아웃렛 박스"], ["앙카", "앵커"], ["사라", "접시머리 나사"], ["비스", "나사"]];
const FACTS=[
 ['뺀찌','「뺀찌 줘」 하면 펜치입니다.'],
 ['메거','「메거 쳐 봐」는 절연 저항 재 보라는 말입니다.'],
 ['와고','「와고로 물려」는 전선 커넥터로 연결하라는 말입니다.'],
 ['토크 렌치','차단기 단자는 정해진 힘으로 조여야 합니다.']];
const TRAY=5,COLS=4;
let cols,tray,score,level,over,leftPairs;
function makeLevel(l){const np=Math.min(12,2+l*2);const ps=shuffle(PAIRS.map((_,i)=>i)).slice(0,np);
 let cards=[];ps.forEach(p=>{cards.push({p,k:0},{p,k:1})});
 for(let tries=0;tries<50;tries++){shuffle(cards);cols=Array.from({length:COLS},()=>[]);cards.forEach((c,i)=>cols[i%COLS].push(c));
  const tops=cols.map(c=>c[c.length-1]).filter(Boolean);
  if(l>1||tops.some(a=>tops.some(b=>a!==b&&a.p===b.p)))break}
 leftPairs=np;}
function label(c){return PAIRS[c.p][c.k]}
function render(msg){
 $('lv').textContent='뺀찌=펜치!';$('stat').textContent='판'+level+' · '+score+'점';
 $('sub').innerHTML='<span class="tg k0">현장말</span>과 <span class="tg k1">표준말</span> 짝을 아래 칸에 모아요';
 let h='<div id="cols">';cols.forEach((c,ci)=>{h+='<div class="col">';
  c.forEach((x,i)=>{const top=i===c.length-1;h+='<button class="cd k'+x.k+(top?' top':'')+'" data-c="'+ci+'"'+(top?'':' disabled')+'>'+label(x)+'</button>'});
  if(!c.length)h+='<div class="empty"></div>';h+='</div>'});
 h+='</div><div id="tray">';for(let i=0;i<TRAY;i++){const t=tray[i];h+='<div class="slot">'+(t?'<span class="k'+t.k+'">'+label(t)+'</span>':'')+'</div>'}
 h+='</div>';$('board').innerHTML=h;$('bar').textContent=msg||('남은 짝 '+leftPairs+'개 · 칸 '+tray.length+'/'+TRAY);
 document.querySelectorAll('.cd.top').forEach(el=>el.onclick=()=>take(+el.dataset.c,el));}
function take(ci,el){if(over)return;const c=cols[ci];if(!c||!c.length)return;const x=c.pop();sfx.tap();
 const m=tray.findIndex(t=>t.p===x.p);
 if(m>=0){tray.splice(m,1);score++;leftPairs--;sfx.ok();vib(25);if(el)burstEl(el,'⚡');
  const pr=PAIRS[x.p];
  if(leftPairs===0){sfx.done();burst(innerWidth/2,innerHeight/3,'🌟');score+=level;level++;tray=[];makeLevel(level);render('⚡ 판 클리어! 판'+level+' 시작');return}
  render('딱 맞음! '+pr[0]+' = '+pr[1]);return}
 tray.push(x);
 if(tray.length>=TRAY){render('');endGame('칸이 꽉 찼어요',score,'점','판 '+level+' · 남은 짝 '+leftPairs+'개',FACTS);return}
 render();}
function start(){hideEnd();over=false;score=0;level=1;tray=[];makeLevel(1);render('같은 공구를 가리키는 두 말을 모아요');}
$('again').onclick=()=>{sfx.tap();start();};
window.__game={get state(){return {cols:cols.map(c=>c.map(x=>x.p)),tray:tray.map(t=>t.p),score,level,over,leftPairs}},start,take:i=>take(i,null),
 hint(){const tops=cols.map((c,i)=>c.length?{i,x:c[c.length-1]}:null).filter(Boolean);if(!tops.length)return '';
  let t=tops.find(o=>tray.some(y=>y.p===o.x.p));
  if(!t)t=tops.find(o=>tops.some(q=>q!==o&&q.x.p===o.x.p));
  if(!t||Math.random()<.1)t=tops[rnd(tops.length)];return '.cd.top[data-c="'+t.i+'"]'}};
start();

</script>
</body>
