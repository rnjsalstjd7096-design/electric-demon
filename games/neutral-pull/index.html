<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>평소엔 파랑!: 누전 때 녹황 빼기 퍼즐</title>
<meta name="description" content="표시된 색 선 중 앞이 빈 것을 뽑아 판을 비우는 퍼즐.">
<style>
html,body{margin:0;height:100%;background:#14161b;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;font-size:20px}
#app{position:relative;margin:0 auto;max-width:480px;height:100%;display:flex;flex-direction:column;padding:8px 12px 10px;box-sizing:border-box}
#top{display:flex;align-items:center;justify-content:space-between;padding-left:44px;padding-right:56px;min-height:48px}
#top b{font-size:20px;white-space:nowrap}#stat{white-space:nowrap;font-size:20px;font-weight:800;color:#ffd23f}
#sub{font-size:20px;line-height:1.35;color:#e8ebf2;text-align:center;margin:4px 0 8px;word-break:keep-all}
#board{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
.btn{flex:1;border:0;border-radius:14px;font-size:20px;font-weight:800;min-height:56px;font-family:inherit;cursor:pointer;touch-action:manipulation;background:#3b4252;color:#fff;box-shadow:0 4px 0 #1f232c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f232c}.btn.main{background:#ffd23f;color:#2b2000;box-shadow:0 4px 0 #a98400}
#mute{position:absolute;top:8px;right:10px;width:48px;height:48px;border:0;border-radius:24px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;z-index:5}
#end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,11,16,.78);z-index:4;padding:16px;box-sizing:border-box}
#end.on{display:flex}
#card{width:100%;max-width:360px;background:#2b2f3a;border:3px solid #4a505f;border-radius:18px;padding:18px;box-sizing:border-box;text-align:center;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#endTitle{font-size:24px;font-weight:800;margin:0 0 6px}#endScore{font-size:52px;font-weight:900;line-height:1.1;color:#ffd23f}
#endSub{font-size:20px;color:#e8ebf2;margin:4px 0}#endBest{font-size:20px;font-weight:700;color:#9fe1ff;margin:0 0 10px}
#fact{font-size:20px;line-height:1.45;background:#1d2029;border-radius:12px;padding:10px 12px;margin:0 0 12px;text-align:left;word-break:keep-all}
.shake{animation:sk .3s}@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.sp{position:absolute;font-size:28px;animation:fl .8s ease-out forwards}@keyframes fl{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.6)}}
#bar{width:100%;text-align:center;min-height:56px;font-size:20px;font-weight:700;color:#9fe1ff;margin-top:6px;line-height:1.3;word-break:keep-all}
.nb{background:repeating-linear-gradient(45deg,#2f9e44 0 9px,#f2d21b 9px 18px);color:#111;text-shadow:0 1px 0 #fff8}
.bl{background:#2f6fdc;color:#fff}

#grid{display:grid;gap:6px;width:100%;max-width:372px;margin-top:6px}
.cl{aspect-ratio:1/1;border-radius:12px;background:#1a1d26;border:2px dashed #2c3140;box-sizing:border-box}
.tl{aspect-ratio:1/1;border:4px solid #fff5;border-radius:12px;font-family:inherit;font-weight:900;font-size:34px;line-height:1;display:flex;align-items:center;justify-content:center;touch-action:manipulation;cursor:pointer;padding:0;color:#fff;text-shadow:0 1px 2px #0008;box-sizing:border-box}
.tl.free{border-color:#fff;box-shadow:0 0 10px #ffd23f}
.tl:active{transform:scale(.94)}
#mode{width:100%;max-width:372px;border-radius:14px;padding:8px;text-align:center;font-size:22px;font-weight:900;margin-top:2px;box-sizing:border-box;word-break:keep-all}
</style>
<meta name="description" content="표시(평소=파랑·누전=녹황)에 맞는 색 선 중 앞이 빈 것을 뽑아 판을 비우는 퍼즐"><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/neutral-pull/"><meta property="og:title" content="평소엔 파랑!: 누전 때 녹황 빼기 퍼즐"><meta property="og:description" content="표시(평소=파랑·누전=녹황)에 맞는 색 선 중 앞이 빈 것을 뽑아 판을 비우는 퍼즐"><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;top:max(8px,env(safe-area-inset-top));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="평소엔 파랑!: 누전 때 녹황 빼기 퍼즐",D="표시(평소=파랑·누전=녹황)에 맞는 색 선 중 앞이 빈 것을 뽑아 판을 비우는 퍼즐",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/neutral-pull/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div id="top"><b id="lv"></b><span id="stat"></span></div>
  <div id="sub"></div>
  <div id="board"></div>
  <div id="bar"></div>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <div id="fx"></div>
  <div id="end"><div id="card">
    <div id="endTitle"></div><div id="endScore"></div><div id="endSub"></div><div id="endBest"></div>
    <div id="fact"></div>
    <button class="btn main" id="again" style="width:100%">한 번 더</button>
  </div></div>
</div>
<script>
const KEY='neutral-pull.save.v1';
"use strict";
const $=id=>document.getElementById(id);
let save={best:0,plays:0,fi:0};
try{const r=localStorage.getItem(KEY);if(r)save=Object.assign(save,JSON.parse(r));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
let muted=false,AC=null;
try{muted=localStorage.getItem(KEY+'.mute')==='1';}catch(e){}
function actx(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();}if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,t,v,when){if(muted)return;const a=actx();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;const s=a.currentTime+(when||0);g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d);}catch(e){}}
const sfx={tap(){tone(520,.07,'triangle',.1)},ok(){tone(660,.1,'triangle',.14);tone(880,.14,'triangle',.14,.09)},bad(){tone(180,.25,'sawtooth',.12)},
 done(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.08))},lose(){[330,262,196].forEach((f,i)=>tone(f,.28,'sawtooth',.1,i*.16))}};
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function burst(x,y,ch){const fx=$('fx'),r=fx.getBoundingClientRect();for(let i=0;i<5;i++){const s=document.createElement('div');s.className='sp';s.textContent=ch||'✨';s.style.left=(x-r.left-14+(Math.random()*60-30))+'px';s.style.top=(y-r.top-14+(Math.random()*30-15))+'px';fx.appendChild(s);setTimeout(()=>s.remove(),850);}}
function burstEl(el,ch){if(!el)return burst(innerWidth/2,innerHeight/3,ch);const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,ch);}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'.mute',muted?'1':'0');}catch(e){}if(!muted)sfx.tap();};
function showEnd(title,score,sub,best,isNew,fact){$('endTitle').textContent=title;$('endScore').textContent=score;$('endSub').textContent=sub;const b=$('endBest');b.textContent=best;b.style.color=isNew?'#ffd23f':'#9fe1ff';$('fact').innerHTML=fact;$('end').classList.add('on');}
function hideEnd(){$('end').classList.remove('on');}
function endGame(t,n,unit,extra,facts){over=true;save.plays++;const nb=n>save.best;const prev=save.best;if(nb)save.best=n;const f=facts[save.fi++%facts.length];persist();sfx.lose();
 const gap=nb?0:save.best-n;
 showEnd(t,n+unit,extra+(nb?'':' · 최고 기록까지 '+(gap+1)+unit+' (아깝다!)'),nb?'신기록! 이전 최고 '+prev+unit:'최고 '+save.best+unit,nb,'<b>'+f[0]+'</b> — '+f[1]);}


const DIRS=[[-1,0,'▲'],[1,0,'▼'],[0,-1,'◀'],[0,1,'▶']];
let N,grid,lives,score,level,over,mode;
function sizeFor(l){return Math.min(6,3+Math.floor((l-1)/2))}
function countFor(l,n){return Math.min(n*n-2,Math.round(n*n*(l<=1?.55:.62))+(l>2?1:0))}
function pathFree(g,r,c,d){let y=r+DIRS[d][0],x=c+DIRS[d][1];while(y>=0&&y<N&&x>=0&&x<N){if(g[y][x])return false;y+=DIRS[d][0];x+=DIRS[d][1];}return true}
function solvable(g){const h=g.map(r=>r.slice());let moved=true;while(moved){moved=false;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=h[r][c];if(t&&pathFree(h,r,c,t.d)){h[r][c]=null;moved=true}}}
 return h.every(r=>r.every(t=>!t))}
function makeBoard(l){N=sizeFor(l);const k=countFor(l,N);
 for(let tries=0;tries<400;tries++){const g=Array.from({length:N},()=>Array(N).fill(null));const cells=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)cells.push([r,c]);shuffle(cells);
  for(let i=0;i<k;i++){const [r,c]=cells[i];g[r][c]={d:rnd(4),col:rnd(4),k:rnd(2)}}
  if(solvable(g))return g}
 const g=Array.from({length:N},()=>Array(N).fill(null));g[0][0]={d:0,col:0,k:0};g[1][1]={d:3,col:1,k:1};return g}
function freeList(){const a=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=grid[r][c];if(t&&pathFree(grid,r,c,t.d))a.push([r,c,t])}return a}
function left(){let n=0;grid.forEach(r=>r.forEach(t=>{if(t)n++}));return n}

const TITLE='파랑·녹황';
const FACTS=[
 ['평소','평소엔 중성선(파랑)이 전류가 돌아오는 길이에요.'],
 ['누전','고장 나서 전기가 샐 때 빠지는 비상 길은 접지선(녹색-노란색)이에요.'],
 ['두 길','두 길은 맡은 일이 달라서 이름도 색도 달라요.'],
 ['색은 약속','전선 색은 한국전기설비규정(KEC)이 정한 약속이에요. 색만 믿지 말고 검전기로 꼭 확인하세요.']];
function pickMode(){const f=freeList();const hasB=f.some(x=>x[2].k===0),hasP=f.some(x=>x[2].k===1);
 if(hasB&&hasP)mode=Math.random()<.5?0:1;else mode=hasB?0:1;}
function startBoard(){grid=makeBoard(level);pickMode();render(level===1?'위 표시와 같은 색 선 중 앞이 빈 것을 눌러요':'');}
function start(){hideEnd();over=false;score=0;level=1;lives=3;startBoard();}
function render(msg){
 $('lv').textContent=TITLE;$('stat').textContent='❤'.repeat(lives)+' 판'+level;
 $('sub').textContent='표시된 색 선 중, 화살표 앞이 빈 것을 뽑아요';
 const m=mode===0?'<div id="mode" class="bl">☀️ 평소예요 → 파랑 선(중성선)을 뽑아요</div>':'<div id="mode" class="nb">⚡ 누전이에요 → 녹황 선(접지선)을 뽑아요</div>';
 let h=m+'<div id="grid" style="grid-template-columns:repeat('+N+',1fr)">';
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=grid[r][c];
  if(!t){h+='<div class="cl"></div>';continue}
  h+='<button class="tl '+(t.k===0?'bl':'nb')+'" data-r="'+r+'" data-c="'+c+'">'+DIRS[t.d][2]+'</button>'}
 h+='</div>';$('board').innerHTML=h;$('bar').textContent=msg||'남은 선 '+left()+'개';
 document.querySelectorAll('.tl').forEach(el=>el.onclick=()=>pull(+el.dataset.r,+el.dataset.c,el));}
function wrong(msg){lives--;sfx.bad();vib([60,40,60]);$('board').classList.add('shake');setTimeout(()=>$('board').classList.remove('shake'),320);
 if(lives<=0){render('');endGame('❤이 다 떨어졌어요',score,'점','판 '+level+'까지 왔어요 · 남은 선 '+left()+'개',FACTS);return}
 render(msg)}
function pull(r,c,el){if(over)return;const t=grid[r][c];if(!t)return;
 if(t.k!==mode){wrong(mode===0?'지금은 평소예요! 파랑 선만 뽑아요':'지금은 누전이에요! 녹황 선만 뽑아요');return}
 if(!pathFree(grid,r,c,t.d)){wrong('앞이 막혀 있어요! 앞이 빈 것부터');return}
 grid[r][c]=null;score++;sfx.ok();vib(20);burstEl(el,mode===0?'🔵':'🟩');
 if(left()===0){sfx.done();burst(innerWidth/2,innerHeight/4,'🌟');score+=level;level++;if(lives<3)lives++;startBoard();$('bar').textContent='⚡ 판 클리어! 다음 판';return}
 pickMode();render(mode===0?'쏙! 이제 평소예요':'쏙! 누전이 났어요');}
$('again').onclick=()=>{sfx.tap();start();};
window.__game={get state(){return {grid:grid.map(r=>r.map(t=>t?{d:t.d,k:t.k}:null)),N,lives,score,level,over,mode}},start,pull:(r,c)=>pull(r,c,null),free:()=>freeList().map(x=>[x[0],x[1],x[2].k])};
start();

</script>
</body>
</html>
