<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>같은 물줄기!: 옴의 법칙 바꿔 잇기</title>
<style>
:root{--bg:#0e1b1f;--ink:#fff;--sub:#cfe7ea;--ok:#46e07a;--y:#ffd23a;--w:#3fb4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
#app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:8px 10px 64px}
.top{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:4px 2px}
.rule{font-size:20px;color:var(--sub);text-align:center;margin:4px 0 2px;font-weight:700}
.sub2{font-size:17px;color:#9fc3c8;text-align:center;margin:0 0 6px}
#tankbar{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800;margin-bottom:6px}
#tank{flex:1;height:22px;border-radius:11px;background:#1b3036;overflow:hidden;border:2px solid #2f5560}#tf{height:100%;background:var(--w);transition:width .3s}
#grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%;margin:0 auto}
.t{aspect-ratio:1/0.92;border-radius:12px;background:#203a42;border:3px solid #33606b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .15s}
.t .n{font-size:19px;font-weight:900;line-height:1.05;text-align:center}
.t .n small{font-size:17px;color:#e8f08a}
.t .s{width:80%;border-radius:4px;background:var(--w)}
.t.sel{border-color:var(--y);transform:scale(1.08);box-shadow:0 0 12px var(--y)}
.t.pop{animation:pop .32s forwards}@keyframes pop{50%{transform:scale(1.25);background:#bfe9ff}100%{transform:scale(0);opacity:0}}
.t.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#hint{font-size:18px;color:var(--sub);text-align:center;margin-top:8px;min-height:46px}
#over{position:fixed;inset:0;background:rgba(5,10,12,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.box{max-width:400px;width:100%;background:#1b3036;border-radius:18px;padding:20px;text-align:center;font-size:21px;line-height:1.5}
.box h2{margin:0 0 6px;font-size:30px}.big{font-size:42px;font-weight:900;color:var(--y)}
.tip{background:#0a1416;border-radius:12px;padding:10px;margin:12px 0;font-size:19px;color:var(--sub);text-align:left}
#again{width:100%;min-height:64px;border:0;border-radius:14px;background:var(--ok);color:#052;font-size:26px;font-weight:900}
#toast{position:fixed;left:50%;top:40%;white-space:nowrap;transform:translate(-50%,-50%) scale(.6);font-size:30px;font-weight:900;color:var(--y);opacity:0;transition:.3s;pointer-events:none;text-shadow:0 2px 8px #000;z-index:4}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.spark{position:fixed;font-size:24px;pointer-events:none;z-index:4;transition:transform .7s ease-out,opacity .7s}
</style><meta name="description" content="전압·저항이 적힌 카드를 옆 칸과 바꿔, 전류(전압 ÷ 저항)가 같은 카드 3장을 한 줄로 잇는 옴의 법칙 퍼즐. 손 20번."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/amp-match/"><meta property="og:title" content="같은 물줄기!: 옴의 법칙 바꿔 잇기"><meta property="og:description" content="전압·저항이 적힌 카드를 옆 칸과 바꿔, 전류(전압 ÷ 저항)가 같은 카드 3장을 한 줄로 잇는 옴의 법칙 퍼즐. 손 20번."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="같은 물줄기!: 옴의 법칙 바꿔 잇기",D="전압·저항이 적힌 카드를 옆 칸과 바꿔, 전류(전압 ÷ 저항)가 같은 카드 3장을 한 줄로 잇는 옴의 법칙 퍼즐. 손 20번.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/amp-match/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head><body>
<div id="app">
 <div class="top"><span>모은 물 <span id="sc">0</span></span><span>최고 <span id="best">0</span></span></div>
 <p class="rule">전류가 같은 카드 3개를 한 줄로!</p>
 <p class="sub2">전압 ÷ 저항 = 전류 · 파란 줄 굵기가 전류</p>
 <div id="tankbar"><span>남은 손 <span id="mv">0</span></span><div id="tank"><div id="tf"></div></div></div>
 <div id="grid"></div>
 <div id="hint">카드 하나를 누르고 바로 옆 카드를 누르면 자리가 바뀝니다</div>
</div>
<div id="toast"></div>
<div id="over"><div class="box">
 <h2>손이 다 떨어졌어요</h2>
 <div class="big" id="oScore">0</div>
 <div id="oGap"></div>
 <div class="tip" id="oTip"></div>
 <button id="again">한 번 더</button>
 <div style="font-size:17px;color:var(--sub);margin-top:8px">지금까지 모은 물 <span id="oTot">0</span>카드</div>
</div></div>
<script>
(function(){
const KEY='amp-match.save.v1';let save={best:0,total:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)save=Object.assign(save,s);}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
let ac=null;
function tone(f,d,t,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.14;o.connect(g);g.connect(ac.destination);const n=ac.currentTime;g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d);}catch(e){}}
const $=id=>document.getElementById(id);const rnd=a=>a[Math.floor(Math.random()*a.length)];const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const C=5,R=6,START=20;
const TIPS=['전압 = 전류 × 저항. 10V에 5Ω이면 전류는 2A.','같은 2A라도 4V·2Ω, 6V·3Ω, 8V·4Ω 여러 꼴이 있다. 나눠 보면 같다.','전압이 같을 때 저항(호스 굵기 방해)이 크면 전류는 준다.','물탱크가 높을수록 미는 힘이 세다 — 전압. 호스를 흐르는 물의 양 — 전류.'];
let st,b=[],sel=-1,busy=false;
function kinds(){return st.score<60?4:5;}
function card(){const A=ri(1,kinds());const R=ri(1,A>=4?3:A>=3?4:5);return {A,R,V:A*R};}
function matches(){const m=new Set();
 for(let y=0;y<R;y++)for(let x=0;x<C-2;x++){const i=y*C+x,k=b[i]&&b[i].A;if(k&&b[i+1].A===k&&b[i+2].A===k){let j=x;while(j<C&&b[y*C+j].A===k){m.add(y*C+j);j++;}}}
 for(let x=0;x<C;x++)for(let y=0;y<R-2;y++){const i=y*C+x,k=b[i]&&b[i].A;if(k&&b[i+C].A===k&&b[i+2*C].A===k){let j=y;while(j<R&&b[j*C+x].A===k){m.add(j*C+x);j++;}}}
 return m;}
function adj(i,j){const dx=Math.abs(i%C-j%C),dy=Math.abs(Math.floor(i/C)-Math.floor(j/C));return dx+dy===1;}
function sw(i,j){const t=b[i];b[i]=b[j];b[j]=t;}
function findMove(){for(let i=0;i<C*R;i++)for(const j of [i+1,i+C]){if(j>=C*R||!adj(i,j))continue;sw(i,j);const ok=matches().size>0;sw(i,j);if(ok)return [i,j];}return null;}
function fill(){do{b=Array.from({length:C*R},card);let g=0;while(matches().size&&g++<300){for(const i of matches())b[i]=card();}}while(matches().size||!findMove());}
function render(pop){const g=$('grid');g.innerHTML='';b.forEach((c,i)=>{const d=document.createElement('div');d.className='t'+(i===sel?' sel':'')+(pop&&pop.has(i)?' pop':'');
  d.innerHTML='<div class="n">'+c.V+'V<br><small>'+c.R+'Ω</small></div><div class="s" style="height:'+(c.A*4-1)+'px"></div>';d.onclick=()=>tap(i);g.appendChild(d);});
 $('sc').textContent=st.score;$('best').textContent=save.best;$('mv').textContent=st.moves;$('tf').style.width=Math.min(100,st.moves/30*100)+'%';}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1000);}
function burst(n){for(let i=0;i<Math.min(16,6+n);i++){const s=document.createElement('div');s.className='spark';s.textContent=i%2?'💦':'⚡';s.style.left=(innerWidth/2)+'px';s.style.top=(innerHeight*.45)+'px';document.body.appendChild(s);requestAnimationFrame(()=>{s.style.transform='translate('+((Math.random()-.5)*300)+'px,'+((Math.random()-.6)*300)+'px)';s.style.opacity=0;});setTimeout(()=>s.remove(),750);}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function resolve(){let chain=0,bonus=0,lastA=0;
 while(true){const m=matches();if(!m.size)break;chain++;
  const n=m.size;lastA=b[[...m][0]].A;render(m);st.score+=n;save.total+=n;
  if(n>=5)bonus++;
  tone(500+chain*120,.1);setTimeout(()=>tone(750+chain*120,.16,'triangle',.1),90);if(navigator.vibrate)navigator.vibrate(25);burst(n);
  $('hint').textContent='콸콸! 모두 '+lastA+'A — 나눠 보면 같은 물줄기';
  if(n>=5)toast(n+'장 한 번에! 손 +1 💧');else if(chain>=2)toast(chain+'연속 콸콸! ⚡');
  await wait(340);
  for(const i of m)b[i]=null;
  for(let x=0;x<C;x++){const col=[];for(let y=R-1;y>=0;y--)if(b[y*C+x])col.push(b[y*C+x]);for(let y=R-1,k=0;y>=0;y--,k++)b[y*C+x]=k<col.length?col[k]:card();}
  render();await wait(180);}
 st.moves+=bonus;store();
}
async function tap(i){if(busy||st.over)return;
 if(sel<0){sel=i;tone(500,.05,'square',.05);render();return;}
 if(sel===i){sel=-1;render();return;}
 if(!adj(sel,i)){sel=i;tone(500,.05,'square',.05);render();return;}
 const a=sel;sel=-1;busy=true;sw(a,i);
 if(!matches().size){sw(a,i);render();const g=$('grid');[a,i].forEach(k=>g.children[k].classList.add('shake'));tone(200,.15,'square',.06);$('hint').textContent='전류가 3장 같지 않아 제자리로 (손은 그대로) — 전압 ÷ 저항을 해 보세요';busy=false;return;}
 st.moves--;const before=kinds();await resolve();
 if(kinds()>before)toast('이제 5A 카드도 나와요');
 if(!findMove()){fill();toast('판 새로 섞음');}
 render();busy=false;
 if(st.moves<=0){st.over=true;tone(160,.4,'sawtooth',.12);setTimeout(over,500);}
}
function over(){const prev=save.best;if(st.score>prev)save.best=st.score;store();
 $('oScore').textContent='물 '+st.score+'카드';
 $('oGap').textContent=st.score>prev?'🎉 새 최고 기록!':(prev===st.score?'최고 기록과 같아요!':'최고 '+prev+'까지 '+(prev-st.score+1)+'카드 남음');
 $('oTip').textContent='💡 '+rnd(TIPS);$('oTot').textContent=save.total;$('over').style.display='flex';}
function start(){st={score:0,moves:START,over:false};sel=-1;busy=false;fill();$('over').style.display='none';$('hint').textContent='카드 하나를 누르고 바로 옆 카드를 누르면 자리가 바뀝니다';render();}
$('again').onclick=start;
window.__game={get state(){return st;},get board(){return b.map(c=>c.A);},get busy(){return busy;},findMove,tap,save:()=>save};
start();
})();
</script></body></html>
