<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바꿔 펑!: 전기 부품 3줄 퍼즐</title>
<style>
:root{--bg:#1a1420;--ink:#fff;--sub:#e0d6ea;--ok:#46e07a;--bad:#ff5a5a;--y:#ffd23a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
#app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:8px 10px 64px}
.top{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:4px 2px}
.rule{font-size:20px;color:var(--sub);text-align:center;margin:4px 0;font-weight:700}
.goal{display:flex;gap:8px;margin:4px 0 8px}
.goal div{flex:1;background:#2b2236;border-radius:12px;text-align:center;padding:6px 2px;font-size:17px;color:var(--sub);font-weight:700}
.goal b{display:block;font-size:26px;color:#fff}
#gbar{height:10px;background:#2b2236;border-radius:5px;margin-bottom:8px;overflow:hidden}#gfill{height:100%;width:0;background:var(--ok);transition:width .3s}
#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;width:100%;margin:0 auto}
.t{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;border:3px solid rgba(0,0,0,.25);transition:transform .15s}
.t.sel{border-color:var(--y);transform:scale(1.1);box-shadow:0 0 12px var(--y)}
.t.pop{animation:pop .3s forwards}@keyframes pop{50%{transform:scale(1.3);background:#fff}100%{transform:scale(0);opacity:0}}
.t.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.k0{background:#d9a21b}.k1{background:#3a7bd5}.k2{background:#2e9e57}.k3{background:#c0473d}.k4{background:#7b54c9}
#hint{font-size:18px;color:var(--sub);text-align:center;margin-top:8px}
#over{position:fixed;inset:0;background:rgba(8,5,10,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.box{max-width:400px;width:100%;background:#2b2236;border-radius:18px;padding:20px;text-align:center;font-size:21px;line-height:1.5}
.box h2{margin:0 0 6px;font-size:30px}.big{font-size:42px;font-weight:900;color:var(--y)}
.tip{background:#120d16;border-radius:12px;padding:10px;margin:12px 0;font-size:19px;color:var(--sub);text-align:left}
#again{width:100%;min-height:64px;border:0;border-radius:14px;background:var(--ok);color:#052;font-size:26px;font-weight:900}
#toast{position:fixed;left:50%;top:40%;white-space:nowrap;transform:translate(-50%,-50%) scale(.6);font-size:32px;font-weight:900;color:var(--y);opacity:0;transition:.3s;pointer-events:none;text-shadow:0 2px 8px #000;z-index:4}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.spark{position:fixed;font-size:24px;pointer-events:none;z-index:4;transition:transform .7s ease-out,opacity .7s}
</style><meta name="description" content="부품 하나를 누르고 옆 부품을 누르면 자리가 바뀌어, 같은 부품 3개가 한 줄이면 터지는 퍼즐. 손 15번 안에 목표 개수를 채우면 다음 판."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/part-swap/"><meta property="og:title" content="바꿔 펑!: 전기 부품 3줄 퍼즐"><meta property="og:description" content="부품 하나를 누르고 옆 부품을 누르면 자리가 바뀌어, 같은 부품 3개가 한 줄이면 터지는 퍼즐. 손 15번 안에 목표 개수를 채우면 다음 판."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="바꿔 펑!: 전기 부품 3줄 퍼즐",D="부품 하나를 누르고 옆 부품을 누르면 자리가 바뀌어, 같은 부품 3개가 한 줄이면 터지는 퍼즐. 손 15번 안에 목표 개수를 채우면 다음 판.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/part-swap/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head><body>
<div id="app">
 <div class="top"><span>판 <span id="lv">1</span></span><span>최고 <span id="best">0</span>개</span></div>
 <p class="rule">옆 칸과 바꿔 같은 부품 3개를 한 줄로!</p>
 <div class="goal"><div>남은 손<b id="mv">0</b></div><div>터뜨림<b id="cl">0</b></div><div>이번 판 목표<b id="gl">0</b></div></div>
 <div id="gbar"><div id="gfill"></div></div>
 <div id="grid"></div>
 <div id="hint">부품 하나를 누르고, 바로 옆 부품을 누르면 자리가 바뀝니다</div>
</div>
<div id="toast"></div>
<div id="over"><div class="box">
 <h2>손이 다 떨어졌어요</h2>
 <div class="big" id="oScore">0개</div>
 <div id="oGap"></div>
 <div class="tip" id="oTip"></div>
 <button id="again">한 번 더</button>
 <div style="font-size:17px;color:var(--sub);margin-top:8px">지금까지 터뜨린 부품 <span id="oTot">0</span>개</div>
</div></div>
<script>
(function(){
const KEY='part-swap.save.v1';let save={best:0,total:0,bestLv:1};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)save=Object.assign(save,s);}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
let ac=null;
function tone(f,d,t,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.14;o.connect(g);g.connect(ac.destination);const n=ac.currentTime;g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d);}catch(e){}}
const $=id=>document.getElementById(id);const rnd=a=>a[Math.floor(Math.random()*a.length)];
const C=6,R=7,ICON=['💡','🔌','🔋','🧰','⚡'];
const TIPS=['전선 색: L1 갈색 · L2 검정 · L3 회색 · 중성선 파랑 · 접지선 초록-노랑 줄무늬.','배선용 차단기는 전선을 지키고, 누전차단기는 사람을 지킨다.','누전차단기는 들어간 전류와 돌아온 전류의 차이를 본다. 차이가 나면 어딘가로 새는 것.','많이 써서 떨어지는 건 과전류 쪽, 새서 떨어지는 건 누전 쪽 일이다.'];
let st,b=[],sel=-1,busy=false;
function goalOf(lv){return 15+lv*10;}
function movesOf(lv){return 15;}
function kinds(){return st.lv<3?4:5;}
function rk(){return Math.floor(Math.random()*kinds());}
function matches(){const m=new Set();
 for(let y=0;y<R;y++)for(let x=0;x<C-2;x++){const i=y*C+x,k=b[i];if(k>=0&&b[i+1]===k&&b[i+2]===k){let j=x;while(j<C&&b[y*C+j]===k){m.add(y*C+j);j++;}}}
 for(let x=0;x<C;x++)for(let y=0;y<R-2;y++){const i=y*C+x,k=b[i];if(k>=0&&b[i+C]===k&&b[i+2*C]===k){let j=y;while(j<R&&b[j*C+x]===k){m.add(j*C+x);j++;}}}
 return m;}
function adj(i,j){const dx=Math.abs(i%C-j%C),dy=Math.abs(Math.floor(i/C)-Math.floor(j/C));return dx+dy===1;}
function sw(i,j){const t=b[i];b[i]=b[j];b[j]=t;}
function hasMove(){for(let i=0;i<C*R;i++)for(const j of [i+1,i+C]){if(j>=C*R||!adj(i,j))continue;sw(i,j);const ok=matches().size>0;sw(i,j);if(ok)return true;}return false;}
function fill(){do{b=Array.from({length:C*R},rk);let g=0;while(matches().size&&g++<200){for(const i of matches())b[i]=rk();}}while(matches().size||!hasMove());}
function render(pop){const g=$('grid');g.innerHTML='';b.forEach((k,i)=>{const d=document.createElement('div');d.className='t k'+k+(i===sel?' sel':'')+(pop&&pop.has(i)?' pop':'');d.textContent=ICON[k];d.dataset.i=i;d.onclick=()=>tap(i);g.appendChild(d);});
 $('lv').textContent=st.lv;$('best').textContent=save.best;$('mv').textContent=st.moves;$('cl').textContent=st.got;$('gl').textContent=st.goal;$('gfill').style.width=Math.min(100,st.got/st.goal*100)+'%';}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),900);}
function burst(n){for(let i=0;i<Math.min(16,6+n);i++){const s=document.createElement('div');s.className='spark';s.textContent='⚡';s.style.left=(innerWidth/2)+'px';s.style.top=(innerHeight*.45)+'px';document.body.appendChild(s);requestAnimationFrame(()=>{s.style.transform='translate('+((Math.random()-.5)*300)+'px,'+((Math.random()-.6)*300)+'px)';s.style.opacity=0;});setTimeout(()=>s.remove(),750);}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function resolve(){let chain=0;
 while(true){const m=matches();if(!m.size)break;chain++;
  render(m);const n=m.size;st.got+=n;st.score+=n;save.total+=n;
  tone(520+chain*110,.1);setTimeout(()=>tone(780+chain*110,.15,'triangle',.1),90);if(navigator.vibrate)navigator.vibrate(25);burst(n);
  if(n>=4||chain>=2)toast(chain>=2?chain+'연속 펑! ⚡':'한 번에 '+n+'개! ⚡');
  await wait(320);
  for(const i of m)b[i]=-1;
  for(let x=0;x<C;x++){const col=[];for(let y=R-1;y>=0;y--)if(b[y*C+x]>=0)col.push(b[y*C+x]);for(let y=R-1,k=0;y>=0;y--,k++)b[y*C+x]=k<col.length?col[k]:rk();}
  render();await wait(180);}
 store();
}
async function tap(i){if(busy||st.over)return;
 if(sel<0){sel=i;tone(500,.05,'square',.05);render();return;}
 if(sel===i){sel=-1;render();return;}
 if(!adj(sel,i)){sel=i;tone(500,.05,'square',.05);render();return;}
 const a=sel;sel=-1;busy=true;sw(a,i);
 if(!matches().size){sw(a,i);render();const g=$('grid');[a,i].forEach(k=>g.children[k].classList.add('shake'));tone(200,.15,'square',.06);$('hint').textContent='3개가 안 이어져서 제자리로 돌아왔어요 (손은 그대로)';busy=false;return;}
 st.moves--;$('hint').textContent='좋아요! 남은 손 안에 목표까지 터뜨리세요';
 await resolve();
 if(st.got>=st.goal){st.lv++;st.got=0;st.goal=goalOf(st.lv);st.moves=movesOf(st.lv);tone(1046,.3,'triangle',.12);toast(st.lv+'판으로! 손 '+st.moves+'번 다시');if(st.lv===3)setTimeout(()=>toast('새 부품 등장: '+ICON[4]),1000);}
 if(!hasMove()){fill();toast('판 새로 섞음');}
 render();busy=false;
 if(st.moves<=0){st.over=true;tone(160,.4,'sawtooth',.12);setTimeout(over,500);}
}
function over(){const prev=save.best;if(st.score>prev)save.best=st.score;if(st.lv>save.bestLv)save.bestLv=st.lv;store();
 $('oScore').textContent=st.lv+'판 · '+st.score+'개';
 $('oGap').textContent='이번 판 목표까지 '+(st.goal-st.got)+'개 남았어요 · '+(st.score>prev?'🎉 새 최고 기록!':'최고 '+prev+'개까지 '+(prev-st.score+1)+'개');
 $('oTip').textContent='💡 '+rnd(TIPS);$('oTot').textContent=save.total;$('over').style.display='flex';}
function start(){st={lv:1,score:0,got:0,goal:goalOf(1),moves:movesOf(1),over:false};sel=-1;busy=false;fill();$('over').style.display='none';$('hint').textContent='부품 하나를 누르고, 바로 옆 부품을 누르면 자리가 바뀝니다';render();}
$('again').onclick=start;
function findMove(){for(let i=0;i<C*R;i++)for(const j of [i+1,i+C]){if(j>=C*R||!adj(i,j))continue;sw(i,j);const ok=matches().size>0;sw(i,j);if(ok)return [i,j];}return null;}
window.__game={get state(){return st;},get board(){return b;},get busy(){return busy;},findMove,tap,save:()=>save};
start();
})();
</script></body></html>
