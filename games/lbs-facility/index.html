<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>정전입니다 — LBS 시설관리</title>
<style>
:root{--bg:#0b0f14;--panel:#111821;--dead:#556273;--live:#ffb020;--red:#ff4a4a;--green:#2fd06a;--txt:#e8eef5;--sub:#8fa0b3;--warn:#ff9a3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
#app.shake{animation:shake .45s linear}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,3px)}}
#top{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 10px 4px;font-size:13px;color:var(--sub)}
#clock{font-variant-numeric:tabular-nums;color:var(--txt);font-weight:700;font-size:15px}
#stageBtn{flex:1;text-align:left;background:none;border:0;color:var(--sub);font-size:13px;padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#miss{color:var(--warn);font-weight:700}
#mute{background:#1b2430;border:0;border-radius:10px;width:40px;height:34px;font-size:17px}
#head{padding:2px 12px 8px;font-size:20px;font-weight:800;line-height:1.25;min-height:34px;transition:color .2s}
#head.alarm{color:var(--red);animation:blink .7s steps(2,start) infinite}
#head.done{color:var(--green)}
#head.nudge{animation:nudge .35s}
@keyframes blink{50%{opacity:.35}}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#mid{flex:1;display:flex;min-height:0;padding:0 6px;gap:6px}
#sld{flex:1;position:relative;background:var(--panel);border-radius:12px;min-width:0;overflow:hidden}
#sld.dark{background:#0d131a}
#sld svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#sld [data-id]{cursor:pointer}
.ring{fill:none;stroke:#fff;stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:ring 1.1s ease-out infinite}
@keyframes ring{0%{opacity:.95;transform:scale(.75)}100%{opacity:0;transform:scale(1.35)}}
.arrow{animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateX(-5px)}}
#bld{width:100px;display:flex;flex-direction:column;padding:6px 0 0}
.roof{height:10px;margin:0 6px;background:#2a3442;border-radius:4px 4px 0 0}
.fl{flex:1;display:flex;align-items:center;gap:4px;padding:0 6px;margin:0 6px;background:#1a222d;border-left:2px solid #2a3442;border-right:2px solid #2a3442;border-top:1px solid #2a3442;position:relative}
.fl span{font-size:11px;color:var(--sub);width:18px}
.fl i{flex:1;height:58%;max-height:40px;background:#0a0e13;border-radius:2px;transition:background .25s,box-shadow .25s}
.fl.on i{background:#ffe08a;box-shadow:0 0 10px rgba(255,214,110,.75)}
.fl.em i{background:#1f4a35;box-shadow:0 0 5px rgba(80,220,140,.4)}
.fl.on span{color:#ffe08a}
.ground{height:4px;background:#5a4630;margin:0 0}
.b1{flex:1.2;background:#141a22;border-bottom:2px solid #2a3442;flex-wrap:wrap;align-content:center;font-size:10px;color:var(--sub);gap:2px}
.b1 b{font-weight:400;font-size:10px;padding:1px 3px;border-radius:3px;background:#0a0e13}
.b1.on b.eq{background:#ffe08a;color:#222}
.b1 .me{width:100%;font-size:10px}
#bottom{padding:6px 12px calc(10px + env(safe-area-inset-bottom));min-height:126px;display:flex;flex-direction:column;gap:6px}
#toast{font-size:13.5px;color:#ffd27a;min-height:38px;line-height:1.38;transition:opacity .3s}
#toast.off{opacity:0}
#acts{min-height:62px;display:flex;align-items:center;justify-content:center}
.btn{display:block;width:100%;padding:17px 12px;font-size:18px;font-weight:800;border-radius:14px;border:0;background:#25303d;color:var(--txt)}
.btn.glow{background:#e23b3b;box-shadow:0 0 0 0 rgba(255,74,74,.7);animation:pulse 1.2s infinite}
.btn.glow.blue{background:#2f6fe0;animation-name:pulseb}
.btn.glow.gold{background:#c98a10;animation-name:pulsey}
@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(255,74,74,0)}100%{box-shadow:0 0 0 0 rgba(255,74,74,0)}}
@keyframes pulseb{0%{box-shadow:0 0 0 0 rgba(80,140,255,.7)}70%{box-shadow:0 0 0 14px rgba(80,140,255,0)}100%{box-shadow:none}}
@keyframes pulsey{0%{box-shadow:0 0 0 0 rgba(255,190,60,.7)}70%{box-shadow:0 0 0 14px rgba(255,190,60,0)}100%{box-shadow:none}}
.tip{font-size:13px;color:var(--sub);text-align:center}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:20;padding:20px}
.hidden{display:none!important}
.card{width:100%;max-width:360px;background:#18212c;border-radius:18px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.who{font-size:15px;color:var(--sub);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.who .ringing{display:inline-block;animation:wig .25s infinite alternate}
@keyframes wig{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.msg{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:6px}
.lesson{font-size:13.5px;color:#ffd27a;line-height:1.4;margin-bottom:14px}
#flash{position:fixed;inset:0;z-index:30;pointer-events:none;background:#fff;opacity:0;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;color:#2050ff;text-shadow:0 0 18px #9cf}
#flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:1;background:#fff}15%{opacity:1;background:#bfe0ff}30%{opacity:.95;background:#fff}100%{opacity:0}}
.paper{width:100%;max-width:360px;max-height:92vh;overflow:auto;background:#f3ecd9;color:#2a2418;border-radius:6px;padding:18px 18px 14px;position:relative;font-family:inherit;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.paper h2{margin:0 0 2px;font-size:20px;letter-spacing:2px}
.paper .meta{font-size:12px;color:#6a5e44;margin-bottom:8px;border-bottom:1px solid #b9ab88;padding-bottom:6px}
.paper ol{margin:0;padding:0 0 0 0;list-style:none;font-size:12.5px;line-height:1.55;max-height:38vh;overflow:auto}
.paper li{display:flex;gap:8px}
.paper li em{font-style:normal;color:#7a6c4e;font-variant-numeric:tabular-nums;width:40px;flex:none}
.paper li.bad{color:#b02020}
.paper .sum{margin-top:10px;font-size:13.5px;font-weight:700;border-top:1px solid #b9ab88;padding-top:8px}
.paper .boss{font-size:13px;color:#5a4e34;margin-top:4px}
#stampMark{position:absolute;right:18px;top:14px;width:78px;height:78px;border:4px solid #d42020;border-radius:50%;color:#d42020;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;transform:rotate(-14deg);opacity:0}
#stampMark.go{animation:stamp .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(3) rotate(-14deg)}60%{opacity:.95;transform:scale(.92) rotate(-14deg)}100%{opacity:.9;transform:scale(1) rotate(-14deg)}}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1;padding:14px 8px;border-radius:12px;border:0;font-size:16px;font-weight:800;background:#d8cdb0;color:#2a2418}
.row button.pri{background:#2a2418;color:#f3ecd9}
.menu h3{margin:0 0 12px;font-size:17px}
.menu button{display:block;width:100%;text-align:left;margin:6px 0;padding:14px;border-radius:12px;border:0;background:#25303d;font-size:15px}
.menu button[disabled]{opacity:.4}
.menu small{color:var(--sub)}
</style>
<meta name="description" content="새벽 3시 "정전입니다". LBS·VCB·ACB를 실제 순서대로 올려 건물 불을 되살리는 시설관리 게임."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/lbs-facility/"><meta property="og:title" content="정전입니다 — LBS 시설관리"><meta property="og:description" content="새벽 3시 "정전입니다". LBS·VCB·ACB를 실제 순서대로 올려 건물 불을 되살리는 시설관리 게임."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"></head>
<body>
<div id="app">
  <div id="top">
    <span id="clock">03:00</span>

      <div class="roof"></div>
      <div class="fl" data-f="F4"><span>4F</span><i></i><i></i><i></i></div>
      <div class="fl" data-f="F3"><span>3F</span><i></i><i></i><i></i></div>
      <div class="fl" data-f="F2"><span>2F</span><i></i><i></i><i></i></div>

      <div class="fl b1" data-f="B1"><span>B1</span><b class="eq">펌프</b><b class="eq">승강기</b><div class="me">🔦 전기실(나)</div></div>

<script>
(() => {
'use strict';

/* ───────── 저장 (lbs-facility.save.v1, 막혀 있어도 게임은 돎) ───────── */
const SAVE_KEY = 'lbs-facility.save.v1';
let save = { v: 1, unlocked: 1, last: 1, best: {}, muted: false };
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) save = Object.assign(save, o); }
} catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ───────── 소리 (WebAudio 합성) ───────── */
const AU = {
  ctx: null, master: null, gen: null,
  init() {
    if (this.ctx) return;
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      this.ctx = new C(); this.master = this.ctx.createGain();
      this.master.gain.value = save.muted ? 0 : 0.45; this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  resume() { this.init(); try { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} },
  ok() { return this.ctx && this.ctx.state === 'running'; },
  setMuted(m) { if (this.master) this.master.gain.value = m ? 0 : 0.45; },
  tone(f, dur, type = 'sine', vol = .25, delay = 0, slide) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + .02);
  },
  noise(dur, vol = .3, freq = 1200, type = 'lowpass', delay = 0) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + delay, n = Math.floor(c.sampleRate * dur);
    const b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = b; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  beep() { this.tone(2400, .22, 'square', .08); },
  clunk() { this.noise(.08, .5, 900); this.tone(90, .15, 'sine', .4); },
  arc() { this.noise(.5, .7, 5000, 'highpass'); this.noise(.25, .6, 800, 'lowpass', .05); for (let i = 0; i < 6; i++) this.noise(.04, .4, 3000, 'bandpass', .08 + i * .06); },
  hum() { this.tone(120, 1.1, 'sine', .3); this.tone(240, 1.1, 'sine', .06); },
  ring() { for (let i = 0; i < 3; i++) { this.tone(1300, .09, 'sine', .15, i * .2); this.tone(1650, .09, 'sine', .15, i * .2 + .1); } },
  light() { this.tone(1320, .18, 'triangle', .12); },
  chime() { [660, 880, 1320].forEach((f, i) => this.tone(f, .35, 'triangle', .14, i * .12)); },
  stamp() { this.noise(.12, .8, 400); this.tone(70, .25, 'sine', .6); },
  nope() { this.tone(220, .12, 'square', .07); },
  genOn(on) {
    if (!this.ok()) return;
    if (on && !this.gen) {
      const c = this.ctx, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
      o.type = 'sawtooth'; o.frequency.value = 38; f.type = 'lowpass'; f.frequency.value = 180; g.gain.value = .12;
      o.connect(f); f.connect(g); g.connect(this.master); o.start(); this.gen = { o, g };
    } else if (!on && this.gen) {
      try { this.gen.g.gain.exponentialRampToValueAtTime(.0001, this.ctx.currentTime + .8); this.gen.o.stop(this.ctx.currentTime + .9); } catch (e) {}
      this.gen = null;
    }
  }
};

/* ───────── 스테이지 정의 ─────────
   노드: type src(인입) lbs ds vcb acb mccb(개폐) tr(확인) mof la load(수동) gen ats relay
   x = 폭 비율, y = 줄 번호. closed = 투입. 투입=빨강, 개방=초록(국내 수배전반 관행). */
const MAIN = [
  { id: 'IN', type: 'src', name: '한전 인입', sub: '22.9kV-Y' },
  { id: 'LBS', type: 'lbs', p: 'IN', name: 'LBS', sub: '수전 부하개폐기' },
  { id: 'LA', type: 'la', p: 'LBS', name: 'LA', sub: '피뢰기' },
  { id: 'MOF', type: 'mof', p: 'LBS', name: 'MOF', sub: '한전 계량용' }
];
function mainAt(x, y0, lbsClosed) {
  const pos = { IN: [x, y0], LBS: [x, y0 + 1], LA: [Math.min(.8, x + .34), y0 + 1.55], MOF: [x, y0 + 2] };
  return MAIN.map(n => Object.assign({}, n, { x: pos[n.id][0], y: pos[n.id][1] }, n.type === 'lbs' ? { closed: lbsClosed } : {}));
}
const closed = id => s => !!s.n[id].closed;
const live = id => s => isLive(s, id);

const STAGES = [
{
  n: 1, name: '한전 정전', start: 3 * 60, rows: 7,
  nodes: mainAt(.42, 0, false).concat([
    { id: 'VCB', type: 'vcb', p: 'MOF', x: .42, y: 3, name: 'VCB', sub: '진공차단기', closed: false, trip: 'UVR' },
    { id: 'TR', type: 'tr', p: 'VCB', x: .42, y: 4, name: 'TR', sub: '22.9kV/380V' },
    { id: 'ACB', type: 'acb', p: 'TR', x: .42, y: 5, name: 'ACB', sub: '저압 주차단기', closed: false },
    { id: 'M1', type: 'mccb', p: 'ACB', x: .12, y: 6, name: '1F', closed: false },
    { id: 'M2', type: 'mccb', p: 'ACB', x: .37, y: 6, name: '2F', closed: false },
    { id: 'M3', type: 'mccb', p: 'ACB', x: .62, y: 6, name: '3F', closed: false },
    { id: 'M4', type: 'mccb', p: 'ACB', x: .87, y: 6, name: '4F', closed: false }
  ]),
  loads: { F1: ['M1'], F2: ['M2'], F3: ['M3'], F4: ['M4'], B1: [] },
  init(s) { s.kepco = false; s.buzzer = true; },
  gate(s) { if (!s.flags.checked) return '상황 확인부터. 한전 쪽인지 우리 쪽인지.'; },
  steps: [
    { t: 'btn:buzzer', hint: '정전입니다', alarm: true, done: s => !s.buzzer },
    { t: 'btn:check', hint: '상황 확인', done: s => !!s.flags.checked },
    { t: null, hint: '한전 복전 대기…', done: s => s.kepco },
    { t: 'LBS', hint: '전원측부터: 수전 LBS 투입', done: closed('LBS') },
    { t: 'VCB', hint: 'VCB 투입', done: closed('VCB') },
    { t: 'TR', hint: '변압기 확인 (탭)', done: s => !!s.trOk.TR },
    { t: 'ACB', hint: 'ACB 투입', done: closed('ACB') },
    { t: 'M1', hint: '층별 MCCB 하나씩 투입', done: live('M1') },
    { t: 'M2', hint: '층별 MCCB 하나씩 투입', done: live('M2') },
    { t: 'M3', hint: '층별 MCCB 하나씩 투입', done: live('M3') },
    { t: 'M4', hint: '층별 MCCB 하나씩 투입', done: live('M4') },
    { t: 'btn:stamp', hint: '복전 완료. 운전일지 쓰셔야죠?', final: true, done: s => !!s.flags.stamped }
  ],
  facts: {
    'btn:buzzer': '실무 1순위: 일단 저 소리부터 끈다.',
    'btn:check': '인입 전압 0 · 구내 계전기 표시 없음 → 한전 측 정전. VCB는 UVR(부족전압계전기)이 트립시켜 둠.',
    'kepco': '한전 복전! 인입 22.9kV 확인. 투입은 전원측 → 부하측.',
    'LBS:close': 'LBS(부하개폐기): 부하전류는 끊지만 고장전류는 못 끊음 → 그래서 PF(전력퓨즈)랑 짝.',
    'VCB:close': 'VCB(진공차단기): 고장전류까지 끊는 주차단기. 투입=빨간불, 개방=초록불.',
    'TR:check': '변압기 여자 확인: 웅— (60Hz 계통이라 120Hz로 웅) · 2차 380V ✓',
    'ACB:close': 'ACB(기중차단기): 저압 주차단기. 분기는 아직 내려 둔 채로.',
    'M1:close': '1층 점등. 분기는 하나씩 — 한꺼번에 넣으면 돌입전류.',
    'M2:close': '2층 점등.', 'M3:close': '3층 점등.', 'M4:close': '4층 점등. 전 층 복전!'
  }
},
{
  n: 2, name: '발전기·ATS', start: 14 * 60 + 20, rows: 8,

/* ───────── 화면 ───────── */
const BTN = { buzzer: ['🔕 부저 정지', ''], check: ['📋 상황 확인', 'blue'], call: ['📞 한전 123 전화', 'blue'], stamp: ['🖋 운전일지 도장 쾅', 'gold'] };
function render() {
  const s = S; if (!s) return;
  const st = curStep(s);
  if (st && st.final && !s.finalLogged) { s.finalLogged = true; s.log.push(logLine('복전 완료')); AU.chime(); }
  $('clock').textContent = clockStr(s);
  $('stageBtn').textContent = `${s.def.n}. ${s.def.name} ▾`;
  $('miss').textContent = s.mistakes ? `실수 ${s.mistakes}` : '';
  $('mute').textContent = save.muted ? '🔇' : '🔊';
  const h = $('head');
  const hint = st ? (typeof st.hint === 'function' ? st.hint(s) : st.hint) : '';
  if (h.textContent !== hint) h.textContent = hint;
  h.classList.toggle('alarm', !!(st && st.alarm));
  h.classList.toggle('done', !!(st && st.final));
  const acts = $('acts');

  if (st && st.t && st.t.startsWith('btn:')) {

    html = `<button class="btn glow ${b[1]}" id="btn-${k}" data-act="${k}">${b[0]}</button>`;
  } else if (st && st.t) html = '<div class="tip">👆 빛나는 기기를 탭</div>';
  else html = '<div class="tip">⏳</div>';

function renderToast() {

function renderBld() {

function renderSLD(st) {
  const s = S, box = $('sld'), W = box.clientWidth, H = box.clientHeight; if (!W || !H) return;
  const rows = s.def.rows, top = 26, bot = 24, rowH = (H - top - bot) / (rows - 1);
  const sz = Math.max(22, Math.min(40, rowH * .62, W / 6.2));
  const P = n => [Math.round(n.x * W), Math.round(top + n.y * rowH)];
  const hh = n => ({ src: sz * .36, lbs: sz * .42, ds: sz * .42, vcb: sz * .32, acb: sz * .29, mccb: sz * .24, tr: sz * .44, mof: sz * .22, la: sz * .2, gen: sz * .36, ats: sz * .3, load: 6 })[n.type] || sz * .3;
  const C = on => on ? 'var(--live)' : 'var(--dead)';
  let lines = '', syms = '', hits = '', over = '';

  // 선
  Object.values(s.n).forEach(n => {
    const ins = n.type === 'ats' ? [[n.pN, -sz * .22], [n.pE, sz * .22]] : n.p ? [[n.p, 0]] : [];
    ins.forEach(([pid, dx]) => {
      const p = s.n[pid], [px, py] = P(p), [cx, cy] = P(n);
      const sy = py + hh(p), ey = cy - hh(n), ex = cx + dx, on = isLive(s, pid);
      let d;
      if (Math.abs(px - ex) < 2) d = `M${px} ${sy}V${ey}`;
      else { const my = ey - Math.min(rowH * .3, (ey - sy) * .5); d = `M${px} ${sy}V${my}H${ex}V${ey}`; }
      lines += `<path d="${d}" stroke="${C(on)}" stroke-width="${on ? 3 : 2}" fill="none" ${on ? 'filter="url(#gl)"' : ''}/>`;
    });
  });

  Object.values(s.n).forEach(n => {
    const [X, Y] = P(n), lv = isLive(s, n.id), inLv = n.p ? isLive(s, n.p) : lv;
    const lamp = (dx, on) => `<circle cx="${X + dx}" cy="${Y}" r="${Math.max(3.5, sz * .11)}" fill="${on ? 'var(--red)' : 'var(--green)'}" stroke="#000" stroke-width="1"/>`;
    const lab = (dx = sz * .5, dy = 0) => {
      const anchor = dx < 0 ? 'end' : 'start';
      return `<text x="${X + dx}" y="${Y + dy - (n.sub ? 2 : -4)}" font-size="${Math.max(10, sz * .3)}" font-weight="700" fill="#dfe7f0" text-anchor="${anchor}">${n.name}</text>` +
        (n.sub ? `<text x="${X + dx}" y="${Y + dy + 10}" font-size="${Math.max(8.5, sz * .23)}" fill="#8fa0b3" text-anchor="${anchor}">${n.sub}</text>` : '');
    };
    const h = hh(n);
    switch (n.type) {
      case 'src':
        syms += `<circle cx="${X}" cy="${Y}" r="${h}" fill="#0b0f14" stroke="${C(lv)}" stroke-width="2"/><text x="${X}" y="${Y + 4}" font-size="${sz * .38}" text-anchor="middle" fill="${lv ? '#ffb020' : '#8fa0b3'}">~</text>` +
          lab(sz * .5) + `<text x="${X - sz * .5}" y="${Y + 4}" font-size="10" text-anchor="end" fill="${lv ? '#ffb020' : '#ff6a6a'}">${lv ? '22.9kV' : '0kV'}</text>`;
        break;
      case 'lbs': case 'ds': {
        const top = Y - h, bt = Y + h, bx = n.closed ? X : X + h * 1.0, by = n.closed ? top : top + h * .55;
        syms += `<line x1="${X}" y1="${top}" x2="${X}" y2="${top + 3}" stroke="${C(inLv)}" stroke-width="2.5"/>` +
          `<circle cx="${X}" cy="${top + 3}" r="2.5" fill="${C(inLv)}"/>` +
          `<line x1="${X}" y1="${bt}" x2="${bx}" y2="${by + 3}" stroke="${C(lv)}" stroke-width="3" stroke-linecap="round"/>` +
          `<circle cx="${X}" cy="${bt}" r="2.5" fill="${C(lv)}"/>` +
          (n.type === 'lbs' ? `<circle cx="${(X + bx) / 2}" cy="${(bt + by) / 2 + 2}" r="3.2" fill="#0b0f14" stroke="${C(lv)}" stroke-width="1.5"/>` : '') +
          lamp(-sz * .55, n.closed) + lab(sz * .5 + (n.closed ? 0 : h * .6));
        break;
      }
      case 'vcb': case 'acb': case 'mccb': {
        const a = h * 2;
        syms += `<rect x="${X - h}" y="${Y - h}" width="${a}" height="${a}" rx="3" fill="${n.closed ? '#c22b2b' : '#1c8a4a'}" stroke="${C(inLv)}" stroke-width="2.5"/>`;
        if (n.type === 'vcb') syms += `<text x="${X}" y="${Y + 3.5}" font-size="9" text-anchor="middle" fill="#fff" opacity=".7">${n.closed ? 'ON' : 'OFF'}</text>`;
        if (n.type === 'mccb') syms += `<text x="${X}" y="${Y + h + 13}" font-size="${Math.max(10, sz * .3)}" font-weight="700" text-anchor="middle" fill="${lv ? '#ffe08a' : '#dfe7f0'}">${n.name}</text>`;
        else syms += lab(sz * .5);
        if (n.trip) syms += `<text x="${X - h - 4}" y="${Y + 4}" font-size="10" font-weight="800" text-anchor="end" fill="var(--warn)">${n.trip === 'UVR' ? 'UVR 트립' : '트립'}</text>`;
        break;
      }

          `<text x="${X + 9}" y="${Y + 3}" font-size="9" fill="#8fa0b3">LA</text>`;
        break;
      case 'gen':
        syms += `<circle cx="${X}" cy="${Y}" r="${h}" fill="#0b0f14" stroke="${C(lv)}" stroke-width="2.5"/><text x="${X}" y="${Y + 5}" font-size="${sz * .42}" font-weight="800" text-anchor="middle" fill="${lv ? '#ffb020' : '#8fa0b3'}">G</text>` +
          `<text x="${X}" y="${Y - h - 6}" font-size="10" font-weight="700" text-anchor="middle" fill="#dfe7f0">발전기</text>` +

        break;
      case 'ats': {
        const w = sz * .62;
        syms += `<rect x="${X - w}" y="${Y - h}" width="${w * 2}" height="${h * 2}" rx="4" fill="#0b0f14" stroke="${C(lv)}" stroke-width="2.5"/>` +
          `<text x="${X}" y="${Y - 1}" font-size="9" font-weight="800" text-anchor="middle" fill="#dfe7f0">ATS</text>` +
          `<text x="${X}" y="${Y + 9}" font-size="9" font-weight="800" text-anchor="middle" fill="${n.pos === 'N' ? '#9fd0ff' : '#ffb020'}">${n.pos === 'N' ? '상용' : '비상'}</text>`;
        break;
      }
      case 'load':
        syms += `<text x="${X}" y="${Y + 4}" font-size="10" font-weight="700" text-anchor="middle" fill="${lv ? '#ffe08a' : '#8fa0b3'}">${lv ? '💡' : '·'} ${n.name}</text>` +
          `<text x="${X}" y="${Y + 16}" font-size="8.5" text-anchor="middle" fill="#8fa0b3">${n.sub}</text>`;
        break;
      case 'relay': {

          `<text x="${X}" y="${Y - 7}" font-size="10" font-weight="700" text-anchor="middle" fill="#dfe7f0">계전기반</text>` +

          `<text x="${X + 13}" y="${Y + 11.5}" font-size="9" fill="${any ? 'var(--warn)' : '#56657a'}">${any ? '동작' : '정상'}</text>`;

function openJournal() {

  $('jboss').textContent = s.mistakes === 0 ? '반장님: "오~ 제법인데? 일지 깔끔하네."' : s.mistakes <= 2 ? '반장님: "됐다. 다음엔 순서 지키자."' : '반장님: "…아침에 얘기 좀 하자. (시말서 각)"';
  const last = s.def.n >= STAGES.length;
  $('next').textContent = last ? '근무표 보기' : '다음 근무 ▶';
  $('journal').classList.remove('hidden');
  const m = $('stampMark'); m.classList.remove('go'); void m.offsetWidth;
  setTimeout(() => { m.classList.add('go'); AU.stamp(); }, 250);

  save.unlocked = Math.max(save.unlocked, Math.min(STAGES.length, s.def.n + 1));
  if (last) save.allClear = true;

}
function openMenu() {

$('mute').addEventListener('click', () => { save.muted = !save.muted; AU.setMuted(save.muted); persist(); render(); });
window.addEventListener('resize', () => render());
document.addEventListener('touchmove', e => { if (!e.target.closest('.paper ol, .paper')) e.preventDefault(); }, { passive: false });

/* ───────── 루프 ───────── */
function tick(dt) {
  const s = S; if (!s) return;
  s.t += dt;
  const fast = s.gen === 'run' && s.coolEnd && s.t < s.coolEnd; // 냉각운전 5분을 빨리감기
  s.clock += dt / 1000 * (fast ? 60 : 12);
  const due = s.timers.filter(x => x.at <= s.t);
  if (due.length) { s.timers = s.timers.filter(x => x.at > s.t); due.forEach(x => x.fn()); render(); }
  if (s.buzzer && s.t - s.lastBeep >= 500) { s.lastBeep = s.t; AU.beep(); }
}
let last = performance.now(), lastRender = 0;
function frame(now) {
  const dt = Math.min(100, now - last); last = now;
  tick(dt);
  if (now - lastRender > 250) { lastRender = now; $('clock').textContent = clockStr(S); renderToast(); if (S.coolEnd && Math.abs(S.t - S.coolEnd) < 300) render(); const st = curStep(S); if (st && typeof st.hint === 'function') { const h = st.hint(S); if ($('head').textContent !== h) render(); } }
  requestAnimationFrame(frame);
}

/* ───────── 테스트용 ───────── */
window.__game = {
  get state() {
    const s = S, st = curStep(s);
    const nodes = {}; Object.values(s.n).forEach(n => { nodes[n.id] = { closed: n.closed, live: isLive(s, n.id), trip: n.trip || null, pos: n.pos }; });
    return { stage: s.def.n, t: Math.round(s.t), clock: clockStr(s), kepco: s.kepco, buzzer: s.buzzer, gen: s.gen, step: st ? st.t : null, hint: $('head').textContent,
      lit: litFloors(s), mistakes: s.mistakes, overlay: s.overlay, flags: Object.assign({}, s.flags), trOk: Object.assign({}, s.trOk), relay: Object.assign({}, s.relay), nodes, log: s.log.map(l => `${l.at} ${l.text}`) };
  },
  tap: id => tapNode(id), press: a => press(a),
  advance(ms) { let left = ms; while (left > 0) { const d = Math.min(50, left); tick(d); left -= d; } render(); },
  start: n => start(n), save: () => JSON.parse(JSON.stringify(save))
};

let first = 1;
try { const q = new URLSearchParams(location.search).get('stage'); if (q && STAGES[+q - 1]) first = +q; else if (save.last && save.last <= save.unlocked) first = save.last; } catch (e) {}
start(first);
AU.resume();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
