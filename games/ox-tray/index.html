<style>
:root{--bg:#14321f;--card:#fff8e6;--o:#1565c0;--x:#c62828;--y:#ffd54f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
h1{font-size:clamp(17px,5.4vw,22px);white-space:nowrap;margin:2px 0;text-align:center;color:var(--y);padding:0 36px}
.top{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:4px 2px 8px}
.lab{font-size:20px;font-weight:700;margin:4px 2px}
#pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pc{min-height:92px;border:0;border-radius:16px;background:var(--card);color:#222;font-size:18px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 5px 0 #0006}
.pc .ic{font-size:36px}
.pc.sel{outline:5px solid var(--y)}
.pc.hint{box-shadow:0 0 0 4px #66bb6a,0 5px 0 #0006}
#qbox{background:#ffffff14;border-radius:16px;padding:12px 14px;margin-top:10px}
#qt{font-size:21px;line-height:1.45;font-weight:700;min-height:92px}
.btns{display:flex;gap:12px;margin-top:10px}
.btn{flex:1;min-height:80px;border:0;border-radius:16px;font-size:46px;font-weight:900;color:#fff;cursor:pointer}
.btn.o{background:var(--o)}.btn.x{background:var(--x)}.btn:disabled{opacity:.3}
#ex{font-size:20px;line-height:1.4;margin-top:8px;min-height:28px}
.ok{display:block;width:100%;min-height:60px;border:0;border-radius:14px;background:var(--y);color:#222;font-size:22px;font-weight:900;margin-top:8px;cursor:pointer}
#tray{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#5d4037;border-radius:14px;padding:6px;margin-top:10px}
.slot{aspect-ratio:1;border-radius:9px;background:#00000040;display:flex;align-items:center;justify-content:center;font-size:28px}
.slot.full{background:var(--card)}.slot.bad{background:#ef9a9a}
.slot.warn{background:#c6282855}
#tray.boom{animation:boom .4s}
@keyframes boom{50%{box-shadow:0 0 30px var(--y);transform:scale(1.04)}}
.hide{display:none}
#over{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:5}
#over .box{background:#fff8e6;color:#222;border-radius:18px;padding:20px 18px;width:min(92vw,400px);text-align:center}
#over h2{margin:0 0 6px;font-size:27px}
.big{font-size:44px;font-weight:900;color:#2e7d32;margin:4px 0}
.row{font-size:20px;margin:6px 0}
.fact{background:#efe3c8;border-radius:12px;padding:12px;font-size:19px;line-height:1.5;text-align:left;margin-top:10px}
.go{display:block;width:100%;min-height:64px;border:0;border-radius:16px;background:#ffb300;color:#222;font-size:24px;font-weight:900;margin-top:12px;cursor:pointer}
.spark{position:fixed;pointer-events:none;font-size:36px;animation:fly .8s forwards;z-index:9}
@keyframes fly{to{transform:translateY(-100px) scale(1.5);opacity:0}}

ute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head><body>

<script>
'use strict';
// 문제는 「60초 전기 OX」(games/elec-ox) 문제 그대로. [문장, 정답, 해설, 묶음]. 근거는 FACTS.md.
const Q=[["KEC에서 L1상 전선 색은 갈색이다.", "O", "KEC 121.2: L1 갈색, L2 흑색, L3 회색, N 청색, 보호도체 녹색-노란색.", "전선 색상"], ["KEC에서 L2상 전선 색은 적색이다.", "X", "L2는 흑색(검정)이다. 적색은 옛 규정 색상.", "전선 색상"], ["KEC에서 L3상 전선 색은 회색이다.", "O", "L3는 회색. 갈색·흑색·회색 순서로 L1·L2·L3를 기억하자.", "전선 색상"], ["KEC에서 중성선(N) 색은 흰색이다.", "X", "중성선(N)은 청색(파란색)이다.", "전선 색상"], ["보호도체(PE)는 녹색-노란색 줄무늬 전선을 쓴다.", "O", "보호도체(접지선)는 녹색-노란색. 다른 용도로 쓰면 안 된다.", "전선 색상"], ["보호도체(PE) 색상으로 흑색을 써도 된다.", "X", "보호도체는 녹색-노란색만. 흑색은 L2상 색이다.", "전선 색상"], ["나전선처럼 색을 칠할 수 없을 때는 단자나 접속부에 색 테이프 등으로 상을 표시할 수 있다.", "O", "KEC 121.2: 종단부에 반영구적인 도색·밴드·색 테이프로 식별 가능.", "전선 색상"], ["인체 감전 보호용 누전차단기는 정격감도전류 30mA 이하, 동작시간 0.03초 이하여야 한다.", "O", "KEC 142.7의 2 \"아\": 30mA 이하·0.03초 이하 전류동작형. 가장 많이 나오는 숫자.", "누전차단기"], ["욕실처럼 몸이 젖는 장소의 콘센트는 30mA 누전차단기면 충분하다.", "X", "KEC 234.5: 욕실 등은 15mA 이하·0.03초 이하(또는 3kVA 이하 절연변압기).", "누전차단기"], ["누전차단기는 들어가는 전류와 나오는 전류의 차이(누설전류)를 감지해 동작한다.", "O", "영상변류기(ZCT)로 왕복 전류의 차이를 감지. 차이 = 어딘가로 새는 전류.", "누전차단기"], ["누전차단기 시험(T) 버튼은 한 달에 한 번 정도 눌러 점검하는 것이 권장된다.", "O", "월 1회 시험 버튼 점검 권장. 눌렀을 때 떨어지지 않으면 교체.", "누전차단기"], ["누전차단기가 자꾸 떨어지면 레버를 테이프로 고정해 두면 된다.", "X", "떨어지는 건 어딘가 누전·과부하가 있다는 신호. 원인을 찾아야 한다.", "누전차단기"], ["누전차단기가 있으면 감전 사고를 100% 막아 준다.", "X", "두 전선 사이(선간)에 몸이 닿는 감전은 누설이 아니라 감지 못 한다.", "누전차단기"], ["누전차단기 정격감도전류 30mA는 30A와 같은 값이다.", "X", "1A = 1,000mA. 30mA는 0.03A로, 사람을 보호하려 아주 작게 잡은 값.", "누전차단기"], ["젖은 손으로 플러그를 꽂아도 220V 정도면 괜찮다.", "X", "젖은 피부는 저항이 크게 낮아져 같은 전압에서도 더 큰 전류가 흐른다.", "누전차단기"], ["접지의 목적 중 하나는 누전 시 기기 외함의 전압 상승을 억제해 감전을 막는 것이다.", "O", "보호접지: 외함과 대지 사이 전위차를 낮추고 차단기가 동작하게 한다.", "접지"], ["KEC에서도 접지는 1종·2종·3종·특별3종으로 구분한다.", "X", "KEC(2021~)는 종별 접지를 없애고 계통접지·보호접지·피뢰시스템접지로 구분.", "접지"], ["접지저항 값은 클수록 좋다.", "X", "접지저항은 작을수록 고장전류가 잘 흘러 외함 전압이 낮아진다.", "접지"], ["TN, TT, IT는 계통접지(접지계통) 방식의 이름이다.", "O", "KEC 203: 첫 글자는 전원 측 접지, 둘째 글자는 설비 노출도전부의 접지 방식.", "접지"], ["TT 계통은 전원 측 한 점을 접지하고, 설비 외함은 그와 독립된 접지극에 접속한다.", "O", "KEC 203.3 TT 계통. 국내 저압 수용가에 흔한 방식.", "접지"], ["보호도체(PE)와 중성선(N)을 하나로 겸용한 도체를 PEN 도체라 한다.", "O", "TN-C 계통에서 쓰는 겸용 도체. PE + N = PEN.", "접지"], ["보호도체(접지선) 중간에 퓨즈를 넣어 보호한다.", "X", "보호도체 회로에는 개폐장치·과전류차단기를 넣지 않는다(KEC 142.3). 끊기면 접지가 없어진다.", "접지"], ["사용전압 220V 저압 전로의 절연저항은 0.5MΩ 이상이면 된다.", "X", "KEC 132: 500V 이하 전로는 DC 500V로 측정해 1.0MΩ 이상. 0.5MΩ은 SELV·PELV 기준.", "접지"], ["절연저항 측정에는 클램프미터를 쓴다.", "X", "절연저항은 절연저항계(메거)로 측정. 클램프미터는 전류 측정용.", "접지"], ["등전위본딩은 손이 닿을 수 있는 도전부들을 전기적으로 연결해 전위차를 없애는 것이다.", "O", "KEC 143: 동시에 닿을 수 있는 금속 부분 사이의 전위차를 없애 감전을 막는다.", "접지"], ["중성선(N)은 접지돼 있으니 맨손으로 만져도 절대 안전하다.", "X", "부하 전류가 흐르고 결선 오류·단선 시 전압이 걸릴 수 있다. 활선으로 취급.", "접지"], ["KEC에서 교류 1,000V 이하는 저압이다.", "O", "KEC 111.1: 저압 = 교류 1kV 이하, 직류 1.5kV 이하.", "전압 구분"], ["KEC에서 직류는 1,500V 이하까지 저압이다.", "O", "직류는 교류보다 기준이 높다. 직류 1.5kV 이하 = 저압.", "전압 구분"], ["교류 7,000V를 넘으면 특고압이다.", "O", "고압 = 1kV 초과 7kV 이하, 특고압 = 7kV 초과.", "전압 구분"], ["KEC에서 교류 600V 이하만 저압이다.", "X", "600V는 옛 기준. KEC는 교류 1,000V 이하를 저압으로 본다.", "전압 구분"], ["교류 3,300V는 고압이다.", "O", "1kV 초과 7kV 이하 = 고압. 3.3kV·6.6kV가 여기 속한다.", "전압 구분"], ["한전 배전선로 22.9kV는 고압이다.", "X", "7kV를 넘으므로 특고압. 22.9kV는 특고압 배전전압.", "전압 구분"], ["우리나라 일반 가정 콘센트 전압은 220V, 주파수는 60Hz다.", "O", "단상 220V 60Hz. 일본은 100V, 유럽은 230V 50Hz.", "전압 구분"], ["우리나라 전력 계통 주파수는 50Hz다.", "X", "우리나라는 60Hz. 50Hz는 유럽·중국·일본 일부.", "전압 구분"], ["한전 22.9kV 배전은 3상 3선식 비접지 방식이다.", "X", "22.9kV-Y 다중접지 3상 4선식이다. 중성선이 함께 간다.", "전압 구분"], ["154kV는 배전전압이다.", "X", "154kV·345kV·765kV는 송전전압. 배전은 22.9kV와 저압.", "전압 구분"], ["3상 4선식 220/380V에서 380V는 선간전압, 220V는 상전압이다.", "O", "Y결선: 선간 = 상전압 × √3. 220 × 1.732 ≈ 380V.", "전압 구분"], ["Y결선에서 선간전압은 상전압의 √3배다.", "O", "선간전압 = √3 × 상전압. Δ결선은 선간 = 상전압.", "전압 구분"], ["역률은 피상전력에 대한 유효전력의 비다.", "O", "역률 = P(kW) ÷ S(kVA) = cosθ.", "역률"], ["역률이 1에 가까울수록 같은 유효전력을 보내는 데 필요한 전류가 작아진다.", "O", "I = P ÷ (V × cosθ). 역률이 높으면 전류·손실·설비 용량이 줄어든다.", "역률"], ["유도전동기 역률 개선용 콘덴서는 부하에 직렬로 연결한다.", "X", "진상용 콘덴서는 부하에 병렬로 연결해 지상 무효전력을 상쇄한다.", "역률"], ["역률 개선용 콘덴서를 너무 많이 넣으면 진상 역률이 되어 오히려 좋지 않다.", "O", "과보상 → 진상 역률, 전압 상승·손실 증가. 한전도 진상 역률에 요금을 더 받는다.", "역률"], ["역률이 낮으면 같은 일을 하는 데 더 많은 전류가 흘러 선로 손실이 늘어난다.", "O", "손실은 I²R. 전류가 커지면 손실은 제곱으로 늘어난다.", "역률"], ["유효전력의 단위는 var이다.", "X", "유효전력은 W(와트). var는 무효전력, VA는 피상전력 단위.", "역률"], ["피상전력의 단위는 W(와트)다.", "X", "피상전력 S = V × I 의 단위는 VA. 변압기·발전기 용량은 kVA로 표시한다.", "역률"], ["전열기처럼 순수 저항 부하의 역률은 1이다.", "O", "전압과 전류의 위상이 같아 cosθ = 1. 무효전력이 없다.", "역률"], ["역률이 낮아도 전기요금에는 아무 영향이 없다.", "X", "한전은 지상역률 90% 기준으로 미달 시 기본요금을 추가, 초과 시 감액한다.", "역률"], ["변압기는 전자기 유도로 교류 전압을 바꾸는 기기다.", "O", "1차 코일의 변화하는 자속이 2차 코일에 전압을 유도한다.", "변압기"], ["변압기는 직류 전압도 그대로 변성할 수 있다.", "X", "직류는 자속이 변하지 않아 유도가 안 된다. 직류를 넣으면 코일이 과열된다.", "변압기"], ["이상 변압기에서 1차·2차 전압의 비는 권수비와 같다.", "O", "V1/V2 = N1/N2 = a. 전류는 반대로 I1/I2 = N2/N1.", "변압기"], ["변압기로 전압을 1/2로 낮추면 전류도 1/2로 줄어든다.", "X", "전력이 같으므로 전압이 1/2이면 전류는 약 2배가 된다.", "변압기"], ["변압기 용량의 단위는 kW다.", "X", "변압기 용량은 피상전력 kVA. 부하 역률에 따라 쓸 수 있는 kW가 달라진다.", "변압기"], ["변압기 철심을 얇은 강판을 겹쳐 만드는 이유는 와전류(맴돌이전류) 손실을 줄이기 위해서다.", "O", "성층 철심. 얇을수록 와전류 경로가 끊겨 철손이 줄어든다.", "변압기"], ["변압기의 철손(무부하손)은 부하가 없으면 0이다.", "X", "철손은 전압만 걸려 있으면 부하와 상관없이 늘 발생한다.", "변압기"], ["변압기의 동손은 부하 전류의 제곱에 비례한다.", "O", "동손 = I²R. 부하가 2배면 동손은 4배.", "변압기"], ["변압기 %임피던스가 작을수록 2차측 단락전류는 작아진다.", "X", "단락전류 = 정격전류 × 100/%Z. %Z가 작으면 단락전류는 커진다.", "변압기"], ["변압기 2차측 중성점 접지는 고저압 혼촉 시 저압측 전압 상승을 막기 위한 것이다.", "O", "KEC 142.5·322.1: 혼촉 시 저압 전로에 고압이 그대로 걸리는 것을 막는다.", "변압기"], ["유입변압기의 절연유는 절연과 냉각 두 가지 역할을 한다.", "O", "절연유는 권선 사이를 절연하고 열을 외부로 옮긴다.", "변압기"], ["Δ-Δ 결선 변압기는 한 대가 고장 나도 V결선으로 운전할 수 있다.", "O", "남은 두 대로 V결선 운전 가능. 단 출력은 줄어든다.", "변압기"], ["V결선의 출력은 Δ결선 출력의 약 2/3(66.7%)다.", "X", "V결선 출력 = Δ결선의 1/√3 ≈ 57.7%. 이용률은 86.6%.", "변압기"], ["부흐홀츠 계전기는 유입변압기 내부 고장을 검출한다.", "O", "내부 고장 시 생기는 가스·유류의 흐름을 감지. 콘서베이터와 본체 사이에 설치.", "변압기"], ["몰드변압기는 절연유를 사용한다.", "X", "몰드변압기는 권선을 에폭시 수지로 굳힌 건식. 기름이 없어 화재에 유리.", "변압기"], ["MCCB는 배선용차단기, ELB는 누전차단기다.", "O", "MCCB(Molded Case Circuit Breaker), ELB·ELCB(Earth Leakage Circuit Breaker).", "차단기·개폐기"], ["ACB(기중차단기)는 주로 특고압 수전용으로 쓴다.", "X", "ACB는 공기 중에서 소호하는 저압 대용량 차단기. 특고압은 VCB·GCB.", "차단기·개폐기"], ["VCB(진공차단기)는 고압·특고압 회로에 쓴다.", "O", "진공 속에서 아크를 끊는다. 22.9kV 수전 설비의 주차단기로 흔하다.", "차단기·개폐기"], ["GCB(가스차단기)의 소호 매질은 질소(N₂)다.", "X", "GCB는 SF₆(육불화황) 가스로 아크를 끊는다.", "차단기·개폐기"], ["OCB는 기중차단기다.", "X", "OCB(Oil Circuit Breaker)는 유입차단기. 기중차단기는 ACB. 지금은 거의 VCB로 대체.", "차단기·개폐기"], ["차단기(CB)는 부하전류뿐 아니라 단락(고장)전류도 끊을 수 있다.", "O", "차단기의 핵심 능력은 정격차단전류. 고장전류를 끊는 것이 본업.", "차단기·개폐기"], ["단로기(DS)는 부하전류가 흐르는 상태에서 열어도 된다.", "X", "단로기는 소호 장치가 없어 무부하 상태에서만 개폐. 부하 중 열면 아크 사고.", "차단기·개폐기"], ["LBS(부하개폐기)는 부하전류는 끊을 수 있지만 단락전류는 끊지 못한다.", "O", "그래서 LBS에는 전력퓨즈(PF)를 함께 달아 단락을 보호한다.", "차단기·개폐기"], ["수변전실 정전 작업 시 차단기(CB)를 먼저 열고 그다음 단로기(DS)를 연다.", "O", "끊을 때는 CB → DS. 전류를 끊는 건 차단기, 단로기는 무부하에서.", "차단기·개폐기"], ["복전(전원 투입) 시에는 차단기(CB)를 먼저 넣고 단로기(DS)를 나중에 넣는다.", "X", "넣을 때는 DS → CB. 단로기를 먼저 넣고 차단기로 전류를 통한다.", "차단기·개폐기"], ["COS(컷아웃스위치)는 변압기 1차측 보호에 쓰는 퓨즈 개폐기다.", "O", "주상변압기 1차측에 달린 퓨즈 홀더. 과전류 시 퓨즈가 끊어진다.", "차단기·개폐기"], ["전력퓨즈(PF)는 동작 후 리셋해서 다시 쓸 수 있다.", "X", "퓨즈는 한 번 끊어지면 교체해야 한다. 재투입은 차단기만.", "차단기·개폐기"], ["과전류계전기(OCR)는 전류가 설정값을 넘으면 차단기에 트립 신호를 보낸다.", "O", "CT로 전류를 받아 판단 → 차단기 트립 코일에 신호. 계전기는 직접 전류를 끊지 않는다.", "차단기·개폐기"], ["배선용차단기(MCCB)는 누전을 감지해 차단한다.", "X", "MCCB는 과부하·단락 보호. 누전은 누전차단기(ELB)가 감지한다.", "차단기·개폐기"], ["배선용차단기는 과부하와 단락을 보호한다.", "O", "열동(과부하)·전자(단락) 트립 장치가 들어 있다.", "차단기·개폐기"], ["ATS는 상용전원이 끊기면 비상(발전기) 전원으로 자동 전환하는 개폐기다.", "O", "ATS(Automatic Transfer Switch). 정전 → 발전기 기동 → 자동 절체.", "차단기·개폐기"], ["피뢰기(LA)는 낙뢰 등 이상전압을 대지로 방전시켜 기기를 보호한다.", "O", "이상전압이 오면 방전하고, 지나가면 속류를 스스로 끊는다.", "차단기·개폐기"], ["CT(변류기) 2차측은 사용하지 않을 때 개방해 두어야 안전하다.", "X", "CT 2차 개방은 고전압 발생·소손 위험. 쓰지 않을 때는 반드시 단락.", "차단기·개폐기"], ["PT(계기용변압기) 2차측은 단락해 두어야 안전하다.", "X", "PT 2차 단락은 큰 전류로 소손. PT는 개방, CT는 단락이 기본.", "차단기·개폐기"], ["CT 2차 정격 전류는 보통 5A다.", "O", "예: 200/5A. 1차 200A가 흐르면 2차에 5A. (1A 규격도 있음)", "차단기·개폐기"], ["PT 2차 정격 전압은 보통 110V다.", "O", "예: 22,900/110V. 계기·계전기는 110V를 받아 동작한다.", "차단기·개폐기"], ["SPD(서지보호장치)는 낙뢰 등 서지 과전압으로부터 기기를 보호한다.", "O", "KEC 153·전기설비기술기준: 저압 설비 보호용 SPD. 서지를 대지로 흘린다.", "차단기·개폐기"], ["피뢰침은 낙뢰가 건물에 떨어지지 않게 막아 주는 장치다.", "X", "피뢰침은 낙뢰를 자신에게 끌어 접지로 흘려보내는 길이다. 막는 것이 아니다.", "차단기·개폐기"], ["유도전동기를 직입 기동하면 기동전류가 정격의 수 배(약 5~7배)까지 흐른다.", "O", "       $('ex').textContent='⭕ 맞았어요! 펑! '+(b>=0?'⚠️ 하나도 같이 치웠어요':'');
      const n1=active().length;if(n1>n0)$('ex').textContent+=' · 새 카드 '+CAT[ORDER[n1-1]]+' '+ORDER[n1-1]+' 등장';
    }else $('ex').textContent='⭕ 맞았어요! '+k+' 칸에 들어감';
    $('qt').textContent='다음 카드를 골라요';render();check();
  }else{G.wrong++;G.lastMiss=G.cur;put(BAD);tone(170,0,.3,'square');G.wait=true;
    $('qt').innerHTML='❌ 아까워요. 정답은 <b>'+q[1]+'</b><div style="font-size:18px;font-weight:500;opacity:.85;margin:4px 0">'+q[0]+'</div><span style="font-weight:500">'+q[2]+'</span>';$('ex').textContent='';$('btns').classList.add('hide');$('okb').classList.remove('hide');render();
    if(G.tray.length>=TRAY){G.wait=false;$('okb').classList.add('hide');$('btns').classList.remove('hide');setTimeout(over,900)}}}
function check(){if(G.tray.length>=TRAY)over()}
function cont(){G.wait=false;$('okb').classList.add('hide');$('btns').classList.remove('hide');$('qt').textContent='다음 카드를 골라요';$('ex').textContent='';render()}
function over(){if(G.over)return;G.over=true;sv.plays++;sv.pops+=G.pops;const prev=sv.best;if(G.pops>sv.best)sv.best=G.pops;save();
  $('oS').textContent='펑 '+G.pops+'번';
  $('oB').textContent=G.pops>prev?'최고 기록 갱신! (전 '+prev+'번)':G.pops===prev?'최고 기록과 같아요 ('+prev+'번)':'최고 '+prev+'번까지 '+(prev-G.pops)+'번 남음';
  $('oR').textContent='맞힘 '+G.right+' · 틀림 '+G.wrong+' · 지금까지 펑 '+sv.pops+'번';
  const f=Q[G.lastMiss!=null?G.lastMiss:G.cur];$('oF').innerHTML='💡 <b>'+f[0]+'</b> → 정답 '+f[1]+'<br>'+f[2];
  tone(220,0,.4,'sawtooth');$('over').style.display='flex';render()}
$('bO').onclick=()=>answer('O');$('bX').onclick=()=>answer('X');$('okb').onclick=cont;$('again').onclick=start;
window.__game={get state(){return {pops:G.pops,tray:G.tray.slice(),cards:G.cards.slice(),sel:G.sel,wait:G.wait,over:G.over,answer:G.cur!=null&&G.sel>=0?Q[G.cur][1]:null,save:sv}},choose,answer,cont,restart:start};
start();
</script></body></html>
