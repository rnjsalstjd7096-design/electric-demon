<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>들어간 만큼 돌아왔나?: 누전차단기 저울</title>
<style>
:root{--bg:#10161c;--ink:#fff;--sub:#cdd8e2;--ok:#46e07a;--bad:#ff5050;--y:#ffd23a;--in:#ff9a3d;--out:#4fb0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
#app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:8px 12px 64px}
.top{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:4px 2px}
.rule{font-size:20px;color:var(--sub);text-align:center;margin:4px 0 2px;font-weight:700}
#rank{font-size:16px;color:var(--y);text-align:center}
#card{margin:8px 0;background:#1d2833;border:2px solid #34475a;border-radius:16px;padding:10px;text-align:center;font-size:24px;font-weight:800;min-height:56px}
#scale{position:relative;flex:1;min-height:200px}
#post{position:absolute;left:50%;bottom:8%;width:14px;height:58%;margin-left:-7px;background:#8a97a5;border-radius:6px}
#base{position:absolute;left:50%;bottom:4%;width:120px;height:18px;margin-left:-60px;background:#8a97a5;border-radius:8px}
#beam{position:absolute;left:6%;right:6%;top:30%;height:12px;background:#c9d3dc;border-radius:6px;transition:transform .6s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 50%}
.pan{position:absolute;top:6px;width:44%;display:flex;flex-direction:column;align-items:center}
.pan.l{left:0}.pan.r{right:0}
.pan .lab{font-size:19px;font-weight:900;margin-top:4px;white-space:nowrap}
.pan .chips{display:flex;flex-wrap:wrap-reverse;justify-content:center;gap:3px;width:100%;transform:translateY(-100%);position:absolute;top:-6px}
.chip{width:26px;height:26px;border-radius:7px;font-size:17px;line-height:26px;text-align:center;font-weight:900;color:#111}
.l .chip{background:var(--in)}.r .chip{background:var(--out)}
.pan .dish{width:100%;height:10px;background:#c9d3dc;border-radius:0 0 30px 30px}
.pan .n{font-size:28px;font-weight:900}
.l .lab,.l .n{color:var(--in)}.r .lab,.r .n{color:var(--out)}
#btns{display:flex;gap:10px;margin-top:6px}
#btns button,#next{flex:1;min-height:72px;border:0;border-radius:16px;font-size:24px;font-weight:900}
#keep{background:#2f8f55;color:#fff}#trip{background:#e04848;color:#fff}
#next{display:none;width:100%;background:var(--y);color:#222;margin-top:6px}
#why{font-size:20px;text-align:center;min-height:56px;color:var(--sub);margin-top:6px;line-height:1.35}
#over{position:fixed;inset:0;background:rgba(5,8,10,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.box{max-width:400px;width:100%;background:#1d2833;border-radius:18px;padding:20px;text-align:center;font-size:21px;line-height:1.5}
.box h2{margin:0 0 6px;font-size:30px}.big{font-size:42px;font-weight:900;color:var(--y)}
.tip{background:#0f151b;border-radius:12px;padding:10px;margin:12px 0;font-size:19px;color:var(--sub);text-align:left}
#again{width:100%;min-height:64px;border:0;border-radius:14px;background:var(--ok);color:#052;font-size:26px;font-weight:900}
#toast{position:fixed;left:50%;top:38%;white-space:nowrap;transform:translate(-50%,-50%) scale(.6);font-size:32px;font-weight:900;opacity:0;transition:.3s;pointer-events:none;text-shadow:0 2px 8px #000;z-index:4}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.spark{position:fixed;font-size:26px;pointer-events:none;z-index:4;transition:transform .7s ease-out,opacity .7s}
</style><meta name="description" content="저울 양쪽 들어간 전류와 돌아온 전류를 보고 같으면 그대로, 다르면 누전차단기를 내리는 판단 퍼즐(❤ 3개)."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/leak-scale/"><meta property="og:title" content="들어간 만큼 돌아왔나?: 누전차단기 저울"><meta property="og:description" content="저울 양쪽 들어간 전류와 돌아온 전류를 보고 같으면 그대로, 다르면 누전차단기를 내리는 판단 퍼즐(❤ 3개)."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="들어간 만큼 돌아왔나?: 누전차단기 저울",D="저울 양쪽 들어간 전류와 돌아온 전류를 보고 같으면 그대로, 다르면 누전차단기를 내리는 판단 퍼즐(❤ 3개).",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/leak-scale/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head><body>
<div id="app">
 <div class="top"><span>맞힘 <span id="sc">0</span></span><span id="hp">❤❤❤</span><span>최고 <span id="best">0</span></span></div>
 <p class="rule">들어간 만큼 돌아오면 그대로, 다르면 차단!</p>
 <div id="rank"></div>
 <div id="card">🔌</div>
 <div id="scale"><div id="base"></div><div id="post"></div>
  <div id="beam">
   <div class="pan l"><div class="chips" id="cin"></div><div class="dish"></div><div class="n" id="nin">0</div><div class="lab">들어간 전류 →</div></div>
   <div class="pan r"><div class="chips" id="cout"></div><div class="dish"></div><div class="n" id="nout">0</div><div class="lab">← 돌아온 전류</div></div>
  </div>
 </div>
 <div id="why"></div>
 <div id="btns"><button id="keep">✅ 그대로</button><button id="trip">⚡ 딸깍 차단</button></div>
 <button id="next">다음 ▶</button>
</div>
<div id="toast"></div>
<div id="over"><div class="box">
 <h2>차단기 판단 끝!</h2>
 <div class="big" id="oScore">0개 맞힘</div>
 <div id="oGap"></div>
 <div class="tip" id="oTip"></div>
 <button id="again">한 번 더</button>
 <div style="font-size:17px;color:var(--sub);margin-top:8px">지금까지 맞힌 판단 <span id="oTot">0</span>개</div>
</div></div>
<script>
(function(){
const KEY='leak-scale.save.v1';let save={best:0,total:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)save=Object.assign(save,s);}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
let ac=null;
function tone(f,d,t,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.14;o.connect(g);g.connect(ac.destination);const n=ac.currentTime;g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d);}catch(e){}}
const $=id=>document.getElementById(id);const rnd=a=>a[Math.floor(Math.random()*a.length)];const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const GEAR=['📺 TV 보는 중','🍚 전기밥솥 취사 중','👕 세탁기 돌리는 중','💨 드라이기 쓰는 중','🧊 냉장고 돌아가는 중','🔥 전기난로 켬','💡 형광등 켬','🔌 멀티탭에 충전기 여러 개','☕ 전기포트 물 끓임'];
const BIG=['🍚+❄ 밥솥에 에어컨까지 같이','🔥+☕ 난로에 전기포트까지 같이','👕+💨 세탁기에 드라이기까지 같이'];
const LEAK=['젖은 손으로 만져서 일부가 사람 몸으로 샜어요','낡은 전선 껍질 틈으로 일부가 땅으로 샜어요','기계 겉통(외함)으로 일부가 샜어요','콘센트에 물이 들어가 일부가 다른 길로 샜어요'];
const TIPS=['누전차단기는 들어간 전류와 돌아온 전류의 「차이」를 봅니다. 차이가 난다 = 어딘가로 새고 있다는 뜻.','전기를 많이 써도 들어간 만큼 다 돌아오면 누전은 아닙니다. 많이 써서 떨어지는 건 과전류(배선용차단기) 쪽 일이에요.','뿌레카(차단기) 중 배선용은 전선을 지키고, 누전차단기는 사람을 지킵니다.'];
const RANKS=[[0,'견습 전기공'],[30,'기능공'],[80,'현장 반장'],[160,'전기 명인']];
let st,q;
function rank(){let r=RANKS[0][1];RANKS.forEach(x=>{if(save.total>=x[0])r=x[1];});return '내 등급: '+r+' (누적 '+save.total+'개)';}
function make(){
 const lv=st.score;const big=lv>=4&&Math.random()<.3;
 const maxN=Math.min(4+Math.floor(lv/2),14);const leak=Math.random()<.5;
 let a=big?ri(Math.max(6,maxN-3),Math.max(8,maxN)):ri(3,Math.max(4,maxN));
 let d=0;if(leak){d=lv<3?ri(2,3):lv<8?ri(1,2):1;if(d>=a)d=a-1;}
 q={inN:a,outN:a-d,leak,big,gear:big?rnd(BIG):rnd(GEAR),why:leak?rnd(LEAK):(big?'많이 썼지만 들어간 만큼 다 돌아왔어요. 누전은 아님!':'들어간 만큼 다 돌아왔어요. 정상!')};
 q.ans=leak?'trip':'keep';
}
function chips(el,n,ch){el.innerHTML='';for(let i=0;i<n;i++){const c=document.createElement('div');c.className='chip';c.textContent=ch;el.appendChild(c);}}
function show(){
 $('card').textContent=q.gear;chips($('cin'),q.inN,'→');chips($('cout'),q.outN,'←');
 $('nin').textContent='?';$('nout').textContent='?';
 const d=q.inN-q.outN;$('beam').style.transform='rotate('+(d*2.2)+'deg)';
 $('why').textContent='새는 곳 없이 다 돌아왔을까?';$('btns').style.display='flex';$('next').style.display='none';
 $('sc').textContent=st.score;$('hp').textContent='❤'.repeat(st.hp)+'🖤'.repeat(3-st.hp);$('best').textContent=save.best;$('rank').textContent=rank();st.wait=true;
}
function toast(t,c){const e=$('toast');e.textContent=t;e.style.color=c;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),900);}
function burst(){for(let i=0;i<14;i++){const s=document.createElement('div');s.className='spark';s.textContent='⚡';s.style.left=(innerWidth/2)+'px';s.style.top=(innerHeight*.4)+'px';document.body.appendChild(s);requestAnimationFrame(()=>{s.style.transform='translate('+((Math.random()-.5)*300)+'px,'+((Math.random()-.7)*300)+'px)';s.style.opacity=0;});setTimeout(()=>s.remove(),750);}}
function answer(a){
 if(!st.wait)return;st.wait=false;
 $('nin').textContent=q.inN;$('nout').textContent=q.outN;
 const ok=a===q.ans;
 if(ok){st.score++;save.total++;store();tone(660,.1);setTimeout(()=>tone(990,.18,'triangle',.12),90);if(navigator.vibrate)navigator.vibrate(30);burst();toast(a==='trip'?'딸깍! 잘 끊었어요':'맞아요! 그대로','#46e07a');}
 else{st.hp--;tone(170,.4,'sawtooth',.12);if(navigator.vibrate)navigator.vibrate([60,40,60]);toast(q.leak?'새고 있었어요!':'멀쩡했어요!','#ff5050');}
 $('why').textContent=(ok?'✅ ':'❌ ')+'들어감 '+q.inN+' · 돌아옴 '+q.outN+' — '+q.why;
 $('sc').textContent=st.score;$('hp').textContent='❤'.repeat(Math.max(0,st.hp))+'🖤'.repeat(3-Math.max(0,st.hp));$('rank').textContent=rank();
 $('btns').style.display='none';$('next').style.display='block';
 if(st.hp<=0){$('next').textContent='결과 보기 ▶';}else $('next').textContent='다음 ▶';
}
function next(){if(st.hp<=0){over();return;}make();show();}
function over(){const prev=save.best;if(st.score>prev)save.best=st.score;store();
 $('oScore').textContent=st.score+'개 맞힘';
 $('oGap').textContent=st.score>prev?'🎉 새 최고 기록!':'최고 '+prev+'개까지 '+(prev-st.score+1)+'개 남았어요';
 $('oTip').textContent='💡 '+rnd(TIPS);$('oTot').textContent=save.total;$('over').style.display='flex';}
function start(){st={score:0,hp:3};$('over').style.display='none';make();show();}
$('keep').onclick=()=>answer('keep');$('trip').onclick=()=>answer('trip');$('next').onclick=next;$('again').onclick=start;
window.__game={get state(){return st;},get q(){return q;},answer,next,save:()=>save};
start();
})();
</script></body></html>
