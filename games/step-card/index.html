<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>딱 한 칸!: 전기 카드 이어 놓기 퍼즐</title>
<meta name="description" content="바닥 카드보다 1 크거나 작은 카드를 피라미드에서 골라 이어 놓는 카드 퍼즐. 뒤집기 카드가 떨어지고 놓을 카드가 없으면 끝.">
<style>
html,body{margin:0;height:100%;background:#14161b;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;font-size:20px}
#app{position:relative;margin:0 auto;max-width:480px;height:100%;display:flex;flex-direction:column;padding:8px 12px 10px;box-sizing:border-box}
#top{display:flex;align-items:center;justify-content:space-between;padding-left:44px;padding-right:56px;min-height:48px}
#top b{font-size:20px;white-space:nowrap}#stat{white-space:nowrap;font-size:20px;font-weight:800;color:#ffd23f}
#sub{font-size:20px;line-height:1.35;color:#e8ebf2;text-align:center;margin:4px 0 8px;word-break:keep-all}
#board{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
.btn{flex:1;border:0;border-radius:14px;font-size:20px;font-weight:800;min-height:56px;font-family:inherit;cursor:pointer;touch-action:manipulation;background:#3b4252;color:#fff;box-shadow:0 4px 0 #1f232c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f232c}.btn.main{background:#ffd23f;color:#2b2000;box-shadow:0 4px 0 #a98400}
#mute{position:absolute;top:8px;right:10px;width:48px;height:48px;border:0;border-radius:24px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;z-index:5}
#end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,11,16,.78);z-index:4;padding:16px;box-sizing:border-box}
#end.on{display:flex}
#card{width:100%;max-width:360px;background:#2b2f3a;border:3px solid #4a505f;border-radius:18px;padding:18px;box-sizing:border-box;text-align:center;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#endTitle{font-size:24px;font-weight:800;margin:0 0 6px}#endScore{font-size:52px;font-weight:900;line-height:1.1;color:#ffd23f}
#endSub{font-size:20px;color:#e8ebf2;margin:4px 0}#endBest{font-size:20px;font-weight:700;color:#9fe1ff;margin:0 0 10px}
#fact{font-size:20px;line-height:1.45;background:#1d2029;border-radius:12px;padding:10px 12px;margin:0 0 12px;text-align:left;word-break:keep-all}
.shake{animation:sk .3s}@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.sp{position:absolute;font-size:28px;animation:fl .8s ease-out forwards}@keyframes fl{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.6)}}
#bar{width:100%;text-align:center;min-height:56px;font-size:20px;font-weight:700;color:#9fe1ff;margin-top:6px;line-height:1.3;word-break:keep-all}

#grid{flex:none;position:relative;width:min(100%,372px,calc(100vh - 370px));aspect-ratio:1;background:#2b2f3a;border-radius:16px;padding:8px;box-sizing:border-box;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;touch-action:none;margin-top:4px}
#tab{position:relative;width:100%;max-width:420px;flex:1;min-height:0}
.k{position:absolute;border-radius:12px;background:#fff8e6;color:#1d2029;border:3px solid #c9b98a;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .15s}
.k .v{font-size:34px}.k .i{font-size:18px;margin-top:2px}
.k.down{background:repeating-linear-gradient(45deg,#3a4a7a,#3a4a7a 6px,#33416b 6px,#33416b 12px);border-color:#5a6a9a;color:transparent}
.k.gone{animation:out .3s ease-in forwards;pointer-events:none}@keyframes out{to{transform:translateY(120px) scale(.5);opacity:0}}
#low{flex:none;display:flex;gap:18px;align-items:center;justify-content:center;margin-top:6px}
#stock,#waste{position:relative;width:84px;height:112px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}
#stock{background:repeating-linear-gradient(45deg,#3a4a7a,#3a4a7a 6px,#33416b 6px,#33416b 12px);border:3px solid #9fe1ff;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 0 #1f232c}
#stock.empty{opacity:.35}
#waste{background:#ffd23f;color:#2b2000;border:3px solid #a98400}#waste .v{font-size:48px}#waste .i{font-size:20px}
.lbl{font-size:18px;color:#aeb4c2;text-align:center;margin-top:4px}
</style>
<meta name="description" content="바닥 카드보다 1 크거나 작은 카드(9 다음 1)를 피라미드에서 골라 이어 놓아 판을 비우는 카드 퍼즐. 뒤집기 카드가 떨어지고 놓을 카드가 없으면 끝."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/step-card/"><meta property="og:title" content="딱 한 칸!: 전기 카드 이어 놓기 퍼즐"><meta property="og:description" content="바닥 카드보다 1 크거나 작은 카드(9 다음 1)를 피라미드에서 골라 이어 놓아 판을 비우는 카드 퍼즐. 뒤집기 카드가 떨어지고 놓을 카드가 없으면 끝."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="딱 한 칸!: 전기 카드 이어 놓기 퍼즐",D="바닥 카드보다 1 크거나 작은 카드(9 다음 1)를 피라미드에서 골라 이어 놓아 판을 비우는 카드 퍼즐. 뒤집기 카드가 떨어지고 놓을 카드가 없으면 끝.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/step-card/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div id="top"><b id="lv"></b><span id="stat"></span></div>
  <div id="sub"></div>
  <div id="board"></div>
  <div id="bar"></div>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <div id="fx"></div>
  <div id="end"><div id="card">
    <div id="endTitle"></div><div id="endScore"></div><div id="endSub"></div><div id="endBest"></div>
    <div id="fact"></div>
    <button class="btn main" id="again" style="width:100%">한 번 더</button>
  </div></div>
</div>
<script>
"use strict";
const KEY='step-card.save.v1';
const $=id=>document.getElementById(id);
let save={best:0,plays:0,fi:0};
try{const r=localStorage.getItem(KEY);if(r)save=Object.assign(save,JSON.parse(r));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
let muted=false,AC=null;
try{muted=localStorage.getItem(KEY+'.mute')==='1';}catch(e){}
function actx(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();}if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,t,v,when){if(muted)return;const a=actx();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;const s=a.currentTime+(when||0);g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d);}catch(e){}}
const sfx={tap(){tone(520,.07,'triangle',.1)},ok(){tone(660,.1,'triangle',.14);tone(880,.14,'triangle',.14,.09)},bad(){tone(180,.25,'sawtooth',.12)},
 done(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.08))},lose(){[330,262,196].forEach((f,i)=>tone(f,.28,'sawtooth',.1,i*.16))}};
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function burst(x,y,ch){const fx=$('fx'),r=fx.getBoundingClientRect();for(let i=0;i<5;i++){const s=document.createElement('div');s.className='sp';s.textContent=ch||'✨';s.style.left=(x-r.left-14+(Math.random()*60-30))+'px';s.style.top=(y-r.top-14+(Math.random()*30-15))+'px';fx.appendChild(s);setTimeout(()=>s.remove(),850);}}
function burstEl(el,ch){if(!el)return burst(innerWidth/2,innerHeight/3,ch);const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,ch);}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'.mute',muted?'1':'0');}catch(e){}if(!muted)sfx.tap();};
function showEnd(title,score,sub,best,isNew,fact){$('endTitle').textContent=title;$('endScore').textContent=score;$('endSub').textContent=sub;const b=$('endBest');b.textContent=best;b.style.color=isNew?'#ffd23f':'#9fe1ff';$('fact').innerHTML=fact;$('end').classList.add('on');}
function hideEnd(){$('end').classList.remove('on');}
function endGame(t,n,unit,extra,facts){over=true;save.plays++;const nb=n>save.best;const prev=save.best;if(nb)save.best=n;const f=facts[save.fi++%facts.length];persist();sfx.lose();
 const gap=nb?0:save.best-n;
 showEnd(t,n+unit,extra+(nb?'':' · 최고 기록까지 '+(gap+1)+unit+' (아깝다!)'),nb?'신기록! 이전 최고 '+prev+unit:'최고 '+save.best+unit,nb,'<b>'+f[0]+'</b> — '+f[1]);}
// 카드 숫자 1~9는 놀이 숫자(9 다음 1). 화면 전기 사실은 FACTS.md만.
save.tot=save.tot||0;
const ICON=['⚡','💡','🔌','🔋'];
const FACTS=[['한 줄(직렬)로 이은 전구','하나만 끊겨도 전부 꺼진다. 옛날 크리스마스 줄 전구 한 알이 빠지면 줄 전체가 꺼지던 이유.'],
 ['우리 집 전등·콘센트는 나란히(병렬)','하나를 꺼도 나머지는 그대로다.'],
 ['W를 220으로 나누면 대충 A','집 전기는 220V. 전력(W) = 전압(V) × 전류(A)라서 A ≒ W ÷ 220.'],
 ['1kW는 1000W','전기포트 이름표에 1.8kW라고 적혀 있으면 1,800W라는 뜻이다.']];
let stage,score,cards,stock,tp,over,streak,R;
function wrap(v){return v<1?9:v>9?1:v}
function covered(c){if(c.r===R-1)return false;return cards.some(o=>!o.gone&&o.r===c.r+1&&(o.i===c.i||o.i===c.i+1))}
function ok(v){return Math.abs(v-tp)===1||(v===1&&tp===9)||(v===9&&tp===1)}
function deal(){
 R=stage===1?3:stage===2?4:5;cards=[];for(let r=0;r<R;r++)for(let i=0;i<=r;i++)cards.push({r,i,v:0,gone:false});
 // 풀리는 순서를 먼저 정하고 숫자를 붙인다(판은 반드시 풀림)
 tp=1+rnd(9);const start=tp;let prev=tp;const draws=[];const tmp=cards.map(c=>({...c}));
 const cov=c=>c.r<R-1&&tmp.some(o=>!o.gone&&o.r===c.r+1&&(o.i===c.i||o.i===c.i+1));
 let left=tmp.length;while(left>0){
  if(left<tmp.length&&Math.random()<(stage<3?.18:.28)){prev=1+rnd(9);draws.push(prev);}
  const free=tmp.filter(c=>!c.gone&&!cov(c));const c=free[rnd(free.length)];prev=wrap(prev+(rnd(2)?1:-1));c.v=prev;c.gone=true;left--;}
 tmp.forEach((c,k)=>cards[k].v=c.v);
 const spare=Math.max(2,7-stage);for(let k=0;k<spare;k++)draws.splice(rnd(draws.length+1),0,1+rnd(9));
 stock=draws;tp=start;streak=0;render();
}
function render(){
 $('lv').textContent=stage+'판';$('stat').textContent=score+'장';
 $('sub').textContent='노란 카드보다 1 크거나 작은 카드를 눌러라';
 const b=$('board');if(!$('tab')){b.innerHTML='<div id="tab"></div><div id="low"><div><div id="stock"></div><div class="lbl">뒤집기</div></div><div><div id="waste"></div><div class="lbl">바닥 카드</div></div></div>';$('stock').onclick=draw;}
 const tab=$('tab');tab.innerHTML='';const tw=tab.clientWidth||360,th=tab.clientHeight||380;
 let cw=Math.min(76,(tw-8)/R/1.06);let ch=cw*1.3;const step=Math.min(ch*.62,(th-ch)/Math.max(1,R-1));
 cards.forEach((c,k)=>{if(c.gone)return;const e=document.createElement('div');const down=covered(c);e.className='k'+(down?' down':'');e.id='c'+k;
  e.style.width=cw+'px';e.style.height=ch+'px';e.style.left=(tw/2+(c.i-c.r/2)*cw*1.06-cw/2)+'px';e.style.top=(c.r*step)+'px';e.style.zIndex=c.r+1;
  e.innerHTML='<span class="v">'+c.v+'</span><span class="i">'+ICON[c.v%4]+'</span>';e.onclick=()=>play(k,e);tab.appendChild(e);});
 $('waste').innerHTML='<span class="v">'+tp+'</span><span class="i">'+ICON[tp%4]+'</span>';
 const s=$('stock');s.textContent=stock.length?'남은 '+stock.length:'없음';s.classList.toggle('empty',!stock.length);
}
function play(k,el){if(over)return;actx();const c=cards[k];if(c.gone||covered(c))return;
 if(!ok(c.v)){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),320);sfx.bad();$('bar').textContent=c.v+'은(는) '+tp+'에서 한 칸 차이가 아니다';return;}
 c.gone=true;tp=c.v;score++;save.tot++;streak++;el.classList.add('gone');tone(440+streak*60,.12,'triangle',.14);vib(20);burstEl(el,streak>=5?'🌟':'⚡');
 $('bar').textContent=streak>=3?streak+'연속 이어 놓기!':'딱 한 칸!';
 setTimeout(()=>{if(cards.every(o=>o.gone)){sfx.done();burst(innerWidth/2,innerHeight/3,'💡');$('bar').textContent=stage+'판 싹 비웠다!';stage++;persist();setTimeout(deal,700);}else{render();check();}},260);
}
function draw(){if(over||cards.every(c=>c.gone))return;actx();if(!stock.length){check();return;}tp=stock.shift();streak=0;sfx.tap();$('bar').textContent='한 장 뒤집었다';render();check();}
function check(){if(stock.length||cards.every(c=>c.gone))return;const any=cards.some(c=>!c.gone&&!covered(c)&&ok(c.v));if(!any){over=true;const left=cards.filter(c=>!c.gone).length;
 setTimeout(()=>endGame('더 놓을 카드가 없다',score,'장',stage+'판에서 카드 '+left+'장 남김',FACTS),600);}}
const _end=endGame;endGame=function(t,n,u,e,f){_end(t,n,u,e+' · 누적 '+save.tot+'장',f);};
function start(){stage=1;score=0;over=false;hideEnd();$('board').innerHTML='';$('bar').textContent='지금까지 놓은 카드 '+save.tot+'장';deal();}
$('again').onclick=()=>{sfx.tap();start();};
addEventListener('resize',()=>{if(cards)render();});
window.__game={get state(){return {stage,score,tp,stock:stock.length,left:cards.filter(c=>!c.gone).length,over}},
 sel(){if(over)return null;const k=cards.findIndex(c=>!c.gone&&!covered(c)&&ok(c.v));if(k>=0&&document.getElementById('c'+k))return '#c'+k;return stock.length?'#stock':null}};
start();
</script>
</body>
</html>
