<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>합쳐라!: 전기 부품 3합 퍼즐</title>
<meta name="description" content="같은 전기 부품 3개를 붙이면 다음 부품으로 합쳐지는 퍼즐. 칸이 다 차면 끝.">
<style>

html,body{margin:0;height:100%;background:#14161b;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;font-size:20px}
#app{position:relative;margin:0 auto;max-width:480px;height:100%;display:flex;flex-direction:column;padding:8px 12px 10px;box-sizing:border-box}
#top{display:flex;align-items:center;justify-content:space-between;padding-left:44px;padding-right:56px;min-height:48px}
#top b{font-size:20px}#stat{font-size:20px;font-weight:800;color:#ffd23f}
#sub{font-size:20px;line-height:1.35;color:#e8ebf2;text-align:center;margin:4px 0 8px;word-break:keep-all}
#board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.bar{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;border:0;border-radius:14px;font-size:20px;font-weight:800;min-height:56px;font-family:inherit;cursor:pointer;touch-action:manipulation;background:#3b4252;color:#fff;box-shadow:0 4px 0 #1f232c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f232c}.btn.main{background:#ffd23f;color:#2b2000;box-shadow:0 4px 0 #a98400}
#mute{position:absolute;top:8px;right:10px;width:48px;height:48px;border:0;border-radius:24px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;z-index:5}
#end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,11,16,.78);z-index:4;padding:16px;box-sizing:border-box}
#end.on{display:flex}
#card{width:100%;max-width:360px;background:#2b2f3a;border:3px solid #4a505f;border-radius:18px;padding:18px;box-sizing:border-box;text-align:center;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#endTitle{font-size:24px;font-weight:800;margin:0 0 6px}#endScore{font-size:52px;font-weight:900;line-height:1.1;color:#ffd23f}
#endSub{font-size:20px;color:#e8ebf2;margin:4px 0}#endBest{font-size:20px;font-weight:700;color:#9fe1ff;margin:0 0 10px}
#fact{font-size:20px;line-height:1.45;background:#1d2029;border-radius:12px;padding:10px 12px;margin:0 0 12px;text-align:left;word-break:keep-all}
.pop{animation:pp .35s ease-out}@keyframes pp{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.shake{animation:sk .3s}@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.sp{position:absolute;font-size:28px;animation:fl .8s ease-out forwards}@keyframes fl{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.6)}}


#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:380px}
.c{aspect-ratio:1/1;border-radius:12px;background:#1c1f26;border:2px solid #343a48;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;color:#fff;cursor:pointer;touch-action:manipulation;padding:0;line-height:1.05}
.c .e{font-size:28px}.c .n{font-size:15px;font-weight:800;margin-top:2px}
.c.t0{background:#2f3e5c;border-color:#5b78b3}.c.t1{background:#4b4420;border-color:#d8c04a}.c.t2{background:#1f4a35;border-color:#58d38d}
.c.t3{background:#4a2a52;border-color:#c98be0}.c.t4{background:#5a3317;border-color:#ff9f5a}.c.t5{background:#5a1f26;border-color:#ff6b7a}
#hud{display:flex;gap:10px;align-items:center;justify-content:center;margin:0 0 8px}
.pv{min-width:112px;border:3px solid #ffd23f;border-radius:14px;background:#2a2d12;padding:4px 10px;text-align:center;font-weight:800;font-size:18px;cursor:pointer}
.pv.h{border-color:#7aa7ff;background:#1b2740}
.pv .e{font-size:30px;display:block}

</style>
<meta name="description" content="같은 전기 부품 3개를 붙이면 다음 부품으로 합쳐지는 퍼즐. 칸이 다 차면 끝. 보관함으로 한 번 바꿀 수 있어요."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/merge-spark/"><meta property="og:title" content="합쳐라!: 전기 부품 3합 퍼즐"><meta property="og:description" content="같은 전기 부품 3개를 붙이면 다음 부품으로 합쳐지는 퍼즐. 칸이 다 차면 끝. 보관함으로 한 번 바꿀 수 있어요."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;top:max(8px,env(safe-area-inset-top));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="합쳐라!: 전기 부품 3합 퍼즐",D="같은 전기 부품 3개를 붙이면 다음 부품으로 합쳐지는 퍼즐. 칸이 다 차면 끝. 보관함으로 한 번 바꿀 수 있어요.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/merge-spark/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div id="top"><b id="lv"></b><span id="stat"></span></div>
  <div id="sub"></div>
  <div id="board"></div>
  <div class="bar" id="bar"></div>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <div id="fx"></div>
  <div id="end"><div id="card">
    <div id="endTitle"></div><div id="endScore"></div><div id="endSub"></div><div id="endBest"></div>
    <div id="fact"></div>
    <button class="btn main" id="again" style="width:100%">한 번 더</button>
  </div></div>
</div>
<script>
"use strict";
const KEY='merge-spark.save.v1';
let save={best:0,plays:0,fi:0};
try{const r=localStorage.getItem(KEY);if(r)save=Object.assign(save,JSON.parse(r));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
const $=id=>document.getElementById(id);
let muted=false,AC=null;
try{muted=localStorage.getItem(KEY+'.mute')==='1';}catch(e){}
function actx(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();}if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,t,v,when){if(muted)return;const a=actx();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;const s=a.currentTime+(when||0);g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d);}catch(e){}}
const sfx={tap(){tone(520,.07,'triangle',.1)},ok(){tone(660,.1,'triangle',.14);tone(880,.14,'triangle',.14,.09)},bad(){tone(180,.25,'sawtooth',.12)},
 done(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.08))},win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'square',.09,i*.09))},lose(){[330,262,196].forEach((f,i)=>tone(f,.28,'sawtooth',.1,i*.16))}};
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function burst(x,y,ch){const fx=$('fx'),r=fx.getBoundingClientRect();for(let i=0;i<5;i++){const s=document.createElement('div');s.className='sp';s.textContent=ch||'✨';s.style.left=(x-r.left-14+(Math.random()*60-30))+'px';s.style.top=(y-r.top-14+(Math.random()*30-15))+'px';fx.appendChild(s);setTimeout(()=>s.remove(),850);}}
function burstEl(el,ch){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,ch);}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'.mute',muted?'1':'0');}catch(e){}if(!muted)sfx.tap();};
function showEnd(title,score,sub,best,isNew,fact){$('endTitle').textContent=title;$('endScore').textContent=score;$('endSub').textContent=sub;const b=$('endBest');b.textContent=best;b.style.color=isNew?'#ffd23f':'#9fe1ff';$('fact').innerHTML=fact;$('end').classList.add('on');}
function hideEnd(){$('end').classList.remove('on');}

const T=[['🔋','건전지'],['💡','전구'],['🔌','콘센트'],['🔲','차단기'],['🗄️','분전반'],['⚡','변압기']];
const N=5;
let cells,nextT,holdT,score,over,busy,placed;
function rnd2(){const r=Math.random();return r<.6?0:r<.9?1:2;}
function start(){hideEnd();cells=Array(N*N).fill(-1);cells[12]=0;cells[13]=0;nextT=0;holdT=rnd2();score=0;over=false;busy=false;placed=0;
 $('bar').innerHTML='<button class="btn" id="swap">🔁 보관함과 바꾸기</button>';$('swap').onclick=swap;render();}
function swap(){if(over||busy)return;const t=nextT;nextT=holdT;holdT=t;sfx.tap();render();}
function render(){
 $('lv').textContent='3개 붙이면 합쳐요';$('stat').textContent=score+'점';
 $('sub').textContent='빈칸을 눌러 놓으세요. 같은 부품 3개가 붙으면 다음 부품이 됩니다';
 $('board').innerHTML='<div style="width:100%;display:flex;flex-direction:column;align-items:center"><div id="hud"><div class="pv"><small style="font-size:14px;display:block">지금</small><span class="e">'+T[nextT][0]+'</span>'+T[nextT][1]+'</div><div class="pv h" id="hold"><small style="font-size:14px;display:block">보관함</small><span class="e">'+T[holdT][0]+'</span>'+T[holdT][1]+'</div></div><div id="grid">'+
  cells.map((v,i)=>'<button class="c'+(v>=0?' t'+v:'')+'" data-i="'+i+'">'+(v>=0?'<span class="e">'+T[v][0]+'</span><span class="n">'+T[v][1]+'</span>':'')+'</button>').join('')+'</div></div>';
 document.querySelectorAll('.c').forEach(el=>el.onclick=()=>tap(+el.dataset.i,el));
 $('hold').onclick=swap;
}
function group(i){const t=cells[i],seen=new Set([i]),q=[i];while(q.length){const x=q.pop(),r=Math.floor(x/N),c=x%N;
  [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([a,b])=>{if(a<0||b<0||a>=N||b>=N)return;const k=a*N+b;if(cells[k]===t&&!seen.has(k)){seen.add(k);q.push(k);}});}
 return [...seen];}
function tap(i,el){
 if(over||busy||cells[i]>=0)return;
 cells[i]=nextT;placed++;sfx.tap();let at=i,chain=0;
 const step=()=>{const g=group(at);
  if(g.length>=3){const t=cells[at];chain++;g.forEach(k=>cells[k]=-1);
   score+=g.length*(t+1)*10*chain;
   if(t<5){cells[at]=t+1;sfx.done();vib(30);}else{score+=300;sfx.win();vib([40,40,60]);}
   render();const e=document.querySelector('.c[data-i="'+at+'"]');if(e){e.classList.add('pop');burstEl(e,chain>1?'🎆':'✨');}
   if(t<5){busy=true;setTimeout(()=>{busy=false;step();},260);return;}}
  after();};
 step();
}
function after(){nextT=rnd2();render();
 if(cells.every(v=>v>=0)){finish();}}
const FACTS=[
 ['ELB','「ELB 떨어졌다」는 누전으로 내려갔다는 말입니다. 전기가 새면 바로 끊는 차단기예요.'],
 ['메인 차단기','분전반 맨 위, 전체를 끊는 차단기예요. 「메인 내려」는 전체 전기 끊으라는 말입니다.'],
 ['전력량계','쓴 전기를 재는 기계예요. 현장에서 「계량기 돈다」 하면 전기 쓰고 있다는 말입니다.'],
 ['분전반','차단기들이 모여 있는 함이에요. 「분전반 열어 봐」는 차단기 함 보라는 말입니다.'],
 ['검전 드라이버','전기가 있으면 불이 켜지는 드라이버예요. 콘센트에 대 보면 불이 켜집니다.']];
function finish(){over=true;save.plays++;const nb=score>save.best;const prev=save.best;if(nb)save.best=score;const f=FACTS[save.fi++%FACTS.length];persist();sfx.lose();
 showEnd('칸이 다 찼어요',score+'점','부품 '+placed+'개를 놓았어요'+(nb?'':' (기록까지 '+(prev-score)+'점, 아깝다!)'),nb?'신기록! 이전 최고 '+prev+'점':'최고 '+save.best+'점',nb,'<b>'+f[0]+'</b> — '+f[1]);}
$('again').onclick=()=>{sfx.tap();start();};
window.__game={get state(){return {cells:cells.slice(),nextT,holdT,score,over}},start,tap:(i)=>tap(i,null)};
start();

</script>
</body>
</html>
