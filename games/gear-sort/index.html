<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>한 줄로!: 설비 묶음 정리</title>
<meta name="description" content="하는 일이 같은 전기 설비 카드를 한 줄에 모으는 정리 퍼즐. 횟수 안에 끝내세요.">
<style>
html,body{margin:0;height:100%;background:#14161b;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;font-size:20px}
#app{position:relative;margin:0 auto;max-width:480px;height:100%;display:flex;flex-direction:column;padding:8px 12px 10px;box-sizing:border-box}
#top{display:flex;align-items:center;justify-content:space-between;padding-left:44px;padding-right:56px;min-height:48px}
#top b{font-size:20px}#stat{font-size:20px;font-weight:800;color:#ffd23f}
#sub{font-size:20px;line-height:1.35;color:#e8ebf2;text-align:center;margin:4px 0 8px;word-break:keep-all}
#board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.bar{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;border:0;border-radius:14px;font-size:20px;font-weight:800;min-height:56px;font-family:inherit;cursor:pointer;touch-action:manipulation;background:#3b4252;color:#fff;box-shadow:0 4px 0 #1f232c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f232c}.btn.main{background:#ffd23f;color:#2b2000;box-shadow:0 4px 0 #a98400}
#mute{position:absolute;top:8px;right:10px;width:48px;height:48px;border:0;border-radius:24px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;z-index:5}
#end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,11,16,.78);z-index:4;padding:16px;box-sizing:border-box}
#end.on{display:flex}
#card{width:100%;max-width:360px;background:#2b2f3a;border:3px solid #4a505f;border-radius:18px;padding:18px;box-sizing:border-box;text-align:center;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#endTitle{font-size:24px;font-weight:800;margin:0 0 6px}#endScore{font-size:52px;font-weight:900;line-height:1.1;color:#ffd23f}
#endSub{font-size:20px;color:#e8ebf2;margin:4px 0}#endBest{font-size:20px;font-weight:700;color:#9fe1ff;margin:0 0 10px}
#fact{font-size:20px;line-height:1.45;background:#1d2029;border-radius:12px;padding:10px 12px;margin:0 0 12px;text-align:left;word-break:keep-all}
.pop{animation:pp .35s ease-out}@keyframes pp{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.shake{animation:sk .3s}@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.sp{position:absolute;font-size:28px;animation:fl .8s ease-out forwards}@keyframes fl{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.6)}}

#rows{display:flex;flex-direction:column;gap:9px;width:100%}
.row{display:flex;gap:6px;align-items:stretch;height:72px;border:3px solid #4a505f;border-radius:14px;padding:4px;box-sizing:border-box;background:#1c1f26;cursor:pointer;touch-action:manipulation;position:relative}
.row.sel{border-color:#ffd23f;background:#2a2d12}
.row.full{border-color:#6ee08a;background:#16301f}
.slot{flex:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15;padding:2px;word-break:keep-all;min-width:0}
.slot.c{background:#3a4357;border:2px solid #5d6882}
.slot b{font-size:19px}.slot small{font-size:14px;color:#d5dae6;margin-top:2px}
.tag{position:absolute;right:8px;top:-12px;background:#6ee08a;color:#0c2a15;font-weight:900;font-size:16px;border-radius:10px;padding:1px 10px}
.row.sel .slot.c:last-of-type{transform:translateY(-4px)}
</style>
<meta name="description" content="하는 일이 같은 전기 설비 카드(막는 것·재는 것·나르고 나누는 것)를 한 줄에 모으는 정리 퍼즐. 횟수 안에 끝내세요."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/gear-sort/"><meta property="og:title" content="한 줄로!: 설비 묶음 정리"><meta property="og:description" content="하는 일이 같은 전기 설비 카드(막는 것·재는 것·나르고 나누는 것)를 한 줄에 모으는 정리 퍼즐. 횟수 안에 끝내세요."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;top:max(8px,env(safe-area-inset-top));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="한 줄로!: 설비 묶음 정리",D="하는 일이 같은 전기 설비 카드(막는 것·재는 것·나르고 나누는 것)를 한 줄에 모으는 정리 퍼즐. 횟수 안에 끝내세요.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/gear-sort/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div id="top"><b id="lv"></b><span id="stat"></span></div>
  <div id="sub"></div>
  <div id="board"></div>
  <div class="bar" id="bar"></div>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <div id="fx"></div>
  <div id="end"><div id="card">
    <div id="endTitle"></div><div id="endScore"></div><div id="endSub"></div><div id="endBest"></div>
    <div id="fact"></div>
    <button class="btn main" id="again" style="width:100%">한 번 더</button>
  </div></div>
</div>
<script>
"use strict";
const KEY='gear-sort.save.v1';
let save={best:0,plays:0,fi:0};
try{const r=localStorage.getItem(KEY);if(r)save=Object.assign(save,JSON.parse(r));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
const $=id=>document.getElementById(id);
let muted=false,AC=null;
try{muted=localStorage.getItem(KEY+'.mute')==='1';}catch(e){}
function actx(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();}if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,t,v,when){if(muted)return;const a=actx();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;const s=a.currentTime+(when||0);g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d);}catch(e){}}
const sfx={tap(){tone(520,.07,'triangle',.1)},ok(){tone(660,.1,'triangle',.14);tone(880,.14,'triangle',.14,.09)},bad(){tone(180,.25,'sawtooth',.12)},
 done(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.08))},win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'square',.09,i*.09))},lose(){[330,262,196].forEach((f,i)=>tone(f,.28,'sawtooth',.1,i*.16))}};
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function burst(x,y,ch){const fx=$('fx'),r=fx.getBoundingClientRect();for(let i=0;i<5;i++){const s=document.createElement('div');s.className='sp';s.textContent=ch||'✨';s.style.left=(x-r.left-14+(Math.random()*60-30))+'px';s.style.top=(y-r.top-14+(Math.random()*30-15))+'px';fx.appendChild(s);setTimeout(()=>s.remove(),850);}}
function burstEl(el,ch){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,ch);}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'.mute',muted?'1':'0');}catch(e){}if(!muted)sfx.tap();};
function showEnd(title,score,sub,best,isNew,fact){$('endTitle').textContent=title;$('endScore').textContent=score;$('endSub').textContent=sub;const b=$('endBest');b.textContent=best;b.style.color=isNew?'#ffd23f':'#9fe1ff';$('fact').innerHTML=fact;$('end').classList.add('on');}
function hideEnd(){$('end').classList.remove('on');}

const G=[
 {g:'막는 것',c:'#7aa7ff',it:[['피뢰침','벼락을 땅으로'],['피뢰기','벼락 전기를 땅으로'],['서지 보호기','순간 고전압 막기'],['절연 매트','바닥에 깔아 막기']]},
 {g:'재는 것',c:'#ffb36b',it:[['전력량계','쓴 전기 재기'],['접지 저항계','접지 상태 재기'],['검전기','전기 있나 확인'],['MOF','요금 계량용']]},
 {g:'나르고 나누는 것',c:'#c79bff',it:[['분전반','차단기 모인 함'],['배전반','곳곳에 나눠 주는 함'],['간선','분전반까지 굵은 선'],['인입선','건물 안으로 들어옴']]}];
const CAP=3,R=5;
let level,rows,sel,left,hist,over,busy;
function key(x){return x.map(a=>a.join('')).sort().join('|');}
function isGoal(x){return x.every(a=>a.length===0||(a.length===CAP&&a.every(v=>v===a[0])));}
function minMoves(start){const q=[[start,0]],seen=new Set([key(start)]);
 while(q.length){const [x,d]=q.shift();if(isGoal(x))return d;
  for(let i=0;i<x.length;i++){if(!x[i].length)continue;for(let j=0;j<x.length;j++){if(i===j||x[j].length>=CAP)continue;
   const y=x.map(a=>a.slice());y[j].push(y[i].pop());const k=key(y);if(!seen.has(k)){seen.add(k);q.push([y,d+1]);}}}}
 return 99;}
function deal(){let cards=[];G.forEach((g,gi)=>shuffle(g.it.slice()).slice(0,3).forEach(it=>cards.push({g:gi,n:it[0],h:it[1]})));
 let r;do{shuffle(cards);r=[[],[],[],[],[]];cards.forEach((c,i)=>r[Math.floor(i/3)].push(c));}
 while(isGoal(r.map(a=>a.map(c=>c.g)))||minMoves(r.map(a=>a.map(c=>c.g)))<4);return r;}
function newRound(){rows=deal();sel=-1;hist=[];over=false;busy=false;
 left=minMoves(rows.map(a=>a.map(c=>c.g)))+Math.max(3,6-level);render();}
function start(){hideEnd();level=0;$('bar').innerHTML='<button class="btn" id="undo">↩ 되돌리기</button>';$('undo').onclick=undo;newRound();}
function rowDone(a){return a.length===CAP&&a.every(c=>c.g===a[0].g);}
function render(){
 $('lv').textContent=(level+1)+'번째 정리';$('stat').textContent='남은 횟수 '+left;
 $('sub').textContent='같은 일을 하는 설비끼리 한 줄에 모으세요 (막는 것 · 재는 것 · 나르고 나누는 것)';
 const b=$('board');b.style.alignItems='center';
 b.innerHTML='<div id="rows">'+rows.map((a,i)=>'<div class="row'+(i===sel?' sel':'')+(rowDone(a)?' full':'')+'" data-i="'+i+'">'+
  (rowDone(a)?'<div class="tag">'+G[a[0].g].g+' ✔</div>':'')+
  [0,1,2].map(k=>a[k]?'<div class="slot c"><b>'+a[k].n+'</b><small>'+a[k].h+'</small></div>':'<div class="slot"></div>').join('')+'</div>').join('')+'</div>';
 b.querySelectorAll('.row').forEach(el=>{el.onclick=()=>tap(+el.dataset.i);});
}
function anyMove(){return rows.some((a,i)=>a.length&&rows.some((b,j)=>i!==j&&b.length<CAP&&!(a.length&&rowDone(a))))||false;}
function tap(i){
 if(over||busy)return;
 if(sel<0){if(!rows[i].length)return;sel=i;sfx.tap();render();return;}
 if(sel===i){sel=-1;render();return;}
 if(rows[i].length>=CAP){sfx.bad();document.querySelectorAll('.row')[i].classList.add('shake');vib(40);sel=-1;setTimeout(render,300);return;}
 hist.push(JSON.stringify(rows));
 rows[i].push(rows[sel].pop());left--;sel=-1;sfx.ok();render();
 const el=document.querySelectorAll('.row')[i];
 if(rowDone(rows[i])){sfx.done();burstEl(el,'⚡');vib(40);el.classList.add('pop');}
 if(isGoal(rows.map(a=>a.map(c=>c.g)))){busy=true;sfx.win();burstEl(el,'🎉');level++;save.best=Math.max(save.best,level);persist();
  $('sub').textContent='모두 제자리! 다음 정리로';setTimeout(newRound,1200);return;}
 if(left<=0)finish();
}
function undo(){if(over||busy||!hist.length)return;rows=JSON.parse(hist.pop());sel=-1;sfx.tap();render();}
const FACTS=[
 ['피뢰침','벼락을 받아 땅으로 보내는 뾰족한 침이에요. 건물 꼭대기에 서 있습니다.'],
 ['서지 보호기','순간 높은 전압을 막는 장치예요. 분전반에 달아 기기를 지킵니다.'],
 ['전력량계','쓴 전기를 재는 기계예요. 현장에서는 「계량기 돈다」 하면 전기 쓰고 있다는 말입니다.'],
 ['접지 저항계','접지가 잘 됐는지 재는 계기예요. 접지 공사 끝나면 값을 재서 적어 둡니다.'],
 ['분전반','차단기들이 모여 있는 함이에요. 「분전반 열어 봐」는 차단기 함 보라는 말입니다.']];
function finish(){over=true;save.plays++;persist();sfx.lose();
 const d=rows.filter(rowDone).length,f=FACTS[save.fi++%FACTS.length];persist();
 showEnd('횟수가 다 됐어요',level+'번 정리',R-2+'줄 중 '+d+'줄 완성했어요 (아깝다!)','최고 '+save.best+'번',false,'<b>'+f[0]+'</b> — '+f[1]);}
$('again').onclick=()=>{sfx.tap();start();};
function hint(){const st=rows.map(a=>a.map(c=>c.g)),q=[[st,[]]],seen=new Set([key(st)]);while(q.length){const [x,p]=q.shift();if(isGoal(x))return p;for(let i=0;i<x.length;i++){if(!x[i].length)continue;for(let j=0;j<x.length;j++){if(i===j||x[j].length>=CAP)continue;const y=x.map(a=>a.slice());y[j].push(y[i].pop());const k=key(y);if(!seen.has(k)){seen.add(k);q.push([y,p.concat([[i,j]])]);}}}}return null;}
window.__game={get state(){return {level,left,rows:rows&&rows.map(a=>a.map(c=>c.g)),over}},start,tap,hint};
start();

</script>
</body>
</html>
