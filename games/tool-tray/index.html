<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>딱딱딱!: 공구 3개 모으기 퍼즐</title>
<meta name="theme-color" content="#3b2a1a">
<style>
:root{--bg:#3b2a1a;--wood:#8d6e4a;--tile:#fffdf5;--y:#ffd54f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
#app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
h1{font-size:21px;margin:2px 0;padding:0 36px;text-align:center;color:var(--y)}
.top{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:4px 2px 6px}
#board{position:relative;flex:1;min-height:300px}
.t{position:absolute;width:var(--s);height:var(--s);border-radius:12px;background:var(--tile);border:3px solid #5d4037;box-shadow:0 4px 0 #5d4037;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.58);cursor:pointer;transition:filter .15s}
.t.cov{filter:brightness(.45);cursor:default}
.t.fly{transition:all .25s ease-in;opacity:.2;transform:scale(.6)}
#tray{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--wood);border:4px solid #5d4037;border-radius:14px;padding:6px;margin-top:6px}
.slot{aspect-ratio:1;border-radius:9px;background:#00000033;display:flex;align-items:center;justify-content:center;font-size:30px}
.slot.full{background:var(--tile)}
.slot.boom{animation:boom .35s}
@keyframes boom{50%{transform:scale(1.3);background:var(--y);box-shadow:0 0 20px var(--y)}}
.slot.warn{background:#c6282855}
.bar{display:flex;gap:8px;margin-top:8px}
.b{flex:1;min-height:58px;border:0;border-radius:14px;font-size:21px;font-weight:800;background:#ffffff22;color:#fff;cursor:pointer}
.b:disabled{opacity:.35}
#msg{text-align:center;font-size:20px;min-height:28px;margin-top:4px;color:var(--y);font-weight:700}
#over{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:5}
#over .box{background:#fff8e6;color:#222;border-radius:18px;padding:20px 18px;width:min(92vw,400px);text-align:center}
#over h2{margin:0 0 6px;font-size:28px}
.big{font-size:44px;font-weight:900;color:#c62828;margin:4px 0}
.row{font-size:20px;margin:6px 0}
.fact{background:#efe3c8;border-radius:12px;padding:12px;font-size:19px;line-height:1.5;text-align:left;margin-top:10px}
.go{display:block;width:100%;min-height:64px;border:0;border-radius:16px;background:#ffb300;color:#222;font-size:24px;font-weight:900;margin-top:12px;cursor:pointer}
.spark{position:fixed;pointer-events:none;font-size:34px;animation:fly .8s forwards;z-index:9}
@keyframes fly{to{transform:translateY(-90px) scale(1.5);opacity:0}}
</style><meta name="description" content="쌓인 공구 중 위에 보이는 것을 눌러 아래 공구함에 같은 것 3개를 모으면 사라지는 퍼즐(7칸이 차면 끝)"><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/tool-tray/"><meta property="og:title" content="딱딱딱!: 공구 3개 모으기 퍼즐"><meta property="og:description" content="쌓인 공구 중 위에 보이는 것을 눌러 아래 공구함에 같은 것 3개를 모으면 사라지는 퍼즐(7칸이 차면 끝)"><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;right:6px;top:max(6px,env(safe-area-inset-top));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="딱딱딱!: 공구 3개 모으기 퍼즐",D="쌓인 공구 중 위에 보이는 것을 눌러 아래 공구함에 같은 것 3개를 모으면 사라지는 퍼즐(7칸이 차면 끝)",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/tool-tray/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head><body>
<div id="app">
  <h1>딱딱딱!: 공구 3개 모으기 퍼즐</h1>
  <div class="top"><span id="stg">1판</span><span id="left">남은 공구 0</span><span id="best">최고 1판</span></div>
  <div id="board"></div>
  <div id="msg">위에 보이는 공구를 눌러요. 같은 것 3개 = 딱!</div>
  <div id="tray"></div>
  <div class="bar"><button class="b" id="undo">↩ 되돌리기 <span id="uN"></span></button><button class="b" id="mix">🔀 섞기 <span id="mN"></span></button></div>
</div>
<div id="over"><div class="box">
  <h2 id="oT">공구함이 꽉 찼어요</h2>
  <div class="big" id="oP">80%</div>
  <div class="row" id="oL"></div>
  <div class="row" id="oB"></div>
  <div class="fact" id="oF"></div>
  <button class="go" id="again">다시 1판부터 ▶</button>
</div></div>
<script>
'use strict';
const KINDS=['🔌','💡','🔋','🪛','🔧','🧤','🔦','🧯','⛑️','📏','🪜','✂️'];
// 게임오버 화면 전기 상식: games/elec-ox 문제(FACTS.md 23·102·106·108·111번)의 정답·해설을 현장 말로 짧게. 근거는 FACTS.md.
const FACTS=[
 '절연저항은 메거(절연저항계)로 잰다. 클램프미터는 전류 재는 공구다.',
 '멀티탭은 정격 용량(예: 16A·3,500W)을 넘겨 쓰면 과열·화재 위험. 전열기 두 개만 꽂아도 넘기기 쉽다.',
 '전기 불(C급 화재)에는 물 말고 이산화탄소·분말 소화기. 물은 감전·확산 위험.',
 '작업 전엔 검전기로 전기 없는지 확인. 차단 → 검전 → 작업, 눈으로는 활선을 모른다.',
 '활선용 절연장갑은 사용 전압 등급에 맞는 걸 쓰고, 쓰기 전에 공기 새는지 점검.'
];
const KEY='tool-tray.save.v1';
let sv={best:1,plays:0,cleared:0};
try{const t=JSON.parse(localStorage.getItem(KEY)||'null');if(t)sv=Object.assign(sv,t)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(sv))}catch(e){}}
let AC=null;function tone(f,t,d,ty){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'triangle';o.frequency.value=f;g.gain.setValueAtTime(.2,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d)}catch(e){}}
const $=id=>document.getElementById(id);
const COLS=6,ROWS=6,TRAY=7;
let G;
function rnd(n){return Math.random()*n|0}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function build(stage){
  const kinds=Math.min(3+stage,KINDS.length), triples=Math.min(3+stage*3,21);
  const pool=[];const ks=shuffle(KINDS.slice()).slice(0,kinds);
  for(let i=0;i<triples;i++){const k=ks[i%kinds];pool.push(k,k,k)}
  shuffle(pool);
  const layers=Math.min(1+Math.floor((stage+1)/2),5);
  const tiles=[];let id=0;
  // 층마다 자리 후보(홀수 층은 반 칸 어긋남), 아래층부터 채움
  const per=Math.ceil(pool.length/layers);
  for(let l=0;l<layers&&pool.length;l++){
    const off=l%2?0.5:0, cand=[];
    for(let r=0;r<ROWS-(off?1:0);r++)for(let c=0;c<COLS-(off?1:0);c++)cand.push([c+off,r+off]);
    shuffle(cand);
    const n=Math.min(per,pool.length,cand.length);
    for(let i=0;i<n;i++)tiles.push({id:id++,k:pool.pop(),x:cand[i][0],y:cand[i][1],l,gone:false});
  }
  return tiles;
}
function covered(t){return G.tiles.some(o=>!o.gone&&o.l>t.l&&Math.abs(o.x-t.x)<1&&Math.abs(o.y-t.y)<1)}
function start(stage){
  G={stage:stage||1,tiles:build(stage||1),tray:[],hist:[],undo:1,mix:1,over:false,total:0};
  G.total=G.tiles.length;$('over').style.display='none';render();
  $('msg').textContent=G.stage===1?'위에 보이는 공구를 눌러요. 같은 것 3개 = 딱!':G.stage+'판! 공구가 늘었어요';
}
function render(){
  const bd=$('board'),W=bd.clientWidth,H=bd.clientHeight;
  const s=Math.floor(Math.min(W/COLS,H/ROWS))-2;bd.style.setProperty('--s',s+'px');
  const ox=(W-COLS*(s+2))/2,oy=(H-ROWS*(s+2))/2;
  bd.innerHTML='';
  G.tiles.filter(t=>!t.gone).sort((a,b)=>a.l-b.l).forEach(t=>{
    const e=document.createElement('div');e.className='t'+(covered(t)?' cov':'');e.textContent=t.k;
    e.style.left=(ox+t.x*(s+2))+'px';e.style.top=(oy+t.y*(s+2))+'px';e.dataset.id=t.id;e.style.zIndex=t.l+1;
    e.onclick=()=>tap(t.id,e);bd.appendChild(e)});
  const tr=$('tray');tr.innerHTML='';
  for(let i=0;i<TRAY;i++){const d=document.createElement('div');d.className='slot'+(G.tray[i]?' full':'')+(G.tray.length>=TRAY-1&&!G.tray[i]?' warn':'');d.textContent=G.tray[i]?G.tray[i].k:'';tr.appendChild(d)}
  const left=G.tiles.filter(t=>!t.gone).length+G.tray.length;
  $('stg').textContent=G.stage+'판';$('left').textContent='남은 공구 '+left;$('best').textContent='최고 '+sv.best+'판';
  $('uN').textContent=G.undo;$('mix').disabled=!G.mix;$('undo').disabled=!G.undo||!G.hist.length;$('mN').textContent=G.mix;
}
function spark(x,y,txt){for(let i=0;i<5;i++){const s=document.createElement('div');s.className='spark';s.textContent=txt;s.style.left=(x-20+Math.random()*60)+'px';s.style.top=y+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}
function tap(id){
  if(G.over)return;const t=G.tiles.find(o=>o.id===id);if(!t||t.gone)return;
  if(covered(t)){tone(160,0,.12,'square');$('msg').textContent='아래 깔린 건 위에 것부터 치워요';return}
  t.gone=true;tone(520,0,.08);
  // 같은 공구 옆에 끼워 넣음
  let pos=G.tray.length;for(let i=G.tray.length-1;i>=0;i--)if(G.tray[i].k===t.k){pos=i+1;break}
  G.tray.splice(pos,0,t);G.hist.push(t.id);
  const same=G.tray.filter(o=>o.k===t.k);
  if(same.length>=3){
    G.tray=G.tray.filter(o=>o.k!==t.k);G.hist=[];
    tone(660,0,.12);tone(880,.1,.12);tone(1100,.2,.18);if(navigator.vibrate)navigator.vibrate(50);
    const r=$('tray').getBoundingClientRect();spark(r.left+r.width/2,r.top,'⚡');
    $('msg').textContent=['딱!','딱딱!','딱딱딱! 정리 끝'][rnd(3)];
    render();
  }else render();
  if(G.tiles.every(o=>o.gone)&&!G.tray.length){win();return}
  if(G.tray.length>=TRAY){lose()}
}
function win(){
  sv.cleared++;if(G.stage+1>sv.best)sv.best=G.stage+1;save();
  tone(523,0,.2);tone(659,.15,.2);tone(784,.3,.2);tone(1047,.45,.35);
  const r=$('board').getBoundingClientRect();spark(r.left+r.width/2,r.top+r.height/2,'🎉');
  $('msg').textContent=G.stage+'판 깨끗! 다음 판으로';G.over=true;
  setTimeout(()=>start(G.stage+1),1100);
}
function lose(){
  G.over=true;sv.plays++;save();tone(200,0,.4,'sawtooth');
  const left=G.tiles.filter(t=>!t.gone).length+G.tray.length;const p=Math.round((G.total-left)/G.total*100);
  $('oT').textContent='공구함이 꽉 찼어요';$('oP').textContent=G.stage+'판 '+p+'% 정리';
  $('oL').textContent='남은 공구 '+left+'개 (이번 판 '+G.total+'개 중)';
  $('oB').textContent=G.stage>=sv.best?'최고 기록과 같은 판!':'최고 '+sv.best+'판까지 '+(sv.best-G.stage)+'판 남음';
  $('oF').textContent='💡 '+FACTS[rnd(FACTS.length)];
  $('over').style.display='flex';
}
$('undo').onclick=()=>{if(G.over||!G.undo||!G.hist.length)return;const id=G.hist.pop();const i=G.tray.findIndex(o=>o.id===id);if(i<0)return;const t=G.tray.splice(i,1)[0];t.gone=false;G.undo--;tone(400,0,.1);render()};
$('mix').onclick=()=>{if(G.over||!G.mix)return;const live=G.tiles.filter(t=>!t.gone);const ks=shuffle(live.map(t=>t.k));live.forEach((t,i)=>t.k=ks[i]);G.mix--;tone(300,0,.1);tone(500,.1,.1);$('msg').textContent='공구를 섞었어요';render()};
$('again').onclick=()=>start(1);
addEventListener('resize',()=>G&&render());
window.__game={get state(){return {stage:G.stage,over:G.over,tray:G.tray.map(t=>t.k),left:G.tiles.filter(t=>!t.gone).length,free:G.tiles.filter(t=>!t.gone&&!covered(t)).map(t=>({id:t.id,k:t.k})),save:sv}},tap,restart:()=>start(1)};
start(1);
</script></body></html>
