<style>
*{box-sizing:border-box;word-break:keep-all;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f1a17;color:#fff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:8px 12px 10px;user-select:none}
.top{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800}
.top .sp{flex:1}
#mute{width:56px;height:56px;border-radius:14px;border:2px solid #36544b;background:#172822;color:#fff;font-size:24px}
.rule{margin:2px 0 6px;font-size:21px;font-weight:800;color:#ffd84a;text-align:center;line-height:1.3}
#wrap{position:relative;margin:0 auto;touch-action:none}
#grid{display:grid;gap:0;width:100%;height:100%}
.c{position:relative;border:2px solid #0f1a17;border-radius:12px;background:#22352f;color:#fff;font-size:26px;padding:0;display:flex;align-items:center;justify-content:center}
.c.blk{background:#0f1a17;border:2px dashed #36544b}
.c.on{background:#5a4a0a}
.c.head{background:#a8860a;outline:4px solid #ffd84a;outline-offset:-4px}
.c.can{background:#2f5247}
.c .i{opacity:.35;filter:grayscale(1)}
.c.on .i,.c.start .i{opacity:1;filter:none}
#svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.msg{min-height:56px;text-align:center;font-size:20px;font-weight:800;margin-top:6px;line-height:1.35}
.msg.warn{color:#ff9a8a}
.rec{text-align:center;font-size:18px;color:#a3bdb4;margin-top:auto;padding-top:2px}
.fx{position:fixed;left:0;top:0;pointer-events:none;font-size:38px;font-weight:900;transition:transform .9s ease-out,opacity .9s;z-index:9;white-space:nowrap;color:#ffd84a}
#over{position:fixed;inset:0;background:rgba(5,10,8,.94);display:none;align-items:center;justify-content:center;z-index:20}
#over .box{width:min(400px,92vw);background:#172822;border:3px solid #ffd84a;border-radius:20px;padding:18px;text-align:center}
#over h2{margin:0 0 6px;font-size:27px}
#over .big{font-size:24px;font-weight:800;margin:6px 0}
#over .near{font-size:20px;color:#ffd84a;margin:6px 0}
#over .tip{font-size:19px;line-height:1.45;background:#0f1a17;border-radius:12px;padding:10px;margin:10px 0;text-align:left}
#again{width:100%;height:64px;border-radius:16px;border:0;background:#ffd84a;color:#111;font-size:26px;font-weight:900}
</style>
<meta name="description" content="⚡ 칸에서 시작해 모든 전등 칸을 한 번씩 지나도록 선 한 줄을 긋는 한붓그리기 퍼즐. 되감기 횟수 한도."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/one-wire/"><meta property="og:title" content="한 줄로 쭉!: 전등 한붓 잇기 퍼즐"><meta property="og:description" content="⚡ 칸에서 시작해 모든 전등 칸을 한 번씩 지나도록 선 한 줄을 긋는 한붓그리기 퍼즐. 되감기 횟수 한도."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="한 줄로 쭉!: 전등 한붓 잇기 퍼즐",D="⚡ 칸에서 시작해 모든 전등 칸을 한 번씩 지나도록 선 한 줄을 긋는 한붓그리기 퍼즐. 되감기 횟수 한도.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/one-wire/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div class="top"><span id="stage">1판</span><span class="sp"></span><span id="rw">되감기 3번</span><button id="mute" aria-label="소리">🔊</button></div>
  <div class="rule">⚡에서 시작해 모든 전등을 한 줄로 이어라</div>
  <div id="wrap"><div id="grid"></div><svg id="svg"></svg></div>
  <div class="msg" id="msg">노란 칸 옆의 밝은 칸을 누르세요</div>
  <div class="rec" id="rec"></div>
</div>
<div id="over"><div class="box">
  <h2>막혔는데 되감기가 없어요</h2>
  <div class="big" id="oScore"></div>
  <div class="near" id="oNear"></div>
  <div class="tip" id="oTip"></div>
  <button id="again">한 번 더</button>
</div></div>
<script>
(function(){
'use strict';
var KEY='one-wire.save.v1';
var save={best:0,total:0};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object'){save.best=o.best|0;save.total=o.total|0;}}}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
// FACTS.md 1~3
var TIPS=[
 '게임은 한 줄로 잇지만, 진짜 집의 전등·콘센트는 나란히(병렬) 잇는다. 하나를 꺼도 나머지는 그대로다.',
 '전구를 한 줄로(직렬) 이으면 하나만 끊겨도 전부 꺼진다. 옛날 크리스마스 줄 전구 한 알이 빠지면 줄 전체가 꺼지던 이유다.',
 '한 줄로 이어진 회로에서는 어느 지점을 재도 전류가 같다.'
];
var LV=[[3,3,0],[3,4,0],[4,4,0],[4,4,1],[4,5,0],[4,5,2],[5,5,1],[5,5,2],[5,6,0],[5,6,2]];
var AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,delay){if(muted)return;var a=ac();if(!a)return;var t=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function $(id){return document.getElementById(id);}
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fx(txt){var r=$('wrap').getBoundingClientRect();var d=document.createElement('div');d.className='fx';d.textContent=txt;d.style.transform='translate('+(r.left+r.width/2-90)+'px,'+(r.top+r.height/2)+'px)';document.body.appendChild(d);requestAnimationFrame(function(){d.style.transform='translate('+(r.left+r.width/2-90)+'px,'+(r.top+r.height/2-90)+'px)';d.style.opacity='0';});setTimeout(function(){d.remove();},1000);}
var S={stage:1,R:3,C:3,blk:{},path:[],sol:[],rw:3,over:false,lock:false,need:0};
function nb(i,R,C){var r=Math.floor(i/C),c=i%C,o=[];if(r>0)o.push(i-C);if(r<R-1)o.push(i+C);if(c>0)o.push(i-1);if(c<C-1)o.push(i+1);return o;}
// 모든 칸을 한 번씩 지나는 길을 먼저 만들어 둔다(반드시 풀리는 판)
function gen(R,C,nBlk){
 for(var tr=0;tr<60;tr++){
  var blk={},k=0;while(k<nBlk){var b=rnd(R*C);if(!blk[b]){blk[b]=1;k++;}}
  var need=R*C-nBlk,st;do{st=rnd(R*C);}while(blk[st]);
  var seen={},path=[st],cnt=0;seen[st]=1;
  var free=function(i){return nb(i,R,C).filter(function(x){return !blk[x]&&!seen[x];});};
  var dfs=function(i){if(path.length===need)return true;if(++cnt>4000)return false;
   var ns=shuffle(free(i));ns.sort(function(a,b){return free(a).length-free(b).length;});
   for(var q=0;q<ns.length;q++){var x=ns[q];seen[x]=1;path.push(x);if(dfs(x))return true;path.pop();seen[x]=0;}return false;};
  if(dfs(st))return {blk:blk,sol:path,need:need};
 }
 var sol=[];for(var r=0;r<R;r++)for(var c=0;c<C;c++)sol.push(r*C+(r%2?C-1-c:c));
 return {blk:{},sol:sol,need:R*C};
}
function head(){return S.path[S.path.length-1];}
function freeN(){return nb(head(),S.R,S.C).filter(function(x){return !S.blk[x]&&S.path.indexOf(x)<0;});}
function build(){
 var lv=LV[Math.min(S.stage-1,LV.length-1)];S.R=lv[1];S.C=lv[0];
 var gnr=gen(S.R,S.C,lv[2]);S.blk=gnr.blk;S.sol=gnr.sol;S.need=gnr.need;S.path=[gnr.sol[0]];
 var w=Math.min(document.documentElement.clientWidth,430)-24;
 var avail=window.innerHeight-250;var cs=Math.floor(Math.min(w/S.C,avail/S.R,84));
 $('wrap').style.width=(cs*S.C)+'px';$('wrap').style.height=(cs*S.R)+'px';
 var gd=$('grid');gd.innerHTML='';gd.style.gridTemplateColumns='repeat('+S.C+',1fr)';
 for(var i=0;i<S.R*S.C;i++){var b=document.createElement('button');b.className='c'+(S.blk[i]?' blk':'');b.dataset.i=i;
  b.innerHTML=S.blk[i]?'':'<span class="i">'+(i===S.path[0]?'⚡':'💡')+'</span>';gd.appendChild(b);}
 $('svg').setAttribute('viewBox','0 0 '+S.C+' '+S.R);
 render();say('노란 칸 옆의 밝은 칸을 누르세요');
}
function say(t,warn){$('msg').textContent=t;$('msg').className='msg'+(warn?' warn':'');}
function render(){
 var cells=$('grid').children,h=head(),fn=freeN();
 for(var i=0;i<cells.length;i++){var el=cells[i],idx=S.path.indexOf(i);
  el.className='c'+(S.blk[i]?' blk':'')+(idx>=0?' on':'')+(i===h?' head':'')+(i===S.path[0]?' start':'')+(fn.indexOf(i)>=0?' can':'');}
 var pts=S.path.map(function(i){return ((i%S.C)+.5)+','+(Math.floor(i/S.C)+.5);}).join(' ');
 $('svg').innerHTML='<polyline points="'+pts+'" fill="none" stroke="#ffd84a" stroke-width=".14" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>';
 $('stage').textContent=S.stage+'판 · '+(S.path.length-1)+'/'+(S.need-1)+'등';
 $('rw').textContent='되감기 '+S.rw+'번';
 $('rec').textContent='최고 '+save.best+'판 · 지금까지 켠 전등 '+save.total+'개';
}
function tap(i){
 if(S.over||S.lock||S.blk[i])return;ac();
 var idx=S.path.indexOf(i);
 if(idx>=0){
  if(i===head())return;
  if(S.rw<=0){say('되감기가 없어요. 그대로 끝까지 이어 보세요',true);tone(160,.2,'sawtooth',.1);return;}
  S.rw--;S.path.length=idx+1;tone(300,.15,'sine',.12);render();say('되감았어요. 남은 되감기 '+S.rw+'번');return;
 }
 if(nb(head(),S.R,S.C).indexOf(i)<0){say('노란 칸 바로 옆 칸만 이을 수 있어요',true);return;}
 S.path.push(i);save.total++;
 tone(440+S.path.length*18,.09,'triangle',.14);
 if(S.path.length===S.need){win();return;}
 render();
 if(freeN().length===0){
  if(S.rw>0){say('막혔어요! 지나온 칸을 눌러 되감으세요 (남은 '+S.rw+'번)',true);tone(200,.25,'sawtooth',.1);vib(60);}
  else lose();
 }else say('전등 '+(S.need-S.path.length)+'개 남았어요');
}
function win(){
 S.lock=true;render();store();
 tone(523,.12,'triangle',.2);tone(659,.12,'triangle',.2,.12);tone(784,.12,'triangle',.2,.24);tone(1047,.35,'triangle',.2,.36);vib([30,30,60]);
 fx(S.stage+'판 다 켰다!');say('전등이 전부 켜졌어요!');
 if(S.stage>save.best){save.best=S.stage;store();}
 setTimeout(function(){S.stage++;if(S.rw<5)S.rw++;S.lock=false;build();},1300);
}
function lose(){
 S.over=true;store();tone(140,.5,'sawtooth',.12);vib([80,50,80]);
 var done=S.stage-1,left=S.need-S.path.length;
 $('oScore').textContent=done+'판 완성 · '+S.stage+'판에서 전등 '+left+'개 남김';
 var gap=save.best-done;
 $('oNear').textContent=gap>0?'최고 기록까지 '+gap+'판':'최고 기록과 같아요! 한 판만 더';
 $('oTip').textContent='💡 '+TIPS[rnd(TIPS.length)];
 $('over').style.display='flex';
}
function start(){S.stage=1;S.rw=3;S.over=false;S.lock=false;$('over').style.display='none';build();}
function cellAt(e){var el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest?el.closest('.c'):null;}
var down=false;
$('wrap').addEventListener('pointerdown',function(e){down=true;var c=cellAt(e);if(c)tap(+c.dataset.i);e.preventDefault();});
// 끌어서 잇기: 새 칸으로 늘리는 것만(되감기는 눌러야만 — 실수로 되감기 횟수가 줄지 않게)
$('wrap').addEventListener('pointermove',function(e){if(!down||S.over||S.lock)return;var c=cellAt(e);if(!c)return;var i=+c.dataset.i;if(S.path.indexOf(i)<0&&!S.blk[i]&&nb(head(),S.R,S.C).indexOf(i)>=0)tap(i);});
window.addEventListener('pointerup',function(){down=false;});
$('again').addEventListener('click',function(){ac();start();});
$('mute').addEventListener('click',function(){muted=!muted;this.textContent=muted?'🔇':'🔊';});
window.__game={state:S,save:save,start:start,tap:tap};
start();
})();
</script>
</body>
