<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>딱 10!: 숫자 짝 지우기 퍼즐</title>
<meta name="description" content="같은 숫자이거나 더해서 10이 되는 두 칸을 이어 지우는 숫자 퍼즐. 사이가 비어 있어야 이어지고, 막히면 줄 더하기. 더하기가 떨어지고 지울 짝이 없으면 끝.">
<style>
html,body{margin:0;height:100%;background:#14161b;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;font-size:20px}
#app{position:relative;margin:0 auto;max-width:480px;height:100%;display:flex;flex-direction:column;padding:8px 12px 10px;box-sizing:border-box}
#top{display:flex;align-items:center;justify-content:space-between;padding-left:44px;padding-right:56px;min-height:48px}
#top b{font-size:20px;white-space:nowrap}#stat{white-space:nowrap;font-size:20px;font-weight:800;color:#ffd23f}
#sub{font-size:20px;line-height:1.35;color:#e8ebf2;text-align:center;margin:4px 0 8px;word-break:keep-all}
#board{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
.btn{flex:1;border:0;border-radius:14px;font-size:20px;font-weight:800;min-height:56px;font-family:inherit;cursor:pointer;touch-action:manipulation;background:#3b4252;color:#fff;box-shadow:0 4px 0 #1f232c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f232c}.btn.main{background:#ffd23f;color:#2b2000;box-shadow:0 4px 0 #a98400}
#mute{position:absolute;top:8px;right:10px;width:48px;height:48px;border:0;border-radius:24px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;z-index:5}
#end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,11,16,.78);z-index:4;padding:16px;box-sizing:border-box}
#end.on{display:flex}
#card{width:100%;max-width:360px;background:#2b2f3a;border:3px solid #4a505f;border-radius:18px;padding:18px;box-sizing:border-box;text-align:center;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#endTitle{font-size:24px;font-weight:800;margin:0 0 6px}#endScore{font-size:52px;font-weight:900;line-height:1.1;color:#ffd23f}
#endSub{font-size:20px;color:#e8ebf2;margin:4px 0}#endBest{font-size:20px;font-weight:700;color:#9fe1ff;margin:0 0 10px}
#fact{font-size:20px;line-height:1.45;background:#1d2029;border-radius:12px;padding:10px 12px;margin:0 0 12px;text-align:left;word-break:keep-all}
.shake{animation:sk .3s}@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.sp{position:absolute;font-size:28px;animation:fl .8s ease-out forwards}@keyframes fl{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.6)}}
#bar{width:100%;text-align:center;min-height:56px;font-size:20px;font-weight:700;color:#9fe1ff;margin-top:6px;line-height:1.3;word-break:keep-all}

#grid{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;touch-action:manipulation}
.c{border-radius:12px;background:#fff8e6;color:#1d2029;border:3px solid #c9b98a;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;cursor:pointer;box-sizing:border-box;box-shadow:0 3px 0 rgba(0,0,0,.35);position:relative}
.c small{position:absolute;right:4px;bottom:1px;font-size:14px;color:#8a7a4a}
.c.e{background:transparent;border:2px dashed #3a3f4c;box-shadow:none;cursor:default;color:transparent}
.c.s{background:#ffd23f;border-color:#a98400;transform:scale(1.06)}
.c.h{outline:4px solid #3fd27a}
#low{flex:none;display:flex;gap:10px;width:100%;margin-top:8px}
#gwrap{flex:1;min-height:0;width:100%;overflow:hidden}

</style>
<meta name="description" content="같은 숫자이거나 더해서 10이 되는 두 칸을 빈칸만 지나 이어지면 지우는 숫자 퍼즐. 막히면 줄 더하기, 더하기가 떨어지고 지울 짝이 없으면 끝."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/ten-pair/"><meta property="og:title" content="딱 10!: 숫자 짝 지우기 퍼즐"><meta property="og:description" content="같은 숫자이거나 더해서 10이 되는 두 칸을 빈칸만 지나 이어지면 지우는 숫자 퍼즐. 막히면 줄 더하기, 더하기가 떨어지고 지울 짝이 없으면 끝."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="딱 10!: 숫자 짝 지우기 퍼즐",D="같은 숫자이거나 더해서 10이 되는 두 칸을 빈칸만 지나 이어지면 지우는 숫자 퍼즐. 막히면 줄 더하기, 더하기가 떨어지고 지울 짝이 없으면 끝.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/ten-pair/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div id="top"><b id="lv"></b><span id="stat"></span></div>
  <div id="sub"></div>
  <div id="board"></div>
  <div id="bar"></div>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <div id="fx"></div>
  <div id="end"><div id="card">
    <div id="endTitle"></div><div id="endScore"></div><div id="endSub"></div><div id="endBest"></div>
    <div id="fact"></div>
    <button class="btn main" id="again" style="width:100%">한 번 더</button>
  </div></div>
</div>
<script>
"use strict";
const KEY='ten-pair.save.v1';
const $=id=>document.getElementById(id);
let save={best:0,plays:0,fi:0};
try{const r=localStorage.getItem(KEY);if(r)save=Object.assign(save,JSON.parse(r));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
let muted=false,AC=null;
try{muted=localStorage.getItem(KEY+'.mute')==='1';}catch(e){}
function actx(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();}if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,t,v,when){if(muted)return;const a=actx();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;const s=a.currentTime+(when||0);g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d);}catch(e){}}
const sfx={tap(){tone(520,.07,'triangle',.1)},ok(){tone(660,.1,'triangle',.14);tone(880,.14,'triangle',.14,.09)},bad(){tone(180,.25,'sawtooth',.12)},
 done(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.08))},lose(){[330,262,196].forEach((f,i)=>tone(f,.28,'sawtooth',.1,i*.16))}};
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function burst(x,y,ch){const fx=$('fx'),r=fx.getBoundingClientRect();for(let i=0;i<5;i++){const s=document.createElement('div');s.className='sp';s.textContent=ch||'✨';s.style.left=(x-r.left-14+(Math.random()*60-30))+'px';s.style.top=(y-r.top-14+(Math.random()*30-15))+'px';fx.appendChild(s);setTimeout(()=>s.remove(),850);}}
function burstEl(el,ch){if(!el)return burst(innerWidth/2,innerHeight/3,ch);const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,ch);}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'.mute',muted?'1':'0');}catch(e){}if(!muted)sfx.tap();};
function showEnd(title,score,sub,best,isNew,fact){$('endTitle').textContent=title;$('endScore').textContent=score;$('endSub').textContent=sub;const b=$('endBest');b.textContent=best;b.style.color=isNew?'#ffd23f':'#9fe1ff';$('fact').innerHTML=fact;$('end').classList.add('on');}
function hideEnd(){$('end').classList.remove('on');}
function endGame(t,n,unit,extra,facts){over=true;save.plays++;const nb=n>save.best;const prev=save.best;if(nb)save.best=n;const f=facts[save.fi++%facts.length];persist();sfx.lose();
 const gap=nb?0:save.best-n;
 showEnd(t,n+unit,extra+(nb?'':' · 최고 기록까지 '+(gap+1)+unit+' (아깝다!)'),nb?'신기록! 이전 최고 '+prev+unit:'최고 '+save.best+unit,nb,'<b>'+f[0]+'</b> — '+f[1]);}
// 숫자는 놀이용(1~9). 「합 10」은 게임 규칙이지 전기 현상이 아니다. 화면 전기 사실은 FACTS.md만.
save.tot=save.tot||0;
const COLS=6;
const FACTS=[['W를 220으로 나누면 대충 A','집 전기는 220V. 전력(W) = 전압(V) × 전류(A)라서 A ≒ W ÷ 220.'],
 ['1kW는 1000W','전기포트 이름표에 1.8kW라고 적혀 있으면 1,800W라는 뜻이다.'],
 ['우리 집 전등·콘센트는 나란히(병렬)','하나를 꺼도 나머지는 그대로다.'],
 ['한 줄(직렬)로 이은 전구','하나만 끊겨도 전부 꺼진다. 옛날 크리스마스 줄 전구가 그랬다.']];
let cells,sel,adds,score,stage,over,maxR,streak;
function pairOK(a,b){return a===b||a+b===10}
function rows(){return Math.ceil(cells.length/COLS)}
function linked(i,j){if(i>j)[i,j]=[j,i];
 let ok=true;for(let k=i+1;k<j;k++)if(cells[k]){ok=false;break;}if(ok)return true; // 읽는 순서로 사이가 빔(줄 넘김 포함)
 if(j%COLS===i%COLS){for(let k=i+COLS;k<j;k+=COLS)if(cells[k])return false;return true;}
 return false;}
function findPair(){for(let i=0;i<cells.length;i++){if(!cells[i])continue;for(let j=i+1;j<cells.length;j++){if(cells[j]&&pairOK(cells[i],cells[j])&&linked(i,j))return [i,j];}}return null}
function mate(x){return rnd(2)?x:10-x||5}
function genRow(n,bias){const out=[];let last=cells.filter(Boolean).slice(-1)[0];for(let k=0;k<n;k++){let v=1+rnd(9);if(last&&Math.random()<bias)v=mate(last);out.push(v);last=v;}return out}
function newBoard(){cells=[];const r=Math.min(3+stage,5);cells=genRow(r*COLS,.55);sel=-1;render();}
function cellSize(){const g=$('gwrap');const w=g.clientWidth||340,h=g.clientHeight||400;return Math.max(40,Math.min((w-5*6)/COLS,(h-(maxR-1)*6)/maxR,64))}
function render(){
 $('lv').textContent=stage+'판';$('stat').textContent=score+'짝';
 $('sub').textContent='같은 수나 합 10인 두 칸을 이어 지워라';
 const b=$('board');if(!$('grid')){b.innerHTML='<div id="gwrap"><div id="grid"></div></div><div id="low"><button class="btn" id="add"></button></div>';$('add').onclick=addRow;}
 const sz=cellSize();const g=$('grid');g.style.gridTemplateColumns='repeat('+COLS+','+sz+'px)';g.style.width='auto';g.style.justifyContent='center';g.innerHTML='';
 cells.forEach((v,i)=>{const e=document.createElement('div');e.className='c'+(v?'':' e')+(i===sel?' s':'');e.id='c'+i;e.style.height=sz+'px';e.innerHTML=v?v+'<small>⚡</small>':'';e.onclick=()=>tap(i,e);g.appendChild(e);});
 const a=$('add');a.textContent='줄 더하기 (남은 '+adds+'번)';a.disabled=adds<=0||rows()>=maxR;a.style.opacity=a.disabled?.4:1;
}
function tap(i,el){if(over||!cells[i])return;actx();
 if(sel<0||sel===i){sel=sel===i?-1:i;sfx.tap();render();return;}
 const a=cells[sel],b=cells[i];
 if(pairOK(a,b)&&linked(sel,i)){const e1=$('c'+sel);cells[sel]=0;cells[i]=0;score++;save.tot++;streak++;
  tone(480+Math.min(streak,10)*50,.12,'triangle',.14);vib(20);burstEl(e1,'⚡');burstEl(el,streak>=5?'🌟':'⚡');
  $('bar').textContent=(a===b?a+' = '+b:a+' + '+b+' = 10')+(streak>=3?' · '+streak+'연속!':'');sel=-1;collapse();
  if(!cells.some(Boolean)){sfx.done();burst(innerWidth/2,innerHeight/3,'💡');$('bar').textContent=stage+'판 싹 비웠다! 줄 더하기 +2';adds+=2;stage++;persist();render();setTimeout(newBoard,700);return;}
  render();check();return;}
 sfx.bad();el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),320);
 $('bar').textContent=!pairOK(a,b)?a+'와 '+b+'는 같지도, 합 10도 아니다':'사이가 막혀 있다(빈칸만 지나야 이어짐)';sel=i;streak=0;render();}
function collapse(){let cleared=false;for(let r=rows()-1;r>=0;r--){const s=r*COLS;const row=cells.slice(s,s+COLS);if(row.length===COLS&&row.every(v=>!v)){cells.splice(s,COLS);cleared=true;}}
 while(cells.length&&!cells[cells.length-1])cells.pop();
 if(cleared){sfx.ok();burst(innerWidth/2,innerHeight/2,'✨');$('bar').textContent='한 줄 싹 비웠다!';}}
function addRow(){if(over||adds<=0||rows()>=maxR)return;actx();adds--;streak=0;const left=cells.filter(Boolean).length;
 const n=Math.max(COLS,Math.min(left,COLS*2));cells.push(...genRow(Math.min(n,(maxR-rows())*COLS+ (COLS-cells.length%COLS)%COLS),Math.max(.25,.6-score*.01)));sel=-1;sfx.tap();$('bar').textContent='숫자를 더 깔았다';render();check();}
function check(){if(findPair())return;if(adds>0&&rows()<maxR){$('bar').textContent='이을 짝이 없다 → 줄 더하기';return;}
 over=true;const left=cells.filter(Boolean).length;setTimeout(()=>endGame('더 지울 짝이 없다',score,'짝',stage+'판에서 숫자 '+left+'칸 남김 · 누적 '+save.tot+'짝',FACTS),600);}
function start(){stage=1;score=0;adds=4;over=false;streak=0;hideEnd();$('board').innerHTML='';$('bar').textContent='지금까지 지운 짝 '+save.tot+'개';
 $('board').innerHTML='<div id="gwrap"><div id="grid"></div></div><div id="low"><button class="btn" id="add"></button></div>';$('add').onclick=addRow;
 maxR=Math.max(6,Math.min(9,Math.floor(($('gwrap').clientHeight+6)/52)));newBoard();check();}
$('again').onclick=()=>{sfx.tap();start();};
addEventListener('resize',()=>{if(cells)render();});
window.__game={get state(){return {stage,score,adds,over,left:cells.filter(Boolean).length,rows:rows(),maxR}},
 sel(){if(over)return null;const p=findPair();if(!p)return (adds>0&&rows()<maxR)?'#add':null;if(sel===p[0])return '#c'+p[1];return '#c'+p[0]},
 wrong(){if(over)return null;if(adds>0&&rows()<maxR)return '#add';return this.sel()}};
start();

</script>
