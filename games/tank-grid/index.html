<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>높이 다 달라!: 콘덴서 물통 빼기 퍼즐</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1622;color:#fff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:10px 12px 14px;user-select:none}
.top{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800}
.top .sp{flex:1}
#mute{width:56px;height:56px;border-radius:14px;border:2px solid #36506a;background:#16283a;color:#fff;font-size:24px}
.rule{margin:6px 0;font-size:20px;font-weight:800;color:#ffd84a;text-align:center;line-height:1.3}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px auto;width:min(100%,370px)}
.t{position:relative;height:96px;border:3px solid #9fb6cc;border-radius:10px 10px 14px 14px;background:#060c12;overflow:hidden;padding:0}
.t.r1{margin-bottom:8px}.t.c1{margin-right:8px}
.t .w{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#5ec8ff,#1f7fd1);transition:height .25s}
.t .lim{position:absolute;left:0;right:0;bottom:80%;border-top:3px dashed #ff5a2a}
.t .n{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:30px;font-weight:900;text-shadow:0 0 5px #000,0 0 3px #000}
.t.given{border-color:#e8dcc0;background:#1a222c}
.t.given .n{color:#f4ecd8}
.t.full .w{background:linear-gradient(#ff8a6a,#d13a1f)}
.t.done{border-color:#2ee66b;box-shadow:0 0 12px #2ee66b}
.t.bad{border-color:#ff3b1a;box-shadow:0 0 18px #ff3b1a}
.msg{min-height:56px;text-align:center;font-size:20px;font-weight:800;margin-top:8px;line-height:1.35}
.leg{text-align:center;font-size:18px;color:#9fb0c0;line-height:1.4}
.rec{text-align:center;font-size:18px;color:#9fb0c0;margin-top:auto;padding-top:6px}
.fx{position:fixed;left:0;top:0;pointer-events:none;font-size:38px;font-weight:900;transition:transform .8s ease-out,opacity .8s;z-index:9;white-space:nowrap}
#over{position:fixed;inset:0;background:rgba(4,8,12,.93);display:none;align-items:center;justify-content:center;z-index:20}
#over .box{width:min(400px,92vw);background:#16283a;border:3px solid #ffd84a;border-radius:20px;padding:20px;text-align:center}
#over h2{margin:0 0 8px;font-size:28px}
#over .big{font-size:24px;font-weight:800;margin:6px 0}
#over .near{font-size:20px;color:#ffd84a;margin:6px 0}
#over .tip{font-size:19px;line-height:1.45;background:#0b1622;border-radius:12px;padding:10px;margin:12px 0;text-align:left}
#again{width:100%;height:64px;border-radius:16px;border:0;background:#ffd84a;color:#111;font-size:26px;font-weight:900}
</style>
<meta name="description" content="한계선을 넘은 콘덴서 물통을 눌러 한 칸씩 빼서, 가로·세로·네모마다 높이 1~4가 하나씩 되게 맞추는 퍼즐. 너무 빼면 찌릿, 3번이면 끝."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/tank-grid/"><meta property="og:title" content="높이 다 달라!: 콘덴서 물통 빼기 퍼즐"><meta property="og:description" content="한계선을 넘은 콘덴서 물통을 눌러 한 칸씩 빼서, 가로·세로·네모마다 높이 1~4가 하나씩 되게 맞추는 퍼즐. 너무 빼면 찌릿, 3번이면 끝."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="높이 다 달라!: 콘덴서 물통 빼기 퍼즐",D="한계선을 넘은 콘덴서 물통을 눌러 한 칸씩 빼서, 가로·세로·네모마다 높이 1~4가 하나씩 되게 맞추는 퍼즐. 너무 빼면 찌릿, 3번이면 끝.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/tank-grid/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div class="top"><span id="stage">1판</span><span class="sp"></span><span id="life">❤️❤️❤️</span><button id="mute" aria-label="소리">🔊</button></div>
  <div class="rule">넘친 물통을 빼서 줄·네모마다 높이 1~4 하나씩</div>
  <div id="grid"></div>
  <div class="msg" id="msg"></div>
  <div class="leg">빨간 물통 = 한계선 넘음 · 한 번 누를 때 한 칸씩 빠짐<br>너무 많이 빼면 찌릿!</div>
  <div class="rec" id="rec"></div>
</div>
<div id="over"><div class="box">
  <h2>찌릿 3번이에요</h2>
  <div class="big" id="oScore"></div>
  <div class="near" id="oNear"></div>
  <div class="tip" id="oTip"></div>
  <button id="again">한 번 더</button>
</div></div>
<script>
(function(){
'use strict';
var KEY='tank-grid.save.v1';
var save={best:0,total:0};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object'){save.best=o.best|0;save.total=o.total|0;}}}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
var TIPS=[ // FACTS.md 근거(2026-11-18 블로그 「방전」 글)
 '전원을 꺼도 콘덴서 안에는 전기가 남아 있을 수 있어요. 긴 케이블도 조금 머금고 있을 수 있습니다.',
 '남은 전기는 눈으로 봐서는 알 수 없어요. 모르고 만지면 감전될 수 있습니다.',
 '차단기 내리고 → 검전기로 확인하고 → 남은 전기를 방전. 순서대로 밟습니다.',
 '방전은 아무 도구로나 하는 게 아니에요. 잘못하면 불꽃이 튀거나 부품이 상할 수 있습니다.'
];
var AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,delay){if(muted)return;var a=ac();if(!a)return;var t=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
function sPick(){tone(440,.06,'square',.06);}
function sGood(){tone(660,.1,'triangle',.16);tone(990,.14,'triangle',.13,.08);}
function sLine(){[784,988,1175].forEach(function(f,i){tone(f,.14,'triangle',.13,i*.07);});}
function sClear(){[523,659,784,1046,1318].forEach(function(f,i){tone(f,.18,'triangle',.15,i*.08);});}
function sBad(){tone(200,.25,'sawtooth',.1);}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function fx(txt,x,y,color){var e=document.createElement('div');e.className='fx';e.textContent=txt;e.style.color=color;e.style.transform='translate('+(x-40)+'px,'+(y-20)+'px)';document.body.appendChild(e);requestAnimationFrame(function(){e.style.transform='translate('+(x-40)+'px,'+(y-90)+'px) scale(1.2)';e.style.opacity='0';});setTimeout(function(){e.parentNode&&e.parentNode.removeChild(e);},900);}
var $=function(id){return document.getElementById(id);};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0;var t=a[i];a[i]=a[j];a[j]=t;}return a;}
// 4×4 판 만들기(가로·세로·2×2 네모마다 0~3 하나씩)
function solution(){
  var base=[[0,1,2,3],[2,3,0,1],[1,0,3,2],[3,2,1,0]];
  var d=shuffle([0,1,2,3]);
  var bands=shuffle([0,1]),rows=[];bands.forEach(function(b){shuffle([0,1]).forEach(function(r){rows.push(b*2+r);});});
  var stacks=shuffle([0,1]),cols=[];stacks.forEach(function(b){shuffle([0,1]).forEach(function(c){cols.push(b*2+c);});});
  var tr=Math.random()<.5,g=[];
  for(var r=0;r<4;r++){g.push([]);for(var c=0;c<4;c++){var v=tr?base[cols[c]][rows[r]]:base[rows[r]][cols[c]];g[r].push(d[v]);}}
  return g;
}
function ok(g,r,c,v){for(var i=0;i<4;i++){if(g[r][i]===v||g[i][c]===v)return false;}var br=r-r%2,bc=c-c%2;for(var y=br;y<br+2;y++)for(var x=bc;x<bc+2;x++)if(g[y][x]===v)return false;return true;}
function count(g,lim){for(var r=0;r<4;r++)for(var c=0;c<4;c++)if(g[r][c]<0){var n=0;for(var v=0;v<4;v++)if(ok(g,r,c,v)){g[r][c]=v;n+=count(g,lim-n);g[r][c]=-1;if(n>=lim)return n;}return n;}return 1;}
function puzzle(blanks){
  var sol=solution(),g=sol.map(function(r){return r.slice();});var cells=shuffle(Array.from({length:16},function(_,i){return i;})),made=0;
  for(var k=0;k<cells.length&&made<blanks;k++){var r=cells[k]>>2,c=cells[k]&3,keep=g[r][c];g[r][c]=-1;if(count(g,2)!==1)g[r][c]=keep;else made++;}
  return{sol:sol,g:g};
}
var st;
var FULL=5; // 한계선 위(넘친 상태)
function newGame(){st={stage:0,cleared:0,drained:0,life:3,over:false};$('over').style.display='none';nextStage();}
function nextStage(){
  st.stage++;var n=st.stage;var blanks=[3,5,7,8,9][Math.min(4,n-1)]+(n>5?1:0);
  var p=puzzle(blanks);st.sol=p.sol.map(function(r){return r.map(function(v){return v+1;});});
  st.given=p.g.map(function(r){return r.map(function(v){return v>=0;});});
  st.lv=p.g.map(function(r,y){return r.map(function(v,x){return v>=0?v+1:FULL;});});
  st.lock=false;render();msg(n===1?'빨간 물통을 눌러 물을 빼 봐요':'다음 판! 넘친 물통 '+leftCount()+'개','#ffd84a');
}
function leftCount(){var k=0;for(var y=0;y<4;y++)for(var x=0;x<4;x++)if(st.lv[y][x]!==st.sol[y][x])k++;return k;}
function render(){
  var g=$('grid');g.innerHTML='';
  for(var r=0;r<4;r++)for(var c=0;c<4;c++){(function(r,c){var b=document.createElement('button');b.className='t'+(r===1?' r1':'')+(c===1?' c1':'')+(st.given[r][c]?' given':'');
    b.innerHTML='<div class="w"></div><div class="lim"></div><div class="n"></div>';b.onclick=function(){tap(r,c,b);};g.appendChild(b);})(r,c);}
  draw();
}
function tank(r,c){return $('grid').children[r*4+c];}
function lineDone(list){var seen={};return list.every(function(p){var v=st.lv[p[0]][p[1]];if(v>4||seen[v])return false;seen[v]=1;return v===st.sol[p[0]][p[1]];});}
function groups(){var gs=[],i,r,c;for(i=0;i<4;i++){r=[];c=[];for(var j=0;j<4;j++){r.push([i,j]);c.push([j,i]);}gs.push(r,c);}
  for(var by=0;by<4;by+=2)for(var bx=0;bx<4;bx+=2){var b=[];for(var y=by;y<by+2;y++)for(var x=bx;x<bx+2;x++)b.push([y,x]);gs.push(b);}return gs;}
function draw(){
  var okc={};groups().forEach(function(l){if(lineDone(l))l.forEach(function(p){okc[p[0]*4+p[1]]=1;});});
  for(var r=0;r<4;r++)for(var c=0;c<4;c++){var e=tank(r,c),v=st.lv[r][c];
    e.querySelector('.w').style.height=(v>4?96:v*20)+'%';e.querySelector('.n').textContent=v>4?'넘침':v;
    e.classList.toggle('full',v>4);e.classList.toggle('done',!!okc[r*4+c]);}
  $('stage').textContent=st.stage+'판';$('life').textContent='❤️'.repeat(st.life)+'🖤'.repeat(3-st.life);
  $('rec').textContent='최고 '+save.best+'판 · 지금까지 뺀 물 '+save.total+'칸';
}
function msg(t,c){$('msg').textContent=t;$('msg').style.color=c||'#fff';}
function tap(r,c,b){
  if(st.over||st.lock)return;ac();if(st.given[r][c])return;
  var v=st.lv[r][c];if(v<=1){return;}
  var rc=b.getBoundingClientRect(),x=rc.left+rc.width/2,y=rc.top;
  var before={};groups().forEach(function(l,i){if(lineDone(l))before[i]=1;});
  st.lv[r][c]=v-1;
  if(st.lv[r][c]<st.sol[r][c]){
    st.life--;sBad();buzz([50,30,50]);b.classList.add('bad');fx('찌릿!',x,y,'#ff5a2a');
    msg('너무 뺐어요! 이 물통은 '+st.sol[r][c]+'칸이었어요. 다시 가득','#ff9c7a');draw();st.lock=true;
    setTimeout(function(){b.classList.remove('bad');st.lv[r][c]=FULL;st.lock=false;draw();if(st.life<=0)gameOver();},900);return;
  }
  st.drained++;save.total++;store();
  var newLine=false;groups().forEach(function(l,i){if(!before[i]&&lineDone(l))newLine=true;});
  draw();
  if(leftCount()===0){st.cleared++;st.lock=true;sClear();buzz([30,40,30]);fx('판 완성 💡',innerWidth/2,innerHeight/2,'#ffd84a');msg('높이가 다 맞았어요! 다음 판으로','#2ee66b');setTimeout(nextStage,1400);return;}
  if(newLine){sLine();fx('한 줄 딱!',x,y,'#2ee66b');msg('한 줄 높이가 다 달라요!','#2ee66b');}
  else{sGood();fx('쏴아',x,y,'#5ec8ff');msg('','#fff');}
}
function gameOver(){
  st.over=true;st.lock=true;var prev=save.best,nb=st.cleared>prev;if(nb)save.best=st.cleared;store();
  $('oScore').textContent=st.cleared+'판 완성 · 물 '+st.drained+'칸 뺌';
  $('oNear').textContent='이번 판 물통 '+leftCount()+'개만 더 맞추면 넘어갔어요 · '+(nb&&prev>0?'최고 기록 '+(st.cleared-prev)+'판 넘음!':nb?'첫 기록!':'최고 기록까지 '+(prev-st.cleared+1)+'판');
  $('oTip').textContent='💡 '+TIPS[Math.random()*TIPS.length|0];
  $('over').style.display='flex';
}
$('again').onclick=function(){ac();newGame();};
$('mute').onclick=function(){muted=!muted;$('mute').textContent=muted?'🔇':'🔊';};
window.__game={get state(){return st;},save:save,newGame:newGame};
newGame();
})();
</script>
</body>
