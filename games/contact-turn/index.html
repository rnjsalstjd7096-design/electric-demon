<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>접점 돌려!: 래더 램프 맞추기 퍼즐</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#15121c;color:#fff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:10px 12px 14px;user-select:none}
.top{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800}
.top .sp{flex:1}
#mute{width:56px;height:56px;border-radius:14px;border:2px solid #4c4360;background:#231e2e;color:#fff;font-size:24px}
.rule{margin:6px 0;font-size:20px;font-weight:800;color:#ffd84a;text-align:center;line-height:1.3}
.bar{display:flex;justify-content:flex-end;font-size:20px;font-weight:800;margin:2px}
#left.low{color:#ff7a6a}
#ins{display:flex;gap:8px;margin:6px 0}
.in{flex:1;height:60px;border-radius:14px;border:3px solid #4c4360;background:#231e2e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:900;line-height:1.2}
.in.on{background:#14462a;border-color:#2ee66b;color:#c9ffd9}
.in small{font-size:16px;font-weight:800}
#lad{background:#0c0a12;border:2px solid #4c4360;border-radius:14px;padding:8px 0;margin-top:6px}
.rung{display:flex;align-items:center;height:84px;border-left:6px solid #ffd84a;border-right:6px solid #8a7fa0;padding:0 6px;position:relative}
.rung+.rung{margin-top:6px}
.seg{flex:1;height:5px;background:#5a5070;min-width:6px}
.seg.on{background:#ffd84a;box-shadow:0 0 8px #ffd84a}
.ct{width:64px;height:72px;white-space:nowrap;border-radius:12px;border:3px solid #6d6488;background:#231e2e;color:#fff;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}
.ct .sy{font-family:monospace;font-size:19px;letter-spacing:-1px;transition:transform .2s;display:inline-block}
.ct .nm{font-size:16px;color:#cbbfe8}
.ct.ta .sy{color:#9fd4ff}.ct.tb .sy{color:#ffa8d8}
.leg{font-size:17px;font-weight:800;line-height:1.35;background:#231e2e;border-radius:12px;padding:5px 10px;margin-top:6px}
.leg b.a{color:#9fd4ff}.leg b.b{color:#ffa8d8}
.ct.pass{border-color:#ffd84a;background:#3a3210}
.ct.spin .sy{transform:rotate(180deg)}
.coil{width:80px;text-align:center;font-weight:900;font-size:16px;line-height:1.2}
.coil .lp{width:40px;height:40px;border-radius:50%;margin:0 auto 2px;background:#2b2638;border:4px solid #6d6488;display:flex;align-items:center;justify-content:center;font-size:24px}
.coil.on .lp{background:#fff3a0;border-color:#ffd84a;box-shadow:0 0 18px #ffd84a}
.coil .tg{display:inline-block;border-radius:8px;padding:1px 4px;margin-top:1px;white-space:nowrap;font-size:15px}
.coil .tg.want{background:#5a4a0a;color:#ffe680}.coil .tg.no{background:#3a2a2a;color:#ffb0a6}
.coil.ok .tg{outline:3px solid #2ee66b}
.msg{min-height:30px;text-align:center;font-size:19px;font-weight:800;margin-top:8px;line-height:1.35}
.rec{text-align:center;font-size:18px;color:#b3a8c8;margin-top:auto;padding-top:6px}
.fx{position:fixed;left:0;top:0;pointer-events:none;font-size:36px;font-weight:900;transition:transform .8s ease-out,opacity .8s;z-index:9;white-space:nowrap}
#over{position:fixed;inset:0;background:rgba(8,6,12,.93);display:none;align-items:center;justify-content:center;z-index:20}
#over .box{width:min(400px,92vw);background:#231e2e;border:3px solid #ffd84a;border-radius:20px;padding:20px;text-align:center}
#over h2{margin:0 0 8px;font-size:28px}
#over .big{font-size:24px;font-weight:800;margin:6px 0}
#over .near{font-size:20px;color:#ffd84a;margin:6px 0}
#over .tip{font-size:19px;line-height:1.45;background:#15121c;border-radius:12px;padding:10px;margin:12px 0;text-align:left}
#again{width:100%;height:64px;border-radius:16px;border:0;background:#ffd84a;color:#111;font-size:26px;font-weight:900}
</style>
<meta name="description" content="버튼 눌림 상태를 보고 래더 줄의 접점을 a↔b로 돌려, 켜야 할 램프만 켜고 꺼야 할 램프는 끄는 퍼즐. 판마다 돌리기 횟수 한도."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/contact-turn/"><meta property="og:title" content="접점 돌려!: 래더 램프 맞추기 퍼즐"><meta property="og:description" content="버튼 눌림 상태를 보고 래더 줄의 접점을 a↔b로 돌려, 켜야 할 램프만 켜고 꺼야 할 램프는 끄는 퍼즐. 판마다 돌리기 횟수 한도."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="접점 돌려!: 래더 램프 맞추기 퍼즐",D="버튼 눌림 상태를 보고 래더 줄의 접점을 a↔b로 돌려, 켜야 할 램프만 켜고 꺼야 할 램프는 끄는 퍼즐. 판마다 돌리기 횟수 한도.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/contact-turn/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div class="top"><span id="stage">1판</span><span class="sp"></span><span id="left">남은 돌리기 0번</span><button id="mute" aria-label="소리">🔊</button></div>
  <div class="rule">버튼 보고 접점을 돌려 표시대로 켜라</div>
  <div class="leg"><b class="a">─| |─ a접점</b>: 버튼 눌리면 통함<br><b class="b">─|/|─ b접점</b>: 버튼 안 눌리면 통함</div>
  <div id="ins"></div>
  <div id="lad"></div>
  <div class="msg" id="msg">접점을 누르면 a ↔ b로 돌아가요</div>
  <div class="rec" id="rec"></div>
</div>
<div id="over"><div class="box">
  <h2>돌리기 횟수가 다 됐어요</h2>
  <div class="big" id="oScore"></div>
  <div class="near" id="oNear"></div>
  <div class="tip" id="oTip"></div>
  <button id="again">한 번 더</button>
</div></div>
<script>
(function(){
'use strict';
var KEY='contact-turn.save.v1';
var save={best:0,total:0};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object'){save.best=o.best|0;save.total=o.total|0;}}}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
// FACTS.md 1~4
var TIPS=[
 'a접점 ─| |─ : 평소엔 열려 있다가, 누르면 닫혀서 전기가 흐른다.',
 'b접점 ─|/|─ : 평소엔 닫혀 있다가, 누르면 열려서 끊는다.',
 '직렬 = 그리고(AND). 한 줄에 놓인 접점이 전부 닫혀야 전기가 지나간다.',
 'PLC는 입력 읽기 → 위에서 아래로 계산 → 출력, 이 한 바퀴를 아주 짧은 시간마다 되풀이한다.'
];
var AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,delay){if(muted)return;var a=ac();if(!a)return;var t=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
function sTurn(){tone(420,.05,'square',.05);}
function sRung(){tone(700,.1,'triangle',.15);tone(1050,.14,'triangle',.13,.07);}
function sClear(){[523,659,784,1046,1318].forEach(function(f,i){tone(f,.18,'triangle',.15,i*.08);});}
function sBad(){tone(180,.3,'sawtooth',.1);}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function fx(txt,el,color){var r=el.getBoundingClientRect();var x=r.left+r.width/2,y=r.top;var e=document.createElement('div');e.className='fx';e.textContent=txt;e.style.color=color;e.style.transform='translate('+(x-40)+'px,'+(y-10)+'px)';document.body.appendChild(e);requestAnimationFrame(function(){e.style.transform='translate('+(x-40)+'px,'+(y-80)+'px) scale(1.2)';e.style.opacity='0';});setTimeout(function(){e.remove();},900);}
function $(id){return document.getElementById(id);}
function rnd(n){return Math.floor(Math.random()*n);}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var st=null,busy=false;
function cfg(s){
  if(s<=1)return{nIn:2,rungs:1,maxC:1,slack:3};
  if(s===2)return{nIn:2,rungs:2,maxC:1,slack:3};
  if(s===3)return{nIn:2,rungs:2,maxC:2,slack:2};
  if(s===4)return{nIn:3,rungs:3,maxC:2,slack:2};
  return{nIn:3,rungs:3,maxC:3,slack:2};
}
function newGame(){st={stage:1,cleared:0};newStage();}
function passes(c){return c.t==='a'?st.ins[c.i]:!st.ins[c.i];}   // a: 버튼 눌리면 닫힘, b: 안 눌리면 닫힘
function rungOn(r){return r.c.every(passes);}
function minTurns(r){
  if(r.want)return r.c.filter(function(c){return !passes(c);}).length;
  return rungOn(r)?1:0;
}
function newStage(){
  var c=cfg(st.stage);
  st.ins=[];for(var i=0;i<c.nIn;i++)st.ins.push(Math.random()<.5);
  if(st.ins.every(function(x){return x;})||st.ins.every(function(x){return !x;}))st.ins[rnd(c.nIn)]=!st.ins[0];
  st.rungs=[];
  for(var k=0;k<c.rungs;k++){
    var nc=1+rnd(c.maxC);if(st.stage>=5&&k===0)nc=c.maxC;
    var ids=shuf(Array.from({length:c.nIn},function(_,j){return j;})).slice(0,nc).sort();
    st.rungs.push({out:k,want:Math.random()<.6,c:ids.map(function(j){return{i:j,t:Math.random()<.5?'a':'b'};})});
  }
  var need=0;st.rungs.forEach(function(r){need+=minTurns(r);});
  if(need<1||(st.stage>=3&&need<2))return newStage();
  st.need=need;st.left=need+c.slack;st.done=st.rungs.map(ok);render();
}
function ok(r){return rungOn(r)===r.want;}
function render(){
  var h='';st.ins.forEach(function(on,i){h+='<div class="in'+(on?' on':'')+'">버튼'+(i+1)+'<small>'+(on?'● 눌림':'○ 안 눌림')+'</small></div>';});
  $('ins').innerHTML=h;
  var L='';
  st.rungs.forEach(function(r,k){
    var flow=true,row='<div class="rung" id="g'+k+'">';
    r.c.forEach(function(c,j){
      row+='<div class="seg'+(flow?' on':'')+'"></div>';
      var p=passes(c);
      row+='<button class="ct t'+c.t+(flow&&p?' pass':'')+'" data-r="'+k+'" data-j="'+j+'"><span class="sy">'+(c.t==='a'?'─| |─':'─|/|─')+'</span><span class="nm">버튼'+(c.i+1)+'</span></button>';
      flow=flow&&p;
    });
    var on=rungOn(r);
    row+='<div class="seg'+(on?' on':'')+'"></div><div class="coil'+(on?' on':'')+(ok(r)?' ok':'')+'"><div class="lp">'+(on?'💡':'')+'</div>램프'+(r.out+1)+'<br><span class="tg '+(r.want?'want':'no')+'">'+(r.want?'켜야 함':'꺼야 함')+(ok(r)?'✔':'')+'</span></div></div>';
    L+=row;
  });
  $('lad').innerHTML=L;hud();
}
$('lad').addEventListener('click',function(e){
  if(busy)return;var b=e.target.closest('.ct');if(!b)return;ac();
  if(st.left<=0)return;
  var k=+b.getAttribute('data-r'),j=+b.getAttribute('data-j'),c=st.rungs[k].c[j];
  c.t=c.t==='a'?'b':'a';st.left--;sTurn();
  b.classList.add('spin');
  setTimeout(function(){
    render();
    var now=st.rungs.map(ok),gained=false;
    now.forEach(function(v,ix){if(v&&!st.done[ix]){gained=true;var el=document.querySelector('#g'+ix+' .coil');fx('딱 맞음!',el,'#5cf08a');}});
    st.done=now;
    if(gained){sRung();buzz(25);}
    if(now.every(function(v){return v;})){
      busy=true;st.cleared++;save.total++;if(st.cleared>save.best)save.best=st.cleared;store();
      sClear();buzz([30,40,60]);$('msg').textContent='램프가 전부 표시대로! 다음 판…';fx(st.stage+'판 완성!',$('lad'),'#ffd84a');
      setTimeout(function(){st.stage++;newStage();busy=false;$('msg').textContent='버튼 상태가 바뀌었어요. 다시 맞춰 보세요';},1300);
    }else if(st.left<=0){busy=true;sBad();buzz(120);setTimeout(function(){over();busy=false;},700);}
    else $('msg').textContent=gained?'좋아요! 나머지 줄도':'';
  },200);
});
function over(){
  var n=st.rungs.filter(ok).length;
  $('oScore').textContent=st.cleared+'판 완성';
  var gap=save.best-st.cleared;
  $('oNear').textContent='이번 판 램프 '+n+'/'+st.rungs.length+'줄 맞음 · '+(gap>0?'최고 기록('+save.best+'판)까지 '+gap+'판':'최고 기록 '+save.best+'판!');
  $('oTip').textContent='⚡ '+TIPS[rnd(TIPS.length)];
  $('over').style.display='flex';
}
$('again').addEventListener('click',function(){$('over').style.display='none';newGame();$('msg').textContent='접점을 누르면 a ↔ b로 돌아가요';});
$('mute').addEventListener('click',function(){muted=!muted;this.textContent=muted?'🔇':'🔊';});
function hud(){$('stage').textContent=st.stage+'판';$('left').textContent='남은 돌리기 '+st.left+'번';$('left').classList.toggle('low',st.left<=1);
  $('rec').textContent='최고 '+save.best+'판 · 지금까지 완성 '+save.total+'판';}
window.__game={state:function(){return st;},goto:function(n){st.stage=n;newStage();},
  answer:function(){var a=[];st.rungs.forEach(function(r,k){if(r.want){r.c.forEach(function(c,j){if(!passes(c))a.push('[data-r="'+k+'"][data-j="'+j+'"]');});}else if(rungOn(r))a.push('[data-r="'+k+'"][data-j="0"]');});return a;},
  wrong:function(){var r=st.rungs[0];return '[data-r="0"][data-j="0"]';},save:save};
newGame();
})();
</script>
</body>
</html>
