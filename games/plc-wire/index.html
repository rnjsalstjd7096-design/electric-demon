<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>배선부터!: PLC 선 잇기 퍼즐</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12161c;color:#fff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:8px 10px 12px;user-select:none}
.top{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;height:52px}
#ladder:before{content:"래더(프로그램)";position:absolute;right:10px;top:-11px;font-size:14px;color:#9fb0c2;background:#12161c;padding:0 4px}
#ladder{position:relative}
.top .sp{flex:1}
#mute{width:56px;height:52px;border-radius:14px;border:2px solid #44505e;background:#1e2630;color:#fff;font-size:24px}
.rule{margin:2px 0 8px;font-size:20px;font-weight:800;color:#ffd84a;text-align:center;line-height:1.3}
#ladder{background:#0b0f14;border:2px solid #3a4756;border-radius:12px;padding:4px 8px;font-size:19px;font-weight:800}
#ladder .h{font-size:16px;color:#9fb0c2;margin-bottom:2px}
.rung{display:flex;align-items:center;gap:4px;height:27px;border-left:4px solid #6d7c8c;border-right:4px solid #6d7c8c;padding:0 6px;white-space:nowrap}
.rung .ln{flex:1;height:3px;background:#6d7c8c}
.rung .ct{font-family:monospace;color:#cfe3ff}
.rung.on{background:#2b2a0c}.rung.on .ln{background:#ffd84a}.rung.on .ct{color:#ffd84a}
#goal{margin:5px 0;font-size:19px;font-weight:800;background:#1e2630;border-radius:12px;padding:4px 10px;line-height:1.35}
#goal .g.ok{color:#5cf08a}#goal .g.ng{color:#ff7a6a}
#board{position:relative;display:grid;grid-template-columns:1.25fr 1fr 1fr 1.25fr;gap:0;margin-top:4px}
#plcbg{position:absolute;top:0;bottom:0;left:calc(100%*1.25/4.5);width:calc(100%*2/4.5);background:#26313d;border:3px solid #6d7c8c;border-radius:14px;z-index:0}
#plcbg span{position:absolute;top:-2px;left:0;right:0;text-align:center;font-size:15px;color:#9fb0c2;font-weight:800}
.col{display:flex;flex-direction:column;gap:6px;padding:18px 0 4px;z-index:1;align-items:center}
.ep{height:56px;border-radius:14px;border:3px solid #55626f;background:#1e2630;color:#fff;font-size:17px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:2px;position:relative;width:92%}
.ep.term{width:76%;background:#3a4756;font-size:17px}
.ep .ic{font-size:21px}
.ep.sel{border-color:#ffd84a;box-shadow:0 0 14px #ffd84a}
.ep.lit{background:#5a4a0a;border-color:#ffd84a}
.ep.load.lit{background:#7a6510;box-shadow:0 0 22px #ffd84a}
.ep.good{box-shadow:0 0 18px #2ee66b;border-color:#2ee66b}
svg#wires{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2}
#run{margin-top:8px;height:64px;border-radius:16px;border:0;background:#2ee66b;color:#06200f;font-size:24px;font-weight:900}
#run:disabled{opacity:.5}
.msg{min-height:26px;text-align:center;font-size:19px;font-weight:800;margin-top:6px;line-height:1.35}
.rec{text-align:center;font-size:17px;color:#9fb0c2;margin-top:auto;padding-top:4px}
.fx{position:fixed;left:0;top:0;pointer-events:none;font-size:38px;font-weight:900;transition:transform .8s ease-out,opacity .8s;z-index:9;white-space:nowrap}
#over{position:fixed;inset:0;background:rgba(6,8,12,.93);display:none;align-items:center;justify-content:center;z-index:20}
#over .box{width:min(400px,92vw);background:#1e2630;border:3px solid #ffd84a;border-radius:20px;padding:20px;text-align:center}
#over h2{margin:0 0 8px;font-size:28px}
#over .big{font-size:24px;font-weight:800;margin:6px 0}
#over .near{font-size:20px;color:#ffd84a;margin:6px 0}
#over .tip{font-size:19px;line-height:1.45;background:#12161c;border-radius:12px;padding:10px;margin:12px 0;text-align:left}
#again{width:100%;height:64px;border-radius:16px;border:0;background:#ffd84a;color:#111;font-size:26px;font-weight:900}
</style>

t.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div class="top"><span id="stage">1판</span><span class="sp"></span><span id="life">❤️❤️❤️</span><button id="mute" aria-label="소리">🔊</button></div>
  <div class="rule">래더 보고 버튼·기계를 단자에 이어라</div>
  <div id="ladder"></div>
  <div id="goal"></div>
  <div id="board">
    <div id="plcbg"><span>PLC</span></div>
    <div class="col" id="cDev"></div>
    <div class="col" id="cIn"></div>
    <div class="col" id="cOut"></div>
    <div class="col" id="cLoad"></div>
    <svg id="wires"></svg>
  </div>
  <button id="run">▶ 시험 운전</button>
  <div class="msg" id="msg">버튼을 누르고 → 입력 단자를 누르면 선이 이어져요</div>
  <div class="rec" id="rec"></div>
</div>
<div id="over"><div class="box">
  <h2>목숨이 다 됐어요</h2>
  <div class="big" id="oScore"></div>
  <div class="near" id="oNear"></div>
  <div class="tip" id="oTip"></div>
  <button id="again">한 번 더</button>
</div></div>
<script>
(function(){
'use strict';
var KEY='plc-wire.save.v1';
var save={best:0,total:0};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object'){save.best=o.best|0;save.total=o.total|0;}}}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
var BTN=[['🟢','초록 버튼','#2ee66b'],['🔴','빨간 버튼','#ff5a4a'],['🟡','노란 버튼','#ffd84a']];
var LOAD=[['💡','램프'],['⚙️','모터'],['🔔','부저'],['🌀','환풍기']];
// FACTS.md 1~4
var TIPS=[
 '래더(프로그램)가 맞아도 선이 엉뚱한 단자에 물려 있으면 램프는 안 켜진다. 프로그램 보기 전에 배선부터.',
 'PLC는 입력 읽기 → 위에서 아래로 계산 → 출력, 이 한 바퀴를 아주 짧은 시간마다 되풀이한다.',
 'a접점 ─| |─ 은 평소엔 열려 있다가, 누르면 닫혀서 전기가 흐른다.',
 '실제 비상정지 버튼은 버튼 속 b접점을 입력에 배선한다. 선이 끊어져도 「정지」로 읽히게.'
];
var AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,delay){if(muted)return;var a=ac();if(!a)return;var t=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
function sPick(){tone(440,.06,'square',.06);}
function sWire(){tone(660,.08,'triangle',.14);tone(880,.1,'triangle',.12,.06);}
function sOn(){tone(784,.12,'triangle',.15);tone(1175,.16,'triangle',.13,.08);}
function sClear(){[523,659,784,1046,1318].forEach(function(f,i){tone(f,.18,'triangle',.15,i*.08);});}
function sBad(){tone(180,.3,'sawtooth',.1);}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function fx(txt,el,color){var r=el.getBoundingClientRect();var x=r.left+r.width/2,y=r.top;var e=document.createElement('div');e.className='fx';e.textContent=txt;e.style.color=color;e.style.transform='translate('+(x-50)+'px,'+(y-10)+'px)';document.body.appendChild(e);requestAnimationFrame(function(){e.style.transform='translate('+(x-50)+'px,'+(y-80)+'px) scale(1.2)';e.style.opacity='0';});setTimeout(function(){e.remove();},900);}
function $(id){return document.getElementById(id);}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function range(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a;}

var st=null,sel=null,busy=false;
function size(stage){if(stage<=1)return[1,2];if(stage===2)return[2,2];if(stage===3)return[2,3];return[3,3];}
function newGame(){st={stage:1,life:3,cleared:0};newStage();}
function newStage(){
  var sz=size(st.stage),k=sz[0],T=sz[1];
  st.k=k;st.T=T;
  st.perm=shuf(range(T));          // 래더: 입력 i → 출력 perm[i]
  st.btn=shuf(range(3)).slice(0,k); // 화면 왼쪽 버튼(위→아래)
  st.load=shuf(range(4)).slice(0,k);// 화면 오른쪽 기계
  var lp=shuf(range(k));
  st.req=range(k).map(function(m){return{b:m,l:lp[m]};}); // 버튼 m → 기계 lp[m]
  st.req=shuf(st.req);
  st.inW={};st.outW={};st.res=null;sel=null;
  render();
}
function render(){
  var h='';
  for(var i=0;i<st.T;i++)h+='<div class="rung" id="r'+i+'"><span>입력'+(i+1)+'</span><span class="ct">─| |─</span><span class="ln"></span><span class="ct">( 출력'+(st.perm[i]+1)+' )</span></div>';
  $('ladder').innerHTML=h;
  var g='';st.req.forEach(function(r,ix){var b=BTN[st.btn[r.b]],l=LOAD[st.load[r.l]];var c=st.res?(st.res[ix]?' ok':' ng'):'';g+='<div class="g'+c+'">'+(st.res?(st.res[ix]?'✅ ':'❌ '):'☐ ')+b[0]+' '+b[1]+' 누르면 → '+l[0]+' '+l[1]+'</div>';});
  $('goal').innerHTML=g;
  var d='',ii='',oo='',ll='';
  for(var m=0;m<st.k;m++){var b=BTN[st.btn[m]];d+='<button class="ep dev" data-t="d" data-i="'+m+'"><span class="ic">'+b[0]+'</span>'+b[1]+'</button>';}
  for(var t=0;t<st.T;t++){ii+='<button class="ep term" data-t="i" data-i="'+t+'">입력'+(t+1)+'</button>';oo+='<button class="ep term" data-t="o" data-i="'+t+'">출력'+(t+1)+'</button>';}
  for(m=0;m<st.k;m++){var l=LOAD[st.load[m]];ll+='<button class="ep load" data-t="l" data-i="'+m+'"><span class="ic">'+l[0]+'</span>'+l[1]+'</button>';}
  $('cDev').innerHTML=d;$('cIn').innerHTML=ii;$('cOut').innerHTML=oo;$('cLoad').innerHTML=ll;
  hud();setTimeout(drawWires,0);
}
function ep(t,i){return document.querySelector('.ep[data-t="'+t+'"][data-i="'+i+'"]');}
function drawWires(){
  var bd=$('board').getBoundingClientRect(),s='';
  function pt(el,side){var r=el.getBoundingClientRect();return[(side?r.right:r.left)-bd.left,r.top+r.height/2-bd.top];}
  function line(a,b,c){var mx=(a[0]+b[0])/2;s+='<path d="M'+a[0]+' '+a[1]+' C'+mx+' '+a[1]+' '+mx+' '+b[1]+' '+b[0]+' '+b[1]+'" stroke="#000" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M'+a[0]+' '+a[1]+' C'+mx+' '+a[1]+' '+mx+' '+b[1]+' '+b[0]+' '+b[1]+'" stroke="'+c+'" stroke-width="6" fill="none" stroke-linecap="round"/>';}
  for(var m in st.inW){var a=ep('d',m),b=ep('i',st.inW[m]);if(a&&b)line(pt(a,1),pt(b,0),BTN[st.btn[m]][2]);}
  for(var o in st.outW){a=ep('o',o);b=ep('l',st.outW[o]);if(a&&b)line(pt(a,1),pt(b,0),'#e0e6ee');}
  $('wires').innerHTML=s;
}
window.addEventListener('resize',function(){if(st)drawWires();});
function clearSel(){var s=document.querySelectorAll('.ep.sel');for(var i=0;i<s.length;i++)s[i].classList.remove('sel');}
function pairOk(a,b){return (a==='d'&&b==='i')||(a==='i'&&b==='d')||(a==='o'&&b==='l')||(a==='l'&&b==='o');}
function connect(a,b){
  var x=a,y=b;if(x.t==='i'||x.t==='l'){x=b;y=a;}
  if(x.t==='d'){for(var m in st.inW)if(st.inW[m]===y.i)delete st.inW[m];st.inW[x.i]=y.i;}
  else{for(var o in st.outW)if(st.outW[o]===y.i)delete st.outW[o];st.outW[x.i]=y.i;}
  sWire();buzz(15);st.res=null;render();
  $('msg').textContent=done()?'다 이었으면 ▶ 시험 운전!':'선이 이어졌어요. 계속 이어 보세요';
}
function done(){var n=0;for(var m in st.inW)n++;var c=0;for(var o in st.outW)c++;return n>=st.k&&c>=st.k;}
$('board').addEventListener('click',function(e){
  if(busy)return;var b=e.target.closest('.ep');if(!b)return;
  var cur={t:b.getAttribute('data-t'),i:+b.getAttribute('data-i')};ac();
  if(sel&&sel.t===cur.t&&sel.i===cur.i){sel=null;clearSel();return;}
  if(sel&&pairOk(sel.t,cur.t)){var a=sel;sel=null;connect(a,cur);return;}
  sel=cur;clearSel();b.classList.add('sel');sPick();
  $('msg').textContent=(cur.t==='d')?'이제 이을 입력 단자를 누르세요':(cur.t==='i')?'이 단자에 이을 버튼을 누르세요':(cur.t==='o')?'이 출력으로 돌릴 기계를 누르세요':'이 기계에 이을 출력 단자를 누르세요';
});
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
function litReset(){var s=document.querySelectorAll('.lit,.good');for(var i=0;i<s.length;i++)s[i].classList.remove('lit','good');var r=document.querySelectorAll('.rung.on');for(i=0;i<r.length;i++)r[i].classList.remove('on');}
async function run(){
  if(busy)return;ac();busy=true;$('run').disabled=true;clearSel();sel=null;
  var res=[],fail='';
  for(var ix=0;ix<st.req.length;ix++){
    var r=st.req[ix];litReset();
    var bEl=ep('d',r.b);bEl.classList.add('lit');tone(520,.06,'square',.06);
    var lit=[];var t=st.inW[r.b];
    await wait(260);
    if(t!==undefined){ep('i',t).classList.add('lit');$('r'+t).classList.add('on');var o=st.perm[t];await wait(220);ep('o',o).classList.add('lit');if(st.outW[o]!==undefined)lit.push(st.outW[o]);}
    await wait(220);
    lit.forEach(function(l){ep('l',l).classList.add('lit');});
    var ok=lit.length===1&&lit[0]===r.l;res.push(ok);
    if(ok){ep('l',r.l).classList.add('good');sOn();fx('딸깍!',ep('l',r.l),'#5cf08a');}
    else{sBad();if(!fail){var bn=BTN[st.btn[r.b]][1],ln=LOAD[st.load[r.l]][1];fail=(t===undefined)?bn+'이 입력 단자에 안 물려 있어요':(lit.length===0)?bn+'을 눌렀는데 아무것도 안 켜졌어요 — 래더의 출력 번호를 보세요':bn+'을 눌렀는데 '+LOAD[st.load[lit[0]]][1]+'이(가) 켜졌어요 ('+ln+'이어야 함)';}}
    await wait(650);
  }
  litReset();st.res=res;var all=res.every(function(x){return x;});
  if(all){
    st.cleared++;save.total++;if(st.cleared>save.best)save.best=st.cleared;store();
    sClear();buzz([30,40,60]);fx(st.stage+'판 완성!',$('run'),'#ffd84a');
    $('msg').textContent='전부 맞게 돌았어요! 다음 판으로…';render();
    await wait(1300);st.stage++;newStage();$('msg').textContent='래더를 보고 새로 이어 보세요';
  }else{
    st.life--;buzz(120);render();$('msg').textContent='✗ '+fail+' · 선을 고쳐서 다시 운전';
    if(st.life<=0){await wait(900);over();}
  }
  busy=false;$('run').disabled=false;hud();
}
$('run').addEventListener('click',run);
function over(){
  var ok=st.res?st.res.filter(function(x){return x;}).length:0;
  $('oScore').textContent=st.cleared+'판 완성';
  var gap=save.best-st.cleared;
  $('oNear').textContent='이번 판 할 일 '+ok+'/'+st.k+'개 맞음 · '+(gap>0?'최고 기록('+save.best+'판)까지 '+gap+'판':'최고 기록 '+save.best+'판!');
  $('oTip').textContent='⚡ '+TIPS[Math.floor(Math.random()*TIPS.length)];
  $('over').style.display='flex';
}
$('again').addEventListener('click',function(){$('over').style.display='none';newGame();$('msg').textContent='버튼을 누르고 → 입력 단자를 누르면 선이 이어져요';});
$('mute').addEventListener('click',function(){muted=!muted;this.textContent=muted?'🔇':'🔊';});
function hud(){$('stage').textContent=st.stage+'판';$('life').textContent='❤️'.repeat(Math.max(0,st.life))+'🖤'.repeat(3-Math.max(0,st.life));$('rec').textContent='최고 '+save.best+'판 · 지금까지 완성 '+save.total+'판';}
window.__game={state:function(){return st;},goto:function(n){st.stage=n;newStage();},
  answer:function(){var a=[];st.req.forEach(function(r,ix){var t=ix%st.T;a.push({btn:r.b,inp:t,out:st.perm[t],load:r.l});});return a;},save:save};
newGame();
})();
</script>
</body>
