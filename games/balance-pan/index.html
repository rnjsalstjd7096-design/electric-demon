<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>딸깍 균형!: 누전 저울 쌓기 퍼즐</title>
<style>
:root{--bg:#121514;--ink:#fff;--sub:#d0dbd6;--ok:#46e07a;--bad:#ff5050;--y:#ffd23a;--in:#ff9a3d;--out:#4fb0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden}
#app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:8px 12px 64px}
.top{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:4px 2px}
.rule{font-size:20px;color:var(--sub);text-align:center;margin:4px 0;font-weight:700}
#gauge{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800;margin:2px 0 4px}
#gbar{flex:1;height:18px;background:#26302c;border-radius:9px;overflow:hidden}
#gfill{height:100%;width:0;background:var(--ok);transition:.3s}
#msg{font-size:19px;text-align:center;min-height:28px;color:var(--y);font-weight:800}
#scale{position:relative;flex:1;min-height:200px}
#post{position:absolute;left:50%;bottom:6%;width:14px;height:50%;margin-left:-7px;background:#8a978f;border-radius:6px}
#beam{position:absolute;left:2%;right:2%;top:40%;height:12px;background:#c9d3cd;border-radius:6px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.pan{position:absolute;top:6px;width:46%;height:auto;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.pan.l{left:0}.pan.r{right:0}
.pile{position:absolute;bottom:22px;width:100%;display:flex;flex-direction:column-reverse;align-items:center;gap:2px}
.pan .hit{position:absolute;bottom:-60px;left:0;right:0;height:240px}
.dish{width:100%;height:12px;background:#c9d3cd;border-radius:0 0 30px 30px}
.n{font-size:30px;font-weight:900}.lab{font-size:18px;font-weight:900;white-space:nowrap}
.l .n,.l .lab{color:var(--in)}.r .n,.r .lab{color:var(--out)}
.blk{height:26px;border-radius:7px;font-size:18px;font-weight:900;color:#111;display:flex;align-items:center;justify-content:center}
.l .blk{background:var(--in)}.r .blk{background:var(--out)}
#tray{display:flex;gap:10px;margin-top:6px}
.tb{flex:1;min-height:72px;border:3px solid #3c4a44;border-radius:14px;background:#22302a;color:#fff;font-size:30px;font-weight:900}
.tb.sel{border-color:var(--y);background:#3b4a2e}
#side{display:flex;gap:10px;margin-top:8px}
#side button{flex:1;min-height:64px;border:0;border-radius:14px;font-size:22px;font-weight:900;color:#111}
#toL{background:var(--in)}#toR{background:var(--out)}
#over{position:fixed;inset:0;background:rgba(5,7,6,.94);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.box{max-width:400px;width:100%;background:#22302a;border-radius:18px;padding:20px;text-align:center;font-size:21px;line-height:1.5}
.box h2{margin:0 0 6px;font-size:30px}.big{font-size:42px;font-weight:900;color:var(--y)}
.tip{background:#101513;border-radius:12px;padding:10px;margin:12px 0;font-size:19px;color:var(--sub);text-align:left}
#again{width:100%;min-height:64px;border:0;border-radius:14px;background:var(--ok);color:#052;font-size:26px;font-weight:900}
#toast{position:fixed;left:50%;top:36%;white-space:nowrap;transform:translate(-50%,-50%) scale(.6);font-size:32px;font-weight:900;color:var(--y);opacity:0;transition:.3s;pointer-events:none;text-shadow:0 2px 8px #000;z-index:4}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.spark{position:fixed;font-size:24px;pointer-events:none;z-index:4;transition:transform .7s ease-out,opacity .7s}
</style><meta name="description" content="숫자 덩어리 3개 중 골라 들어간 쪽·돌아온 쪽 접시에 올려 두 접시를 같게 맞추는 퍼즐. 차이가 4를 넘으면 차단기 딸깍."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/balance-pan/"><meta property="og:title" content="딸깍 균형!: 누전 저울 쌓기 퍼즐"><meta property="og:description" content="숫자 덩어리 3개 중 골라 들어간 쪽·돌아온 쪽 접시에 올려 두 접시를 같게 맞추는 퍼즐. 차이가 4를 넘으면 차단기 딸깍."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="딸깍 균형!: 누전 저울 쌓기 퍼즐",D="숫자 덩어리 3개 중 골라 들어간 쪽·돌아온 쪽 접시에 올려 두 접시를 같게 맞추는 퍼즐. 차이가 4를 넘으면 차단기 딸깍.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/balance-pan/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head><body>
<div id="app">
 <div class="top"><span>점수 <span id="sc">0</span></span><span>균형 <span id="bal">0</span>번</span><span>최고 <span id="best">0</span></span></div>
 <p class="rule">두 접시가 같아지게 전류 덩어리를 올린다</p>
 <div id="gauge"><span>차이</span><div id="gbar"><div id="gfill"></div></div><span id="gtxt">0/4</span></div>
 <div id="msg"></div>
 <div id="scale"><div id="post"></div>
  <div id="beam">
   <div class="pan l" id="pl"><div class="pile" id="pileL"></div><div class="dish"></div><div class="n" id="nL">0</div><div class="lab">들어간 쪽</div><div class="hit"></div></div>
   <div class="pan r" id="pr"><div class="pile" id="pileR"></div><div class="dish"></div><div class="n" id="nR">0</div><div class="lab">돌아온 쪽</div><div class="hit"></div></div>
  </div>
 </div>
 <div id="tray"></div>
 <div id="side"><button id="toL">◀ 들어간 쪽</button><button id="toR">돌아온 쪽 ▶</button></div>
</div>
<div id="toast"></div>
<div id="over"><div class="box">
 <h2>딸깍! 차단기가 떨어졌어요</h2>
 <div class="big" id="oScore">0점</div>
 <div id="oGap"></div>
 <div class="tip" id="oTip"></div>
 <button id="again">한 번 더</button>
 <div style="font-size:17px;color:var(--sub);margin-top:8px">지금까지 맞춘 균형 <span id="oTot">0</span>번</div>
</div></div>
<script>
(function(){
const KEY='balance-pan.save.v1';let save={best:0,total:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)save=Object.assign(save,s);}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
let ac=null;
function tone(f,d,t,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.14;o.connect(g);g.connect(ac.destination);const n=ac.currentTime;g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d);}catch(e){}}
const $=id=>document.getElementById(id);const rnd=a=>a[Math.floor(Math.random()*a.length)];const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const LIMIT=4;
const LEAK=['💧 젖은 손! 돌아온 쪽에서 1 새어 나감','🧵 낡은 전선 틈으로 돌아온 쪽 1 샘','🧺 세탁기 겉통으로 돌아온 쪽 1 샘'];
const TIPS=['누전차단기는 들어간 전류와 돌아온 전류의 「차이」를 봅니다. 차이가 난다 = 어딘가로 새고 있다는 뜻.','전기를 많이 써도 들어간 만큼 다 돌아오면 누전은 아닙니다. 많이 써서 떨어지는 건 과전류(배선용차단기) 쪽 일이에요.','젖은 손으로 플러그·스위치 만지지 말 것. 새는 길이 사람 몸이 될 수 있습니다.'];
let st,sel=0;
function maxV(){return Math.min(3+Math.floor(st.bal/2),7);}
function blk(){return ri(1,maxV());}
function sum(a){return a.reduce((x,y)=>x+y,0);}
function render(){
 const L=sum(st.L),R=sum(st.R),d=Math.abs(L-R);
 const pile=(el,a)=>{el.innerHTML='';a.forEach(v=>{const b=document.createElement('div');b.className='blk';b.style.width=(30+v*12)+'px';b.textContent=v;el.appendChild(b);});};
 pile($('pileL'),st.L);pile($('pileR'),st.R);$('nL').textContent=L;$('nR').textContent=R;
 $('beam').style.transform='rotate('+Math.max(-14,Math.min(14,(L-R)*3))+'deg)';
 $('gfill').style.width=Math.min(100,d/LIMIT*100)+'%';$('gfill').style.background=d>=LIMIT?'#ff5050':d>=LIMIT-1?'#ffd23a':'#46e07a';$('gtxt').textContent=d+'/'+LIMIT;
 const t=$('tray');t.innerHTML='';st.tray.forEach((v,i)=>{const b=document.createElement('button');b.className='tb'+(i===sel?' sel':'');b.textContent=v;b.onclick=()=>{sel=i;tone(500,.05,'square',.05);render();};t.appendChild(b);});
 $('sc').textContent=st.score;$('bal').textContent=st.bal;$('best').textContent=save.best;
}
function toast(t,c){const e=$('toast');e.textContent=t;e.style.color=c||'#ffd23a';e.classList.add('on');setTimeout(()=>e.classList.remove('on'),900);}
function burst(){for(let i=0;i<16;i++){const s=document.createElement('div');s.className='spark';s.textContent='⚡';s.style.left=(innerWidth/2)+'px';s.style.top=(innerHeight*.4)+'px';document.body.appendChild(s);requestAnimationFrame(()=>{s.style.transform='translate('+((Math.random()-.5)*300)+'px,'+((Math.random()-.7)*300)+'px)';s.style.opacity=0;});setTimeout(()=>s.remove(),750);}}
function put(side){
 if(st.over)return;const v=st.tray[sel];(side==='L'?st.L:st.R).push(v);st.tray[sel]=blk();st.moves++;tone(360+v*30,.07,'triangle',.08);$('msg').textContent='';
 if(st.moves%5===0&&st.R.length){st.R[st.R.length-1]--;if(st.R[st.R.length-1]<=0)st.R.pop();$('msg').textContent=rnd(LEAK);tone(240,.15,'sawtooth',.06);}
 const L=sum(st.L),R=sum(st.R);
 if(L>0&&L===R){const n=st.L.length+st.R.length;const pts=n*n;st.score+=pts;st.bal++;save.total++;store();tone(660,.1);setTimeout(()=>tone(880,.12),90);setTimeout(()=>tone(1320,.25,'triangle',.1),180);if(navigator.vibrate)navigator.vibrate(35);burst();toast('균형! 다 돌아왔다 +'+pts);$('msg').textContent=n>=4?'덩어리 '+n+'개로 맞춤 → '+n+'×'+n+'점':'여러 개로 맞추면 점수가 커져요';st.L=[];st.R=[];}
 render();
 if(Math.abs(L-R)>LIMIT){st.over=true;st.lastD=Math.abs(L-R);tone(160,.45,'sawtooth',.14);if(navigator.vibrate)navigator.vibrate([60,40,60]);toast('딸깍!','#ff5050');setTimeout(over,800);}
}
function over(){const prev=save.best;if(st.score>prev)save.best=st.score;store();
 $('oScore').textContent=st.score+'점 · 균형 '+st.bal+'번';
 $('oGap').textContent='차이 '+st.lastD+' (한계 '+LIMIT+') · '+(st.score>prev?'🎉 새 최고 기록!':'최고 '+prev+'점까지 '+(prev-st.score+1)+'점');
 $('oTip').textContent='💡 '+rnd(TIPS);$('oTot').textContent=save.total;$('over').style.display='flex';}
function start(){st={L:[],R:[],score:0,bal:0,moves:0,over:false};st.tray=[blk(),blk(),blk()];sel=0;$('over').style.display='none';$('msg').textContent='덩어리를 고르고 접시를 누르세요';render();}
$('toL').onclick=()=>put('L');$('toR').onclick=()=>put('R');$('pl').onclick=()=>put('L');$('pr').onclick=()=>put('R');$('again').onclick=start;
window.__game={get state(){return st;},put,select:i=>{sel=i;render();},save:()=>save};
start();
})();
</script></body></html>
