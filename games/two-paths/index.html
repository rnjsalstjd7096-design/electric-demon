<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>길이 둘!: 중성선 접지선 길 고르기</title>
<meta name="description" content="평소 돌아오는 길과 고장 때 빠지는 길을 고르는 8문제 퀴즈 퍼즐.">
<style>
html,body{margin:0;height:100%;background:#14161b;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;font-size:20px}
#app{position:relative;margin:0 auto;max-width:480px;height:100%;display:flex;flex-direction:column;padding:8px 12px 10px;box-sizing:border-box}
#top{display:flex;align-items:center;justify-content:space-between;padding-left:44px;padding-right:56px;min-height:48px}
#top b{font-size:20px;white-space:nowrap}#stat{white-space:nowrap;font-size:20px;font-weight:800;color:#ffd23f}
#sub{font-size:20px;line-height:1.35;color:#e8ebf2;text-align:center;margin:4px 0 8px;word-break:keep-all}
#board{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
.btn{flex:1;border:0;border-radius:14px;font-size:20px;font-weight:800;min-height:56px;font-family:inherit;cursor:pointer;touch-action:manipulation;background:#3b4252;color:#fff;box-shadow:0 4px 0 #1f232c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f232c}.btn.main{background:#ffd23f;color:#2b2000;box-shadow:0 4px 0 #a98400}
#mute{position:absolute;top:8px;right:10px;width:48px;height:48px;border:0;border-radius:24px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;z-index:5}
#end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,11,16,.78);z-index:4;padding:16px;box-sizing:border-box}
#end.on{display:flex}
#card{width:100%;max-width:360px;background:#2b2f3a;border:3px solid #4a505f;border-radius:18px;padding:18px;box-sizing:border-box;text-align:center;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#endTitle{font-size:24px;font-weight:800;margin:0 0 6px}#endScore{font-size:52px;font-weight:900;line-height:1.1;color:#ffd23f}
#endSub{font-size:20px;color:#e8ebf2;margin:4px 0}#endBest{font-size:20px;font-weight:700;color:#9fe1ff;margin:0 0 10px}
#fact{font-size:20px;line-height:1.45;background:#1d2029;border-radius:12px;padding:10px 12px;margin:0 0 12px;text-align:left;word-break:keep-all}
.shake{animation:sk .3s}@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.sp{position:absolute;font-size:28px;animation:fl .8s ease-out forwards}@keyframes fl{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.6)}}
#bar{width:100%;text-align:center;min-height:56px;font-size:20px;font-weight:700;color:#9fe1ff;margin-top:6px;line-height:1.3;word-break:keep-all}
.nb{background:repeating-linear-gradient(45deg,#2f9e44 0 9px,#f2d21b 9px 18px);color:#111;text-shadow:0 1px 0 #fff8}
.bl{background:#2f6fdc;color:#fff}

#scene{width:100%;max-width:372px;background:#222633;border:3px solid #4a505f;border-radius:18px;padding:14px 12px;box-sizing:border-box;text-align:center;margin-top:4px}
#scene .em{font-size:56px;line-height:1.1}#scene .q{font-size:22px;font-weight:800;line-height:1.4;margin-top:6px;word-break:keep-all}
#choices{display:flex;flex-direction:column;gap:12px;width:100%;max-width:372px;margin-top:14px}
.ch{border:4px solid #fff;border-radius:16px;min-height:84px;font-size:24px;font-weight:900;font-family:inherit;touch-action:manipulation;cursor:pointer;line-height:1.25}
.ch small{display:block;font-size:18px;font-weight:700}
.ch:active{transform:scale(.97)}
</style>
<meta name="description" content="평소 돌아오는 길과 고장 때 빠지는 길을 고르는 8문제 퀴즈 퍼즐(맞으면 ⚡, 틀리면 ❤ 하나 줄어듦)"><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/two-paths/"><meta property="og:title" content="길이 둘!: 중성선 접지선 길 고르기"><meta property="og:description" content="평소 돌아오는 길과 고장 때 빠지는 길을 고르는 8문제 퀴즈 퍼즐(맞으면 ⚡, 틀리면 ❤ 하나 줄어듦)"><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;top:max(8px,env(safe-area-inset-top));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="길이 둘!: 중성선 접지선 길 고르기",D="평소 돌아오는 길과 고장 때 빠지는 길을 고르는 8문제 퀴즈 퍼즐(맞으면 ⚡, 틀리면 ❤ 하나 줄어듦)",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/two-paths/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div id="top"><b id="lv"></b><span id="stat"></span></div>
  <div id="sub"></div>
  <div id="board"></div>
  <div id="bar"></div>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <div id="fx"></div>
  <div id="end"><div id="card">
    <div id="endTitle"></div><div id="endScore"></div><div id="endSub"></div><div id="endBest"></div>
    <div id="fact"></div>
    <button class="btn main" id="again" style="width:100%">한 번 더</button>
  </div></div>
</div>
<script>
const KEY='two-paths.save.v1';
"use strict";
const $=id=>document.getElementById(id);
let save={best:0,plays:0,fi:0};
try{const r=localStorage.getItem(KEY);if(r)save=Object.assign(save,JSON.parse(r));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
let muted=false,AC=null;
try{muted=localStorage.getItem(KEY+'.mute')==='1';}catch(e){}
function actx(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();}if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,t,v,when){if(muted)return;const a=actx();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;const s=a.currentTime+(when||0);g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d);}catch(e){}}
const sfx={tap(){tone(520,.07,'triangle',.1)},ok(){tone(660,.1,'triangle',.14);tone(880,.14,'triangle',.14,.09)},bad(){tone(180,.25,'sawtooth',.12)},
 done(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.08))},lose(){[330,262,196].forEach((f,i)=>tone(f,.28,'sawtooth',.1,i*.16))}};
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function burst(x,y,ch){const fx=$('fx'),r=fx.getBoundingClientRect();for(let i=0;i<5;i++){const s=document.createElement('div');s.className='sp';s.textContent=ch||'✨';s.style.left=(x-r.left-14+(Math.random()*60-30))+'px';s.style.top=(y-r.top-14+(Math.random()*30-15))+'px';fx.appendChild(s);setTimeout(()=>s.remove(),850);}}
function burstEl(el,ch){if(!el)return burst(innerWidth/2,innerHeight/3,ch);const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,ch);}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'.mute',muted?'1':'0');}catch(e){}if(!muted)sfx.tap();};
function showEnd(title,score,sub,best,isNew,fact){$('endTitle').textContent=title;$('endScore').textContent=score;$('endSub').textContent=sub;const b=$('endBest');b.textContent=best;b.style.color=isNew?'#ffd23f':'#9fe1ff';$('fact').innerHTML=fact;$('end').classList.add('on');}
function hideEnd(){$('end').classList.remove('on');}
function endGame(t,n,unit,extra,facts){over=true;save.plays++;const nb=n>save.best;const prev=save.best;if(nb)save.best=n;const f=facts[save.fi++%facts.length];persist();sfx.lose();
 const gap=nb?0:save.best-n;
 showEnd(t,n+unit,extra+(nb?'':' · 최고 기록까지 '+(gap+1)+unit+' (아깝다!)'),nb?'신기록! 이전 최고 '+prev+unit:'최고 '+save.best+unit,nb,'<b>'+f[0]+'</b> — '+f[1]);}


const TITLE='길이 둘!';
const Q=[
 ['💡','방 전등이 평소처럼 켜져 있어요. 일을 마친 전류가 전원으로 돌아오는 길은?','N'],
 ['🌀','선풍기 겉이 새는 고장이 났어요. 새는 전기를 안전하게 빼 주는 비상 길은?','PE'],
 ['😴','아무 일 없는 평소에 전류가 거의 안 흐르고 쉬고 있는 길은?','PE'],
 ['🔵','파란색 선이에요. 어느 길일까요?','N'],
 ['🟩','녹색-노란색 줄무늬 선이에요. 어느 길일까요?','PE'],
 ['📺','TV를 보는 중이에요. 쓰고 남은 전류가 되돌아가는 길은?','N'],
 ['⚠️','세탁기 몸통에 전기가 샜어요. 고장 때만 일하는 길은?','PE'],
 ['☕','전기 포트가 끓는 중이에요. 평소 전류가 돌아오는 길은?','N'],
 ['🛡️','「평소엔 쉬고, 고장 때 지켜 주는 길」은 어느 쪽일까요?','PE'],
 ['🏃','「평소에 일하면서 전류가 돌아오는 길」은 어느 쪽일까요?','N'],
 ['❄️','냉장고가 잘 돌아가는 중이에요. 전류가 돌아오는 길은?','N'],
 ['🔧','냉장고 겉에 전기가 샜어요. 빠져나가는 비상 길은?','PE']];
const FACTS=[
 ['중성선','중성선(N)은 파란색이에요. 평소 쓰고 난 전류가 전원으로 돌아오는 길이에요.'],
 ['접지선','접지선은 녹색-노란색이에요. 평소엔 쉬고, 고장 나서 전기가 샐 때 빠지는 비상 길이에요.'],
 ['두 길','두 길은 맡은 일이 달라서 이름도 색도 달라요.'],
 ['색은 약속','전선 색은 한국전기설비규정(KEC)이 정한 약속이에요. 색만 믿지 말고 검전기로 꼭 확인하세요.']];
const PER=8,LIVES=3;
let qs,qi,lives,score,combo,over,locked;
function start(){hideEnd();over=false;locked=false;score=0;combo=0;lives=LIVES;qi=0;qs=shuffle(Q.slice()).slice(0,PER);render('위 질문에 맞는 길을 눌러요');}
function render(msg){
 $('lv').textContent=TITLE;$('stat').textContent='❤'.repeat(lives)+' '+(qi+1>PER?PER:qi+1)+'/'+PER;
 $('sub').textContent='평소 돌아오는 길일까, 고장 때 빠지는 길일까?';
 const q=qs[qi]||qs[PER-1];
 const flip=q.flip===undefined?(q.flip=Math.random()<.5):q.flip;
 const bN='<button class="ch bl" data-a="N">🔵 중성선<small>평소 돌아오는 길</small></button>';
 const bP='<button class="ch nb" data-a="PE">🟩 접지선<small>고장 때 빠지는 길</small></button>';
 $('board').innerHTML='<div id="scene"><div class="em">'+q[0]+'</div><div class="q">'+q[1]+'</div></div><div id="choices">'+(flip?bP+bN:bN+bP)+'</div>';
 $('bar').textContent=msg||'';
 document.querySelectorAll('.ch').forEach(el=>el.onclick=()=>pick(el.dataset.a,el));}
function pick(a,el){if(over||locked)return;const q=qs[qi];
 if(a===q[2]){score++;combo++;sfx.ok();vib(20);burstEl(el,'⚡');if(combo>=3&&combo%3===0){sfx.done();burst(innerWidth/2,innerHeight/4,'🌟');}
  qi++;
  if(qi>=PER){over=true;save.plays++;const nb=score>save.best;if(nb)save.best=score;persist();sfx.done();showEnd('전부 통과!',score+'문제','8문제를 끝까지 풀었어요 · ❤ '+lives+'개 남음',nb?'신기록!':'최고 '+save.best+'문제',nb,'<b>'+FACTS[save.fi%FACTS.length][0]+'</b> — '+FACTS[save.fi++%FACTS.length][1]);persist();return}
  render(combo>=2?'연속 '+combo+'번 맞혔어요!':'딱 맞아요');return}
 combo=0;lives--;sfx.bad();vib([60,40,60]);$('board').classList.add('shake');setTimeout(()=>$('board').classList.remove('shake'),320);
 const right=q[2]==='N'?'중성선(파랑)':'접지선(녹색-노란색)';
 if(lives<=0){endGame('❤이 다 떨어졌어요',score,'문제','맞힌 문제 '+score+'문제 · 마지막 정답은 '+right,FACTS);render('');return}
 qi++;if(qi>=PER){over=true;endGame('끝까지 왔어요',score,'문제','맞힌 문제 '+score+'/'+PER+' · 마지막 정답은 '+right,FACTS);return}
 render('아쉬워요! 정답은 '+right+'이었어요');}
$('again').onclick=()=>{sfx.tap();start();};
window.__game={get state(){return {qi,lives,score,combo,over,answer:(qs[qi]||[])[2]}},start,pick:a=>pick(a,null)};
start();

</script>
</body>
</html>
