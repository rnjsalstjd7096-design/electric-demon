<style>
*{box-sizing:border-box;word-break:keep-all;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#101820;color:#fff;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none;touch-action:none}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:8px 10px 10px;user-select:none}
.top{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800}
.top .sp{flex:1}
#mute{width:56px;height:56px;border-radius:14px;border:2px solid #3c4c5c;background:#1a2632;color:#fff;font-size:24px}
.rule{margin:2px 0 6px;font-size:20px;font-weight:800;color:#ffd84a;text-align:center;line-height:1.3}
.moves{text-align:center;font-size:21px;font-weight:800;margin-bottom:6px}
.moves b{color:#7be0ff}
#wrap{position:relative;margin:0 auto}
#board{position:absolute;left:0;top:0;background:#1e2a36;border:4px solid #4a6070;border-radius:12px;background-image:linear-gradient(#2c3c4a 2px,transparent 2px),linear-gradient(90deg,#2c3c4a 2px,transparent 2px)}
.door{position:absolute;color:#7bffb0;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;width:30px}
.b.card{background:#fff6d0;color:#111;font-size:22px;border-color:#c9a400}
.b.card .u{color:#c0392b}
.b.card.mA .u{color:#1565c0}
.order{display:inline-block;background:#ffd84a;color:#111;border-radius:10px;padding:2px 10px;font-size:24px}
.b{position:absolute;border-radius:10px;border:3px solid rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:#111;touch-action:none;transition:left .12s,top .12s}
.b.drag{transition:none;z-index:5;box-shadow:0 0 0 3px #fff}
.b.t{background:#ff4d3d;color:#fff;font-size:22px}
.b.out{transition:left .45s ease-in,opacity .45s;opacity:0}
.msg{min-height:56px;text-align:center;font-size:20px;font-weight:800;margin-top:8px;line-height:1.35}
.msg.warn{color:#ff9a8a}
#reset{display:block;margin:2px auto 0;height:56px;padding:0 22px;border-radius:14px;border:2px solid #3c4c5c;background:#1a2632;color:#fff;font-size:20px;font-weight:800}
.rec{text-align:center;font-size:18px;color:#b0a690;margin-top:auto;padding-top:4px}
.fx{position:fixed;left:0;top:0;pointer-events:none;font-size:34px;font-weight:900;transition:transform .9s ease-out,opacity .9s;z-index:9;white-space:nowrap;color:#7bffb0}
#over{position:fixed;inset:0;background:rgba(5,8,12,.94);display:none;align-items:center;justify-content:center;z-index:20}
#over .box{width:min(400px,92vw);background:#1a2632;border:3px solid #ffd84a;border-radius:20px;padding:18px;text-align:center}
#over h2{margin:0 0 6px;font-size:27px}
#over .big{font-size:24px;font-weight:800;margin:6px 0}
#over .near{font-size:20px;color:#ffd84a;margin:6px 0}
#over .tip{font-size:19px;line-height:1.45;background:#101820;border-radius:12px;padding:10px;margin:10px 0;text-align:left}
#again{width:100%;height:64px;border-radius:16px;border:0;background:#ffd84a;color:#111;font-size:26px;font-weight:900}
</style>
<meta name="description" content="주문 전류(예: 5A)와 같은 카드(5000mA)만 6×6 판에서 밀어 문으로 빼는 블록 탈출 퍼즐. 헷갈리는 카드를 빼면 하트 -1."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/ma-slide/"><meta property="og:title" content="그 전류만 빼!: A·mA 블록 탈출 퍼즐"><meta property="og:description" content="주문 전류(예: 5A)와 같은 카드(5000mA)만 6×6 판에서 밀어 문으로 빼는 블록 탈출 퍼즐. 헷갈리는 카드를 빼면 하트 -1."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="그 전류만 빼!: A·mA 블록 탈출 퍼즐",D="주문 전류(예: 5A)와 같은 카드(5000mA)만 6×6 판에서 밀어 문으로 빼는 블록 탈출 퍼즐. 헷갈리는 카드를 빼면 하트 -1.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/ma-slide/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div class="top"><span id="stage">1판</span><span class="sp"></span><button id="mute" aria-label="소리">🔊</button></div>
  <div class="rule">주문과 같은 전류 카드만 밀어 문으로</div>
  <div class="moves" id="moves"></div>
  <div id="wrap"><div id="board"></div><div id="doors"></div></div>
  <div class="msg" id="msg"></div>
  <button id="reset">↺ 이 판 처음부터</button>
  <div class="rec" id="rec"></div>
</div>
<div id="over"><div class="box">
  <h2>엉뚱한 카드가 나갔어요</h2>
  <div class="big" id="oScore"></div>
  <div class="near" id="oNear"></div>
  <div class="tip" id="oTip"></div>
  <button id="again">한 번 더</button>
</div></div>
<script>
(function(){
'use strict';
var KEY='ma-slide.save.v1';
var save={best:0,total:0};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object'){save.best=o.best|0;save.total=o.total|0;}}}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
// FACTS.md 1~3
var TIPS=[
 '1A는 1000mA예요. m(밀리)는 「천분의 일」이라 mA를 1000으로 나누면 A가 돼요.',
 '누전차단기(사람 감전 보호용)는 30mA에서 떨어져요. 30mA = 0.03A, 아주 작은 전류예요.',
 '보조배터리의 mAh는 「얼마나 오래」(용량), 충전기의 A는 「얼마나 세게」(전류)예요. 둘은 다른 말이에요.'
];
var COLORS=['#7be0ff','#b8f28a','#f0b7ff','#ffb870','#d0d0d0'];
var AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,delay){if(muted)return;var a=ac();if(!a)return;var t=a.currentTime+(delay||0);var o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function $(id){return document.getElementById(id);}
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fx(txt){var d=document.createElement('div');d.className='fx';d.textContent=txt;var x=window.innerWidth/2-120,y=window.innerHeight/2-40;d.style.transform='translate('+x+'px,'+y+'px)';document.body.appendChild(d);requestAnimationFrame(function(){d.style.transform='translate('+x+'px,'+(y-90)+'px)';d.style.opacity='0';});setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},1000);}
function txt(ma,u){return u==='A'?String(ma/1000):String(ma);}
var N=6;
// 블록: {h, len, fix, gone, v(mA), u}
function cells(b,p){var a=[];for(var k=0;k<b.len;k++)a.push(b.h?b.fix*N+p+k:(p+k)*N+b.fix);return a;}
function occ(bs,pos,skip){var g=new Array(N*N).fill(-1);bs.forEach(function(b,i){if(i===skip||b.gone)return;cells(b,pos[i]).forEach(function(c){g[c]=i;});});return g;}
function range(bs,pos,i){var g=occ(bs,pos,i),b=bs[i],lo=pos[i],hi=pos[i];
 while(lo>0&&g[b.h?b.fix*N+lo-1:(lo-1)*N+b.fix]<0)lo--;
 while(hi+b.len<N&&g[b.h?b.fix*N+hi+b.len:(hi+b.len)*N+b.fix]<0)hi++;
 return [lo,hi];}
function solve(bs,pos0,cap){
 var key=function(p){return p.join('');};
 var seen={},q=[pos0],d=0,cnt=0;seen[key(pos0)]=1;
 while(q.length&&d<=cap){var nq=[];
  for(var qi=0;qi<q.length;qi++){var p=q[qi];if(p[0]+bs[0].len===N)return d;
   for(var i=0;i<bs.length;i++){var r=range(bs,p,i);for(var v=r[0];v<=r[1];v++){if(v===p[i])continue;var np=p.slice();np[i]=v;var k=key(np);if(!seen[k]){seen[k]=1;cnt++;nq.push(np);}}}}
  q=nq;d++;if(cnt>25000)return -1;}
 return -1;}
var BASE=[1000,2000,3000,5000,500,1500,200,250,100,50,30,20];
function values(st){
 var pool=st<=2?[1000,2000,3000,5000,500]:BASE;
 var v=pool[rnd(pool.length)];
 var dec=[v*10,v/10,v*100,v/100,v*1000].filter(function(x){return x>=1&&x<=50000&&x===Math.round(x);});
 shuffle(dec);
 return {v:v,dec:dec};
}
function gen(st){
 var nd=st<=2?1:st<=5?2:3;
 var k=Math.min(2+st,10),want=Math.min(1+Math.floor(st*0.7),8),best=null,bestD=-1,t0=Date.now();
 var val=values(st);var ou=Math.random()<.5?'A':'mA',cu=ou==='A'?'mA':'A';
 for(var tries=0;tries<260;tries++){
  if(best&&Date.now()-t0>500)break;
  var rows=shuffle([0,1,2,3,4,5]);
  var bs=[{h:true,len:2,fix:rows[0],v:val.v,u:cu}],pos=[rnd(3)];
  for(var d=0;d<nd;d++){bs.push({h:true,len:2,fix:rows[1+d],v:val.dec[d%val.dec.length],u:Math.random()<.6?cu:ou});pos.push(rnd(3));}
  var g=occ(bs,pos,-1),ok=true;
  for(var i=0;i<bs.length;i++)cells(bs[i],pos[i]).forEach(function(c){if(g[c]!==i)ok=false;});
  if(!ok)continue;
  for(var a=0;a<80&&bs.length<1+nd+k;a++){
   var len=Math.random()<.3?3:2,fix=rnd(N),p=rnd(N-len+1);
   var b={h:false,len:len,fix:fix},cs=cells(b,p);
   if(cs.some(function(c){return g[c]>=0;}))continue;
   bs.push(b);pos.push(p);cs.forEach(function(c){g[c]=bs.length-1;});
  }
  var dd=solve(bs,pos,want+2);
  if(dd<0)continue;
  if(dd>bestD&&dd<=want){best={bs:bs,pos:pos};bestD=dd;}
  if(dd===want)break;
 }
 if(!best){best={bs:[{h:true,len:2,fix:2,v:val.v,u:cu},{h:false,len:2,fix:4}],pos:[0,1]};bestD=1;}
 best.bs.forEach(function(b){if(!b.u)b.col=COLORS[rnd(COLORS.length)];});
 return {bs:best.bs,pos:best.pos,min:bestD,order:{v:val.v,u:ou}};
}
var S={stage:1,hearts:3,bs:[],pos:[],start:[],min:0,used:0,order:null,over:false,lock:false,cs:50};
function layout(){
 var w=Math.min(document.documentElement.clientWidth,430)-20-30,avail=window.innerHeight-310;
 S.cs=Math.floor(Math.min(w/N,avail/N,62));
 var W=S.cs*N+8;
 $('wrap').style.width=(W+30)+'px';$('wrap').style.height=W+'px';
 var bd=$('board');bd.style.width=W+'px';bd.style.height=W+'px';bd.style.backgroundSize=S.cs+'px '+S.cs+'px';bd.style.backgroundPosition='-2px -2px';
 var ds=$('doors');ds.innerHTML='';
 for(var r=0;r<N;r++){var d=document.createElement('div');d.className='door';d.textContent='▶';d.style.left=(W)+'px';d.style.top=(4+r*S.cs)+'px';d.style.height=S.cs+'px';ds.appendChild(d);}
}
function build(){
 var g=gen(S.stage);
 S.bs=g.bs;S.pos=g.pos.slice();S.start=g.pos.slice();S.min=g.min;S.order=g.order;S.used=0;
 layout();
 var bd=$('board');bd.innerHTML='';
 S.bs.forEach(function(b,i){var e=document.createElement('div');e.dataset.i=i;
  e.style.width=((b.h?b.len:1)*S.cs-6)+'px';e.style.height=((b.h?1:b.len)*S.cs-6)+'px';
  if(b.u){e.className='b card '+b.u;var tl=(txt(b.v,b.u)+b.u).length;e.style.fontSize=(tl>=7?17:tl>=6?19:22)+'px';e.innerHTML=txt(b.v,b.u)+'<span class="u">'+b.u+'</span>';}
  else{e.className='b';e.style.background=b.col;}
  bd.appendChild(e);});
 place();render();
 say(S.stage===1?'카드를 옆으로 끌어 오른쪽 ▶ 문으로 빼 보세요':'틀린 카드를 빼면 하트가 줄어요');
}
function place(){var es=document.querySelectorAll('#board .b');S.bs.forEach(function(b,i){var e=es[i];var r=b.h?b.fix:S.pos[i],c=b.h?S.pos[i]:b.fix;e.style.left=(c*S.cs+3)+'px';e.style.top=(r*S.cs+3)+'px';});}
function say(t,warn){$('msg').textContent=t;$('msg').className='msg'+(warn?' warn':'');}
function render(){
 $('stage').textContent=S.stage+'판 '+'❤️'.repeat(S.hearts)+'🖤'.repeat(3-S.hearts);
 $('moves').innerHTML='주문 <span class="order">'+txt(S.order.v,S.order.u)+S.order.u+'</span> 과 같은 카드';
 $('rec').textContent='최고 '+save.best+'판 · 지금까지 맞게 뺀 카드 '+save.total+'장';
}
var D=null;
$('board').addEventListener('pointerdown',function(e){
 if(S.over||S.lock)return;var t=e.target.closest('.b');if(!t)return;ac();
 var i=+t.dataset.i;if(S.bs[i].gone)return;D={i:i,el:t,x:e.clientX,y:e.clientY,p0:S.pos[i],r:range(S.bs,S.pos,i)};
 t.classList.add('drag');try{t.setPointerCapture(e.pointerId);}catch(err){}e.preventDefault();
});
window.addEventListener('pointermove',function(e){if(!D)return;var b=S.bs[D.i];var dpx=b.h?e.clientX-D.x:e.clientY-D.y;
 var px=Math.max((D.r[0]-D.p0)*S.cs,Math.min((D.r[1]-D.p0)*S.cs,dpx));
 var base=D.p0*S.cs+3+px;if(b.h)D.el.style.left=base+'px';else D.el.style.top=base+'px';});
function end(e){if(!D)return;var b=S.bs[D.i];var dpx=b.h?e.clientX-D.x:e.clientY-D.y;
 var np=Math.max(D.r[0],Math.min(D.r[1],D.p0+Math.round(dpx/S.cs)));
 var i=D.i,el=D.el;el.classList.remove('drag');D=null;
 if(np!==S.pos[i]){S.pos[i]=np;S.used++;tone(260+np*40,.07,'triangle',.12);}
 place();
 if(b.h&&S.pos[i]+b.len===N)exitCard(i,el);
}
window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
function exitCard(i,el){
 var b=S.bs[i];b.gone=true;el.classList.add('out');el.style.left=(N*S.cs+40)+'px';
 if(i===0){win();return;}
 S.hearts--;render();
 tone(160,.25,'sawtooth',.12);vib([50,30,50]);
 say(txt(b.v,b.u)+b.u+'는 '+(b.u==='A'?b.v+'mA':(b.v/1000)+'A')+'예요. 주문과 달라요',true);
 if(S.hearts<=0)lose();
}
function win(){
 S.lock=true;save.total++;if(S.stage>save.best)save.best=S.stage;store();
 var o=S.order;
 tone(523,.12,'triangle',.2);tone(659,.12,'triangle',.2,.12);tone(784,.12,'triangle',.2,.24);tone(1047,.35,'triangle',.2,.36);vib([30,30,60]);
 fx(txt(o.v,'A')+'A = '+o.v+'mA');say(S.stage+'판 성공! 딱 맞는 카드예요');
 setTimeout(function(){S.stage++;S.lock=false;build();},1400);
}
function lose(){
 S.over=true;store();vib([60,40,60]);
 var done=S.stage-1,gap=S.bs[0].gone?0:N-(S.pos[0]+S.bs[0].len);
 $('oScore').textContent=done+'판 성공 · '+S.stage+'판에서 맞는 카드가 문까지 '+gap+'칸';
 var g2=save.best-done;
 $('oNear').textContent=g2>0?'최고 기록까지 '+g2+'판 남았어요':'최고 기록과 같아요! 한 판만 더';
 var b=S.bs[0];
 $('oTip').textContent='💡 정답은 '+txt(b.v,b.u)+b.u+' 카드였어요. '+TIPS[rnd(TIPS.length)];
 setTimeout(function(){$('over').style.display='flex';},400);
}
function resetStage(){if(S.over||S.lock)return;S.bs.forEach(function(b,i){if(!b.gone)S.pos[i]=S.start[i];});
 var es=document.querySelectorAll('#board .b');S.bs.forEach(function(b,i){if(!b.gone)S.pos[i]=S.start[i];});place();say('처음 자리로 돌렸어요');}
function start(){S.stage=1;S.hearts=3;S.over=false;S.lock=false;$('over').style.display='none';build();}
$('reset').addEventListener('click',resetStage);
$('again').addEventListener('click',function(){ac();start();});
$('mute').addEventListener('click',function(){muted=!muted;this.textContent=muted?'🔇':'🔊';});
window.__game={state:S,save:save,start:start,solve:solve,range:range,build:build};
start();
