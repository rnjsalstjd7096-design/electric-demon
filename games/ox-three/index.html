.hide{display:none}
.spark{position:fixed;pointer-events:none;font-size:40px;animation:fly .8s forwards;z-index:9}
@keyframes fly{to{transform:translateY(-120px) scale(1.6);opacity:0}}

<script>
'use strict';
// 문제는 「60초 전기 OX」(games/elec-ox) 문제 그대로. [문장, 정답, 해설]. 근거는 FACTS.md.
const Q=[["KEC에서 L1상 전선 색은 갈색이다.","O","KEC 121.2: L1 갈색, L2 흑색, L3 회색, N 청색, 보호도체 녹색-노란색."],["KEC에서 L2상 전선 색은 적색이다.","X","L2는 흑색(검정)이다. 적색은 옛 규정 색상."],["KEC에서 L3상 전선 색은 회색이다.","O","L3는 회색. 갈색·흑색·회색 순서로 L1·L2·L3를 기억하자."],["KEC에서 중성선(N) 색은 흰색이다.","X","중성선(N)은 청색(파란색)이다."],["보호도체(PE)는 녹색-노란색 줄무늬 전선을 쓴다.","O","보호도체(접지선)는 녹색-노란색. 다른 용도로 쓰면 안 된다."],["보호도체(PE) 색상으로 흑색을 써도 된다.","X","보호도체는 녹색-노란색만. 흑색은 L2상 색이다."],["나전선처럼 색을 칠할 수 없을 때는 단자나 접속부에 색 테이프 등으로 상을 표시할 수 있다.","O","KEC 121.2: 종단부에 반영구적인 도색·밴드·색 테이프로 식별 가능."],["인체 감전 보호용 누전차단기는 정격감도전류 30mA 이하, 동작시간 0.03초 이하여야 한다.","O","KEC 142.7의 2 \"아\": 30mA 이하·0.03초 이하 전류동작형. 가장 많이 나오는 숫자."],["욕실처럼 몸이 젖는 장소의 콘센트는 30mA 누전차단기면 충분하다.","X","KEC 234.5: 욕실 등은 15mA 이하·0.03초 이하(또는 3kVA 이하 절연변압기)."],["누전차단기는 들어가는 전류와 나오는 전류의 차이(누설전류)를 감지해 동작한다.","O","영상변류기(ZCT)로 왕복 전류의 차이를 감지. 차이 = 어딘가로 새는 전류."],["누전차단기 시험(T) 버튼은 한 달에 한 번 정도 눌러 점검하는 것이 권장된다.","O","월 1회 시험 버튼 점검 권장. 눌렀을 때 떨어지지 않으면 교체."],["누전차단기가 자꾸 떨어지면 레버를 테이프로 고정해 두면 된다.","X","떨어지는 건 어딘가 누전·과부하가 있다는 신호. 원인을 찾아야 한다."],["누전차단기가 있으면 감전 사고를 100% 막아 준다.","X","두 전선 사이(선간)에 몸이 닿는 감전은 누설이 아니라 감지 못 한다."],["누전차단기 정격감도전류 30mA는 30A와 같은 값이다.","X","1A = 1,000mA. 30mA는 0.03A로, 사람을 보호하려 아주 작게 잡은 값."],["젖은 손으로 플러그를 꽂아도 220V 정도면 괜찮다.","X","젖은 피부는 저항이 크게 낮아져 같은 전압에서도 더 큰 전류가 흐른다."],["접지의 목적 중 하나는 누전 시 기기 외함의 전압 상승을 억제해 감전을 막는 것이다.","O","보호접지: 외함과 대지 사이 전위차를 낮추고 차단기가 동작하게 한다."],["KEC에서도 접지는 1종·2종·3종·특별3종으로 구분한다.","X","KEC(2021~)는 종별 접지를 없애고 계통접지·보호접지·피뢰시스템접지로 구분."],["접지저항 값은 클수록 좋다.","X","접지저항은 작을수록 고장전류가 잘 흘러 외함 전압이 낮아진다."],["TN, TT, IT는 계통접지(접지계통) 방식의 이름이다.","O","KEC 203: 첫 글자는 전원 측 접지, 둘째 글자는 설비 노출도전부의 접지 방식."],["TT 계통은 전원 측 한 점을 접지하고, 설비 외함은 그와 독립된 접지극에 접속한다.","O","KEC 203.3 TT 계통. 국내 저압 수용가에 흔한 방식."],["보호도체(PE)와 중성선(N)을 하나로 겸용한 도체를 PEN 도체라 한다.","O","TN-C 계통에서 쓰는 겸용 도체. PE + N = PEN."],["보호도체(접지선) 중간에 퓨즈를 넣어 보호한다.","X","보호도체 회로에는 개폐장치·과전류차단기를 넣지 않는다(KEC 142.3). 끊기면 접지가 없어진다."],["사용전압 220V 저압 전로의 절연저항은 0.5MΩ 이상이면 된다.","X","KEC 132: 500V 이하 전로는 DC 500V로 측정해 1.0MΩ 이상. 0.5MΩ은 SELV·PELV 기준."],["절연저항 측정에는 클램프미터를 쓴다.","X","절연저항은 절연저항계(메거)로 측정. 클램프미터는 전류 측정용."],["등전위본딩은 손이 닿을 수 있는 도전부들을 전기적으로 연결해 전위차를 없애는 것이다.","O","KEC 143: 동시에 닿을 수 있는 금속 부분 사이의 전위차를 없애 감전을 막는다."],["중성선(N)은 접지돼 있으니 맨손으로 만져도 절대 안전하다.","X","부하 전류가 흐르고 결선 오류·단선 시 전압이 걸릴 수 있다. 활선으로 취급."],["KEC에서 교류 1,000V 이하는 저압이다.","O","KEC 111.1: 저압 = 교류 1kV 이하, 직류 1.5kV 이하."],["KEC에서 직류는 1,500V 이하까지 저압이다.","O","직류는 교류보다 기준이 높다. 직류 1.5kV 이하 = 저압."],["교류 7,000V를 넘으면 특고압이다.","O","고압 = 1kV 초과 7kV 이하, 특고압 = 7kV 초과."],["KEC에서 교류 600V 이하만 저압이다.","X","600V는 옛 기준. KEC는 교류 1,000V 이하를 저압으로 본다."],["교류 3,300V는 고압이다.","O","1kV 초과 7kV 이하 = 고압. 3.3kV·6.6kV가 여기 속한다."],["한전 배전선로 22.9kV는 고압이다.","X","7kV를 넘으므로 특고압. 22.9kV는 특고압 배전전압."],["우리나라 일반 가정 콘센트 전압은 220V, 주파수는 60Hz다.","O","단상 220V 60Hz. 일본은 100V, 유럽은 230V 50Hz."],["우리나라 전력 계통 주파수는 50Hz다.","X","우리나라는 60Hz. 50Hz는 유럽·중국·일본 일부."],["한전 22.9kV 배전은 3상 3선식 비접지 방식이다.","X","22.9kV-Y 다중접지 3상 4선식이다. 중성선이 함께 간다."],["154kV는 배전전압이다.","X","154kV·345kV·765kV는 송전전압. 배전은 22.9kV와 저압."],["3상 4선식 220/380V에서 380V는 선간전압, 220V는 상전압이다.","O","Y결선: 선간 = 상전압 × √3. 220 × 1.732 ≈ 380V."],["Y결선에서 선간전압은 상전압의 √3배다.","O","선간전압 = √3 × 상전압. Δ결선은 선간 = 상전압."],["역률은 피상전력에 대한 유효전력의 비다.","O","역률 = P(kW) ÷ S(kVA) = cosθ."],["역률이 1에 가까울수록 같은 유효전력을 보내는 데 필요한 전류가 작아진다.","O","I = P ÷ (V × cosθ). 역률이 높으면 전류·손실·설비 용량이 줄어든다."],["유도전동기 역률 개선용 콘덴서는 부하에 직렬로 연결한다.","X","진상용 콘덴서는 부하에 병렬로 연결해 지상 무효전력을 상쇄한다."],["역률 개선용 콘덴서를 너무 많이 넣으면 진상 역률이 되어 오히려 좋지 않다.","O","과보상 → 진상 역률, 전압 상승·손실 증가. 한전도 진상 역률에 요금을 더 받는다."],["역률이 낮으면 같은 일을 하는 데 더 많은 전류가 흘러 선로 손실이 늘어난다.","O","손실은 I²R. 전류가 커지면 손실은 제곱으로 늘어난다."],["유효전력의 단위는 var이다.","X","유효전력은 W(와트). var는 무효전력, VA는 피상전력 단위."],["피상전력의 단위는 W(와트)다.","X","피상전력 S = V × I 의 단위는 VA. 변압기·발전기 용량은 kVA로 표시한다."],["전열기처럼 순수 저항 부하의 역률은 1이다.","O","전압과 전류의 위상이 같아 cosθ = 1. 무효전력이 없다."],["역률이 낮아도 전기요금에는 아무 영향이 없다.","X","한전은 지상역률 90% 기준으로 미달 시 기본요금을 추가, 초과 시 감액한다."],["변압기는 전자기 유도로 교류 전압을 바꾸는 기기다.","O","1차 코일의 변화하는 자속이 2차 코일에 전압을 유도한다."],["변압기는 직류 전압도 그대로 변성할 수 있다.","X","직류는 자속이 변하지 않아 유도가 안 된다. 직류를 넣으면 코일이 과열된다."],["이상 변압기에서 1차·2차 전압의 비는 권수비와 같다.","O","V1/V2 = N1/N2 = a. 전류는 반대로 I1/I2 = N2/N1."],["변압기로 전압을 1/2로 낮추면 전류도 1/2로 줄어든다.","X","전력이 같으므로 전압이 1/2이면 전류는 약 2배가 된다."],["변압기 용량의 단위는 kW다.","X","변압기 용량은 피상전력 kVA. 부하 역률에 따라 쓸 수 있는 kW가 달라진다."],["변압기 철심을 얇은 강판을 겹쳐 만드는 이유는 와전류(맴돌이전류) 손실을 줄이기 위해서다.","O","성층 철심. 얇을수록 와전류 경로가 끊겨 철손이 줄어든다."],["변압기의 철손(무부하손)은 부하가 없으면 0이다.","X","철손은 전압만 걸려 있으면 부하와 상관없이 늘 발생한다."],["변압기의 동손은 부하 전류의 제곱에 비례한다.","O","동손 = I²R. 부하가 2배면 동손은 4배."],["변압기 %임피던스가 작을수록 2차측 단락전류는 작아진다.","X","단락전류 = 정격전류 × 100/%Z. %Z가 작으면 단락전류는 커진다."],["변압기 2차측 중성점 접지는 고저압 혼촉 시 저압측 전압 상승을 막기 위한 것이다.","O","KEC 142.5·322.1: 혼촉 시 저압 전로에 고압이 그대로 걸리는 것을 막는다."],["유입변압기의 절연유는 절연과 냉각 두 가지 역할을 한다.","O","절연유는 권선 사이를 절연하고 열을 외부로 옮긴다."],["Δ-Δ 결선 변압기는 한 대가 고장 나도 V결선으로 운전할 수 있다.","O","남은 두 대로 V결선 운전 가능. 단 출력은 줄어든다."],["V결선의 출력은 Δ결선 출력의 약 2/3(66.7%)다.","X","V결선 출력 = Δ결선의 1/√3 ≈ 57.7%. 이용률은 86.6%."],["부흐홀츠 계전기는 유입변압기 내부 고장을 검출한다.","O","내부 고장 시 생기는 가스·유류의 흐름을 감지. 콘서베이터와 본체 사이에 설치."],["몰드변압기는 절연유를 사용한다.","X","몰드변압기는 권선을 에폭시 수지로 굳힌 건식. 기름이 없어 화재에 유리."],["MCCB는 배선용차단기, ELB는 누전차단기다.","O","MCCB(Molded Case Circuit Breaker), ELB·ELCB(Earth Leakage Circuit Breaker)."],["ACB(기중차단기)는 주로 특고압 수전용으로 쓴다.","X","ACB는 공기 중에서 소호하는 저압 대용량 차단기. 특고압은 VCB·GCB."],["VCB(진공차단기)는 고압·특고압 회로에 쓴다.","O","진공 속에서 아크를 끊는다. 22.9kV 수전 설비의 주차단기로 흔하다."],["GCB(가스차단기)의 소호 매질은 질소(N₂)다.","X","GCB는 SF₆(육불화황) 가스로 아크를 끊는다."],["OCB는 기중차단기다.","X","OCB(Oil Circuit Breaker)는 유입차단기. 기중차단기는 ACB. 지금은 거의 VCB로 대체."],["차단기(CB)는 부하전류뿐 아니라 단락(고장)전류도 끊을 수 있다.","O","차단기의 핵심 능력은 정격차단전류. 고장전류를 끊는 것이 본업."],["단로기(DS)는 부하전류가 흐르는 상태에서 열어도 된다.","X","단로기는 소호 장치가 없어 무부하 상태에서만 개폐. 부하 중 열면 아크 사고."],["LBS(부하개폐기)는 부하전류는 끊을 수 있지만 단락전류는 끊지 못한다.","O","그래서 LBS에는 전력퓨즈(PF)를 함께 달아 단락을 보호한다."],["수변전실 정전 작업 시 차단기(CB)를 먼저 열고 그다음 단로기(DS)를 연다.","O","끊을 때는 CB → DS. 전류를 끊는 건 차단기, 단로기는 무부하에서."],["복전(전원 투입) 시에는 차단기(CB)를 먼저 넣고 단로기(DS)를 나중에 넣는다.","X","넣을 때는 DS → CB. 단로기를 먼저 넣고 차단기로 전류를 통한다."],["COS(컷아웃스위치)는 변압기 1차측 보호에 쓰는 퓨즈 개폐기다.","O","주상변압기 1차측에 달린 퓨즈 홀더. 과전류 시 퓨즈가 끊어진다."],["전력퓨즈(PF)는 동작 후 리셋해서 다시 쓸 수 있다.","X","퓨즈는 한 번 끊어지면 교체해야 한다. 재투입은 차단기만."],["과전류계전기(OCR)는 전류가 설정값을 넘으면 차단기에 트립 신호를 보낸다.","O","CT로 전류를 받아 판단 → 차단기 트립 코일에 신호. 계전기는 직접 전류를 끊지 않는다."],["배선용차단기(MCCB)는 누전을 감지해 차단한다.","X","MCCB는 과부하·단락 보호. 누전은 누전차단기(ELB)가 감지한다."],["배선용차단기는 과부하와 단락을 보호한다.","O","열동(과부하)·전자(단락) 트립 장치가 들어 있다."],["ATS는 상용전원이 끊기면 비상(발전기) 전원으로 자동 전환하는 개폐기다.","O","ATS(Automatic Transfer Switch). 정전 → 발전기 기동 → 자동 절체."],["피뢰기(LA)는 낙뢰 등 이상전압을 대지로 방전시켜 기기를 보호한다.","O","이상전압이 오면 방전하고, 지나가면 속류를 스스로 끊는다."],["CT(변류기) 2차측은 사용하지 않을 때 개방해 두어야 안전하다.","X","CT 2차 개방은 고전압 발생·소손 위험. 쓰지 않을 때는 반드시 단락."],["PT(계기용변압기) 2차측은 단락해 두어야 안전하다.","X","PT 2차 단락은 큰 전류로 소손. PT는 개방, CT는 단락이 기본."],["CT 2차 정격 전류는 보통 5A다.","O","예: 200/5A. 1차 200A가 흐르면 2차에 5A. (1A 규격도 있음)"],["PT 2차 정격 전압은 보통 110V다.","O","예: 22,900/110V. 계기·계전기는 110V를 받아 동작한다."],["SPD(서지보호장치)는 낙뢰 등 서지 과전압으로부터 기기를 보호한다.","O","KEC 153·전기설비기술기준: 저압 설비 보호용 SPD. 서지를 대지로 흘린다."],["피뢰침은 낙뢰가 건물에 떨어지지 않게 막아 주는 장치다.","X","피뢰침은 낙뢰를 자신에게 끌어 접지로 흘려보내는 길이다. 막는 것이 아니다."],["유도전동기를 직입 기동하면 기동전류가 정격의 수 배(약 5~7배)까지 흐른다.","O","그래서 큰 전동기는 Y-Δ·리액터·인버터 등으로 기동전류를 줄인다."],["Y-Δ 기동은 기동전류를 직입 기동의 1/2로 줄인다.","X","Y-Δ 기동 시 기동전류·토크 모두 1/3이 된다."],["3상 유도전동기의 회전 방향을 바꾸려면 세 선을 모두 바꿔 연결해야 한다.","X","세 선 중 두 선만 바꾸면 역회전. 세 선을 다 바꾸면 방향이 그대로."],["4극 유도전동기의 60Hz 동기속도는 1,800rpm이다.","O","Ns = 120f/P = 120×60/4 = 1,800rpm. 실제 속도는 슬립만큼 느리다."],["EOCR은 전동기의 과전류(과부하)를 감지하는 전자식 계전기다.","O","EOCR(Electronic Over Current Relay). 열동계전기(THR)의 전자식 버전."],["전자접촉기(MC)는 전동기 등 부하를 자주 개폐하는 데 쓴다.","O","코일에 전압을 주면 접점이 붙는다. 열동계전기와 합치면 전자개폐기."],["열동계전기(THR)는 전동기 과부하를 보호한다.","O","바이메탈이 열로 휘어 접점을 열고 MC를 떨어뜨린다."],["전선은 굵기(단면적)가 클수록 허용전류가 크다.","O","굵으면 저항이 작아 발열이 적다. 전선 선정의 기본."],["주위 온도가 높아지면 전선의 허용전류는 커진다.","X","주위 온도가 높으면 열을 못 버려 허용전류를 줄여야 한다(온도 보정)."],["전선을 둥글게 감아 둔(릴) 상태로 큰 전류를 흘리면 열이 쌓여 위험하다.","O","감긴 전선은 방열이 안 되고 유도 열도 생긴다. 다 풀어서 사용."],["KEC에서 저압 옥내배선용 구리 전선의 최소 굵기는 1.5㎟다.","X","KEC 231.3.1: 단면적 2.5㎟ 이상의 연동선(예외 있음)."],["전선을 접속할 때 전기저항이 늘어나지 않도록 해야 한다.","O","KEC 123: 접속부 저항 증가 금지. 접속 불량은 발열·화재의 주범."],["전선 접속 시 인장강도는 50%까지 줄어도 된다.","X","KEC 123: 전선의 세기를 20% 이상 감소시키지 않아야 한다."],["절연전선을 접속한 부분은 원래 피복과 같은 수준 이상으로 절연해야 한다.","O","KEC 123: 절연물과 동등 이상의 절연 효력이 있는 것으로 피복."],["코드 피복이 벗겨진 전선은 테이프로 감으면 계속 써도 된다.","X","임시 조치일 뿐. 벗겨진 코드는 교체가 원칙."],["플러그를 뽑을 때 전선을 잡고 당겨도 된다.","X","전선 속 심선이 끊어지거나 단자가 벌어진다. 플러그 몸체를 잡고 뽑는다."],["콘센트에 쌓인 먼지와 습기는 트래킹 현상으로 화재를 일으킬 수 있다.","O","먼지+습기가 미세한 전류 길을 만들어 탄화 → 발화. 콘센트 청소가 예방."],["멀티탭은 정격 용량(예: 16A·3,500W)을 넘겨 쓰면 과열·화재 위험이 있다.","O","전열기 두 개만 꽂아도 넘기기 쉽다. 정격을 꼭 확인."],["접지형 콘센트의 접지극은 기기 외함을 접지해 감전을 막는다.","O","외함에 누전되면 접지로 흘러 누전차단기가 동작한다."],["감전의 위험을 결정하는 것은 전압보다 몸에 흐르는 전류와 그 시간이다.","O","위험도 = 전류 × 시간 × 경로. 그래서 누전차단기가 mA·초 단위."],["사람이 전기를 느끼기 시작하는 최소 감지전류는 교류 약 1A 정도다.","X","약 1mA. 1A의 1/1000이다. 수십 mA면 이미 치명적일 수 있다."],["전기 화재(C급)에는 물 소화기가 가장 적합하다.","X","전기 화재는 이산화탄소·분말 소화기. 물은 감전·확산 위험."],["감전된 사람을 보면 먼저 손으로 끌어내야 한다.","X","전원 차단이 먼저. 못 끊으면 마른 나무·절연물로 떼어 낸다."],["전기 작업 전에는 검전기로 전기가 없는지 확인한다.","O","차단 → 검전 → 접지(필요시) → 작업. 눈으로는 활선을 알 수 없다."],["차단기를 내렸으면 검전기로 다시 확인하지 않아도 된다.","X","오결선·역송전·다른 회로 가능성. 작업 전 검전은 생략 금지."],["정전 작업 시 차단기를 내린 뒤 '작업 중' 표지와 잠금장치(LOTO)를 한다.","O","다른 사람이 모르고 투입하는 사고를 막는다. 산업안전보건 기준."],["활선 작업용 절연장갑은 사용 전압 등급에 맞는 것을 써야 한다.","O","절연장갑은 등급(class)별 사용 전압이 다르다. 사용 전 공기 누설 점검."],["길에 끊어져 늘어진 전선은 한전(국번 없이 123)에 신고한다.","O","살아 있다고 생각하고 가까이 가지 말 것. 한전 고장 신고 123."],["옴의 법칙에서 전압은 전류 나누기 저항이다.","X","V = I × R. 전압 = 전류 × 저항."],["저항 두 개를 병렬로 연결하면 합성저항은 더 커진다.","X","병렬은 길이 늘어나 합성저항이 가장 작은 저항보다도 작아진다."],["220V, 1,100W 전열기에 흐르는 전류는 약 5A다.","O","I = P ÷ V = 1,100 ÷ 220 = 5A."],["1kWh는 1kW 기기를 1분 사용한 전력량이다.","X","1kWh = 1kW × 1시간. 전력량 = 전력 × 시간, 전기요금의 단위."],["교류 220V의 최대값(피크)은 220V다.","X","220V는 실효값. 최대값 = 220 × √2 ≈ 311V."],["지락은 전선과 전선이 서로 붙는 고장이다.","X","지락은 전선이 대지(땅)와 연결되는 고장. 전선끼리 붙는 건 단락. 지락계전기(OCGR)가 감지."],["단락(쇼트)은 전선 사이가 아주 낮은 저항으로 붙어 큰 전류가 흐르는 고장이다.","O","단락전류는 수천~수만 A. 차단기 정격차단전류가 이보다 커야 한다."],["전력량계(계량기)는 kW 단위로 전력량을 측정한다.","X","전력량계는 kWh(전력 × 시간). kW는 순간 전력 단위."],["변류기(CT)는 큰 전류를 작은 전류로 바꿔 측정·보호에 쓴다.","O","수천 A도 5A로 줄여 계기·계전기에 넣는다."],["콘덴서용 직렬 리액터(SR)는 보통 콘덴서 용량의 6% 정도를 쓴다.","O","5고조파 억제 이론값 4%, 실무는 여유를 둬 6%."]];
const KEY='ox-three.save.v1';
let sv={streak:0,last:'',total:0,sets:0,perfect:0,best:0,recent:[]};
try{const t=JSON.parse(localStorage.getItem(KEY)||'null');if(t)sv=Object.assign(sv,t)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(sv))}catch(e){}}
function day(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let AC=null;function tone(f,t,dur,type){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.18,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+dur);o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+dur)}catch(e){}}
function good(){tone(660,0,.15);tone(880,.12,.2);if(navigator.vibrate)navigator.vibrate(40)}
function bad(){tone(180,0,.3,'square')}
function fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.25))}
function spark(el,txt){const r=el.getBoundingClientRect();for(let i=0;i<5;i++){const s=document.createElement('div');s.className='spark';s.textContent=txt;s.style.left=(r.left+r.width*(0.15+0.7*Math.random()))+'px';s.style.top=(r.top+r.height*0.4)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}
const $=id=>document.getElementById(id);
let G={qs:[],i:0,right:0,res:[],answered:false,over:false};
function pick(){
  // 첫 문제는 짧은 문장(쉽게 시작, R7), 최근에 나온 문제는 피함(R4)
  const pool=Q.map((q,i)=>i).filter(i=>!sv.recent.includes(i));
  const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
  sh(pool);const short=pool.filter(i=>Q[i][0].length<=26);
  const first=short.length?short[0]:pool[0];
  const rest=pool.filter(i=>i!==first).slice(0,2);
  return [first,...rest];
}
function start(){G={qs:pick(),i:0,right:0,res:[],answered:false,over:false};$('res').classList.add('hide');$('play').classList.remove('hide');show();hud()}
function hud(){$('streak').textContent='🔥 '+sv.streak+'일째';$('tot').textContent='맞힌 수 '+sv.total}
function dots(){$('dots').innerHTML=[0,1,2].map(k=>'<div class="dot '+(G.res[k]===true?'ok':G.res[k]===false?'no':k===G.i?'now':'')+'"></div>').join('')}
function show(){const q=Q[G.qs[G.i]];$('card').textContent=q[0];$('card').className='card';$('ex').classList.add('hide');$('next').classList.add('hide');$('btns').classList.remove('hide');G.answered=false;dots()}
function answer(c){if(G.answered||G.over)return;G.answered=true;const q=Q[G.qs[G.i]],ok=c===q[1];G.res[G.i]=ok;
  if(ok){G.right++;sv.total++;good();$('card').className='card hit';spark($('card'),'⚡')}else{bad();$('card').className='card miss'}
  $('ex').innerHTML='<b>'+(ok?'⭕ 맞았어요!':'❌ 아까워요')+'</b> 정답은 '+q[1]+'<br>'+q[2];$('ex').classList.remove('hide');
  $('btns').classList.add('hide');$('next').textContent=G.i<2?'다음 문제 ▶':'결과 보기 ▶';$('next').classList.remove('hide');dots();hud()}
function next(){if(!G.answered)return;if(G.i<2){G.i++;show()}else finish()}
function finish(){G.over=true;const t=day(),y=day(new Date(Date.now()-864e5));
  if(sv.last!==t){sv.streak=(sv.last===y)?sv.streak+1:1;sv.last=t}
  sv.sets++;if(G.right===3)sv.perfect++;sv.best=Math.max(sv.best,sv.streak);
  sv.recent=(sv.recent.concat(G.qs)).slice(-30);save();
  $('play').classList.add('hide');$('res').classList.remove('hide');
  $('rScore').textContent=G.right+' / 3';
  $('rTitle').textContent=G.right===3?'만점! 오늘도 3문제 끝':'오늘 3문제 끝!';
  $('rNear').textContent=G.right===3?'만점 '+sv.perfect+'번째':'만점까지 '+(3-G.right)+'개 모자람';
  $('rStreak').textContent='🔥 연속 '+sv.streak+'일째 (최고 '+sv.best+'일)';
  $('rBest').textContent='지금까지 맞힌 수 '+sv.total+'개 · '+sv.sets+'판';
  const miss=G.qs.find((qi,k)=>!G.res[k]);const f=Q[miss!==undefined?miss:G.qs[2]];
  $('rFact').innerHTML='💡 <b>'+f[0]+'</b> → 정답 '+f[1]+'<br>'+f[2];
  if(G.right===3){fanfare();spark($('rScore'),'🎉')}else tone(440,0,.2);hud()}
$('bO').onclick=()=>answer('O');$('bX').onclick=()=>answer('X');$('next').onclick=next;$('again').onclick=start;
window.__game={get state(){return {i:G.i,right:G.right,over:G.over,answered:G.answered,qs:G.qs.slice(),answer:G.qs[G.i]!==undefined?Q[G.qs[G.i]][1]:null,save:sv}},answer,next,restart:start,Q};
start();
</script></body></html>
