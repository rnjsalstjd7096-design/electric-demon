<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1320">
<title>도시 전력 관리자</title>
<style>
:root{
  --bg:#0a1320; --bg2:#101923; --panel:#152238; --line:#2c415b; --text:#eaf1fb; --dim:#a5b7ca;
  --cyan:#64ceeb; --gold:#f2c66d; --green:#78e2ae; --red:#e77d78;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:system-ui,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
#top{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 6px) calc(var(--sar) + 6px) 0 calc(var(--sal) + 6px);
  pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:5}
#hud{pointer-events:auto;width:100%;max-width:760px;background:rgba(21,34,56,.92);border:1px solid var(--line);
  border-radius:14px;padding:5px;box-shadow:0 6px 20px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:4px;min-width:0}
.ib{flex:0 0 auto;width:40px;height:44px;border-radius:10px;border:1px solid var(--line);background:#1b2c47;
  font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0}
.ib:active{transform:scale(.95)}
.ib.on{background:#2a3f22;border-color:var(--green);color:var(--green)}
#bSpeed{font-size:15px;color:var(--gold)}
#clock{flex:1 1 auto;min-width:0;overflow:hidden;display:flex;align-items:center;gap:4px;padding:0 2px}
#wIcon{font-size:22px;line-height:1;flex:0 0 auto}
#clock .ct{display:flex;flex-direction:column;line-height:1.15;min-width:0}
#clock b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.ib{width:36px}#wIcon{display:none}#clock b{font-size:13px}.stat b{font-size:14px}}
#clock small{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;padding:0 2px;min-width:50px}
.stat small{font-size:11px;color:var(--dim);white-space:nowrap}
.stat b{font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
#moneyT{color:var(--gold)}
#moneyT.neg{color:var(--red)}
#happyT.low{color:var(--red)}
#pwr{position:relative;flex:1 1 auto;min-width:0;height:30px;border-radius:8px;background:#0d1828;border:1px solid var(--line);overflow:hidden}
#pwrFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#3d8c69,#78e2ae);transition:width .25s}
#pwrFill.warn{background:linear-gradient(90deg,#a8823b,#f2c66d)}
#pwrFill.bad{background:linear-gradient(90deg,#9b3f3b,#e77d78);animation:blink .6s infinite alternate}
#pwrCap{position:absolute;top:0;bottom:0;width:3px;background:#eaf1fb;box-shadow:0 0 6px #64ceeb}
#pwrT{position:absolute;inset:0;display:flex;align-items:center;padding:0 8px;font-size:12.5px;font-weight:700;
  text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;overflow:hidden}
#graph{flex:0 0 auto;width:72px;height:30px;border-radius:8px;background:#0d1828;border:1px solid var(--line)}
.mini{flex:0 0 auto;font-size:12px;color:var(--dim);display:flex;flex-direction:column;line-height:1.2;align-items:flex-end;min-width:46px}
.mini b{color:var(--text);font-size:12.5px;font-variant-numeric:tabular-nums}
@keyframes blink{from{opacity:1}to{opacity:.55}}
#goal{pointer-events:auto;max-width:760px;width:100%;background:rgba(16,25,35,.88);border:1px solid var(--line);border-radius:12px;
  padding:7px 10px;font-size:13.5px;line-height:1.4;display:none}
#goal.on{display:block}
#goal.tut{border-color:var(--gold);box-shadow:0 0 14px rgba(242,198,109,.35)}
#goal b{color:var(--gold)}
#goal .gp{color:var(--cyan)}
#toasts{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;max-width:520px}
.toast{background:rgba(21,34,56,.95);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13.5px;
  box-shadow:0 4px 14px rgba(0,0,0,.4);animation:tin .25s ease-out;max-width:100%;text-align:center}
.toast.warn{border-color:var(--red);color:#ffd9d6}
.toast.good{border-color:var(--green)}
.toast.gold{border-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 calc(var(--sar) + 6px) calc(var(--sab) + 6px) calc(var(--sal) + 6px);
  pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:5}
#info{pointer-events:auto;width:100%;max-width:520px;background:rgba(21,34,56,.96);border:1px solid var(--line);border-radius:12px;
  padding:8px 10px;font-size:13.5px;display:none;gap:8px;align-items:center}
#info.on{display:flex}
#info .it{flex:1 1 auto;min-width:0;line-height:1.4}
#info .it b{font-size:15px}
#info .it small{color:var(--dim)}
#info .ib2{flex:0 0 auto;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#1b2c47;font-weight:700;font-size:13.5px}
#info .ib2.red{border-color:var(--red);color:var(--red)}
#info .ib2.gold{border-color:var(--gold);color:var(--gold)}
#tools{pointer-events:auto;width:100%;max-width:760px;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;
  background:rgba(21,34,56,.94);border:1px solid var(--line);border-radius:14px;padding:5px;scrollbar-width:none;touch-action:pan-x}
#tools::-webkit-scrollbar{display:none}
.tb{flex:1 0 54px;min-width:54px;height:62px;border-radius:10px;border:1px solid transparent;background:#1a2a43;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;padding:2px 0;position:relative}
.tb canvas{width:30px;height:30px}
.tb span{font-size:11px;line-height:1.1;white-space:nowrap}
.tb em{font-style:normal;font-size:10.5px;color:var(--gold);line-height:1.1}
.tb.sel{border-color:var(--cyan);background:#20395a;box-shadow:inset 0 0 10px rgba(100,206,235,.35)}
.tb.dis{opacity:.4}
.tb.poor em{color:var(--red)}
.tb.hint{animation:hint 0.9s infinite alternate;border-color:var(--gold)}
@keyframes hint{from{box-shadow:0 0 0 0 rgba(242,198,109,.0)}to{box-shadow:0 0 14px 3px rgba(242,198,109,.8)}}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,12,22,.72);z-index:20;
  padding:calc(var(--sat) + 12px) calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px)}
.screen.on{display:flex}
#title{background:radial-gradient(ellipse at 50% 30%,rgba(10,19,32,.35),rgba(10,19,32,.85))}
.panel{width:100%;max-width:440px;max-height:100%;overflow:auto;background:rgba(21,34,56,.96);border:1px solid var(--line);
  border-radius:18px;padding:18px 16px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.panel h2{margin:0 0 10px;font-size:21px;text-align:center}
.panel p{color:var(--dim);margin:6px 0;line-height:1.5;font-size:14px}
.btn{display:block;width:100%;min-height:48px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:#1d3150;
  font-size:16px;font-weight:700}
.btn.pri{background:linear-gradient(180deg,#f6d37f,#d9a743);color:#1b1405;border-color:#f2c66d;box-shadow:0 0 18px rgba(242,198,109,.45)}
.btn:active{transform:scale(.98)}
.back{position:fixed;left:calc(var(--sal) + 10px);top:calc(var(--sat) + 10px);z-index:21;color:var(--dim);text-decoration:none;
  font-size:14px;padding:12px 12px;border-radius:10px;background:rgba(21,34,56,.85);border:1px solid var(--line);min-height:44px;display:flex;align-items:center}
.logo{font-size:34px;font-weight:900;text-align:center;margin:4px 0 2px;color:#fff3cf;letter-spacing:1px;
  text-shadow:0 0 8px rgba(242,198,109,.9),0 0 22px rgba(242,198,109,.6)}
.sub{text-align:center;color:var(--dim);font-size:14.5px;margin-bottom:14px}
.best{text-align:center;font-size:14px;color:var(--cyan);margin:6px 0 2px}
.small-row{display:flex;gap:8px}
.small-row .btn{font-size:14px}
.card{display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:64px;margin:7px 0;padding:9px 10px;border-radius:12px;
  border:1px solid var(--line);background:#1a2c48}
.card .cn{font-size:22px;width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:#0f1c2f;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--gold)}
.card .cb{flex:1;min-width:0}
.card b{font-size:15px}
.card small{display:block;color:var(--dim);font-size:12.5px;line-height:1.4;margin-top:2px}
.card .ck{color:var(--green);font-weight:900;font-size:13px;flex:0 0 auto}
.card.surv{border-color:var(--gold);background:#2a2a1e}
.how{list-style:none;padding:0;margin:0}
.how li{display:flex;gap:10px;align-items:center;margin:9px 0;font-size:14px;line-height:1.45}
.how li canvas{flex:0 0 40px;width:40px;height:40px;background:#0f1c2f;border-radius:10px}
.how li .ie{flex:0 0 40px;width:40px;height:40px;background:#0f1c2f;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.how b{color:var(--gold)}
.kbd{color:var(--dim);font-size:12.5px;line-height:1.6;margin-top:8px}
.res-big{font-size:30px;font-weight:900;text-align:center;margin:6px 0;color:var(--gold);text-shadow:0 0 14px rgba(242,198,109,.5)}
.res-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.res-stats div{background:#0f1c2f;border-radius:10px;padding:8px;text-align:center;font-size:12.5px;color:var(--dim)}
.res-stats b{display:block;color:var(--text);font-size:17px}
.newrec{display:none;text-align:center;color:#1b1405;background:var(--gold);border-radius:999px;padding:4px 12px;font-weight:900;width:max-content;margin:0 auto;animation:hint .7s infinite alternate}
.newrec.on{display:block}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
</style>
<meta name="description" content="발전소 5종을 짓고 날씨·고장·정전을 버티며 도시에 전기를 대는 전력 관리 게임. 생존 모드와 시나리오 6개."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/power-grid/"><meta property="og:title" content="도시 전력 관리자"><meta property="og:description" content="발전소 5종을 짓고 날씨·고장·정전을 버티며 도시에 전기를 대는 전력 관리 게임. 생존 모드와 시나리오 6개."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 84px);z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="도시 전력 관리자",D="발전소 5종을 짓고 날씨·고장·정전을 버티며 도시에 전기를 대는 전력 관리 게임. 생존 모드와 시나리오 6개.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/power-grid/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttri <body>
<canvas id="cv" aria-label="도시 지도"></canvas>
<div id="flash"></div>

<div id="top">
  <div id="hud" hidden>
    <div class="row">
      <button class="ib" id="bMenu" aria-label="메뉴 (일시정지)">☰</button>
      <button class="ib" id="bPause" aria-label="시간 멈춤/흐름">⏸</button>
      <button class="ib" id="bSpeed" aria-label="배속">×1</button>
      <div id="clock"><span id="wIcon">☀️</span><div class="ct"><b id="dayT">1일차 06:00</b><small id="wT">맑음</small></div></div>
      <div class="stat"><small>💰 자금</small><b id="moneyT">0</b></div>
      <div class="stat"><small>😊 만족도</small><b id="happyT">70</b></div>
    </div>
    <div class="row">
      <div id="pwr"><div id="pwrFill"></div><div id="pwrCap"></div><span id="pwrT">수요 0 / 공급 0 MW</span></div>
      <canvas id="graph" aria-label="24시간 수요·공급 그래프"></canvas>
      <div class="mini"><span>👥 <b id="popT">0</b></span><span id="batBox">🔋 <b id="batT">-</b></span></div>
      <div class="mini"><span>오염</span><b id="polT">0</b></div>
    </div>
  </div>
  <div id="goal"></div>
  <div id="toasts"></div>
</div>

<div id="bottom">
  <div id="info"></div>
  <div id="tools" hidden></div>
</div>

<!-- 타이틀 -->
<div class="screen on" id="title">
  <a class="back" href="../">← 게임 목록</a>
  <div class="panel" style="background:rgba(21,34,56,.88)">
    <div class="logo">⚡ 도시 전력 관리자</div>
    <div class="sub">발전소를 짓고 전선을 이어, 밤에도 꺼지지 않는 도시를 만드세요!</div>
    <button class="btn pri" id="bStart">게임 시작</button>
    <button class="btn" id="bHow">방법 보기</button>
    <div class="best" id="bestT">최고 기록: 없음</div>
    <div class="small-row"><button class="btn" id="bSound1">🔊 소리 켜짐</button></div>
  </div>
</div>

<!-- 모드 선택 -->
<div class="screen" id="modes">
  <div class="panel">
    <h2>모드 선택</h2>
    <div id="modeList"></div>
    <button class="btn" id="bModesBack">← 뒤로</button>
  </div>
</div>

<!-- 방법 보기 -->
<div class="screen" id="howto">
  <div class="panel">
    <h2>방법 보기</h2>
    <ul class="how" id="howList"></ul>
    <div class="kbd">키보드: 방향키/WASD 지도 이동 · +/− 확대 · 1~9 도구 선택 · Space 시간 멈춤 · F 배속 · Esc 메뉴<br>휴대폰: 한 손가락 드래그로 이동, 두 손가락으로 확대·축소</div>
    <button class="btn pri" id="bHowBack">알겠어요</button>
  </div>
</div>

<!-- 일시정지 -->
<div class="screen" id="pause">
  <div class="panel">
    <h2>일시정지</h2>
    <p id="pauseInfo" style="text-align:center"></p>
    <button class="btn pri" id="bResume">계속하기</button>
    <button class="btn" id="bRestart">다시 시작</button>
    <button class="btn" id="bSound2">🔊 소리 켜짐</button>
    <button class="btn" id="bHow2">방법 보기</button>
    <button class="btn" id="bQuit">타이틀로</button>
  </div>
</div>

<!-- 결과 -->
<div class="screen" id="result">
  <div class="panel">
    <h2 id="resTitle">게임 오버</h2>
    <p id="resReason" style="text-align:center"></p>
    <div class="res-big" id="resBig"></div>
    <div class="newrec" id="resNew">🏆 최고 기록 갱신!</div>
    <div class="res-stats" id="resStats"></div>
    <button class="btn pri" id="bAgain">다시 하기</button>
    <button class="btn" id="bResModes">다른 모드</button>
    <button class="btn" id="bResTitle">타이틀</button>
  </div>
</div>

<script>
'use strict';
/* ===================================================================
 * 도시 전력 관리자 (games/03)
 * 구조
 *  - 상수: BUILD(발전·송전 시설), CONS(수요처), WEATHER, SCENARIOS
 *  - 저장(Store) · 소리(Sfx: Web Audio 합성)
 *  - 상태 G: 지도(tiles) · 건물(blds) · 전력망(net) · 시간/경제/만족도
 *  - 시뮬레이션: rebuildNet()  → 전신주 연결 요소(전력망) 계산
 *               simStep(dt)   → 수요·발전·배터리 배분, 정전(부하 차단), 돈/오염/만족도
 *               hourly()/daily() → 건물 생성·성장, 고장·낙뢰·날씨
 *  - 렌더링: drawWorld()(캔버스) · updateHud()(DOM)
 *  - 입력: 포인터(탭/드래그/핀치/휠) · 키보드 · 툴바
 * 시간: ×1 배속에서 게임 1시간 = 2.5초, 하루 = 60초
 * =================================================================== */

  const gw = Math.ceil(W / cell) + 3, gh = Math.ceil(H / cell) + 3, g = new Float32Array(gw * gh);

const Sfx = {
  ctx: null, on: Store.get('sound', true), master: null, last: {},
  init() {
    if (!this.ctx) {
      try { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = .5; this.master.connect(this.ctx.destination); } catch (e) { this.ctx = null; return; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => { });
  },
  tone(f, d, type = 'sine', v = .2, f2 = null, delay = 0) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + .02);
  },
  noise(d, v = .2, freq = 1200, delay = 0) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay, n = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, n, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .7; g.gain.value = v;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  play(name) {
    if (!this.on || !this.ctx) return;
    const now = performance.now(); if (this.last[name] && now - this.last[name] < 70) return; this.last[name] = now;
    switch (name) {
      case 'click': this.tone(660, .06, 'triangle', .12); break;
      case 'build': this.noise(.12, .25, 300); this.tone(520, .1, 'square', .07, null, .05); this.tone(780, .14, 'triangle', .1, null, .1); break;
      case 'pole': this.noise(.08, .2, 500); this.tone(880, .08, 'triangle', .08, null, .03); break;
      case 'error': this.tone(180, .18, 'square', .1, 120); break;
      case 'on': this.tone(440, .12, 'triangle', .12, 880); this.tone(1320, .2, 'sine', .08, null, .1); break;
      case 'off': this.tone(500, .35, 'sawtooth', .08, 90); this.noise(.2, .12, 200); break;
      case 'zap': this.noise(.5, .5, 2200); this.noise(.8, .35, 120, .05); this.tone(90, .6, 'sawtooth', .12, 40); break;
      case 'alarm': this.tone(880, .12, 'square', .08); this.tone(660, .12, 'square', .08, null, .15); this.tone(880, .12, 'square', .08, null, .3); break;
      case 'repair': for (let i = 0; i < 3; i++) this.tone(1200 + i * 200, .05, 'square', .06, null, i * .07); break;
      case 'coin': this.tone(988, .08, 'square', .06); this.tone(1319, .14, 'square', .06, null, .07); break;

// ---------- 지도 생성 ----------
function genMap() {
  const sc = G.sc, W = G.W, H = G.H, rng = mulberry32(G.seed);
  const n1 = noiseField(rng, W, H, 6), n2 = noiseField(rng, W, H, 3), n3 = noiseField(rng, W, H, 4), n4 = noiseField(rng, W, H, 5);
  const cx = W / 2, cy = H / 2;
  const riverX = Math.floor(W * .78);
  for (let y = 0; y < H; y++) {
    G.tiles[y] = []; G.occ[y] = [];
    for (let x = 0; x < W; x++) {
      let t = T.GRASS;
      const n = n1(x, y) * .7 + n2(x, y) * .3;
      const dc = Math.hypot(x + .5 - cx, y + .5 - cy);
      if (sc.island) {
        const r = W * .44 + (n - .5) * 4;
        if (dc > r) t = T.WATER;
      } else if (n < .26 && dc > 5) t = T.WATER;
      if (sc.river && Math.abs(x - riverX - Math.sin(y * .4) * 1.4) < 1.1) t = T.WATER;
      if (t === T.GRASS) {
        if (n3(x, y) > .66 && dc > 4) t = T.HILL;
        else if (n4(x, y) > .64 && dc > 3.5) t = T.FOREST;
      }
      if (dc < 4.2) t = T.GRASS;
      G.tiles[y][x] = t; G.occ[y][x] = null;
    }
  }
}
function placeStartCity() {
  const cx = Math.floor(G.W / 2), cy = Math.floor(G.H / 2);
  const spots = [[0, 0, 'house'], [1, 0, 'house'], [0, 1, 'house'], [1, 1, 'house'], [2, 0, 'shop']];
  const extra = [[2, 2, 'house'], [-1, 2, 'house'], [3, 1, 'house'], [0, 3, 'house'], [1, -1, 'house'], [3, -1, 'shop']];
  const n = (G.sc.startHouses || 0);
  for (let i = 0; i < n && i < extra.length; i++) spots.push(extra[i]);
  if (G.demo) {
    for (const [dx, dy, t] of [[2, 2, 'house'], [-1, 2, 'house'], [3, 1, 'house'], [0, 3, 'house'], [1, -1, 'house'], [3, -1, 'shop'], [4, 2, 'factory'], [-2, 3, 'house'], [2, 4, 'hospital'], [0, -2, 'house']]) spots.push([dx, dy, t]);
  }
  for (const [dx, dy, t] of spots) {
    const c = addCons(t, cx + dx, cy + dy, true);
    if (c && G.demo) c.level = 1 + (c.id % 3 === 0 ? 1 : 0);
  }
  if (G.demo) {
    addBuild('coal', cx - 4, cy, true); addBuild('solar', cx - 4, cy + 2, true); addBuild('wind', cx - 4, cy - 2, true);
    for (const [dx, dy] of [[-2, 0], [-1, 2], [2, 1], [1, 3], [3, 3], [-2, -2], [2, -2]]) addBuild('pole', cx + dx, cy + dy, true);
  }
}
const inMap = (x, y) => x >= 0 && y >= 0 && x < G.W && y < G.H;

function addCons(type, x, y, ready) {
  if (!inMap(x, y) || G.tiles[y][x] === T.WATER || G.occ[y][x]) return null;
  if (G.tiles[y][x] === T.FOREST) G.tiles[y][x] = T.GRASS;

  return c;
}
function addBuild(type, x, y, free) {

// ---------- 날씨 ----------
function rollWeather(day) {
  const sc = G.sc;
  if (sc.weatherFixed) return sc.weatherFixed;
  if (day <= 1) return 'sunny';
  const w = Object.assign({ sunny: 3.4, cloudy: 2, windy: 1.4, calm: 1.2, storm: .9, heat: .8 }, sc.weights || {});
  if (sc.survival) { w.storm += day * .08; w.heat += day * .07; }
  return wpick(w);
}
const WX = () => WEATHER[G.weather];

// ---------- 전력망 계산 ----------
function rebuildNet() {
  const nodes = G.blds.filter(b => !(b.broken && BUILD[b.type].kind === 'net'));
  const n = nodes.length, parent = nodes.map((_, i) => i);
  const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const edges = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const a = nodes[i], b = nodes[j], d = dist(a, b), r = Math.max(BUILD[a.type].link, BUILD[b.type].link);
    if (d <= r + 1e-6) edges.push([d, i, j]);
  }
  edges.sort((a, b) => a[0] - b[0]);
  const links = [];
  for (const [d, i, j] of edges) { const a = find(i), b = find(j); if (a !== b) { parent[a] = b; links.push([nodes[i], nodes[j]]); } }
  const compMap = new Map(), comps = [];
  for (const b of G.blds) b.comp = -1;
  nodes.forEach((b, i) => {
    const r = find(i);
    if (!compMap.has(r)) { compMap.set(r, comps.length); comps.push({ nodes: [], cons: [], energized: false, short: false }); }
    b.comp = compMap.get(r); comps[b.comp].nodes.push(b);
  });
  // 수요처 배정: 가장 가까운 공급 노드(전신주·변전소)
  const servers = nodes.filter(b => BUILD[b.type].serve);
  const covered = new Set();
  for (const s of servers) {
    const R = BUILD[s.type].serve, ri = Math.ceil(R);
    for (let y = s.y - ri; y <= s.y + ri; y++) for (let x = s.x - ri; x <= s.x + ri; x++)
      if (inMap(x, y) && Math.hypot(x - s.x, y - s.y) <= R + 1e-6) covered.add(y * G.W + x);
  }
  for (const c of G.cons) {
    let best = null, bd = 1e9;
    for (const s of servers) { const d = dist(s, c); if (d <= BUILD[s.type].serve + 1e-6 && d < bd) { bd = d; best = s; } }
    c.feed = best; c.comp = best ? best.comp : -1; c.conn = !!best;
    if (best) comps[best.comp].cons.push(c);
  }
  G.net = { comps, links, covered };
  G.dirty = false;
}

// ---------- 수요/발전 ----------
const hourOf = t => (t % 1440) / 60;
const dayOf = t => Math.floor(t / 1440) + 1;
function profile(type, h) { const p = PROF[type], i = Math.floor(h) % 24, f = h - Math.floor(h); return lerp(p[i], p[(i + 1) % 24], f); }
function demandOf(c, h) {
  if (c.prog < 1) return 0;
  const d = CONS[c.type].lv[c.level - 1].mw * profile(c.type, h) * (1 + .03 * (dayOf(G.time) - 1));
  let heat = 1;
  if (WX().heat > 1 && (c.type === 'house' || c.type === 'shop')) heat = 1 + (WX().heat - 1) * clamp((h - 9) / 4, 0, 1) * clamp((24 - h) / 3, 0, 1);
  return d * heat;
}
function sunOf(h) { return h > 6 && h < 18.5 ? Math.max(0, Math.sin(Math.PI * (h - 6) / 12.5)) : 0; }
function plantOut(b, h) {
  const d = BUILD[b.type];
  if (b.broken) return 0;
  if (b.type === 'solar') return d.cap * sunOf(h) * WX().solar;
  if (b.type === 'wind') return d.cap * Math.min(1.25, G.wind * (G.tiles[b.y][b.x] === T.HILL ? 1.3 : 1));
  if (b.type === 'nuclear') return d.cap;
  return 0;
}
function darkness(h) {
  if (h >= 7.5 && h <= 17) return 0;
  if (h > 17 && h < 20) return (h - 17) / 3 * .7;
  if (h > 5 && h < 7.5) return (7.5 - h) / 2.5 * .7;
  return .7;
}

function simStep(dt) {
  if (G.dirty) rebuildNet();
  const h = hourOf(G.time), dh = dt / 60;
  const S = { dem: 0, cap: 0, out: 0, served: 0, bat: 0, batMax: 0, shed: 0, unconn: 0, renew: 0, coal: 0 };
  // 바람: 목표값을 향해 천천히
  G.wind = lerp(G.wind, G.windTarget, .04);
  let fuelCost = 0, newlyOff = 0, newlyOn = 0;
  for (const comp of G.net.comps) {
    let renew = 0, nuke = 0, coalCap = 0; const coals = [], bats = [];
    for (const b of comp.nodes) {
      const k = b.type;
      if (k === 'coal') { if (!b.broken) { coalCap += BUILD.coal.cap; coals.push(b); } b.out = 0; }
      else if (k === 'battery') { if (!b.broken) bats.push(b); S.bat += b.charge; S.batMax += BUILD.battery.store; b.out = 0; }
      else if (BUILD[k].kind === 'plant') { b.out = plantOut(b, h); if (k === 'nuclear') nuke += b.out; else renew += b.out; }
    }
    let demand = 0;
    for (const c of comp.cons) { c.dem = demandOf(c, h); demand += c.dem; }
    const base = renew + nuke;
    let coalOut = 0, batOut = 0, need = 0;
    const batAvail = bats.reduce((s, b) => s + Math.min(BUILD.battery.rate, b.charge / dh), 0);
    if (base >= demand) {
      need = 0;
    } else {
      need = demand - base;
      coalOut = Math.min(coalCap, need); need -= coalOut;
      batOut = Math.min(batAvail, need); need -= batOut;
      if (batOut > 0) { const tot = batAvail; for (const b of bats) { const share = Math.min(BUILD.battery.rate, b.charge / dh) / tot * batOut; b.charge = Math.max(0, b.charge - share * dh); b.out = share; } }
    }
    // 남는 전기로 배터리 충전(재생/원자력 잉여 → 남는 석탄 순)
    if (bats.length) {
      let spareFree = Math.max(0, base - demand), spareCoal = coalCap - coalOut;
      for (const b of bats) {
        const room = (BUILD.battery.store - b.charge) / dh / .9;
        let want = Math.min(BUILD.battery.rate, room);
        if (want <= 0 || b.out > 0) continue;
        const a = Math.min(want, spareFree); spareFree -= a; want -= a;
        const c2 = Math.min(want, spareCoal); spareCoal -= c2; coalOut += c2;
        b.charge = Math.min(BUILD.battery.store, b.charge + (a + c2) * dh * .9); b.out = -(a + c2);
      }
    }
    for (const b of coals) b.out = coalCap > 0 ? coalOut * BUILD.coal.cap / coalCap : 0;
    S.coal += coalOut; fuelCost += coalOut * dh * BUILD.coal.fuel;
    // 공급 가능량 & 부하 차단
    const available = demand - need;
    comp.energized = (base + coalCap + batAvail) > 0.01;
    comp.short = need > 0.01;
    let left = available + 1e-6;
    const order = comp.short ? comp.cons.slice().sort((a, b) => CONS[a.type].pri - CONS[b.type].pri || a.id - b.id) : comp.cons;
    for (const c of order) {
      const was = c.on;
      if (c.prog < 1) { c.on = false; continue; }
      if (c.dem <= left) { c.on = true; left -= c.dem; S.served += c.dem; } else { c.on = false; S.shed += c.dem; }
      if (was && !c.on) newlyOff++; if (!was && c.on) newlyOn++;
    }
    S.dem += demand; S.cap += base + coalCap + batAvail; S.out += base + coalOut + batOut; S.renew += renew;
  }
  for (const c of G.cons) if (c.comp < 0) { const was = c.on; c.on = false; c.dem = demandOf(c, h); if (c.prog >= 1) { S.dem += c.dem; S.unconn += c.dem; } if (was) newlyOff++; }
  G.stat = S;
  // 시작 전(준비): 첫 불이 켜지면 시간이 흐름
  if (!G.started) return { newlyOn, newlyOff };

  // 경제
  let upkeep = 0;
  for (const b of G.blds) upkeep += BUILD[b.type].upkeep;
  const income = S.served * dh * PRICE;
  G.money += income - upkeep * dh - fuelCost;
  G.earned += income;
  G.totalMWh += S.served * dh;
  // 오염
  G.pollution = clamp(G.pollution + S.coal * .02 * dh - G.pollution * .02 * dh, 0, 100);
  if (G.pollution > POLL_LIMIT) G.money -= (G.pollution - POLL_LIMIT) * 1.5 * dh;
  // 만족도
  let tw = 0, ow = 0, hospOff = 0;
  for (const c of G.cons) {
    if (c.prog < 1) continue;
    const w = CONS[c.type].w[c.level - 1]; tw += w;
    if (!c.on) { ow += c.conn ? w : w * .5; if (c.type === 'hospital') hospOff++; }
  }
  const bf = tw ? ow / tw : 0;
  let dH = bf < .001 ? (G.happy < 85 ? 1.2 : .3) : -(.8 + 18 * bf);
  dH -= hospOff * 3;
  if (G.pollution > POLL_LIMIT) dH -= (G.pollution - POLL_LIMIT) * .06;
  G.happy = clamp(G.happy + dH * dh, 0, 100);
  if (bf > .001) G.blackoutH += dh;
  // 기록용 그래프
  G.histAcc += dt;
  if (G.histAcc >= 15) { G.histAcc -= 15; G.hist.push({ d: S.dem, c: S.cap }); if (G.hist.length > 96) G.hist.shift(); }
  return { newlyOn, newlyOff };
}

// ---------- 매 시간 / 매일 ----------
function hourly() {
  const sc = G.sc, day = dayOf(G.time), h = Math.floor(hourOf(G.time));
  G.hoursSinceStart++;
  // 건물 상태 시간 누적
  for (const c of G.cons.slice()) {
    if (c.prog < 1) { c.prog = Math.min(1, c.prog + 1 / GRACE_H); if (c.prog >= 1) G.dirty = true; continue; }
    if (c.on) { c.onH++; c.offH = 0; } else { c.offH++; c.onH = 0; }
    if (c.offH >= 30 && c.type !== 'hospital') {
      removeObj(c); G.happy = Math.max(0, G.happy - 3);
      toast(`${CONS[c.type].name}의 주민이 오랜 정전에 떠났어요`, 'warn');
      spawnFx(c.x, c.y, 'dust');
    }
  }
  // 바람 변화
  G.windTarget = clamp((.25 + Math.random() * .8) * WX().wind, .02, 1.3);
  // 수리 진행
  for (const b of G.blds) if (b.broken && b.repairT > 0) { b.repairT--; if (b.repairT <= 0) { b.broken = false; G.dirty = true; toast(`${BUILD[b.type].name} 수리 완료!`, 'good'); Sfx.play('repair'); } }
  // 건물 생성·성장 (시작 후 3시간부터)
  if (G.hoursSinceStart >= 3) { spawnTick(day); upgradeTick(day); }
  // 고장
  if (day >= 2 || G.hoursSinceStart > 20) {
    const diff = sc.survival ? 1 + (day - 1) * .12 : 1;
    const pr = { coal: .006, nuclear: .0035, wind: .004, solar: .0015, battery: .002, sub: .002 };
    for (const b of G.blds) {
      if (b.broken || !pr[b.type]) continue;
      if (Math.random() < pr[b.type] * diff) breakDown(b, 'fail');
    }
  }
  // 낙뢰
  if (WX().lightning) {
    if (Math.random() < .5) {
      const tall = G.blds.filter(b => !b.broken && (b.type === 'pole' || b.type === 'sub' || b.type === 'wind'));
      if (tall.length && Math.random() < .75) { const b = pick(tall); lightning(b.x, b.y, true); breakDown(b, 'bolt'); }
      else lightning(Math.floor(Math.random() * G.W), Math.floor(Math.random() * G.H), false);
    }
  }
  // 튜토리얼 타이머
  if (G.tut >= 3) { G.tutTimer++; }
  checkGoals();
}
function daily() {
  const day = dayOf(G.time);
  G.weather = G.forecast;
  G.forecast = rollWeather(day + 1);
  const w = WX();
  toast(`${day}일차 시작! 오늘 날씨: ${w.icon} ${w.name}`, 'gold');
  if (G.weather === 'heat') toast('🔥 폭염 특보! 낮~저녁 에어컨 수요가 급증해요', 'warn');
  if (G.weather === 'storm') toast('⛈️ 뇌우! 낙뢰로 전신주가 고장 날 수 있어요', 'warn');
  if (G.weather === 'calm') toast('🍂 바람이 없어요. 풍력 발전이 거의 멈춰요', 'warn');
  if (G.weather === 'cloudy') toast('☁️ 흐린 날. 태양광이 약해요');
  Sfx.play('day');
}
function spawnTick(day) {
  const sc = G.sc;
  const hf = clamp((G.happy - 15) / 55, .1, 1.2);
  let p = (.2 + .035 * day) * hf;
  if (sc.factoryBoost) p *= 1.15;
  let n = 0; while (Math.random() < p && n < 3) { n++; p *= .5; spawnOne(day); }
}
function spawnOne(day) {
  const sc = G.sc;
  const counts = { house: 0, shop: 0, factory: 0, hospital: 0 };
  for (const c of G.cons) counts[c.type]++;
  let type;
  if (G.pop >= 150 * (counts.hospital + 1) && counts.hospital < 4) type = 'hospital';
  else {
    const w = { house: 6.2, shop: counts.house >= 5 ? 2 : 0, factory: (day >= 2 || sc.factoryBoost) ? (sc.factoryBoost ? 2.4 : 1.1) : 0 };
    type = wpick(w);
  }
  const cand = [];
  const plants = G.blds.filter(b => b.type === 'coal' || b.type === 'nuclear');
  const ccx = G.W / 2, ccy = G.H / 2;
  for (let y = 0; y < G.H; y++) for (let x = 0; x < G.W; x++) {
    if (G.occ[y][x] || G.tiles[y][x] !== T.GRASS) continue;
    let near = false;
    for (const c of G.cons) { const d = Math.hypot(c.x - x, c.y - y); if (d <= 2.3) { near = true; break; } }
    if (!near) continue;
    if (type !== 'factory' && plants.some(p => Math.hypot(p.x - x, p.y - y) < 2.2)) continue;
    const dc = Math.hypot(x - ccx, y - ccy);
    if (type === 'factory' && dc < 3.5) continue;
    if (G.tut >= 0 && G.tut < 3 && Math.abs(x - Math.floor(ccx)) < 4 && Math.abs(y - Math.floor(ccy)) < 4) continue;
    cand.push({ x, y, w: type === 'factory' ? dc : 1 });
  }
  if (!cand.length) return;
  // 공장은 바깥쪽 선호
  let c;
  if (type === 'factory') { cand.sort((a, b) => b.w - a.w); c = cand[Math.floor(Math.random() * Math.min(6, cand.length))]; }
  else c = pick(cand);
  const o = addCons(type, c.x, c.y, false);
  if (o) {
    spawnFx(c.x, c.y, 'dust');
    if (type === 'hospital') toast('🏥 병원이 생겨요! 병원 정전은 만족도에 치명적이에요', 'gold');
    else if (type === 'factory' && counts.factory === 0) toast('🏭 첫 공장이 들어와요. 전력을 많이 써요!', 'gold');
  }
}
function upgradeTick(day) {

    const max = CONS[c.type].lv.length;

}
function breakDown(b, why) {

  else toast(`⚠ ${BUILD[b.type].name} 고장! 탭해서 수리하세요`, 'warn');

}
function repairCost(b) { return Math.max(10, Math.round(BUILD[b.type].cost * .15)); }
function startRepair(b) {

  if (G.money < c) { toast('수리비가 부족해요', 'warn'); Sfx.play('error'); return; }
  G.money -= c; b.repairT = BUILD[b.type].kind === 'net' ? 1 : 2;
  floatText(b.x, b.y, `-${c}만`, '#e77d78');

function lightning(x, y, hit) {

}
function makeBolt() { const s = []; let x = 0; for (let i = 0; i <= 10; i++) { s.push(x); x += (Math.random() - .5) * 26; } return s; }

// ---------- 목표 ----------
function goalInfo() {
  const sc = G.sc, g = sc.goal || {};
  const day = dayOf(G.time);
  if (sc.survival) return `생존 <b>${fmtSurv(G.time - START_MIN)}</b> · 최고 ${bestText()}`;
  const parts = [];
  if (g.pop) parts.push(`인구 <span class="gp">${G.pop}/${g.pop}</span>`);
  if (g.factories) parts.push(`가동 공장 <span class="gp">${poweredFactories()}/${g.factories}</span>`);
  if (g.happy) parts.push(`만족도 ${g.happy} 이상 유지`);
  if (sc.pollutionMax) parts.push(`오염 <span class="gp">${Math.round(G.pollution)}/${sc.pollutionMax}</span> 미만`);
  const leftMin = sc.days * 1440 - G.time;
  const lh = Math.max(0, Math.ceil(leftMin / 60));
  return `<b>${sc.name}</b> · ${parts.join(' · ')} · 남은 시간 ${Math.floor(lh / 24)}일 ${lh % 24}시간`;
}
function poweredFactories() { return G.cons.filter(c => c.type === 'factory' && c.on).length; }
function checkGoals() {
  if (G.over || G.demo) return;
  const sc = G.sc, g = sc.goal || {};
  if (G.happy <= 0) return endGame(false, '시민들의 불만이 폭발했어요! 만족도가 0이 되었습니다.');
  if (G.money < BANKRUPT) return endGame(false, `파산했어요! 자금이 ${BANKRUPT}만 아래로 떨어졌습니다.`);
  if (sc.survival) return;
  if (sc.pollutionMax && G.pollution >= sc.pollutionMax) return endGame(false, `오염도가 한도(${sc.pollutionMax})를 넘었어요.`);
  const deadline = sc.days * 1440;
  let met = true;
  if (g.pop && G.pop < g.pop) met = false;
  if (g.factories && poweredFactories() < g.factories) met = false;
  if (g.survive) {
    if (G.time >= deadline) {
      if (g.happy && G.happy < g.happy) return endGame(false, `버텼지만 만족도가 ${g.happy} 미만이에요.`);
      if (met) return endGame(true, `${sc.days}일을 버텨냈어요!`);
      return endGame(false, '기간 안에 목표를 이루지 못했어요.');
    }
    return;
  }
  if (met) return endGame(true, '목표 달성!');
  if (G.time >= deadline) return endGame(false, '기간 안에 목표를 이루지 못했어요.');
}

// ---------- 갱신 ----------
function computePop() { let p = 0; for (const c of G.cons) if (c.type === 'house' && c.prog >= 1) p += CONS.house.lv[c.level - 1].pop; G.pop = p; G.peakPop = Math.max(G.peakPop, p); }

function update(dt) {
  animT += dt;
  if (!G) return;
  // 애니메이션
  for (const b of G.blds) if (b.type === 'wind' && !b.broken) b.ang += dt * (1 + G.wind * 7) * (G.started || G.demo ? 1 : .4);
  updateFx(dt);
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (flashA > 0) { flashA = Math.max(0, flashA - dt * 2.5); }
  $('flash').style.opacity = flashA.toFixed(3);
  if (G.demo) { G.time += dt * 70; G.wind = .7; if (G.dirty) rebuildNet(); for (const c of G.cons) c.on = true; for (const cp of G.net.comps) cp.energized = true; for (const b of G.blds) b.out = 1; return; }
  if (screen !== 'game' || G.over) return;
  if (G.started && !G.paused) {
    G.acc += dt * MIN_PER_SEC * G.speed;
    let guard = 0;
    while (G.acc >= STEP && guard++ < 20) { G.acc -= STEP; advanceStep(); if (G.over) break; }
  } else {
    // 준비 중/멈춤: 시간은 멈추지만 전력망 상태는 계속 계산
    const r = simStep(0.0001);
    if (r.newlyOn) onPowerOn(r.newlyOn);
  }
  tutorialTick();
}
function advanceStep() {
  const r = simStep(STEP);
  G.time += STEP;
  computePop();
  if (r.newlyOn) onPowerOn(r.newlyOn);
  if (r.newlyOff && G.stat.shed > 0) {
    if (animT - G.lastShortToast > 6) { toast('⚡ 전력 부족! 일부 구역이 정전됐어요', 'warn'); G.lastShortToast = animT; Sfx.play('off'); }
  }
  const hr = Math.floor(G.time / 60);
  if (hr !== G.lastHour) {
    G.lastHour = hr;
    if (G.time % 1440 === 0) daily();
    hourly();
  }
  if (G.happy <= 0 || G.money < BANKRUPT) checkGoals();
}
function onPowerOn(n) {
  if (!G.started) {
    G.started = true;
    toast('💡 불이 켜졌어요! 이제 시간이 흐릅니다', 'good');
  }
  if (n > 0) Sfx.play('on');
}

function tutPlant() { return (G.sc.banned || []).includes('coal') ? 'solar' : 'coal'; }
function tutorialTick() {
  if (G.tut < 0) return;
  const s = G.tut;
  if (s === 0 && G.blds.some(b => BUILD[b.type].kind === 'plant')) advTut();
  else if (s === 1 && G.cons.some(c => c.on)) advTut();

  H.forEach((p, i) => { if (p.d > p.c) c.fillRect(X(i), Y(p.d), Math.max(1, w / 96), Y(p.c) - Y(p.d)); });
}
let toastQ = [];
function toast(msg, kind = '', ms = 3600) {
  if (!G || G.demo) return;

  if (toastQ.some(t => t.msg === msg)) return;
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
  box.appendChild(el); const item = { msg, el }; toastQ.push(item);
  while (toastQ.length > 3) { const o = toastQ.shift(); o.el.remove(); }
  setTimeout(() => { el.remove(); toastQ = toastQ.filter(t => t !== item); }, ms);
}
function showInfo() {
  const box = $('info');
  if (!selected || !G || (selected.cat === 'cons' ? !G.cons.includes(selected) : !G.blds.includes(selected))) { box.className = ''; box.innerHTML = ''; selected = null; return; }
  const o = selected; let html = '', btn = '';
  if (o.cat === 'cons') {
    const d = CONS[o.type], L = o.level;
    const status = o.prog < 1 ? `입주 준비 중 ${Math.round(o.prog * 100)}%` : o.on ? '<span style="color:#78e2ae">전기 공급 중</span>' : o.conn ? '<span style="color:#e77d78">정전! 발전량이 부족해요</span>' : '<span style="color:#64ceeb">연결 안 됨 — 가까이 전신주가 필요해요</span>';
    html = `<b>${LV_NAME[o.type][L - 1]}</b> ${o.type === 'house' ? `<small>· 인구 ${d.lv[L - 1].pop}명</small>` : ''}<br>${status}<br><small>지금 수요 ${fmt1(o.dem)} MW${o.type === 'hospital' ? ' · 최우선 공급' : ''}</small>`;
  } else {
    const d = BUILD[o.type]; let line = '';
    if (o.type === 'battery') line = `저장 ${fmt1(o.charge)}/${d.store} MWh · ${o.out > 0 ? '방전 ' + fmt1(o.out) : o.out < 0 ? '충전 ' + fmt1(-o.out) : '대기'} MW`;
    else if (d.kind === 'plant') line = `출력 ${fmt1(o.out)} / ${d.cap} MW${o.type === 'wind' && G.tiles[o.y][o.x] === T.HILL ? ' · 언덕 보너스' : ''}`;
    else line = `연결 ${d.link}칸 · 공급 범위 ${d.serve}칸`;
    const conn = d.kind !== 'net' && o.comp >= 0 && G.net.comps[o.comp] && G.net.comps[o.comp].cons.length === 0 ? '<br><small style="color:#64ceeb">아직 건물과 이어지지 않았어요 — 전신주로 연결하세요</small>' : '';
    const st = o.broken ? (o.repairT > 0 ? `<span style="color:#64ceeb">수리 중 (${o.repairT}시간)</span>` : '<span style="color:#e77d78">고장!</span>') : '';
    html = `<b>${d.name}</b> ${st}<br>${line}${conn}<br><small>유지비 ${d.upkeep}만/시간 · ${d.desc}</small>`;
    if (o.broken && o.repairT <= 0) btn += `<button class="ib2 gold" id="iRepair">수리 ${repairCost(o)}만</button>`;
    const refund = Math.round(d.cost * (G.time - o.builtAt <= 60 ? 1 : .5));
    btn += `<button class="ib2 red" id="iDemolish">철거 +${refund}</button>`;
  }
  box.innerHTML = `<div class="it">${html}</div>${btn}<button class="ib2" id="iClose" aria-label="닫기">✕</button>`;
  box.className = 'on';
  const r = $('iRepair'); if (r) r.onclick = () => { startRepair(o); showInfo(); };
  const dm = $('iDemolish'); if (dm) dm.onclick = () => demolish(o);
  $('iClose').onclick = () => { selected = null; showInfo(); };
}

// ---------- 툴바 ----------
function buildToolbar() {
  const box = $('tools'); box.innerHTML = '';
  TOOLS.forEach((k, i) => {
    const b = document.createElement('button'); b.className = 'tb'; b.dataset.t = k;
    const name = TOOL_LABEL[k] || (k === 'battery' ? '배터리' : k === 'coal' ? '석탄' : BUILD[k].name);
    b.setAttribute('aria-label', `${name} (${i + 1})`);
    const c = document.createElement('canvas'); c.width = c.height = 30 * 2;
    const x = c.getContext('2d'); x.scale(2, 2); sprite(x, k, 30, { level: 1, ang: .4, charge: .7, sun: 1 });
    b.appendChild(c);
    const s = document.createElement('span'); s.textContent = name; b.appendChild(s);
    const e = document.createElement('em'); e.textContent = BUILD[k] ? BUILD[k].cost + '만' : ' '; b.appendChild(e);
    b.onclick = () => { Sfx.init(); setTool(k); };
    box.appendChild(b);
  });
  refreshTools();
}
function setTool(k) {
  if (G && (G.sc.banned || []).includes(k)) { toast('이 시나리오에서는 지을 수 없어요', 'warn'); Sfx.play('error'); return; }
  tool = (tool === k && k !== 'select') ? 'select' : k;
  Sfx.play('click'); refreshTools();
  if (BUILD[tool]) toast(`${BUILD[tool].name}: ${BUILD[tool].desc}`, '', 2200);
}
function refreshTools() {
  const hint = G && G.tut >= 0 && TUT[G.tut].tool ? TUT[G.tut].tool() : null;
  document.querySelectorAll('.tb').forEach(el => {
    const k = el.dataset.t;
    el.classList.toggle('sel', k === tool);
    el.classList.toggle('dis', !!(G && (G.sc.banned || []).includes(k)));
    el.classList.toggle('hint', k === hint && tool !== k);
    const em = el.querySelector('em'); if (G && (G.sc.banned || []).includes(k)) em.textContent = '금지';
  });
}

// ---------- 입력 ----------
const ptrs = new Map(); let gesture = null;
cv.addEventListener('pointerdown', e => {
  Sfx.init();
  if (screen !== 'game') return;
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) {
    gesture = { type: 'pan', sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y, moved: false };
    pressTile = screenToTile(e.clientX, e.clientY);
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    gesture = { type: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z, mid: screenToWorld((a.x + b.x) / 2, (a.y + b.y) / 2) };
    pressTile = null;
  }
});
cv.addEventListener('pointermove', e => {
  if (screen !== 'game') return;
  if (e.pointerType === 'mouse' && !ptrs.size) { hoverTile = screenToTile(e.clientX, e.clientY); return; }
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (gesture && gesture.type === 'pan') {
    const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
    if (!gesture.moved && Math.hypot(dx, dy) > 9) { gesture.moved = true; pressTile = null; }
    if (gesture.moved) { cam.x = gesture.cx - dx / cam.z; cam.y = gesture.cy - dy / cam.z; clampCam(); }
    else pressTile = screenToTile(e.clientX, e.clientY);
  } else if (gesture && gesture.type === 'pinch' && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    cam.z = clamp(gesture.z * d / Math.max(10, gesture.d), .35, 2.6);
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    cam.x = gesture.mid.x - (mx - VW / 2) / cam.z; cam.y = gesture.mid.y - (my - VH / 2) / cam.z; clampCam();
  }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (gesture && gesture.type === 'pan' && !gesture.moved && ptrs.size === 0 && e.type === 'pointerup') {
    const t = screenToTile(e.clientX, e.clientY); tapTile(t.x, t.y);
  }
  if (ptrs.size === 0) { gesture = null; pressTile = null; }
  else if (ptrs.size === 1) { const p = [...ptrs.values()][0]; gesture = { type: 'pan', sx: p.x, sy: p.y, cx: cam.x, cy: cam.y, moved: true }; }
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hoverTile = null; });
cv.addEventListener('wheel', e => {
  if (screen !== 'game') return; e.preventDefault();
  const before = screenToWorld(e.clientX, e.clientY);
  cam.z = clamp(cam.z * Math.exp(-e.deltaY * .0015), .35, 2.6);
  const after = screenToWorld(e.clientX, e.clientY);
  cam.x += before.x - after.x; cam.y += before.y - after.y; clampCam();
}, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
const keys = new Set();
window.addEventListener('keydown', e => {
  Sfx.init();
  const k = e.key;
  if (k === 'Escape') {
    if (screen === 'game') openPause(); else if (screen === 'pause') resume(); else if (screen === 'howto') closeHow(); else if (screen === 'modes') show('title');
    e.preventDefault(); return;
  }
  if (screen !== 'game') return;
  if (k === ' ') { togglePause(); e.preventDefault(); return; }
  if (k === 'f' || k === 'F') { cycleSpeed(); return; }
  if (k === '+' || k === '=') { cam.z = clamp(cam.z * 1.2, .35, 2.6); return; }
  if (k === '-' || k === '_') { cam.z = clamp(cam.z / 1.2, .35, 2.6); return; }
  if (/^[1-9]$/.test(k)) { setTool(TOOLS[+k - 1]); return; }
  if (k === 'Enter' && hoverTile) { tapTile(hoverTile.x, hoverTile.y); return; }
  keys.add(k.toLowerCase());
  if (k.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
function keyPan(dt) {
  if (screen !== 'game') return;
  let dx = 0, dy = 0;
  if (keys.has('arrowleft') || keys.has('a')) dx--; if (keys.has('arrowright') || keys.has('d')) dx++;
  if (keys.has('arrowup') || keys.has('w')) dy--; if (keys.has('arrowdown') || keys.has('s')) dy++;
  if (dx || dy) { cam.x += dx * 420 * dt / cam.z; cam.y += dy * 420 * dt / cam.z; clampCam(); }
}

// ---------- 화면 ----------
const SCREENS = ['title', 'modes', 'howto', 'pause', 'result'];
let howReturn = 'title';
function show(name) {
  screen = name;
  for (const s of SCREENS) $(s).classList.toggle('on', s === name);
  const inGame = name === 'game' || name === 'pause' || name === 'result';
  $('hud').hidden = !inGame || (G && G.demo); $('tools').hidden = !inGame || (G && G.demo);
  $('goal').style.display = inGame && G && !G.demo ? '' : 'none';
  if (!inGame) { $('info').className = ''; }
  if (name === 'title') { refreshBest(); if (!G || !G.demo) newGame(Object.assign({}, SURVIVAL, { seed: 77 }), true); }
  if (name === 'modes') buildModes();
  if (inGame) setTimeout(resize, 0);
}
function refreshBest() {
  $('bestT').textContent = '최고 기록: ' + bestText() + ` · 시나리오 ${Store.get('cleared', []).length}/${SCENARIOS.length} 클리어`;
  syncSound();
}
function bestText() { const b = Store.get('best', null); return b ? fmtSurv(b.min) : '없음'; }
function fmtSurv(min) { min = Math.max(0, min); const d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60); return `${d}일 ${h}시간`; }
function buildModes() {
  const box = $('modeList'); box.innerHTML = '';
  const cleared = Store.get('cleared', []);
  const mk = (sc, num, cls) => {
    const b = document.createElement('button'); b.className = 'card ' + (cls || '');
    b.innerHTML = `<span class="cn">${num}</span><span class="cb"><b>${sc.name}</b><small>${sc.desc}</small></span>${cleared.includes(sc.id) ? '<span class="ck">✓ 클리어</span>' : ''}`;
    b.onclick = () => { Sfx.init(); Sfx.play('click'); startGame(sc); };
    box.appendChild(b);
  };
  mk(Object.assign({}, SURVIVAL, { desc: SURVIVAL.desc + ' 최고 기록: ' + bestText() }), '∞', 'surv');
  SCENARIOS.forEach((sc, i) => mk(sc, i + 1));
}
let curSc = null;
function startGame(sc) {
  curSc = sc;
  newGame(Object.assign({}, sc));
  toastQ.forEach(t => t.el.remove()); toastQ = [];
  buildToolbar();
  show('game');
  updateHud(true);
  if (G.tut < 0) toast(sc.survival ? '발전소를 짓고 전신주로 집까지 이어 불을 켜세요!' : `목표: ${sc.desc}`, 'gold');
}
function openPause() {
  if (screen !== 'game' || G.over) return;
  $('pauseInfo').innerHTML = `${G.sc.name} · ${dayOf(G.time)}일차 · 인구 ${G.pop}명`;
  syncSound(); show('pause');
}
function resume() { show('game'); last = performance.now(); }
function togglePause() {
  if (!G.started) { G.started = true; toast('시간이 흐르기 시작해요', 'good'); }
  else G.paused = !G.paused;
  Sfx.play('click'); updateHud(true);
}
function cycleSpeed() { G.speed = G.speed === 1 ? 2 : G.speed === 2 ? 4 : 1; if (G.paused) G.paused = false; Sfx.play('click'); updateHud(true); }
function endGame(win, reason) {
  if (G.over) return;
  G.over = true; G.win = win;
  const sc = G.sc;
  let isNew = false;
  const survived = G.time - START_MIN;
  if (sc.survival) {
    const b = Store.get('best', null);
    if (!b || survived > b.min) { Store.set('best', { min: survived, pop: G.peakPop }); isNew = true; }
  } else if (win) {
    const cl = Store.get('cleared', []); if (!cl.includes(sc.id)) { cl.push(sc.id); Store.set('cleared', cl); isNew = true; }
  }
  Sfx.play(win ? 'win' : 'lose');
  $('resTitle').textContent = sc.survival ? '도시가 무너졌어요' : win ? '🎉 시나리오 클리어!' : '시나리오 실패';
  $('resReason').textContent = reason;
  $('resBig').textContent = sc.survival ? `${fmtSurv(survived)} 버팀` : sc.name;
  $('resNew').textContent = sc.survival ? '🏆 최고 기록 갱신!' : '✓ 첫 클리어!';
  $('resNew').classList.toggle('on', isNew);
  $('resStats').innerHTML = [
    ['최고 인구', fmt(G.peakPop) + '명'], ['공급한 전력', fmt(G.totalMWh) + ' MWh'],
    ['번 돈', fmt(G.earned) + '만'], ['정전 시간', fmt1(G.blackoutH) + '시간'],
  ].map(([a, b]) => `<div>${a}<b>${b}</b></div>`).join('');
  setTimeout(() => { if (G && G.over) show('result'); }, 600);
}

// 버튼
$('bStart').onclick = () => { Sfx.init(); Sfx.play('click'); show('modes'); };
$('bHow').onclick = () => { Sfx.init(); Sfx.play('click'); howReturn = 'title'; show('howto'); };
$('bHow2').onclick = () => { howReturn = 'pause'; show('howto'); };
function closeHow() { if (howReturn === 'pause') show('pause'); else show('title'); }
$('bHowBack').onclick = closeHow;
$('bModesBack').onclick = () => show('title');
$('bResume').onclick = resume;
$('bRestart').onclick = () => startGame(curSc);
$('bQuit').onclick = () => { G = null; show('title'); };
$('bAgain').onclick = () => startGame(curSc);
$('bResModes').onclick = () => { G = null; show('modes'); newGame(Object.assign({}, SURVIVAL, { seed: 77 }), true); };
$('bResTitle').onclick = () => { G = null; show('title'); };
$('bMenu').onclick = () => { Sfx.init(); openPause(); };
$('bPause').onclick = () => { Sfx.init(); togglePause(); };
$('bSpeed').onclick = () => { Sfx.init(); cycleSpeed(); };
function syncSound() { const t = Sfx.on ? '🔊 소리 켜짐' : '🔇 소리 꺼짐'; $('bSound1').textContent = t; $('bSound2').textContent = t; }
function toggleSound() { Sfx.on = !Sfx.on; Store.set('sound', Sfx.on); Sfx.init(); syncSound(); Sfx.play('click'); }
$('bSound1').onclick = toggleSound; $('bSound2').onclick = toggleSound;
document.addEventListener('visibilitychange', () => { if (document.hidden && screen === 'game' && G && !G.over) openPause(); });

// 방법 보기 내용
(function buildHow() {
  const items = [
    ['coal', '<b>발전소</b>를 지어요. 석탄(싸지만 오염), 태양광(낮), 풍력(바람), 원자력(강력), 배터리(저장).'],
    ['pole', '<b>전신주</b>는 3칸 안의 시설과 선으로 이어지고, 주변 2칸의 건물에 전기를 나눠 줘요. 변전소는 더 멀리·넓게!'],
    ['house', '집·상가·공장·병원이 계속 생기고 커져요. <b>🔌</b>는 선이 안 닿은 건물이에요.'],
    ['⚡', '<b>수요 &gt; 공급</b>이면 정전! 저녁 18~20시가 피크. 정전이 이어지면 만족도가 떨어지고 0이면 끝.'],
    ['⛈️', '날씨: 흐림=태양광↓, 무풍=풍력↓, 폭염=에어컨 수요↑, 뇌우=낙뢰로 전신주 고장. 위쪽 날씨 옆 ▸ 아이콘이 내일 예보예요.'],
    ['❗', '고장 난 시설은 <b>탭해서 수리</b>. 돈: 전기 요금 수입 − 건설비·유지비·연료비·오염 벌금.'],
  ];
  const ul = $('howList');
  for (const [k, t] of items) {
    const li = document.createElement('li');
    if (k.length > 2) {
      const c = document.createElement('canvas'); c.width = c.height = 80; const x = c.getContext('2d'); x.scale(2, 2);
      sprite(x, k, 40, { level: 1, hue: 1, ang: .3 }); li.appendChild(c);
    } else { const s = document.createElement('span'); s.className = 'ie'; s.textContent = k; li.appendChild(s); }
    const d = document.createElement('div'); d.innerHTML = t; li.appendChild(d); ul.appendChild(li);
  }
})();

// ---------- 루프 ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  keyPan(dt);
  update(dt);
  render();
  if (screen === 'game') updateHud(false);
  requestAnimationFrame(frame);
}

// ---------- 테스트용 읽기 훅 ----------
window.__game = {
  state: () => G ? ({
    screen, mode: G.sc.survival ? 'survival' : 'scenario', scenario: G.sc.id, demo: G.demo, day: dayOf(G.time), hour: +hourOf(G.time).toFixed(2), time: G.time,
    started: G.started, paused: G.paused, speed: G.speed, over: G.over, win: !!G.win, money: Math.round(G.money), happiness: +G.happy.toFixed(1),
    pollution: +G.pollution.toFixed(1), pop: G.pop, demand: +G.stat.dem.toFixed(2), capacity: +G.stat.cap.toFixed(2), shed: +G.stat.shed.toFixed(2),
    unconnected: +G.stat.unconn.toFixed(2), consumers: G.cons.length, poweredConsumers: G.cons.filter(c => c.on).length,
    buildings: G.blds.length, broken: G.blds.filter(b => b.broken).length, weather: G.weather, tool, tutorial: G.tut, comps: G.net.comps.length,
  }) : { screen },
  map: () => G ? { w: G.W, h: G.H, tiles: G.tiles.map(r => r.slice()), buildings: G.blds.map(b => ({ type: b.type, x: b.x, y: b.y, broken: b.broken })), consumers: G.cons.map(c => ({ type: c.type, x: c.x, y: c.y, level: c.level, on: c.on, conn: c.conn, ready: c.prog >= 1 })) } : null,
  tileToScreen: (x, y) => worldToScreen((x + .5) * TILE, (y + .5) * TILE),
  center: () => G ? { x: Math.floor(G.W / 2), y: Math.floor(G.H / 2) } : null,
  // 화면 탭·툴바 선택과 같은 동작(입력 자동화용)
  tap: (x, y) => tapTile(x, y),
  selectTool: (k) => { if (tool !== k) setTool(k); },
  forecast: () => G ? G.forecast : null,
  // 검증 자동화용 빨리 감기(일반 진행과 같은 규칙으로 시간만 앞당김)
  advance: (min) => { if (!G || !G.started) return; for (let m = 0; m < min && !G.over; m += STEP) advanceStep(); updateHud(true); },
};

resize();
show('title');
requestAnimationFrame(frame);
</script>
