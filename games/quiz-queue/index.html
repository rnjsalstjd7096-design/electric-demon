<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>시험 줄서기: 문제 종류별 모으기</title>
<meta name="description" content="시험 문제 카드를 종류가 같은 칸에 모으는 줄서기 퍼즐. 전부 연습용 예시 문제.">
<style>
html,body{margin:0;height:100%;background:#14161b;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;font-size:20px}
#app{position:relative;margin:0 auto;max-width:480px;height:100%;display:flex;flex-direction:column;padding:8px 12px 10px;box-sizing:border-box}
#top{display:flex;align-items:center;justify-content:space-between;padding-left:44px;padding-right:56px;min-height:48px}
#top b{font-size:20px;white-space:nowrap}#stat{white-space:nowrap;font-size:20px;font-weight:800;color:#ffd23f}
#sub{font-size:20px;line-height:1.35;color:#e8ebf2;text-align:center;margin:4px 0 8px;word-break:keep-all}
#board{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
.btn{flex:1;border:0;border-radius:14px;font-size:20px;font-weight:800;min-height:56px;font-family:inherit;cursor:pointer;touch-action:manipulation;background:#3b4252;color:#fff;box-shadow:0 4px 0 #1f232c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f232c}.btn.main{background:#ffd23f;color:#2b2000;box-shadow:0 4px 0 #a98400}
#mute{position:absolute;top:8px;right:10px;width:48px;height:48px;border:0;border-radius:24px;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;z-index:5}
#end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,11,16,.78);z-index:4;padding:16px;box-sizing:border-box}
#end.on{display:flex}
#card{width:100%;max-width:360px;background:#2b2f3a;border:3px solid #4a505f;border-radius:18px;padding:18px;box-sizing:border-box;text-align:center;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#endTitle{font-size:24px;font-weight:800;margin:0 0 6px}#endScore{font-size:52px;font-weight:900;line-height:1.1;color:#ffd23f}
#endSub{font-size:20px;color:#e8ebf2;margin:4px 0}#endBest{font-size:20px;font-weight:700;color:#9fe1ff;margin:0 0 10px}
#fact{font-size:20px;line-height:1.45;background:#1d2029;border-radius:12px;padding:10px 12px;margin:0 0 12px;text-align:left;word-break:keep-all}
.shake{animation:sk .3s}@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.sp{position:absolute;font-size:28px;animation:fl .8s ease-out forwards}@keyframes fl{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.6)}}
#bar{width:100%;text-align:center;min-height:56px;font-size:20px;font-weight:700;color:#9fe1ff;margin-top:6px;line-height:1.3;word-break:keep-all}

#blocks{display:flex;gap:8px;width:100%;max-width:372px}
.bk{flex:1;border:4px solid #fff5;border-radius:14px;padding:6px 4px;min-height:92px;box-sizing:border-box;text-align:center;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.bk .nm{font-size:18px;line-height:1.15;word-break:keep-all}
.dots{display:flex;gap:6px;margin-top:4px}.dot{width:22px;height:22px;border-radius:50%;background:#0006;border:2px solid #fff6}.dot.on{background:#fff;border-color:#fff}
#wait{display:flex;gap:6px;width:100%;max-width:372px;margin-top:10px;align-items:center}
#wait .lb{font-size:16px;color:#aeb4c2;width:44px;font-weight:700;line-height:1.1}
.ws{flex:1;height:60px;border:3px dashed #4a505f;border-radius:12px;background:#12141a;padding:0;font-family:inherit;color:#fff;touch-action:manipulation}
.ws .it{width:100%;height:100%;margin:0;border-radius:9px;font-size:17px}
#qs{display:flex;gap:8px;width:100%;max-width:372px;margin-top:12px;align-items:flex-start}
.q{flex:1;display:flex;flex-direction:column;gap:6px}
.it{border:0;border-radius:11px;font-family:inherit;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;touch-action:manipulation;text-shadow:0 1px 2px #0008;word-break:keep-all}
.q .it{min-height:50px;font-size:20px;padding:4px}
.q .it:first-child{min-height:72px;border:4px solid #fff;cursor:pointer}
.q .it:not(:first-child){opacity:.55;transform:scale(.92)}
.tx .it{font-size:17px;line-height:1.2}.tx .q .it:first-child{font-size:19px}

</style>
<meta name="description" content="시험 문제 카드(연습용 예시)를 전선 색·단위·옴·합성저항 종류별 칸에 3개씩 모으는 줄 세우기 퍼즐. 맞는 칸이 없으면 대기 칸, 대기 칸이 차면 끝."><meta property="og:type" content="website"><meta property="og:url" content="https://rnjsalstjd7096-design.github.io/electric-demon/games/quiz-queue/"><meta property="og:title" content="시험 줄서기: 문제 종류별 모으기"><meta property="og:description" content="시험 문제 카드(연습용 예시)를 전선 색·단위·옴·합성저항 종류별 칸에 3개씩 모으는 줄 세우기 퍼즐. 맞는 칸이 없으면 대기 칸, 대기 칸이 차면 끝."><meta property="og:image" content="https://rnjsalstjd7096-design.github.io/electric-demon/icon-512.png"><style>#eddm{position:fixed;left:8px;top:max(8px,env(safe-area-inset-top));z-index:2147483646;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,19,32,.72);color:#f2c66d;font:17px/32px system-ui,sans-serif;text-align:center;padding:0;cursor:pointer;opacity:.8;-webkit-tap-highlight-color:transparent}#eddms{position:fixed;inset:0;z-index:2147483647;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);font:15px/1.4 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}#eddms.on{display:flex}#eddms>div{width:min(100%,430px);background:#152238;color:#eaf1fb;border-radius:16px 16px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}#eddms b{display:block;margin:0 0 10px;font-size:16px}#eddms a,#eddms button{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;padding:12px;border-radius:10px;border:1px solid #2c415b;background:#0a1320;color:#eaf1fb;font:inherit;text-align:left;text-decoration:none;cursor:pointer}#eddms .cafe{background:#03c75a;border-color:#03c75a;color:#fff;font-weight:700}#eddms small{display:block;color:#a5b7ca;font-size:12px}</style><script>addEventListener("DOMContentLoaded",function(){var T="시험 줄서기: 문제 종류별 모으기",D="시험 문제 카드(연습용 예시)를 전선 색·단위·옴·합성저항 종류별 칸에 3개씩 모으는 줄 세우기 퍼즐. 맞는 칸이 없으면 대기 칸, 대기 칸이 차면 끝.",U="https://rnjsalstjd7096-design.github.io/electric-demon/games/quiz-queue/";var b=document.createElement("button");b.id="eddm";b.type="button";b.setAttribute("aria-label","공유·카페·다른 게임");b.textContent="⚡";var s=document.createElement("div");s.id="eddms";s.innerHTML="<div><b>⚡ "+T+"</b><button type=button data-k=share>📤 친구에게 공유하기<small>카톡·단톡방에 이 게임 보내기</small></button><a class=cafe href=https://cafe.naver.com/eleccommander target=_blank rel=noopener>☕ 전기인 모임 (네이버 카페)<small style=color:#e6ffe9>점수 자랑 · 전기 질문 · 새 게임 소식</small></a><a href=../>🎮 다른 전기 미니게임</a><button type=button data-k=x>닫기</button></div>";function stop(e){e.stopPropagation()}["pointerdown","pointerup","mousedown","mouseup","touchstart","touchend","click","keydown"].forEach(function(t){b.addEventListener(t,stop);s.addEventListener(t,stop)});b.onclick=function(){s.classList.add("on")};s.onclick=function(e){var k=e.target.closest("[data-k]");if(e.target===s||(k&&k.dataset.k==="x"))s.classList.remove("on");else if(k&&k.dataset.k==="share"){if(navigator.share)navigator.share({title:T,text:D,url:U}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText("⚡ "+T+"\n"+U).then(function(){k.firstChild.textContent="✅ 주소 복사됨 — 카톡에 붙여 넣기"},function(){prompt("주소를 복사하세요",U)});else prompt("주소를 복사하세요",U)}};document.body.appendChild(s);document.body.appendChild(b)})</script></head>
<body>
<div id="app">
  <div id="top"><b id="lv"></b><span id="stat"></span></div>
  <div id="sub"></div>
  <div id="board"></div>
  <div id="bar"></div>
  <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
  <div id="fx"></div>
  <div id="end"><div id="card">
    <div id="endTitle"></div><div id="endScore"></div><div id="endSub"></div><div id="endBest"></div>
    <div id="fact"></div>
    <button class="btn main" id="again" style="width:100%">한 번 더</button>
  </div></div>
</div>
<script>
"use strict";
const KEY='quiz-queue.save.v1';
const $=id=>document.getElementById(id);
let save={best:0,plays:0,fi:0};
try{const r=localStorage.getItem(KEY);if(r)save=Object.assign(save,JSON.parse(r));}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
let muted=false,AC=null;
try{muted=localStorage.getItem(KEY+'.mute')==='1';}catch(e){}
function actx(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();}if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,t,v,when){if(muted)return;const a=actx();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=t||'sine';o.frequency.value=f;const s=a.currentTime+(when||0);g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d);}catch(e){}}
const sfx={tap(){tone(520,.07,'triangle',.1)},ok(){tone(660,.1,'triangle',.14);tone(880,.14,'triangle',.14,.09)},bad(){tone(180,.25,'sawtooth',.12)},
 done(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.08))},lose(){[330,262,196].forEach((f,i)=>tone(f,.28,'sawtooth',.1,i*.16))}};
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function burst(x,y,ch){const fx=$('fx'),r=fx.getBoundingClientRect();for(let i=0;i<5;i++){const s=document.createElement('div');s.className='sp';s.textContent=ch||'✨';s.style.left=(x-r.left-14+(Math.random()*60-30))+'px';s.style.top=(y-r.top-14+(Math.random()*30-15))+'px';fx.appendChild(s);setTimeout(()=>s.remove(),850);}}
function burstEl(el,ch){if(!el)return burst(innerWidth/2,innerHeight/3,ch);const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,ch);}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a}
$('mute').textContent=muted?'🔇':'🔊';
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem(KEY+'.mute',muted?'1':'0');}catch(e){}if(!muted)sfx.tap();};
function showEnd(title,score,sub,best,isNew,fact){$('endTitle').textContent=title;$('endScore').textContent=score;$('endSub').textContent=sub;const b=$('endBest');b.textContent=best;b.style.color=isNew?'#ffd23f':'#9fe1ff';$('fact').innerHTML=fact;$('end').classList.add('on');}
function hideEnd(){$('end').classList.remove('on');}
function endGame(t,n,unit,extra,facts){over=true;save.plays++;const nb=n>save.best;const prev=save.best;if(nb)save.best=n;const f=facts[save.fi++%facts.length];persist();sfx.lose();
 const gap=nb?0:save.best-n;
 showEnd(t,n+unit,extra+(nb?'':' · 최고 기록까지 '+(gap+1)+unit+' (아깝다!)'),nb?'신기록! 이전 최고 '+prev+unit:'최고 '+save.best+unit,nb,'<b>'+f[0]+'</b> — '+f[1]);}
const CATS=[
 {id:'색',label:'전선 색 외우기',bg:'#7b4fd1'},
 {id:'단위',label:'단위 외우기',bg:'#1f8f84'},
 {id:'옴',label:'옴·전력 풀기',bg:'#c8741f'},
 {id:'합',label:'합성저항 풀기',bg:'#c23d73'}];
const BANK=[
 {c:'색',t:'L1 선의 색은?',a:'갈색',h:'외워 두면 바로 나와요'},
 {c:'색',t:'L2 선의 색은?',a:'검정',h:'외워 두면 바로 나와요'},
 {c:'색',t:'L3 선의 색은?',a:'회색',h:'외워 두면 바로 나와요'},
 {c:'색',t:'N(중성선)의 색은?',a:'파랑',h:'외워 두면 바로 나와요'},
 {c:'색',t:'접지(PE)선의 색은?',a:'녹색-노란색',h:'외워 두면 바로 나와요'},
 {c:'단위',t:'전압의 단위는?',a:'V(볼트)',h:'외워 두면 바로 나와요'},
 {c:'단위',t:'전류의 단위는?',a:'A(암페어)',h:'외워 두면 바로 나와요'},
 {c:'단위',t:'저항의 단위는?',a:'Ω(옴)',h:'외워 두면 바로 나와요'},
 {c:'단위',t:'전력의 단위는?',a:'W(와트)',h:'외워 두면 바로 나와요'},
 {c:'옴',t:'12V에 4Ω이면 전류는?',a:'3A',h:'식으로 풀어요: 12÷4'},
 {c:'옴',t:'5Ω에 2A가 흐르면 전압은?',a:'10V',h:'식으로 풀어요: 5×2'},
 {c:'옴',t:'220V에 2A면 저항은?',a:'110Ω',h:'식으로 풀어요: 220÷2'},
 {c:'옴',t:'100V에 5A면 전력은?',a:'500W',h:'식으로 풀어요: 100×5'},
 {c:'합',t:'10Ω과 20Ω을 직렬로 이으면?',a:'30Ω',h:'식으로 풀어요: 10+20'},
 {c:'합',t:'4Ω과 6Ω을 직렬로 이으면?',a:'10Ω',h:'식으로 풀어요: 4+6'},
 {c:'합',t:'6Ω과 3Ω을 병렬로 이으면?',a:'2Ω',h:'식으로 풀어요: 6×3÷(6+3)'},
 {c:'합',t:'6Ω과 6Ω을 병렬로 이으면?',a:'3Ω',h:'식으로 풀어요: 6×6÷(6+6)'}
];
const NQ=3,QD=3,TITLE='줄서기',QCLS='tx';
function mkItem(c){const l=BANK.filter(x=>x.c===c);return {c:c,t:l[rnd(l.length)].t}}
const FIRSTMSG='맨 위 문제를 누르면 같은 종류 칸으로 들어가요 (연습용 예시 문제)';
const SUBTXT='문제를 종류가 같은 칸에 3개씩 모아요 · 맞는 칸이 없으면 대기 칸';
const FACTS=[
 ['옴의 법칙','전압(V)은 전류(A)에 저항(Ω)을 곱한 값이에요. 셋 중 둘을 알면 나머지 하나를 구해요.'],
 ['전선 색','L1 갈색, L2 검정, L3 회색, N 파랑, 접지 녹색-노란색. 색은 약속이라 외워 두고, 현장에선 검전기로 꼭 확인해요.'],
 ['병렬 합성저항','저항 두 개를 병렬로 이으면 합성저항은 두 값의 곱을 합으로 나눈 값이에요. 작은 쪽보다 작아져요.'],
 ['직렬 합성저항','저항을 직렬로 이으면 합성저항은 그냥 더한 값이에요.']];

const MAXW=4,CAP=3;
let blocks,queues,wait,score,over,cleared;
function inBlocks(c){return blocks.some(b=>b.c===c)}
function allowed(){return cleared<3?CATS.slice(0,CATS.length-1):CATS}
function newItem(){const al=allowed();
 const bc=blocks.filter(b=>b.n<CAP).map(b=>b.c);const p=Math.max(.1,.8-.05*cleared);
 const c=(bc.length&&Math.random()<p)?bc[rnd(bc.length)]:al[rnd(al.length)].id;
 return mkItem(c)}
function fillQ(q){while(q.length<QD)q.push(newItem())}
function newBlockCat(){const al=allowed().map(x=>x.id);const free=al.filter(c=>!inBlocks(c));const pool=free.length?free:al;return pool[rnd(pool.length)]}
function start(){hideEnd();over=false;score=0;cleared=0;wait=[];
 const al=CATS.slice(0,CATS.length-1).map(x=>x.id);shuffle(al);blocks=[0,1,2].map(i=>({c:al[i],n:0}));
 queues=[];for(let i=0;i<NQ;i++){queues.push([]);}
 queues.forEach(fillQ);queues[0][0]=mkItem(blocks[0].c);queues[1][0]=mkItem(blocks[1].c);queues[NQ-1][0]=mkItem(blocks[0].c);
 render(FIRSTMSG);}
function cat(id){return CATS.find(x=>x.id===id)}
function sty(c){const k=cat(c);return 'background:'+k.bg+';color:'+(k.fg||'#fff')}
function itHtml(it){return '<div class="it" style="'+sty(it.c)+'">'+it.t+'</div>'}
function render(msg){
 $('lv').textContent=TITLE;$('stat').textContent='✔'+cleared+'칸 대기'+wait.length+'/'+MAXW;
 $('sub').textContent=SUBTXT;
 let h='<div id="blocks">'+blocks.map(b=>{const k=cat(b.c);return '<div class="bk" style="'+sty(b.c)+'"><div class="nm">'+k.label+'</div><div class="dots">'+[0,1,2].map(i=>'<span class="dot'+(i<b.n?' on':'')+'"></span>').join('')+'</div></div>'}).join('')+'</div>';
 h+='<div id="wait"><span class="lb">대기<br>칸</span>'+[0,1,2,3].map(i=>'<button class="ws" data-i="'+i+'">'+(wait[i]?itHtml(wait[i]):'')+'</button>').join('')+'</div>';
 h+='<div id="qs" class="'+QCLS+'">'+queues.map((q,i)=>'<div class="q">'+q.map((it,j)=>j===0?'<button class="it" data-i="'+i+'" style="'+sty(it.c)+'">'+it.t+'</button>':itHtml(it)).join('')+'</div>').join('')+'</div>';
 $('board').innerHTML=h;$('bar').textContent=msg||'';
 document.querySelectorAll('#qs button.it').forEach(el=>el.onclick=()=>tapQ(+el.dataset.i,el));
 document.querySelectorAll('.ws').forEach(el=>el.onclick=()=>tapW(+el.dataset.i,el));}
function place(it,el){const b=blocks.find(x=>x.c===it.c&&x.n<CAP);if(!b)return false;b.n++;score+=1;sfx.ok();vib(20);burstEl(el,'⚡');
 if(b.n>=CAP){cleared++;sfx.done();b.c=newBlockCat();b.n=0;burst(innerWidth/2,innerHeight/4,'⚡');return 'full'}
 return true}
function afterMove(msg){if(isStuck()){render('');endGame('대기 칸이 꽉 찼어요!',cleared,'칸','완성한 칸 '+cleared+'칸 · '+score+'개',FACTS);return}render(msg)}
function isStuck(){if(wait.length<MAXW)return false;const open=c=>blocks.some(b=>b.c===c&&b.n<CAP);
 return !(queues.some(q=>open(q[0].c))||wait.some(w=>open(w.c)))}
function shk(){sfx.bad();$('board').classList.add('shake');setTimeout(()=>$('board').classList.remove('shake'),320)}
function tapQ(i,el){if(over)return;const it=queues[i][0];
 const r=place(it,el);
 if(r){queues[i].shift();fillQ(queues[i]);afterMove(r==='full'?'⚡ 한 칸 완성!':'딱 맞아요');return}
 if(wait.length>=MAXW){shk();render('대기 칸이 꽉 찼어요. 대기 칸 것을 먼저 보내요');return}
 queues[i].shift();fillQ(queues[i]);wait.push(it);sfx.tap();afterMove('맞는 칸이 없어 대기 칸으로 갔어요')}
function tapW(j,el){if(over||!wait[j])return;const r=place(wait[j],el);
 if(!r){shk();render('아직 맞는 칸이 없어요');return}
 wait.splice(j,1);afterMove(r==='full'?'⚡ 한 칸 완성!':'딱 맞아요')}
$('again').onclick=()=>{sfx.tap();start();};
window.__game={get state(){return {blocks:blocks.map(b=>({c:b.c,n:b.n})),queues:queues.map(q=>q.map(x=>x.c)),wait:wait.map(x=>x.c),score,cleared,over}},start,tapQ:i=>tapQ(i,null),tapW:j=>tapW(j,null)};
start();
</script>
</body>
