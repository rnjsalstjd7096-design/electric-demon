<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Nanum+Gothic:wght@800&display=block" rel="stylesheet">
<style>
  /* 전기지식 채널 디자인 — 강조색은 빨강 대신 노랑 하나로 통일 */
  :root {
    --bg: #0b0b0b;        /* 위·아래 검정 */
    --text: #ffffff;
    --yellow: #ffd400;    /* 검정 배경 위 노랑 글씨 */
    --marker: #ffe03a;    /* 크림 패널 위 노랑 형광펜 */
    --panel: #f4f0e6;     /* 가운데 크림 패널 */
    --ink: #161616;
    --bar: #2a2a2a;       /* 자막 바 */
    --brand: #8a8a8a;
    --title-font: __TITLE_FONT__;
    --body-font: __BODY_FONT__;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; background: var(--bg); overflow: hidden; }
  body { color: var(--text); display: flex; flex-direction: column; text-align: center;
         word-break: keep-all; letter-spacing: -0.01em; font-family: var(--body-font); }
  .top { height: 620px; display: flex; flex-direction: column; justify-content: center;
         font-family: var(--title-font); font-size: 150px; line-height: 1.2; padding-top: 70px; }
  .top .y { color: var(--yellow); }
  .panel { position: relative; height: 760px; background: var(--panel); color: var(--ink); }
  .scene { position: absolute; inset: 0 40px 150px; display: flex; align-items: center; justify-content: center;
           font-size: 104px; line-height: 1.32; }
  /* 패널 안 강조: 노랑 형광펜을 글자 아래쪽에 칠한다 */
  .scene .y { background: linear-gradient(transparent 52%, var(--marker) 52%, var(--marker) 92%, transparent 92%);
              padding: 0 6px; }
  .bar { position: absolute; left: 34px; right: 34px; bottom: 26px; height: 104px; border-radius: 22px;
         background: var(--bar); display: grid; }
  .sub { grid-area: 1/1; display: flex; align-items: center; justify-content: center;
         font-size: 62px; color: #fff; }
  .sub .y { color: var(--yellow); }
  .brand { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding-top: 120px;
           font-family: var(--title-font); font-size: 64px; color: #555; }
  @keyframes pop { from { opacity: 0; transform: translateY(30px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeout { from { opacity: 1; } to { opacity: 0; } }
</style>
</head>
<body>
  <div class="top">__TOP__</div>
  <div class="panel" style="animation:fadein .5s ease-out __PANEL_T__s both">
    __SCENES__
    <div class="bar">__SUBS__</div>
  </div>
  <div class="brand" style="animation:fadein .5s ease-out __PANEL_T__s both">__BRAND__</div>
</body>
</html>
