<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Nanum+Gothic:wght@800&display=block" rel="stylesheet">
<style>
  /* 전기지식 채널 디자인 — "모눈 노트" 컨셉.
     전기기사단(검정 + 크림 패널 + 빨강)과 겹치지 않게: 남색 모눈 배경, 흰 카드, 노랑 하나로 강조. */
  :root {
    --bg1: #0d1b33; --bg2: #08111f;   /* 남색 배경 위→아래 */
    --grid: rgba(120,160,220,.10);    /* 모눈 선 */
    --text: #ffffff;
    --yellow: #ffd400;                /* 유일한 강조색 */
    --marker: #ffe03a;                /* 흰 카드 위 형광펜 */
    --card: #fbfaf6; --ink: #141a24;
    --title-font: __TITLE_FONT__;
    --body-font: __BODY_FONT__;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background:
      linear-gradient(var(--grid) 2px, transparent 2px) 0 0 / 60px 60px,
      linear-gradient(90deg, var(--grid) 2px, transparent 2px) 0 0 / 60px 60px,
      linear-gradient(180deg, var(--bg1), var(--bg2));
    color: var(--text); font-family: var(--body-font); text-align: center;
    word-break: keep-all; display: flex; flex-direction: column; align-items: center;
  }
  /* 맨 위 채널 칩 */
  .chip { margin-top: 190px; padding: 10px 34px 14px; border-radius: 999px; background: var(--yellow);
          color: #111; font-family: var(--title-font); font-size: 50px; }
  .top { margin-top: 34px; font-family: var(--title-font); font-size: 148px; line-height: 1.16; }
  .top .y { color: var(--yellow); position: relative; }
  /* 제목 둘째 줄 아래 노란 굵은 밑줄 */
  .top > div:last-child { display: inline-block; padding-bottom: 14px;
          background: linear-gradient(var(--yellow), var(--yellow)) bottom / 100% 14px no-repeat; }
  /* 흰 카드 */
  .card { position: relative; margin-top: 70px; width: 980px; height: 720px; border-radius: 40px;
          background: var(--card); color: var(--ink); box-shadow: 0 24px 60px rgba(0,0,0,.45);
          border-left: 22px solid var(--yellow); }
  .scene { position: absolute; inset: 40px 50px 40px 40px; display: flex; align-items: center; justify-content: center;
           font-size: 100px; line-height: 1.3; }
  .scene .y { background: linear-gradient(transparent 52%, var(--marker) 52%, var(--marker) 92%, transparent 92%); padding: 0 6px; }
  /* 카드 왼쪽 위 번호 배지 */
  .num { position: absolute; top: -46px; left: -40px; width: 112px; height: 112px; border-radius: 50%;
         background: var(--yellow); color: #111; border: 8px solid var(--bg1);
         font-family: var(--title-font); font-size: 60px; display: grid; place-items: center; }
  /* 진행 점 */
  .dots { margin-top: 44px; display: flex; gap: 22px; }
  .dot { width: 24px; height: 24px; border-radius: 50%; background: #3a4a66; }
  /* 자막: 노랑 바탕 + 검정 글씨 (기사단의 어두운 자막 바와 반대) */
  .bar { margin-top: 40px; width: 960px; height: 112px; display: grid; }
  .sub { grid-area: 1/1; display: flex; align-items: center; justify-content: center;
         background: var(--yellow); color: #111; border-radius: 18px; font-size: 62px;
         transform: skewX(-6deg); }
  .sub .y { text-decoration: underline 6px; text-underline-offset: 10px; }
  @keyframes pop { from { opacity: 0; transform: translateY(30px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes subpop { from { opacity: 0; transform: skewX(-6deg) translateX(-60px); } to { opacity: 1; transform: skewX(-6deg); } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeout { from { opacity: 1; } to { opacity: 0; } }
  @keyframes lit { to { background: var(--yellow); transform: scale(1.25); } }
</style>
</head>
<body>
  <div class="chip" style="animation:fadein .4s ease-out .05s both"><svg width="34" height="46" viewBox="0 0 24 32" style="vertical-align:-6px;margin-right:8px"><path d="M14 0 L2 18 H11 L8 32 L22 12 H13 Z" fill="#111"/></svg>__BRAND__</div>
  <div class="top">__TOP__</div>
  <div class="card" style="animation:pop .5s cubic-bezier(.2,.8,.2,1) __PANEL_T__s both">
    __SCENES__
    __NUMS__
  </div>
  <div class="dots" style="animation:fadein .5s ease-out __PANEL_T__s both">__DOTS__</div>
  <div class="bar">__SUBS__</div>
</body>
</html>
